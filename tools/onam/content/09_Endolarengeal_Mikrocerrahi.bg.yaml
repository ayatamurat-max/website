code: "09"
type: surgical
aesthetic: false
title: "Ендоларингеална микрохирургия"
alt_name: "Микрохирургия на гласните гънки / гръкляна (микроларингоскопия)"

specific_fields:
  - label: "Лезия / предварителна диагноза:"
  - label: "Страна:"
    options: ["Дясна гласна гънка", "Лява гласна гънка", "Двустранно", "Друга част на гръкляна"]
  - label: "Планирана техника:"
    options: ["Студени инструменти", "CO2 лазер", "Ще бъде определена от хирурга по време на операцията"]
    blank: false
  - label: "Биопсия / хистологично изследване:"
    options: ["Планира се", "При необходимост", "Не се планира"]

about:
  - "Гръклянът (ларинксът) се намира в предната част на шията. Той създава гласа, предпазва дихателните пътища и затваря входа на трахеята по време на преглъщане. Гласните гънки (гласните връзки) са две тънки структури в гръкляна, които трептят и така образуват звука."
  - "По гласните гънки или в друга част на гръкляна могат да се появят **възли (нодули), полипи, кисти, оток на Райнке, папиломи, левкоплакия (бели петна)** или лезия, при която има съмнение за рак. Те могат да причинят дрезгав глас, бърза умора на гласа, усещане за заседнало нещо в гърлото и рядко затруднено дишане. Сред причините са неправилната или прекомерната употреба на гласа, тютюнопушенето, рефлуксът, инфекциите (напр. HPV), а понякога и неизвестни фактори."
  - "Целта на операцията е да се отстрани лезията, като се запази колкото е възможно повече здрава тъкан на гласната гънка, **да се подобри гласът ви**, при необходимост да се разшири дихателният път и чрез **хистологично изследване** на отстранената тъкан да се постави **точна диагноза**."

procedure_intro:
  - "Операцията се извършва под обща анестезия в операционна зала, през устата; на шията не се прави разрез."
procedure_steps:
  - "**Достъп до гръкляна:** След като заспите, през устата се въвежда метална тръба (ларингоскоп), чрез която се достига до гръкляна. Зъбите ви се предпазват със специален протектор."
  - "**Оглед под микроскоп:** Гласните гънки се оглеждат подробно под увеличение с операционен микроскоп или ендоскоп. На този етап може да се открият допълнителни находки, които не се виждат при прегледа в кабинета."
  - "**Отстраняване на лезията:** Лезията се отстранява с много фини микрохирургични инструменти или с CO2 лазер, като трептящата повърхност на гласната гънка се запазва във възможно най-голяма степен. При нужда се взема само малко парче за диагноза (биопсия)."
  - "**Допълнителни действия:** В зависимост от ситуацията може да се използват тампони с лекарство за спиране на кървенето, а в гласната гънка да се инжектира лекарство за намаляване на образуването на белег."
  - "**Приключване:** Ларингоскопът се изважда, устата и зъбите се проверяват. На шията няма шевове или видим белег."
procedure_notes:
  - "Много рядко, поради ограничено отваряне на устата, особености на зъбите или анатомията на челюстта или шията, може да не е възможно да се достигне безопасно до гръкляна. В такъв случай процедурата може да бъде прекратена и ще ви бъдат обяснени алтернативни методи."
anesthesia: "Обща анестезия"
duration: "Около 20–60 минути"
stay: "Обикновено изписване в същия ден или 1 нощ в болница"

benefits:
  - "Намаляване на дрезгавостта и по-ясен глас, който се уморява по-трудно"
  - "**Точна диагноза** чрез хистологично изследване на отстранената тъкан, така че заболяване, открито в ранен стадий, да бъде лекувано навреме"
  - "По-лесно дишане, ако лезията стеснява дихателния път"
success:
  - "При доброкачествени лезии като възли, полипи и кисти гласът се подобрява значително при повечето пациенти. Резултатът обаче зависи от вида и размера на лезията, предишното състояние на гласните гънки, фактори като тютюнопушене и рефлукс, както и от спазването на **гласовия покой и гласовата терапия** след операцията. Някои заболявания, като папиломите, могат да се появят отново и да наложат повече от една операция."

alternatives:
  - "**Гласова терапия (с логопед/фониатър):** Може да бъде първият избор, особено при възли на гласните гънки, и често прави операцията ненужна."
  - "**Медикаментозно лечение:** При рефлукс или възпаление могат да помогнат лекарства, които намаляват стомашната киселина или възпалението."
  - "**Спиране на тютюнопушенето и хигиена на гласа:** Подпомагат обратното развитие на някои лезии (напр. оток на Райнке)."
  - "**Процедура в кабинета под местна анестезия:** При подходящо подбрани малки лезии или биопсия процедурата може да се извърши, докато сте будни, с ендоскоп през носа или устата; не е подходяща за всяка лезия."
  - "**Внимателно наблюдение:** Малки лезии без съмнение за рак могат да се проследяват с редовни прегледи."

no_treatment:
  - "Ако операцията не бъде извършена, дрезгавостта може да продължи или да се засили. Тъй като точното естество на лезията не е известно, макар и рядко, поставянето на диагнозата на сериозно основно заболяване (напр. рак в ранен стадий или лезия, която може да се превърне в рак) може да се забави. Нарастващите лезии рядко могат да причинят затруднено дишане."

before:
  - "Преди операцията се правят кръвни изследвания и ще бъдете прегледани от анестезиолог."
  - "През последните **6–8 часа** преди операцията не трябва да ядете и пиете нищо (спазвайте указанията на анестезиолога)."
  - "Задължително ни съобщете за **клатещи се зъби, коронки, мостове, импланти или протези**; подвижните протези се свалят преди операцията."
  - "Ако ви е препоръчано лечение на рефлукса, може да бъдете помолени да го започнете преди операцията."

recovery:
  - when: "Първите 24–48 часа"
    what: "Може да имате болки или парене в гърлото, лек дискомфорт при преглъщане, дрезгав глас и леко кървенисти храчки. Може да усетите изтръпване на езика, промяна във вкуса или болка в челюстта; те обикновено отшумяват за няколко дни."
  - when: "1-ва седмица"
    what: "По препоръка на лекаря обикновено **3–7 дни пълен гласов покой** (без говорене и без шепнене), след което гласът постепенно се натоварва. Повечето хора се връщат на работа в офис след 2–3 дни; хората с гласови професии (учители, певци, служители в кол центрове) трябва да изчакат по-дълго."
  - when: "2–4-та седмица"
    what: "Гласът постепенно се подобрява. При нужда се започва гласова терапия. Избягвайте викане, пеене и продължително говорене. Резултатът от хистологичното изследване обикновено е готов в този период и ще бъде обсъден с вас."
  - when: "1–3-ти месец"
    what: "Заздравяването на гласните гънки приключва; окончателният глас обикновено се установява в рамките на **6–12 седмици**. При контролния преглед гласните гънки се оглеждат с ендоскоп."

risks:
  expected:
    - "Болки в гърлото и лек дискомфорт при преглъщане (няколко дни)"
    - "Временна дрезгавост или промяна в тембъра на гласа след операцията"
    - "Леко кървенисти храчки (първите 1–2 дни)"
    - "Чувствителност на челюстта, устните или зъбите; малки пукнатини в ъглите на устата"
  common:
    - name: "Изтръпване на езика и промяна във вкуса"
      text: "Дължат се на натиска на ларингоскопа върху езика; срещат се при около **5–15 от 100** пациенти и обикновено отшумяват за няколко дни до няколко седмици, много рядко продължават месеци."
    - name: "Болка в челюстната става"
      text: "Дължи се на продължителното отваряне на устата; обикновено отминава за няколко дни. При хора с проблеми на челюстната става може да е по-честа и по-продължителна."
    - name: "Гласът не се подобрява толкова, колкото се очаква"
      text: "След операцията гласът не винаги се възстановява напълно; може да е необходима гласова терапия или допълнително лечение."
  uncommon:
    - name: "Увреждане на зъби"
      text: "Въпреки използването на протектор при около **1–5 от 100** пациенти може да се получи отчупване, пукване или разклащане на зъб или увреждане на коронка/мост. Рискът е по-висок при клатещи се, кариозни или изкуствени зъби; може да е необходимо стоматологично лечение."
    - name: "Влошаване на гласа или трайна промяна на гласа"
      text: "Ако по повърхността на гласната гънка се образува белег, гласът може да стане по-дрезгав, по-слаб или да се уморява по-бързо, отколкото преди операцията. Това може да наложи гласова терапия, а понякога и допълнителни операции; рядко може да е трайно."
    - name: "Повторна поява на лезията"
      text: "Лезията може да се появи отново, особено ако неправилната употреба на гласа или тютюнопушенето продължат, или при заболявания като папиломите; може да е необходима повторна операция."
    - name: "Сраствания в предната част на гласните гънки (мембрана)"
      text: "Когато се оперира в предната част на двете гласни гънки, те могат да се слепят една с друга; това може да влоши качеството на гласа и да наложи втора операция за разделянето им."
    - name: "Допълнително лечение според хистологичния резултат"
      text: "Хистологичният резултат може да се различава от очакваното (напр. лезия със склонност към злокачествено израждане или рак). В такъв случай може да са необходими допълнителна операция, лъчетерапия или внимателно проследяване; това ще ви бъде обяснено подробно."
  rare:
    - name: "Оток на гръкляна и затруднено дишане"
      text: "След операцията може да се развие оток на гръкляна. Обикновено се повлиява от лекарства; много рядко може да се наложи наблюдение в интензивно отделение или временно отваряне на дихателния път през шията (трахеостомия)."
    - name: "Кървене"
      text: "Значителното кървене е рядко. Поради риска кръв да попадне в дихателните пътища сериозното кървене може да наложи спешна намеса и връщане в операционната."
    - name: "Рискове, свързани с лазера"
      text: "При използване на CO2 лазер съществува риск от изгаряне на околните тъкани и много рядко от запалване на интубационната (дихателната) тръба (пожар в дихателните пътища). Прилагат се специфични мерки за безопасност (специална тръба, влажни тампони, защита на очите). Ако такова събитие настъпи, то може да причини сериозни изгаряния на дихателните пътища и да наложи продължително лечение в интензивно отделение и трахеостомия."
    - name: "Нараняване на устата, езика, устните или гълтача"
      text: "Малките наранявания от инструментите обикновено заздравяват сами; много рядко може да са необходими шевове. Изключително рядко разкъсване на стената на гълтача може да доведе до навлизане на въздух под кожата на шията (усещане за пукане) или до инфекция на шията; това може да наложи наблюдение в болница, венозни антибиотици и рядко операция."
    - name: "Проблеми с шийните прешлени"
      text: "Поради отметнатото назад положение на главата може да се появи болка във врата — особено при заболявания на шийния отдел на гръбначния стълб — и много рядко по-сериозни гръбначни проблеми. Моля, съобщете ни, ако имате дискова херния в шията или сте претърпели операция на шията."

emergency:
  - "**Задух** или свирещ, хриптящ звук при вдишване (стридор)"
  - "**Изкашляне или повръщане на кръв**, или кървенисти храчки, които се увеличават вместо да намаляват"
  - "**Невъзможност за преглъщане** или толкова силна болка или оток, че не можете да преглъщате слюнката си"
  - "**Температура над 38,5 °C** и все по-силна болка в гърлото"
  - "Оток на шията или лицето или усещане за пукане под кожата"

lifestyle:
  - "Спазвайте стриктно препоръчания **гласов покой**; шепненето също натоварва гласните гънки. Можете да общувате писмено или чрез приложения на телефона."
  - "Пийте много вода и поддържайте въздуха в стаята влажен. Избягвайте прочистването на гърлото и кашлянето, доколкото е възможно."
  - "Стойте далеч от цигарите и тютюневия дим; тютюнопушенето влошава заздравяването и увеличава риска лезията да се появи отново."
  - "Ако са ви предписани лекарства за рефлукс, приемайте ги за препоръчания срок; не яжте 2–3 часа преди лягане и ограничете лютите и киселите храни."
  - "Пътуването със самолет обикновено е безопасно от следващия ден; продължете гласовия покой по време на пътуването."

declarations_extra:
  - "Разбирам, че ако по време на операцията се установи, че гръклянът не може да бъде достигнат безопасно, процедурата може да бъде прекратена, както и че в зависимост от хистологичния резултат на отстранената тъкан може да е необходимо допълнително лечение или проследяване."
  - "Разбирам, че окончателният глас зависи и от спазването на гласовия покой, гласовата терапия, спирането на тютюнопушенето и лечението на рефлукса след операцията."
