code: "18"
type: surgical
aesthetic: false
title: "Тимпанопластика"
alt_name: "Восстановление барабанной перепонки (при необходимости — с восстановлением слуховых косточек и мастоидэктомией)"

specific_fields:
  - label: "Сторона:"
    options: ["Справа", "Слева"]
    blank: false
  - label: "Визуализация:"
    options: ["Микроскопическая", "Эндоскопическая", "Будет определено во время операции"]
  - label: "Доступ:"
    options: ["Трансканальный", "Заушный", "Эндауральный"]
  - label: "Источник трансплантата:"
    options: ["Фасция мышцы (фасция височной мышцы)", "Хрящ / надхрящница", "Другое"]
  - label: "Восстановление слуховых косточек (оссикулопластика):"
    options: ["Не планируется", "Планируется", "При необходимости"]
  - label: "Мастоидэктомия:"
    options: ["Не планируется", "Планируется", "При необходимости"]
  - label: "Дата и краткие результаты предоперационного исследования слуха (аудиограммы):"

about:
  - "Барабанная перепонка — это тонкая мембрана, которая отделяет наружный слуховой проход от среднего уха и передаёт звуковые колебания крошечным косточкам (слуховым косточкам) среднего уха. При наличии в барабанной перепонке **отверстия (перфорации)** слух снижается, а попадание в ухо воды или микробов вызывает **повторяющиеся выделения из уха**."
  - "Перфорации барабанной перепонки чаще всего возникают вследствие **хронического воспаления среднего уха**, а иногда — травмы (пощёчина, ватная палочка, резкий перепад давления). Небольшие недавно образовавшиеся отверстия могут закрыться самостоятельно; однако давно существующие отверстия обычно не закрываются. У некоторых пациентов воспаление может также разрушить слуховые косточки среднего уха или распространиться на воздухоносные ячейки кости за ухом (сосцевидного отростка). Если в среднем ухе имеется **холестеатома** (мешочек из клеток кожи, который растёт и разрушает кость), её лечение особенно важно."
  - "Цель тимпанопластики — закрыть отверстие в барабанной перепонке, очистить среднее ухо от воспаления, чтобы получить **сухое и безопасное ухо**, и по возможности **сохранить или улучшить слух**."

procedure_intro:
  - "Операция проводится в операционной под общим наркозом с использованием микроскопа и/или эндоскопа."
procedure_steps:
  - "**Доступ:** Если отверстие небольшое и удобно расположено, операцию можно выполнить полностью через слуховой проход, и снаружи не останется рубца. При более крупных отверстиях или когда необходим более широкий обзор делается небольшой разрез за ухом (в складке позади ушной раковины) или перед ухом."
  - "**Забор трансплантата:** Для восстановления барабанной перепонки используются собственные ткани пациента: обычно фасция мышцы, расположенной над ухом (фасция височной мышцы), или хрящ ушной раковины с его оболочкой (надхрящницей). Эти ткани берутся через тот же разрез или через небольшой дополнительный разрез."
  - "**Очищение среднего уха:** Края отверстия освежаются, барабанная перепонка приподнимается и осматривается среднее ухо; при наличии удаляются воспалённые ткани и спайки. Проверяется состояние слуховых косточек."
  - "**Восстановление слуховых косточек (при необходимости):** Если цепь слуховых косточек разрушена или разорвана, её можно восстановить с помощью собственной косточки/хряща пациента или биосовместимого протеза, например титанового."
  - "**Мастоидэктомия (при необходимости):** Если воспаление или холестеатома распространились на воздухоносные ячейки кости за ухом, эти ячейки вскрываются и очищаются с помощью специального бора."
  - "**Установка трансплантата и ушивание:** Трансплантат помещается под отверстие или поверх него. Среднее ухо и слуховой проход поддерживаются рассасывающимися губками. Разрез, если он был, ушивается, и на ухо накладывается давящая повязка."
procedure_notes:
  - "При обнаружении холестеатомы у некоторых пациентов может быть запланирована **повторная контрольная операция («second look») через 6–12 месяцев**, чтобы убедиться, что заболевание полностью удалено. Это будет объяснено вам отдельно."
anesthesia: "Общий наркоз"
duration: "Около 1,5–3 часов (дольше при мастоидэктомии)"
stay: "Обычно выписка в тот же день или через 1 ночь"

benefits:
  - "Закрытие отверстия в барабанной перепонке"
  - "Уменьшение или прекращение эпизодов выделений из уха и воспалений; сухое и безопасное ухо"
  - "Меньше ограничений, необходимых для защиты уха при купании, приёме душа и плавании"
  - "Сохранение или улучшение слуха у подходящих пациентов"
  - "При наличии холестеатомы — удаление заболевания и предотвращение его возможных серьёзных осложнений"
success:
  - "Стойкое закрытие барабанной перепонки достигается примерно у **85–95%** пациентов. Улучшение слуха зависит от состояния слуховых косточек, распространённости воспаления и состояния внутреннего уха; слух может значительно улучшиться, остаться прежним или в редких случаях ухудшиться. Если трансплантат не приживётся или образуется новое отверстие, операцию можно повторить."

alternatives:
  - "**Наблюдение и поддержание уха сухим:** При небольших сухих отверстиях возможны регулярные осмотры и защита уха от воды. Отверстие остаётся открытым, и риск воспаления сохраняется."
  - "**Медикаментозное лечение:** Ушные капли с антибиотиком временно подавляют воспаление в периоды выделений; отверстие они не закрывают."
  - "**Слуховой аппарат:** Может компенсировать снижение слуха; однако при выделениях из уха пользоваться им может быть трудно, и отверстие он не закрывает."
  - "**Простое закрытие небольших отверстий:** При очень маленьких отверстиях может рассматриваться закрытие бумажной заплаткой или жировой тканью (мирингопластика)."

no_treatment:
  - "Без операции отверстие в барабанной перепонке обычно остаётся открытым. Выделения могут повторяться при попадании воды в ухо или при простудных заболеваниях, а снижение слуха со временем может усиливаться. Если имеется холестеатома и её не лечить, она продолжает расти и может привести к серьёзным осложнениям, таким как **стойкая потеря слуха, головокружение, паралич лицевого нерва, менингит или абсцесс мозга**."

before:
  - "Перед операцией проводится исследование слуха (аудиометрия), а при необходимости — компьютерная томография. Вас осмотрит анестезиолог."
  - "В течение **6–8 часов** до операции нельзя ничего есть и пить (пожалуйста, следуйте указаниям анестезиолога)."
  - "Если из уха есть активные выделения, перед операцией вас могут попросить закапывать капли, чтобы подсушить ухо."
  - "В день операции волосы за ухом могут немного подстричь. При гриппе или инфекции дыхательных путей операция может быть отложена."

recovery:
  - when: "Первые 24–48 часов"
    what: "В ухе будут ощущаться распирание, лёгкая боль и заложенность; боль снимается обезболивающими. Возможны кратковременное лёгкое головокружение и тошнота. Давящую повязку обычно снимают на 1-й день. Не ложитесь на прооперированное ухо."
  - when: "1–2-я неделя"
    what: "Из-за губок в слуховом проходе в этот период слух будет казаться **сниженным**; это нормально. Возможны небольшие кровянистые выделения из уха. Швы обычно снимают **на 7–10-й день**. Большинство людей возвращаются к офисной работе в течение 1 недели."
  - when: "3–6-я неделя"
    what: "Губки из слухового прохода удаляются на контрольных осмотрах или рассасываются самостоятельно. В ухо ни в коем случае не должна попадать вода. Интенсивные физические нагрузки, подъём тяжестей и натуживание следует отложить примерно на **4–6 недель**. Перелёт обычно возможен **через 2–4 недели** с разрешения врача."
  - when: "2–3-й месяц"
    what: "На контрольных осмотрах оценивается, прижился ли трансплантат. Исследование слуха в этот период показывает, как операция повлияла на слух. Плавание и контакт уха с водой обычно разрешаются после одобрения врача."
  - when: "6–12-й месяц"
    what: "Барабанная перепонка и среднее ухо завершают заживление. После операции по поводу холестеатомы планируются регулярные осмотры и при необходимости визуализирующие исследования или повторная контрольная операция."

risks:
  expected:
    - "Ощущение распирания и заложенности в ухе, ощущение сниженного слуха в первые недели (из-за губок в слуховом проходе)"
    - "Лёгкая боль в ухе, ощущение потрескивания, плеска воды или гула"
    - "Небольшие кровянистые выделения из уха (первые дни)"
    - "Временное онемение ушной раковины и области вокруг разреза; ушная раковина может немного оттопыриваться (после заушного доступа; это проходит в течение нескольких недель)"
  common:
    - name: "Изменение вкуса"
      text: "Вкусовой нерв (барабанная струна) проходит сразу за барабанной перепонкой; во время операции он может растягиваться или в редких случаях его приходится пересекать. Примерно у **5–20 из 100** пациентов возникают металлический привкус, снижение вкуса на этой стороне языка или ощущение сухости во рту; обычно это **проходит или становится незаметным в течение от нескольких недель до нескольких месяцев**. В редких случаях это может сохраниться навсегда."
    - name: "Шум в ухе"
      text: "После операции может появиться шум (звон) в ухе, или имевшийся шум может на время усилиться; обычно это временно."
    - name: "Временное головокружение"
      text: "В первые дни возможны лёгкая неустойчивость или головокружение; обычно это проходит в течение нескольких дней."
  uncommon:
    - name: "Неприживление трансплантата или новое отверстие"
      text: "Примерно у **5–15 из 100** пациентов барабанная перепонка может закрыться не полностью, или позднее может снова образоваться отверстие. В этом случае выделения из уха могут продолжаться, и **может потребоваться повторная операция**."
    - name: "Слух не улучшается"
      text: "Даже если барабанная перепонка закрылась, слух может не улучшиться в ожидаемой степени из-за состояния слуховых косточек, вентиляции среднего уха или внутреннего уха. После восстановления слуховых косточек протез может сместиться или вытолкнуться через барабанную перепонку; может потребоваться дополнительная операция."
    - name: "Инфекция уха и выделения"
      text: "После операции могут возникнуть выделения из уха или инфекция раны; обычно они проходят при лечении каплями или антибиотиками. Воспаление хряща ушной раковины (перихондрит) встречается редко, но может оставить деформацию хряща."
    - name: "Сужение слухового прохода или латерализация барабанной перепонки"
      text: "Рубцовая ткань может сузить слуховой проход, или новая барабанная перепонка может сместиться от своего правильного положения; это может повлиять на слух и потребовать корректирующего вмешательства."
    - name: "Рецидив или остаточная холестеатома"
      text: "После операции по поводу холестеатомы у части пациентов заболевание может вернуться или может разрастись небольшой остаток; поэтому необходимы длительное наблюдение и при необходимости **повторная операция**."
    - name: "Проблемы с раной и рубцом"
      text: "Возможны утолщённый рубец или келоид в области заушного разреза, а в редких случаях — скопление жидкости за ухом."
  rare:
    - name: "Стойкая потеря слуха вследствие повреждения внутреннего уха"
      text: "**Менее чем у 1 из 100** пациентов из-за поражения внутреннего уха может развиться **стойкая сенсоневральная тугоухость**; очень редко слух на оперированное ухо может быть полностью утрачен («мёртвое ухо»). Это может потребовать слухового аппарата или дальнейшей слуховой реабилитации. Риск выше при холестеатоме и заболеваниях, расположенных близко к внутреннему уху."
    - name: "Длительное головокружение и нарушение равновесия"
      text: "В редких случаях из-за поражения внутреннего уха может возникнуть головокружение, длящееся неделями; могут потребоваться упражнения для тренировки равновесия и медикаментозное лечение."
    - name: "Паралич лицевого нерва"
      text: "Поскольку лицевой нерв проходит через среднее ухо, очень редко (**значительно реже, чем у 1 из 100** пациентов) может развиться временная или стойкая слабость мышц лица на этой стороне. Риск выше при холестеатоме, повторных операциях и врождённо нетипичном ходе нерва. Если это произойдёт, может потребоваться медикаментозное лечение, защита глаза и при необходимости хирургическое вмешательство (декомпрессия или восстановление нерва). Если паралич окажется стойким, могут сохраниться асимметрия лица и неполное смыкание век; в этом случае потребуется длительная защита глаза и, возможно, операции по восстановлению мимики (реанимации лица)."
    - name: "Осложнения со стороны оболочек мозга"
      text: "Особенно при мастоидэктомии и операциях по поводу холестеатомы, когда кость основания черепа истончена, очень редко могут возникнуть истечение спинномозговой жидкости (ликворея), менингит или повреждение мозговой оболочки. Это может потребовать дополнительного лечения в больнице (иногда в отделении интенсивной терапии) и операции; менингит в редких случаях может оставить стойкие последствия."
    - name: "Стойкое изменение формы ушной раковины"
      text: "В результате заушного доступа или забора хрящевого трансплантата в редких случаях может навсегда сохраниться небольшое изменение положения или формы ушной раковины."

emergency:
  - "**Внезапное выраженное снижение слуха** (резкое ухудшение, отличающееся от заложенности из-за губок)"
  - "**Сильное головокружение**, рвота и невозможность стоять"
  - "**Слабость мышц лица**: опущение уголка рта, невозможность закрыть глаз"
  - "**Температура выше 38,5 °C**, нарастающая боль в ухе, покраснение и отёк ушной раковины или гнойные выделения с неприятным запахом"
  - "**Прозрачные водянистые выделения** из уха, сильная головная боль или ригидность (напряжение) мышц шеи"
  - "**Не прекращающееся кровотечение** из-под повязки или из уха"

lifestyle:
  - "Пока врач не разрешит, **не допускайте попадания воды в ухо**: принимая душ, закрывайте ухо ватой, смазанной вазелином; не купайтесь в бассейне и море."
  - "В первые **4–6 недель** **не сморкайтесь**; если нужно чихнуть, чихайте с открытым ртом. Не зажимайте нос и не натуживайтесь (не выполняйте пробу Вальсальвы)."
  - "В первые недели избегайте подъёма тяжестей, натуживания, наклонов и интенсивных физических нагрузок. Если у вас запор, сообщите об этом врачу."
  - "Перед перелётами, дайвингом и занятиями, связанными с перепадами давления, обязательно получите разрешение врача; для **дайвинга** обычно требуется более длительное ожидание."
  - "Не вводите в слуховой проход ватные палочки или какие-либо другие предметы; используйте назначенные ушные капли так, как вам показали."
  - "Если вы приехали из-за рубежа, планируйте обратную поездку вместе с врачом; контрольные осмотры и исследования слуха после возвращения можно продолжить у местного ЛОР-врача."

declarations_extra:
  - "Я понимаю, что основная цель операции — закрыть барабанную перепонку и получить сухое, безопасное ухо; что улучшение слуха не может быть гарантировано и что в редких случаях слух может ухудшиться."
  - "Мне объяснили, что в зависимости от того, что будет обнаружено во время операции, может потребоваться восстановление слуховых косточек или мастоидэктомия, и я даю согласие на выполнение этих вмешательств так, как отмечено выше."
