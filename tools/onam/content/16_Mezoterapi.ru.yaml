code: "16"
type: office
aesthetic: true
title: "Мезотерапия"
alt_name: "Микроинъекции средств для ухода и восстановления кожи или кожи головы"

specific_fields:
  - label: "Название препарата / состав:"
  - label: "Номер серии (LOT) / срок годности:"
  - label: "Зона введения:"
    options: ["Лицо", "Шея", "Кожа головы", "Подглазничная область", "Другое"]
  - label: "Методика:"
    options: ["Ручная (иглой)", "Мезоинжектор («пистолет» для мезотерапии)", "Дермароллер / микронидлинг"]
  - label: "Номер сеанса / запланированное количество сеансов:"

about:
  - "Мезотерапия — это введение очень тонкими иглами небольших количеств препаратов, содержащих такие компоненты, как **гиалуроновая кислота, витамины, минералы и аминокислоты**, в поверхностные слои кожи или кожи головы. Цель — повысить увлажнённость и жизненный тонус кожи, сделать менее заметными мелкие морщины, тусклость и усталый вид области под глазами или поддержать уход за кожей головы при выпадении волос."
  - "На качество кожи и волос влияют возраст, солнце, курение, стресс, гормоны и генетика. Мезотерапия не останавливает эти процессы; это **вспомогательный** метод ухода. Какой препарат и сколько сеансов подходят именно вам, будет решено вместе после консультации."

procedure_intro:
  - "Процедура проводится в нашей клинике в стерильных условиях. Используются только препараты, **зарегистрированные/разрешённые в Турции, стерильные и вскрытые из оригинальной упаковки**; название препарата и номер серии (LOT) записываются в вашу медицинскую карту."
procedure_steps:
  - "**Подготовка:** Зону фотографируют, снимают макияж и обрабатывают кожу антисептическим раствором. По желанию на 20–30 минут может быть нанесён обезболивающий крем."
  - "**Введение:** Препарат вводится в поверхностный слой кожи множеством мельчайших капель — вручную очень тонкой иглой, с помощью мезоинжектора или аппарата для микронидлинга."
  - "**Завершение:** Зону очищают; при необходимости ненадолго прикладывают холодный компресс. Вы получите рекомендации по уходу после процедуры."
procedure_notes:
  - "Эффект обычно становится заметным не после одного сеанса, а после **курса из нескольких сеансов**. В большинстве протоколов рекомендуется 3–6 сеансов с интервалом 2–4 недели, а затем поддерживающие сеансы раз в несколько месяцев."
anesthesia: "Обезболивающий крем (по желанию)"
duration: "Около 20–40 минут"
stay: "В тот же день; кратковременное наблюдение после процедуры"

benefits:
  - "Кожа выглядит более увлажнённой, сияющей и свежей; мелкие морщины менее заметны"
  - "Менее усталый вид области под глазами"
  - "Поддержка питания кожи головы и качества волос при выпадении волос"
success:
  - "Результаты значительно различаются у разных людей. Степень научной доказанности мезотерапии зависит от препарата и цели: процедуры с гиалуроновой кислотой для улучшения качества кожи изучены лучше, тогда как данные по некоторым смесям препаратов («коктейлям») ограничены. Эффект не является постоянным, и для его поддержания необходимы регулярные повторные процедуры. Никакой конкретный результат не может быть гарантирован."

alternatives:
  - "**Отказ от каких-либо процедур** или продолжение только регулярного ухода за кожей, защиты от солнца и соблюдения рекомендаций по здоровому образу жизни"
  - "**Наружные средства:** кремы с ретиноидами, витамином C или увлажняющими компонентами; при выпадении волос — препараты, например миноксидил, по рекомендации врача"
  - "**Другие процедуры:** PRP, процедуры с гиалуроновой кислотой, разработанные для улучшения качества кожи, химические пилинги, лазерные процедуры или микронидлинг"
  - "При выпадении волос — обследование и лечение возможной основной причины (дефицит железа или нарушение функции щитовидной железы, гормональные причины)"

no_treatment:
  - "Если мезотерапия не проводится, ваша кожа или волосы будут меняться естественным образом. Поскольку это исключительно эстетическая/вспомогательная процедура, отказ от неё не несёт никакого вреда для вашего здоровья."

before:
  - "По возможности, посоветовавшись с врачом, прекратите за 1 неделю до процедуры приём средств, которые могут усиливать образование синяков, — аспирина, обезболивающих (ибупрофен и т. п.), омега-3 и витамина E."
  - "Если в зоне введения есть активные угри, герпес, экзема или инфекция, процедура будет отложена."
  - "Сообщите нам, если в последние 2 недели в ту же зону вводили филлеры, ботулинотоксин или проводили лазерную процедуру или пилинг."
  - "Во время беременности и кормления грудью мезотерапия не проводится."

recovery:
  - when: "Первые часы"
    what: "В местах уколов появляются небольшие возвышения (папулы), покраснение и лёгкий отёк; обычно они уменьшаются в течение нескольких часов. В местах уколов могут быть видны мельчайшие следы крови."
  - when: "Первые 24 часа"
    what: "Не наносите макияж и не трите зону введения. Избегайте сауны, турецкой бани (хаммама), солярия, интенсивных физических нагрузок и прямого солнца. После процедуры на коже головы мыть голову можно на следующий день."
  - when: "2–7-й день"
    what: "Синяки, **если они появятся**, проходят за 3–7 дней. Лёгкие возвышения и чувствительность полностью проходят. Продолжайте пользоваться солнцезащитным средством."
  - when: "В течение курса"
    what: "Сеансы обычно повторяются каждые 2–4 недели. Эффект чаще всего становится заметен после 2–3-го сеанса."
  - when: "После курса"
    what: "Эффект постепенно ослабевает; для его сохранения можно запланировать поддерживающие сеансы раз в несколько месяцев."

risks:
  expected:
    - "Лёгкая боль или жжение от уколов"
    - "Небольшие возвышения, покраснение и лёгкий отёк в местах уколов (от нескольких часов до 1 дня)"
    - "Мельчайшие следы крови и чувствительность в местах уколов"
  common:
    - name: "Синяки"
      text: "Часто возникают, особенно в зонах с тонкой кожей, например под глазами; проходят самостоятельно за 3–7 дней, их можно скрыть макияжем."
    - name: "Длительный отёк или покраснение"
      text: "Отёк под глазами может сохраняться несколько дней. Помогают холодные компрессы и сон с приподнятой головой."
    - name: "Эффект меньше ожидаемого"
      text: "У некоторых людей заметных изменений может не быть, или эффект может оказаться кратковременным."
  uncommon:
    - name: "Временное усиление выпадения волос"
      text: "После процедуры на коже головы в первые недели может наблюдаться временное усиление выпадения волос; обычно оно проходит самостоятельно."
    - name: "Аллергическая или воспалительная реакция"
      text: "В ответ на какой-либо компонент препарата могут появиться зуд, покраснение, крапивница или длительный отёк. Обычно это лечится медикаментозно."
    - name: "Потемнение кожи (гиперпигментация)"
      text: "В местах уколов может появиться потемнение, особенно на смуглой коже и при пребывании на солнце; обычно оно светлеет в течение нескольких месяцев."
    - name: "Небольшие уплотнения (узелки)"
      text: "Могут образоваться небольшие прощупываемые уплотнения; большинство из них исчезают в течение нескольких недель."
  rare:
    - name: "Инфекция"
      text: "Бактериальная инфекция встречается редко. **Атипичная микобактериальная инфекция**, о которой сообщалось главным образом в связи с нестерильными или незарегистрированными препаратами, может проявиться через несколько недель после процедуры в виде болезненных, покрасневших уплотнений с выделениями; она может потребовать длительного лечения антибиотиками, а иногда и хирургического вскрытия и дренирования, и может оставить рубцы. Чтобы снизить этот риск, используются только зарегистрированные стерильные препараты."
    - name: "Воспаление жировой ткани (панникулит) или гранулёма"
      text: "Редкая реакция с болезненным уплотнением или покраснением в глубоких тканях, которая может быть длительной и требовать лечения."
    - name: "Стойкие рубцы или изменение цвета кожи"
      text: "Очень редко после инфекции или тяжёлой реакции могут остаться стойкий рубец, вмятина или разница в цвете кожи."
    - name: "Закупорка кровеносного сосуда"
      text: "Особенно при использовании препаратов с гиалуроновой кислотой **крайне редко** сообщалось о том, что попадание вещества в кровеносный сосуд или его сдавливание нарушало кровоснабжение кожи и оставляло стойкий рубец. Если вы заметите внезапную сильную боль, побледнение кожи или багрово-синюшное сетчатое окрашивание, немедленно сообщите нам; раннее лечение очень важно."
    - name: "Тяжёлая аллергическая реакция (анафилаксия)"
      text: "Встречается очень редко; проявляется одышкой, распространённой сыпью и падением артериального давления и требует неотложного лечения."

emergency:
  - "**Нарастающие боль, покраснение, жар, отёк или гнойные выделения** в зоне введения"
  - "**Температура выше 38 °C**"
  - "Болезненные, покрасневшие уплотнения или уплотнения с выделениями, появившиеся **через несколько дней или недель** после процедуры"
  - "Отёк лица, губ или языка, **одышка** или распространённая зудящая сыпь"
  - "Побледнение кожи, багрово-синюшное сетчатое окрашивание или сильная боль"

lifestyle:
  - "Не наносите макияж в первые 24 часа; избегайте сауны, турецкой бани (хаммама), солярия, интенсивных тренировок и бассейна."
  - "В течение курса ежедневно пользуйтесь солнцезащитным средством с высоким фактором защиты."
  - "В первые 2–3 дня не наносите на зону введения пилинги, ретинол или средства с кислотами."
  - "Если в дальнейшем вам будут проводить другую процедуру в той же зоне (филлеры, лазер и т. п.), сообщите врачу, что вам делали мезотерапию."

declarations_extra:
  - "Мне назвали название и состав препарата, который будет использоваться; мне объяснили, что будут использоваться только зарегистрированные и стерильные препараты и что данные о препарате будут записаны в мою медицинскую карту."
  - "Я понимаю, что эффект различается у разных людей, что может потребоваться несколько сеансов и что результат не является постоянным."
