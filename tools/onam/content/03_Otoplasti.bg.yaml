code: "03"
type: surgical
aesthetic: true
title: "Отопластика"
alt_name: "Операция за корекция на щръкнали уши"

specific_fields:
  - label: "Страна:"
    options: ["Дясно", "Ляво", "Двустранно"]
    blank: false
  - label: "Вид анестезия:"
    options: ["Обща анестезия", "Местна анестезия", "Местна анестезия + седация"]
    blank: false
  - label: "Части за корекция / очаквания на пациента:"

about:
  - "Щръкналите уши са уши, които стърчат от главата под по-голям ъгъл от обичайния, или при които естествената гънка на ушния хрущял (антихеликсът) не е развита. Състоянието обикновено е вродено, не е вредно за здравето и не засяга слуха. Особено в детска и юношеска възраст обаче то може да доведе до подигравки, загуба на самочувствие и социална тревожност."
  - "Целта на отопластиката е ушите да прилегнат по-близо до главата, да изглеждат **естествено** и да бъдат възможно най-**симетрични**. Тъй като около 5–6-годишна възраст ушната мида вече е достигнала по-голямата част от размера си при възрастен човек, операцията може да се извърши **след 5–6-годишна възраст**; извършването ѝ преди училище може да предпази детето от социални затруднения. Ако детето ви ще бъде оперирано, важно е да се вземат предвид и неговото желание и готовност."

procedure_intro:
  - "Операцията се извършва в операционна зала. При деца обикновено се използва обща анестезия, а при възрастни — местна анестезия (при нужда със седация) или обща анестезия."
procedure_steps:
  - "**Планиране и маркиране:** Измерва се разстоянието на ушите от главата, правят се снимки и се маркира мястото на новата гънка."
  - "**Разрез:** Разрезът се прави в кожата на **задната повърхност на ухото**, близо до естествената гънка между ухото и главата. Тъй като белегът е зад ухото, обикновено не се вижда."
  - "**Оформяне на хрущяла:** С постоянни шевове в ушния хрущял се оформя нова гънка (антихеликс). При необходимост хрущялът се изтънява или леко се насича, за да стане по-мек."
  - "**Приближаване на ухото към главата:** Ако дълбоката вдлъбната част на ухото (конхата) е голяма, тя се намалява или се фиксира с шевове към тъканта зад ухото. Ако ушната висулка също стърчи, тя се коригира."
  - "**Затваряне и превръзка:** Кожата се затваря с шевове. Поставя се мека, леко притискаща превръзка около главата, която поддържа новата форма на ушите и предотвратява събирането на кръв."
anesthesia: "При деца обща анестезия; при възрастни местна анестезия ± седация или обща анестезия"
duration: "Около 1–2 часа (двустранно)"
stay: "Обикновено изписване в същия ден"

benefits:
  - "Уши, които прилягат по-близо до главата и изглеждат естествено"
  - "По-балансиран вид на двете уши"
  - "По-малко социална тревожност и подигравки, свързани с външния вид; по-добро самочувствие"
success:
  - "Повечето пациенти и семейства са доволни от резултата. Тъй като ушният хрущял е еластична тъкан, според публикуваните данни при около **5–10 от 100** пациенти ухото може частично отново да се отдалечи от главата и да е необходима корекция. Разлики от няколко милиметра между двете уши се смятат за нормални."

alternatives:
  - "**Без операция:** Щръкналите уши не причиняват здравословни проблеми, затова операцията не е задължителна."
  - "**Моделиране (шиниране) в неонаталния период:** През първите седмици след раждането ушният хрущял е много мек и може да се оформи със специални шини; след този период методът не е ефективен."
  - "**Прикриване с прическа:** Прически, които покриват ушите, могат да прикрият външния им вид."
  - "**Безразрезни техники / техники с конци:** При подбрани пациенти с мек хрущял корекцията може да се направи през много малки разрези; честотата на рецидив може да е по-висока, отколкото при стандартната операция."

no_treatment:
  - "Ако операцията не бъде извършена, формата на ушите ще остане същата; тя не се подобрява от само себе си с времето. Щръкналите уши не представляват опасност за здравето; решението за операция зависи изцяло от външния вид и от желанието на човека (при деца — на детето и семейството)."

before:
  - "Преди операцията се правят необходимите кръвни изследвания; ако е планирана обща анестезия, анестезиолог ще прегледа вас или детето ви."
  - "При обща анестезия или седация не трябва да се яде и пие през последните **6–8 часа** преди операцията (при малки деца — времето, посочено от анестезиолога)."
  - "Сутринта в деня на операцията косата трябва да се измие с шампоан. Дългата коса може да се прибере далеч от оперативното поле."
  - "Операцията може да бъде отложена при активна кожна инфекция, екзема или незаздравял пиърсинг около ухото."

recovery:
  - when: "Първите 48 часа"
    what: "Пулсиране, усещане за опъване и умерена болка в ушите са обичайни и се овладяват с обезболяващи. Препоръчва се спане с повдигната глава. **Силна болка, която постоянно се засилва от едната страна, не е нормална** и трябва да ни бъде съобщена незабавно."
  - when: "2–7-и ден"
    what: "Превръзката обикновено се сваля на контролен преглед между **2-рия и 5-ия ден** и ушите се преглеждат. На този етап са обичайни оток, кръвонасядания и чувствителност на ушите. След свалянето на превръзката се носи мека **лента за глава (за ушите)**. Децата обикновено могат да се върнат на училище след една седмица."
  - when: "1–2-ра седмица"
    what: "Лентата се носи **денем и нощем през първите 1–2 седмици**, а след това **само нощем още 4–6 седмици**. Така ухото не се прегъва напред по време на сън и шевовете са защитени. Нерезорбируемите кожни конци, ако има такива, се свалят на 7–10-ия ден."
  - when: "3–6-а седмица"
    what: "По-голямата част от отока отзвучава. Контактните спортове, плуването и каските, които притискат ушите, трябва да се избягват поне **4–6 седмици**."
  - when: "3–6-и месец"
    what: "Гънките на ухото се стабилизират, белегът избледнява и крайният вид става видим. Лекото изтръпване на ушите обикновено отминава през този период."

risks:
  expected:
    - "Болка, пулсиране и усещане за опъване през първите дни"
    - "Оток и кръвонасядания по ушите (1–2 седмици)"
    - "Временно изтръпване на кожата на ушите и чувствителност към студ (седмици до месеци)"
    - "Тънък белег зад ухото, който избледнява с времето"
  common:
    - name: "Опипващи се или прорязващи кожата шевове"
      text: "При около **5–10 от 100** пациенти постоянните шевове, оформящи хрущяла, може да се опипват зад ухото месеци или години по-късно, да излязат през кожата или да образуват малко възпалено възелче (гранулом). Обикновено това се коригира с проста процедура за отстраняване на шева."
    - name: "Частичен рецидив (ухото отново се отдалечава)"
      text: "При около **5–10 от 100** пациенти ухото може частично да се върне към първоначалното си положение; при нужда може да се направи корекция."
    - name: "Лека асиметрия"
      text: "Двете уши никога не са напълно еднакви; разлики от няколко милиметра след операцията са нормални. При забележима разлика може да се направи корекция."
  uncommon:
    - name: "Събиране на кръв в ухото (хематом)"
      text: "Среща се при около **1–3 от 100** пациенти, обикновено през първите 48 часа. **Силна, постоянно засилваща се болка от едната страна** е най-важният му признак. Трябва да се **дренира спешно**, преди да наруши кръвоснабдяването на хрущяла; при забавено лечение може да настъпи увреждане на хрущяла и трайна деформация („карфиолово ухо“)."
    - name: "Инфекция на раната"
      text: "Среща се при около **1–5 от 100** пациенти; обикновено отзвучава с антибиотици."
    - name: "Задебелен белег или келоид"
      text: "При около **1–3 от 100** пациенти, особено при по-тъмна кожа или склонност към келоиди, зад ухото може да се образува задебелен, надигнат белег. Може да е необходимо лечение с кортикостероидни инжекции, силиконов гел или операция, като е възможен рецидив. Моля, уведомете ни, ако в миналото сте имали келоид."
    - name: "Свръхкорекция или неестествен вид"
      text: "Ушите може да изглеждат прекалено прилепнали към главата, гънката да е прекалено остра или средната част на ухото да е по-назад от горната и долната (вид на „телефонна слушалка“); при нужда може да се направи коригираща операция."
  rare:
    - name: "Възпаление на обвивката на хрущяла (перихондрит)"
      text: "Среща се при **по-малко от 1 от 100** пациенти. Проявява се със засилващо се зачервяване, оток, затопляне и силна болка в ухото. Може да наложи венозни антибиотици и при нужда хирургично почистване; при забавено лечение може да настъпи загуба на хрущял и **трайна деформация**."
    - name: "Нарушено кръвоснабдяване на кожата или хрущяла (некроза)"
      text: "Много рядко; обикновено е свързано с прекалено стегната превръзка, нелекуван хематом или инфекция. Може да са необходими грижи за раната и понякога възстановителна операция."
    - name: "Трайно намалена чувствителност или хронична болка"
      text: "Изтръпването на кожата на ухото или болката при студено време рядко могат да бъдат трайни."
    - name: "Стесняване на външния слухов проход"
      text: "Много рядко, след намаляване или фиксиране на конхата, входът на слуховия проход може да се стесни; може да е необходима корекция."

emergency:
  - "**Силна болка в едното ухо, която постоянно се засилва** (особено през първите 48 часа) — може да е признак на събиране на кръв"
  - "Засилващо се просмукване на кръв през превръзката или напоена с кръв превръзка"
  - "**Температура над 38,5 °C**, засилващо се зачервяване, оток, затопляне или зловонна секреция от ухото"
  - "Превръзка, която стяга прекалено, посиняване или промяна в цвета на ухото"
  - "Удар по ухото или внезапна промяна на формата му"

lifestyle:
  - "Не мокрете превръзката и не я сваляйте сами, преди да бъде свалена в клиниката. След свалянето ѝ можете внимателно да вземете душ от деня, препоръчан от лекаря."
  - "Носете лентата за глава редовно през указания период; това е важно за трайния резултат."
  - "През първите седмици избягвайте лежане върху ушите, прегъване на ушите напред, както и обличане и събличане на дрехи с тясна яка, които притискат ушите."
  - "Пазете ушите от слънце и силен студ поне 3 месеца; поради намалената чувствителност изгаряне или измръзване могат да останат незабелязани."
  - "Наглеждайте детето си, за да не дърпа превръзката или лентата."

declarations_extra:
  - "Разбирам, че носенето на лентата за глава през препоръчания период след операцията е част от резултата и че неспазването на тези указания може да увеличи риска от рецидив."
