code: "04"
type: surgical
aesthetic: false
title: "Аденоидектомия"
alt_name: "Отстраняване на аденоидните вегетации („трета сливица“)"

specific_fields:
  - label: "Допълнителни процедури по време на същата операция:"
    options: ["Тонзилектомия (премахване на сливиците)", "Вентилационна тръбичка", "Няма"]
  - label: "Показание за операцията (попълва се от лекаря):"
    options: ["Запушен нос / хъркане / сънна апнея", "Течност / чести възпаления в средното ухо", "Чести аденоидити / синузит"]
  - label: "Друго / пояснения:"

about:
  - "Аденоидите („третата сливица“) са лимфна тъкан, разположена в задната част на носа над небцето, която е част от защитната система на организма. Те могат да се уголемят, особено при деца на възраст 2–7 години, а от пубертета нататък обикновено намаляват."
  - "Уголемените аденоиди могат да запушат задната част на носа и да причинят **дишане през устата, хъркане, паузи в дишането по време на сън, хрема, носов говор и чести инфекции**. Тъй като могат да запушат и отвора на Евстахиевата тръба, която свързва ухото със задната част на носа, те могат да доведат до **натрупване на течност в средното ухо, намален слух и повтарящи се възпаления на ушите**. Продължителното дишане през устата може да повлияе и на развитието на лицето и зъбите."
  - "Целта на аденоидектомията е да се отстрани уголемената аденоидна тъкан, за да се облекчи дишането през носа и да се намалят проблемите с ушите, синусите и дихателните пътища. Лекарят ще ви обясни отделно защо тази операция се препоръчва на вас или на вашето дете."

procedure_intro:
  - "Операцията се извършва под обща анестезия в операционна зала. Тя се прави през устата; **отвън няма разрези или белези.**"
procedure_steps:
  - "**Подготовка:** След въвеждането в анестезия се поставя специален инструмент, който държи устата отворена, а мекото небце внимателно се повдига, за да се види задната част на носа."
  - "**Отстраняване на аденоидите:** Аденоидите се отстраняват от задната част на носа с кюрета (специален инструмент за изстъргване), микродебридер под ендоскопски контрол, коблация или електрокоагулация. Тъй като аденоидите са тъкан, а не отделен орган, те не могат да бъдат премахнати „из корен“; целта е безопасно да се отстрани частта, която причинява запушването."
  - "**Овладяване на кървенето:** Областта се притиска за кратко с тампон и при нужда кървенето се спира с електрокоагулация. В края на операцията в задната част на носа не се оставя тампон."
  - "**Допълнителни процедури:** Ако е планирано, по време на същата анестезия се извършва премахване на сливиците (тонзилектомия) или поставяне на вентилационни тръбички в тъпанчетата. За тези процедури се попълват отделни формуляри за съгласие."
  - "**Събуждане:** След операцията пациентът се наблюдава внимателно в зала за събуждане, докато се събуди напълно."
procedure_notes:
  - "Ако лекарят прецени, че е необходимо, отстранената тъкан се изпраща за хистологично изследване."
anesthesia: "Обща анестезия"
duration: "Около 20–30 минути (без времето за анестезия)"
stay: "Обикновено изписване в същия ден; при нужда една нощ наблюдение"

benefits:
  - "Облекчено дишане през носа, по-малко хъркане и по-малко паузи в дишането по време на сън"
  - "По-качествен сън и в резултат — подобрено внимание през деня, поведение и успех в училище"
  - "По-рядко натрупване на течност в средното ухо и по-малко ушни възпаления, което подпомага подобряването на слуха"
  - "По-малко хрема, синузити и инфекции на горните дихателни пътища"
success:
  - "При правилно подбрани пациенти запушването на носа и хъркането се подобряват значително в по-голямата част от случаите. Ако обаче запушването има и други причини — например алергия, уголемени носни конхи или изкривена носна преграда — оплакванията може да не изчезнат напълно. При проблеми с ушите успехът зависи и от развитието на Евстахиевата тръба; при някои деца може да е необходимо допълнително лечение или вентилационни тръбички."

alternatives:
  - "**Наблюдение:** Ако оплакванията са леки, може да се изчака с редовни прегледи, тъй като аденоидите намаляват с възрастта."
  - "**Медикаментозно лечение:** Назалните спрейове с кортикостероид могат временно да намалят отока на аденоидите и запушването при някои деца; при алергия се провежда лечение на алергията. Ефектът обикновено продължава, докато се използва лекарството."
  - "**Само вентилационни тръбички при проблеми с ушите:** В някои случаи може да се обсъди поставяне само на тръбички в тъпанчетата, без отстраняване на аденоидите."
  - "**Други методи при сънна апнея:** В много редки случаи, когато операцията не е подходяща, по време на сън може да се използва апарат за дишане с положително налягане (CPAP)."

no_treatment:
  - "Ако операцията не бъде извършена, аденоидите могат сами да намалеят в пубертета. Дотогава обаче дишането през устата, хъркането, лошият сън, честите инфекции и намаленият слух поради течност в ухото може да продължат. Продължителните и тежки нарушения на дишането по време на сън при децата могат да доведат до изоставане в растежа и развитието, проблеми с вниманието и поведението, а рядко и до натоварване на сърцето и белите дробове. Дълго задържащата се течност в средното ухо може да повлияе на развитието на говора и да причини трайни промени в тъпанчето."

before:
  - "Преди операцията се правят кръвни изследвания (особено за кръвосъсирването) и при нужда други изследвания; ще бъдете прегледани от анестезиолог."
  - "Задължително съобщете, ако в семейството има склонност към лесно кървене, кръвонасядания или заболяване на кръвосъсирването."
  - "През последните **6 часа** преди операцията не трябва да се дава твърда храна и мляко; за бистрите течности спазвайте срока, определен от анестезиолога."
  - "Моля, уведомете ни, ако през последните 2–3 седмици преди операцията е имало температура, диария, кашлица или грип; може да се наложи операцията да бъде отложена."
  - "Ако има клатещ се млечен зъб, кажете на лекаря, тъй като той може да падне по време на анестезията."
  - "Препоръчваме да подготвите детето си за операцията с подходящи за възрастта му думи, които не го плашат."

recovery:
  - when: "Денят на операцията"
    what: "След събуждането може да има леко болно гърло, кървениста слуз от носа и дишане през устата. Възможни са повръщане или леко повишена температура. След като гаденето отмине, първо се дава вода, а след това хладка, мека храна. Повечето пациенти се прибират у дома в същия ден."
  - when: "Първите 3–5 дни"
    what: "Запушването на носа и хъркането може все още да продължават поради отока; възможни са лош дъх от устата, леко повишена температура, болка в ушите и във врата. Болката обикновено е лека и се овладява с обезболяващите, препоръчани от лекаря. Приемът на много течности е важен."
  - when: "1-ва седмица"
    what: "Повечето деца могат да се върнат на училище/детска градина след 3–7 дни, а възрастните — на работа. През първата седмица избягвайте многолюдни места и контакт с болни хора."
  - when: "2–4-та седмица"
    what: "С отзвучаването на отока дишането през носа се подобрява осезаемо. Ако има временен носов говор, той обикновено отминава в този период. Плуването и натоварващият спорт обикновено са разрешени след 2 седмици."
  - when: "1–3-ти месец"
    what: "Извършва се контролен преглед; ако операцията е направена заради проблеми с ушите, състоянието им се оценява с аудиометрия и тимпанометрия."

risks:
  expected:
    - "Леко болно гърло, дискомфорт при преглъщане"
    - "Кървениста слуз от носа и запушен нос няколко дни"
    - "Лош дъх (от заздравяващата повърхност; отминава за 1–2 седмици)"
    - "Болка, излъчваща се към ухото (отразена болка по общи нерви; не означава, че има заболяване на ухото)"
    - "Леко повишена температура (първите 1–2 дни), гадене и повръщане от анестезията"
  common:
    - name: "Временен носов говор"
      text: "След отстраняване на аденоидите небцето се нуждае от време, за да се адаптира; при говор въздухът може да излиза през носа в продължение на няколко дни до няколко седмици, а понякога течности да се връщат през носа. Обикновено отминава от само себе си в рамките на 1–2 месеца."
    - name: "Болка и скованост във врата"
      text: "Поради положението по време на операцията и заздравяването в задната част на носа движенията на врата може да са болезнени през първите дни; обикновено отминава за няколко дни."
    - name: "Непълно отзвучаване на оплакванията"
      text: "Ако има допълнителни причини, като алергия, уголемени носни конхи или изкривена носна преграда, запушването на носа може частично да остане; може да е необходимо допълнително лечение."
  uncommon:
    - name: "Кървене"
      text: "Значимо кървене след операцията се наблюдава при **по-малко от 1 на 100 пациенти (около 0,5–1 на 100)**. Най-често се случва през първите 24 часа. Ако кървенето не може да бъде спряно, може да се наложи **връщане в операционната под обща анестезия за овладяването му**. Кръвопреливане е необходимо много рядко."
    - name: "Увреждане на зъб"
      text: "Натискът на инструмента, който държи устата отворена, може да отчупи или избие зъб, особено ако той вече е клатещ се или кариозен."
    - name: "Нараняване или оток на устните, езика или небцето"
      text: "От допира на инструментите може да се появят малки рани или временен оток; те заздравяват за няколко дни."
    - name: "Инфекция"
      text: "Може да се прояви с повишаване на температурата, засилване на лошия дъх и на болката; обикновено се повлиява от антибиотици."
    - name: "Повторно нарастване на аденоидите"
      text: "Аденоидната тъкан може да нарасне отново (при около **1–5 на 100** пациенти), особено при оперирани в много ранна възраст и при деца с алергия. Ако оплакванията се възобновят, рядко може да е необходима повторна операция."
  rare:
    - name: "Траен носов говор / връщане на течности през носа (велофарингеална недостатъчност)"
      text: "Среща се при около **1 на 1500–3000** пациенти; рискът е по-висок при деца със скрита цепка на небцето (субмукозна цепка). Обикновено се подобрява с логопедична терапия; рядко може да е необходима коригираща операция. Затова небцето се преглежда внимателно преди операцията."
    - name: "Разместване (сублуксация) на горните шийни прешлени (синдром на Гризел)"
      text: "**Много рядко** състояние, при което възпалението в задната част на носа засяга връзките на горните шийни прешлени. Проявява се с болка във врата, която започва в дните след операцията и постепенно се засилва, невъзможност за завъртане на главата и наклонено настрани положение на главата. При ранно откриване се лекува с лекарства и шийна яка; при закъсняла диагноза може да е необходимо по-продължително лечение, рядко и операция, като може да остане трайно ограничение в движенията на врата. Затова постепенно засилващата се болка във врата трябва винаги да бъде съобщена."
    - name: "Сраствания или стесняване в задната част на носа"
      text: "Много рядко, особено когато заедно с тонзилектомия се отстранява голямо количество тъкан, по време на заздравяването може да се развие стесняване в задната част на носа; то може да причини запушване и да наложи допълнително лечение."
    - name: "Тежко кървене и неговите последици"
      text: "Изключително рядко, при наличие на необичайно разположен кръвоносен съд или неразпознато нарушение на кръвосъсирването, може да възникне тежко кървене. В такъв случай може да са необходими спешна операция, кръвопреливане и лечение в **интензивно отделение**; попадането на кръв в дихателните пътища може да причини проблеми с дишането."

emergency:
  - "**Прясна, червена кръв** от устата или носа, изплюване или повръщане на кръв (всяко кървене, по-голямо от няколко капки, трябва да бъде съобщено)"
  - "Често преглъщане (при децата важен признак, че кръвта се поглъща), бледост, отпадналост"
  - "**Температура над 38,5 °C** или температура, която не спада след обезболяващи"
  - "Пълен отказ от течности, липса на уриниране в продължение на 6–8 часа, необичайна сънливост (признаци на обезводняване)"
  - "Постепенно засилваща се **болка във врата**, невъзможност за завъртане на главата или наклонено настрани положение на главата"
  - "Затруднено дишане или изразени паузи в дишането по време на сън"

lifestyle:
  - "При болка използвайте само **обезболяващите, препоръчани от лекаря**; аспирин и лекарства, съдържащи аспирин, не трябва да се приемат, тъй като могат да засилят кървенето."
  - "През първите дни се препоръчват хладки или студени меки храни и **много течности**; избягвайте много горещи, твърди и люти храни."
  - "През първата седмица не издухвайте силно носа."
  - "Ако през първата седмица след операцията е планиран обратен полет към чужбина, обсъдете с лекаря кога най-рано е безопасно да летите; поради риска от кървене е препоръчително през първите дни да сте близо до лекаря си."

declarations_extra:
  - "Беше ми обяснено, че през първите дни след операцията, особено при моето дете, трябва да следя за признаци на кървене (често преглъщане, изплюване или повръщане на кръв) и да се свържа с лекаря."
