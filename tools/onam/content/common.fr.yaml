interpreter_text: "Déclaration de l'interprète : J'ai traduit intégralement et fidèlement ce formulaire ainsi que les explications orales du médecin au patient / représentant légal, dans une langue qu'il comprend."

minor_text:
  - "Pour les patients de moins de 18 ans, le consentement est donné par un **parent ou le tuteur légal**. L'enfant est informé de manière adaptée à son âge et à sa maturité, et son avis est recherché. Pour les patients dont la capacité juridique est limitée, le consentement est donné par le représentant légal."

minor_checks:
  - "Si nous exerçons conjointement l'autorité parentale, je déclare que l'autre parent est informé de cette intervention et y consent."
  - "Je déclare qu'il n'existe aucune décision de justice ni aucun litige concernant l'autorité parentale / la tutelle (le cas échéant, le document correspondant a été présenté au médecin)."

copies:
  - "Ce formulaire est établi en deux exemplaires : l'un est conservé dans le dossier du patient, l'autre est remis au patient / représentant légal."

withdraw_text:
  - "Je retire le consentement que j'ai donné ci-dessus. Les conséquences possibles de ce retrait m'ont été expliquées."

final_note: "Ce formulaire a été établi conformément au Règlement turc sur les droits des patients et aux principes de l'Association médicale turque en matière de consentement éclairé. Il complète, sans la remplacer, l'information orale donnée par votre médecin."
