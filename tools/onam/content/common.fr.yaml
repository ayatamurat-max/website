intro:
  - "Chère patiente, cher patient, ce formulaire a été conçu pour vous expliquer, dans un **langage simple et clair**, ce que vous devez savoir sur l'intervention qui vous est proposée. Son objectif n'est pas de vous effrayer, mais de vous aider à prendre votre décision **librement et en connaissance de cause**."
  - "Veuillez lire ce formulaire sans vous presser. Interrogez votre médecin sur tout ce que vous ne comprenez pas. Votre médecin vous expliquera également oralement les risques propres à votre situation. Donner ou non votre consentement est entièrement votre droit."

