code: "12"
type: surgical
aesthetic: true
title: "Глубокая подтяжка шеи"
alt_name: "Подтяжка шеи с коррекцией также глубоких структур шеи (глубокая подтяжка шеи, deep-plane)"

specific_fields:
  - label: "Планируемые компоненты:"
    options: ["Платизмопластика", "Удаление глубокого жира", "Уменьшение двубрюшной мышцы", "Уменьшение поднижнечелюстной железы", "Иссечение избытка кожи"]
    blank: false
  - label: "Одновременная подтяжка лица:"
    options: ["Нет", "Да (с отдельной формой согласия)"]
  - label: "Другие вмешательства, выполняемые одновременно:"
  - label: "Жалобы и ожидания пациента:"

about:
  - "С возрастом, при изменениях веса или из-за наследственных особенностей на шее могут появиться **полнота под подбородком**, утрата угла между челюстью и шеей, **вертикальные тяжи** (тяжи платизмы) и **дряблость кожи**. Такой вид часто обусловлен не только подкожным жиром, но и **глубоким жиром под мышцей шеи, мышцами под подбородком (двубрюшными мышцами) и опущением слюнных желёз (поднижнечелюстных желёз)**."
  - "Глубокая подтяжка шеи затрагивает и эти глубокие структуры, чтобы сделать линию челюсти более чёткой и добиться **более молодого, подтянутого и естественного** вида шеи. Результат зависит от эластичности вашей кожи, строения костей, веса и возраста. Операция не останавливает старение; со временем шея будет постепенно снова расслабляться."

procedure_intro:
  - "Операция обычно проводится под общим наркозом в условиях операционной. Перед ней вашу шею осматривают в положении сидя и стоя, фотографируют и размечают, а также вместе с вами определяют, какие структуры будут корректироваться."
procedure_steps:
  - "**Разрезы:** В естественной складке под подбородком делают разрез длиной около 3–5 см. Если планируется удаление избытка кожи, добавляют разрезы вокруг мочки уха, продолжающиеся за ухо к линии роста волос. По возможности разрезы скрывают в естественных складках и в волосистой части головы."
  - "**Отслойка кожи:** Кожу шеи бережно отделяют от лежащей под ней мышцы; при необходимости поверхностный жир равномерно истончают."
  - "**Удаление глубокого жира:** Глубокий жир, расположенный под мышцей шеи (платизмой), до которого невозможно добраться с помощью наружной липосакции, контролируемо уменьшают."
  - "**Двубрюшные мышцы и поднижнечелюстные железы:** При необходимости истончают переднюю часть двубрюшной мышцы, создающую полноту под подбородком. Если слюнная железа (поднижнечелюстная железа) опущена и выступает, её выступающая часть при необходимости может быть частично уменьшена; железа полностью не удаляется."
  - "**Платизмопластика:** Края платизмы, разошедшиеся по средней линии шеи и образующие тяжи, сшивают между собой, создавая «внутренний корсет»; при необходимости мышцу также подвешивают с боков."
  - "**Удаление избытка кожи и завершение операции:** Кожу без натяжения перераспределяют вверх и назад, а избыток удаляют. Тщательно останавливают кровотечение, обычно устанавливают **дренаж** (тонкую трубку для отвода жидкости), разрезы зашивают тонкими швами и накладывают повязку на шею."
procedure_notes:
  - "Планируемые компоненты различаются у разных людей; не каждый этап выполняется у каждого пациента. Если одновременно будет выполняться подтяжка лица, для неё подписывается **отдельная форма согласия**."
anesthesia: "Общий наркоз (у отдельных пациентов — седация + местная анестезия)"
duration: "Около 2–4 часов (дольше при сочетании с другими вмешательствами)"
stay: "Обычно одна ночь в больнице"

benefits:
  - "Более чёткая линия челюсти и угол между челюстью и шеей"
  - "Уменьшение полноты под подбородком и вертикальных тяжей на шее"
  - "Подтягивание дряблой кожи шеи и более молодой, свежий вид"
success:
  - "Большинство правильно отобранных пациентов довольны результатом. Основная часть отёка спадает в первые 4–6 недель; окончательный результат виден через **6–12 месяцев**. У пациентов с плохим качеством кожи, в пожилом возрасте, после значительного похудения или ранее перенесённой операции на шее результаты могут быть более ограниченными. Примерно **5–10 из каждых 100** пациентов может потребоваться небольшая корректирующая процедура."

alternatives:
  - "**Отказ от операции:** Поскольку это эстетическое вмешательство, у вас всегда есть возможность от него отказаться."
  - "**Только субментальная липосакция (липосакция подбородка):** Может быть достаточной для людей с хорошей эластичностью кожи, у которых полнота обусловлена только подкожным жиром; она не устраняет глубокий жир и не корректирует мышцы или железы."
  - "**Инъекции, растворяющие жир (дезоксихолевая кислота), или аппаратные методы (радиочастотное воздействие, ультразвук):** Дают ограниченное улучшение при небольшой полноте и дряблости; обычно требуется несколько сеансов."
  - "**Ботулотоксин для смягчения тяжей платизмы:** Временно (на 3–4 месяца) уменьшает тяжи; не устраняет провисание и жир."
  - "**Более ограниченная подтяжка шеи:** Менее объёмные операции, при которых только удаляют избыток кожи или выполняют только платизмопластику; их эффект более ограничен."

no_treatment:
  - "Если операцию не проводить, нынешний вид вашей шеи сохранится, а естественное старение будет продолжаться. Это не представляет угрозы для вашего здоровья."

before:
  - "Перед операцией выполняются анализы крови и при необходимости ЭКГ и другие исследования; вас осмотрит анестезиолог."
  - "**Очень важно, чтобы ваше артериальное давление было хорошо контролируемым.** Высокое давление значительно повышает риск скопления крови в области шеи (гематомы) после операции. Уточните у анестезиолога, нужно ли вам принять препарат от давления также утром в день операции (с глотком воды)."
  - "В течение **6–8 часов** до операции нельзя ничего есть и пить (следуйте указаниям анестезиолога)."
  - "Перед операцией избегайте интенсивных физических нагрузок, сауны и употребления большого количества алкоголя. В день операции не используйте макияж, украшения и цепочки на шее; возьмите с собой одежду с застёжкой спереди, которую не нужно надевать через голову."
  - "Рекомендуется, чтобы в первые 24–48 часов после операции рядом с вами кто-то находился."

recovery:
  - when: "Первые 24–48 часов"
    what: "На шее будут повязка и дренаж. Вы будете ощущать отёк, стянутость и дискомфорт при глотании; боль обычно лёгкая или умеренная. Важно спать с приподнятой головой (30–45°), не сгибать шею чрезмерно и не допускать повышения давления (не натуживаться, держать кашель под контролем). Дренаж обычно удаляют на **1–2-й день**."
  - when: "1-я неделя"
    what: "Отёк и синяки, **если они появляются**, наиболее заметны именно в этот период, а затем начинают уменьшаться. Онемение шеи и области под подбородком — это нормально. **Компрессионное изделие/повязку для шеи** носят днём и ночью согласно рекомендациям. Швы снимают на **5–10-й день**."
  - when: "2–4-я недели"
    what: "Большинство пациентов возвращаются к сидячей работе и общественной жизни в течение 10–14 дней. Уплотнение, ощущение неровности и стянутость шеи могут сохраняться. Интенсивных физических нагрузок, наклонов, подъёма тяжестей и движений, нагружающих шею, следует избегать не менее **3–4 недель**."
  - when: "1–3-й месяцы"
    what: "Оставшиеся отёк и уплотнение постепенно уменьшаются. Онемение в основном проходит. В этот период рубцы могут быть розовыми и слегка приподнятыми."
  - when: "6–12-й месяцы"
    what: "Становится виден окончательный результат; рубцы светлеют и становятся тоньше. Если коррекция будет сочтена необходимой, её обычно проводят не ранее чем через 6 месяцев."

risks:
  expected:
    - "Отёк шеи и области под подбородком; синяки, **если они появляются**, проходят в течение 1–3 недель"
    - "Временное онемение кожи шеи и области вокруг ушей"
    - "Стянутость и уплотнение шеи, лёгкий дискомфорт при глотании"
    - "Лёгкая боль, зуд и розовые рубцы в местах разрезов"
    - "Неровности и уплотнения, прощупываемые под кожей в первые недели"
  common:
    - name: "Длительный отёк и уплотнение"
      text: "Уплотнение шеи и области под подбородком может сохраняться несколько месяцев; оно проходит благодаря массажу и со временем."
    - name: "Небольшая асимметрия и неровности контура"
      text: "Могут сохраниться небольшие различия между двумя сторонами шеи или мелкие впадины/бугорки под кожей; большинство из них со временем сглаживаются, некоторые могут потребовать небольшой коррекции."
    - name: "Серома (скопление жидкости)"
      text: "Скопление прозрачной жидкости под кожей; обычно лечится её откачиванием иглой в кабинете врача."
    - name: "Необходимость коррекции"
      text: "Примерно **5–10 из каждых 100** пациентов может потребоваться небольшая коррекция из-за остаточной полноты, неровностей или рубцов."
  uncommon:
    - name: "Гематома (скопление крови в области шеи)"
      text: "Возникает примерно у **2–5 из каждых 100** пациентов; чаще встречается **у мужчин и у людей с высоким артериальным давлением** и обычно появляется в первые 24 часа. Небольшие гематомы можно удалить иглой; при больших требуется **повторное взятие в операционную** для удаления крови и остановки кровотечения. Быстро увеличивающаяся гематома может **сдавить трахею и затруднить дыхание**; это требует неотложной помощи. Поздно распознанная гематома может нарушить кровоснабжение кожи и привести к проблемам с заживлением раны и рубцами."
    - name: "Временная слабость движений нижней губы (краевая ветвь нижней челюсти / шейная ветвь лицевого нерва)"
      text: "Примерно у **1–10 из каждых 100** пациентов одна сторона нижней губы при улыбке может выглядеть асимметричной. В большинстве случаев это связано с натяжением нерва или отёком и проходит самостоятельно в течение **от нескольких недель до нескольких месяцев**."
    - name: "Подтекание слюны / скопление слюны (сиалоцеле)"
      text: "У пациентов, которым уменьшали поднижнечелюстную железу, слюна может подтекать из железы и скапливаться под кожей. Обычно это проходит после повторных откачиваний иглой, наложения давящей повязки и при необходимости приёма лекарств; в редких случаях требуется дополнительное вмешательство."
    - name: "Деформация из-за избыточного удаления тканей"
      text: "Удаление слишком большого количества жира или ткани железы может привести к образованию впадины в средней части шеи, выступанию мышц и «скелетированному» виду (деформация «шея кобры»). Для коррекции может потребоваться пересадка жира или повторная операция; поэтому ткани удаляют сбалансированно и контролируемо."
    - name: "Заметные или широкие рубцы"
      text: "Рубцы под подбородком и за ушами в редких случаях могут утолщаться, расширяться или менять цвет. Их можно лечить инъекциями стероидов, силиконовым гелем или хирургической коррекцией рубца. Если разрез за ухом продолжается к линии роста волос, вдоль него волосы могут поредеть. Если разрезы делают вокруг мочки уха, мочка в редких случаях может выглядеть оттянутой вниз и вперёд; при необходимости выполняется небольшая коррекция."
    - name: "Длительное онемение"
      text: "Снижение чувствительности шеи и области вокруг мочки уха может сохраняться несколько месяцев; в редких случаях оно может остаться частично стойким."
    - name: "Инфекция"
      text: "Возникает у **от менее чем 1 до 2 из каждых 100** пациентов. Обычно проходит при лечении антибиотиками; в редких случаях требуется дренирование."
  rare:
    - name: "Нарушение кровоснабжения кожи и потеря ткани (некроз)"
      text: "Особенно у **курящих**, у людей с сахарным диабетом и у пациентов, у которых развилась гематома, возможны расхождение раны и потеря кожи по краям. Заживление затягивается, требуются перевязки, а иногда и дополнительная операция; может остаться стойкий рубец."
    - name: "Стойкое повреждение нерва"
      text: "Стойкая слабость движений нижней губы возникает **менее чем у 1 из 100** пациентов. Очень редко могут пострадать нервы, которые двигают язык (подъязычный нерв) или обеспечивают чувствительность языка (язычный нерв), либо нерв, обеспечивающий чувствительность мочки уха (большой ушной нерв)."
    - name: "Проблемы с дыхательными путями и затруднение глотания"
      text: "В очень редких случаях из-за большой гематомы или выраженного отёка может потребоваться экстренное обеспечение проходимости дыхательных путей с последующим наблюдением в отделении интенсивной терапии. После коррекции глубоких структур может возникнуть временное затруднение глотания."
    - name: "Повреждение кровеносного сосуда или слюнного протока"
      text: "Кровотечение из-за повреждения вен шеи или проблемы с протоком слюнной железы бывают очень редко; они могут потребовать дополнительного лечения или вмешательства."
    - name: "Повторное провисание"
      text: "С годами шея может снова расслабиться из-за старения и изменений веса; это естественный процесс, а не осложнение. Со временем тяжи шейной мышцы также могут снова стать заметными. Выраженное раннее провисание бывает редко."
    - name: "Психологическая неудовлетворённость"
      text: "Несмотря на технически успешный результат, человеку может быть трудно привыкнуть к своему новому виду. Открытое обсуждение ожиданий до операции снижает этот риск."

emergency:
  - "**Быстро нарастающий отёк, напряжение или выраженное одностороннее увеличение** шеи, особенно в первые 24–48 часов"
  - "**Затруднение дыхания, изменение голоса, невозможность глотать** или ощущение удушья (немедленно звоните 112)"
  - "**Непрекращающееся кровотечение** под повязкой или быстрое увеличение количества крови в дренажной ёмкости"
  - "**Температура выше 38,5 °C**, нарастающее покраснение, боль, ощущение жара или гной в местах разрезов"
  - "**Потемнение, фиолетово-чёрный цвет** кожи или расхождение раны"
  - "Внезапная сильная боль или боль, которая не проходит после приёма обезболивающих"
  - "Одышка, боль в груди или односторонний отёк и боль в ноге"

lifestyle:
  - "В первые 2 недели спите на спине с приподнятой головой; избегайте чрезмерного сгибания шеи, резких движений головой и шеей и наклонов вперёд."
  - "Носите компрессионное изделие/повязку для шеи в течение рекомендованного срока (обычно 1–3 недели)."
  - "Регулярно измеряйте артериальное давление и не пропускайте приём лекарств; избегайте натуживания, подъёма тяжестей и неконтролируемого кашля."
  - "В первые 3–4 недели избегайте интенсивных физических нагрузок, сауны, турецкой бани (хаммама) и горячего душа."
  - "Защищайте рубцы от солнца не менее 3–6 месяцев."
  - "Если вы приехали из-за рубежа, авиаперелёт обычно безопасен после удаления дренажа и проведения первых контрольных осмотров — как правило, начиная с 5–7-го дня."

declarations_extra:
  - "Я понимаю, что операция не останавливает старение, что со временем шея может снова расслабиться и что результат ограничен качеством моей кожи, моим весом и строением костей."
  - "Я понимаю, что контроль артериального давления и соблюдение послеоперационных указаний важны для снижения риска кровотечения (гематомы)."
