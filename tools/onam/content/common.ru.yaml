refusal_right:
  - "Вы имеете право отказаться от рекомендованной процедуры, отложить её или получить мнение другого врача. Это решение никак не повлияет на любую другую медицинскую помощь, которая вам предоставляется. Вы можете отозвать своё согласие в любое время до начала процедуры; однако, пожалуйста, имейте в виду, что после начала процедуры могут быть этапы, на которых её прекращение небезопасно с медицинской точки зрения."

before_common:
  - "Сообщите врачу обо **всех лекарствах**, которые вы принимаете (включая препараты, разжижающие кровь, аспирин, обезболивающие, средства для похудения и гормональные препараты), а также о любых **растительных средствах и добавках** (например, омега-3, витамин E, гинкго, чеснок, женьшень, рыбий жир). Не прекращайте приём какого-либо лекарства самостоятельно, без согласования с врачом."
  - "Обязательно сообщите нам об **аллергиях**, проблемах с кровотечением или свёртываемостью крови, заболеваниях сердца и лёгких, диабете, нарушениях артериального давления или щитовидной железы, перенесённых операциях и любых проблемах, которые возникали у вас при анестезии."
  - "Если есть вероятность, что вы беременны, или если вы кормите грудью, обязательно сообщите нам об этом до процедуры."
  - "Курение и никотиносодержащие продукты значительно ухудшают заживление ран. По возможности откажитесь от них как минимум за 2–4 недели до процедуры и не курите в период восстановления."

risk_intro:
  - "Как и любая медицинская процедура, эта процедура сопряжена с определёнными рисками. Ниже **ожидаемые временные эффекты** и **осложнения** приведены отдельно и сгруппированы по частоте их возникновения. Приведённые цифры — **приблизительные** значения, основанные на данных медицинской литературы; ваш личный риск может быть ниже или выше в зависимости от возраста, общего состояния здоровья, курения и перенесённых операций."
  - "Подавляющее большинство осложнений **временные** и проходят при надлежащем лечении. В список включены и очень редкие, но серьёзные события; то, что они упомянуты, не означает, что они произойдут с вами, однако вам необходимо знать о них, чтобы принять осознанное решение."

risk_tiers:
  expected: "Ожидаемые временные эффекты (не являются осложнениями — это естественная часть заживления)"
  common: "Частые состояния (большинство из них временные или проходят при лечении)"
  uncommon: "Нечастые состояния"
  rare: "Редкие или очень редкие, но потенциально серьёзные состояния"
  general: "Общие риски, относящиеся к любому хирургическому / медицинскому вмешательству"

general_risks_surgical:
  - "**Риски анестезии:** Если применяется общая анестезия или седация, её риски (тошнота, боль в горле, повреждение зубов, аллергическая реакция и, очень редко, проблемы с сердцем или лёгкими) отдельно разъяснит врач-анестезиолог, и ваше согласие будет получено на **отдельной форме согласия на анестезию**."
  - "**Кровотечение и переливание крови:** Необходимость переливания крови при этих процедурах возникает очень редко. При серьёзном кровотечении может потребоваться введение крови или препаратов крови; это также связано с собственными очень редкими рисками (например, аллергией или инфекцией)."
  - "**Инфекция:** Раневую инфекцию после операции обычно лечат антибиотиками; в редких случаях может потребоваться дренирование (удаление гноя)."
  - "**Тромбы в венах ног (ТГВ) и в лёгких (тромбоэмболия лёгочной артерии):** При непродолжительных операциях на голове и шее встречаются очень редко. Ранняя двигательная активность снижает риск. Приём гормональных препаратов, курение, ожирение и тромбозы в прошлом повышают риск."
  - "**Лекарственная аллергия:** Может развиться аллергическая реакция на используемые лекарства, антисептики, пластыри или шовный материал."
  - "**Рубцы и проблемы с заживлением:** Формирование рубцов у разных людей происходит по-разному; очень редко может образоваться грубый (гипертрофический) рубец или келоид."
  - "**Риск для жизни:** В наши дни смерть при плановых операциях на голове и шее встречается крайне редко; однако ни одно хирургическое вмешательство не является полностью безрисковым. При серьёзном осложнении может потребоваться лечение в отделении интенсивной терапии и может наступить стойкая инвалидность."

general_risks_office:
  - "**Предобморочное состояние (вазовагальная реакция):** Во время инъекции или забора крови могут возникнуть головокружение, потливость и кратковременный обморок; это быстро проходит, если лечь."
  - "**Инфекция:** При обработке кожи антисептиком и использовании стерильных материалов риск очень низкий; если инфекция всё же возникает, её обычно лечат антибиотиками."
  - "**Аллергическая реакция:** На используемый препарат, местный анестетик или антисептик — от лёгкого покраснения до, очень редко, тяжёлой аллергической реакции (анафилаксии). Наша клиника оснащена оборудованием и лекарствами для оказания неотложной помощи."
  - "**Обострение герпеса («простуды» на губах):** Если у вас раньше бывал герпес, он может снова появиться в обработанной области; пожалуйста, сообщите нам об этом."
  - "**Результат, не соответствующий ожиданиям:** Степень и продолжительность эффекта у разных людей различаются; могут потребоваться дополнительные сеансы или коррекция."

risk_outro:
  - "Этот список не охватывает все возможные осложнения; могут возникнуть и другие непредсказуемые и очень редкие события. Если разовьётся осложнение, врач спланирует необходимое лечение и наблюдение; это может потребовать дополнительного лечения, лекарств, процедур или повторной операции."

emergency_call: "Если возникнет что-либо из перечисленного, немедленно позвоните своему врачу: +90 288 502 50 20 · WhatsApp +90 555 333 21 20. Если вы не можете с нами связаться, обратитесь в ближайшее отделение неотложной помощи или позвоните по номеру 112."

lifestyle_common:
  - "Принимайте назначенные вам лекарства (антибиотики, обезболивающие и т. д.) в рекомендованной дозе и в течение рекомендованного срока. Не принимайте аспирин или подобные ему лекарства, которые могут усиливать кровоточивость, не посоветовавшись с врачом."
  - "Во время перелётов или поездок продолжительностью более 4 часов после операции пейте много воды, регулярно двигайтесь и, если вам это рекомендовано, носите компрессионные чулки; это снижает риск образования тромбов в ногах."
  - "В период восстановления рекомендуется не употреблять алкоголь, а также воздерживаться от курения и никотиносодержащих продуктов."
  - "Пожалуйста, обязательно приходите на все контрольные осмотры. Если вы приехали из-за рубежа, после возвращения домой наблюдение может продолжаться в формате онлайн-консультаций и по фото/видео; если вам понадобится обратиться к местному врачу, вам будут выданы письменный протокол операции и наши рекомендации."

intraop:
  - "Если во время процедуры возникнет непредвиденная ситуация, врач останется в рамках той процедуры, на которую вы дали согласие в этой форме. **Если нет угрозы для жизни или риска серьёзного вреда для органа**, никакое дополнительное вмешательство, на которое вы не давали согласия, выполняться не будет; в таком случае процедура будет завершена в безопасный момент, а затем вас проинформируют, чтобы решение было принято вместе с вами. Если же ваша жизнь в опасности, будет оказана неотложная помощь, необходимая для сохранения вашей жизни или органа."
  - "Удалённые во время процедуры ткани при необходимости направляются на **патоморфологическое (гистологическое) исследование** для уточнения диагноза. В зависимости от результата может потребоваться дополнительное лечение или наблюдение."
  - "Переливание крови при этих процедурах требуется очень редко и проводится только по жизненным показаниям. Если вы не согласны на введение крови или препаратов крови (например, по религиозным убеждениям), обязательно сообщите об этом до процедуры; возможные последствия такого решения будут отдельно обсуждены с вами и записаны в разделе «Информация, касающаяся лично вас»."

photo_intro:
  - "До и после процедуры могут быть сделаны **фотографии/видеозаписи** для планирования, наблюдения и оценки результата. Эти материалы являются частью вашей медицинской документации и хранятся конфиденциально. Ваши изображения **ни при каких обстоятельствах не будут использоваться для рекламы, продвижения или в социальных сетях.**"
  - "Использование ваших изображений для любых других целей возможно **только с вашего отдельного и явно выраженного разрешения**. Отказ никак не повлияет на ваше лечение, и вы можете отозвать своё разрешение в любое время:"

photo_options:
  - "Я согласен(-на) на использование моих изображений **только для медицинской документации и наблюдения за лечением**."
  - "Я разрешаю использовать мои изображения для научных публикаций и обучения врачей **таким образом, чтобы меня нельзя было узнать** (с закрытой областью лица/глаз)."
  - "Я разрешаю использовать мои изображения для научных публикаций и обучения врачей **таким образом, что меня можно будет узнать**."
  - "Я **не разрешаю** использование в научных/образовательных целях."

kvkk:
  - "Ваши персональные данные и данные о здоровье обрабатываются в соответствии с турецким Законом о защите персональных данных № 6698 (KVKK) и соответствующим законодательством в сфере здравоохранения в целях диагностики, лечения и исполнения требований закона лицами, связанными обязательством сохранения профессиональной тайны. Подробную информацию вы найдёте в нашем Уведомлении о защите персональных данных."

individual_hint: "Дополнительные риски, касающиеся данного пациента (сопутствующие заболевания, принимаемые лекарства, перенесённые операции), подробности плана, ожидания пациента, заданные вопросы и полученные ответы. Если добавить нечего, пишется «нет»."

declarations:
  - "Я прочитал(-а) и понял(-а) эту форму на своём языке. Мне было предоставлено достаточно времени для размышления; у меня была возможность задать вопросы, и я получил(-а) удовлетворившие меня ответы."
  - "Мне устно и письменно разъяснили моё состояние, цель рекомендованной процедуры, как, кем и где она будет выполнена, её примерную продолжительность, ожидаемую пользу, вероятность успеха, альтернативы и то, что может произойти, если её не проводить."
  - "Мне разъяснили частые и потенциально серьёзные риски, а также возможные последствия этих осложнений (в том числе то, что может потребоваться дополнительное лечение или повторная процедура/операция). Я понимаю, что результат любой медицинской процедуры **не может быть гарантирован на 100%**."
  - "Я предоставил(-а) точную и полную информацию о своём здоровье, принимаемых лекарствах, аллергиях и перенесённых заболеваниях. Я понимаю, что неполная или неверная информация может увеличить риски."
  - "Я понимаю, что соблюдение указаний, данных до и после процедуры, влияет на результат и что посещение контрольных осмотров важно."
  - "Я знаю, что могу отозвать своё согласие в любое время до начала процедуры. Я понимаю, что подписание этой формы не освобождает врача от обязанности проявлять должную заботу и тщательность."
  - "Я принимаю это решение по собственной воле, без давления с чьей-либо стороны."

declarations_aesthetic:
  - "Я понимаю, что эта процедура носит **эстетический характер**, не является медицински необходимой и что у меня всегда есть возможность от неё отказаться. Я обсудил(-а) свои ожидания с врачом, и мне разъяснили реалистичный результат, которого можно достичь."
  - "Я понимаю, что идеальная симметрия или точное повторение внешности с фотографии не могут быть гарантированы, что окончательный результат зависит от того, как заживают мои ткани, и что в некоторых случаях может потребоваться корректирующая процедура."

decision_options:
  - "Я **ДАЮ СВОЁ СОГЛАСИЕ** на описанную выше процедуру."
  - "Я **НЕ СОГЛАСЕН(-НА)** на описанную выше процедуру. Мне разъяснили возможные последствия отказа."

handwritten_hint: "Рекомендуется, чтобы пациент написал собственноручно: «Я прочитал(-а) и понял(-а) эту форму и даю своё согласие»."

sign_rows:
  - "Пациент"
  - "Законный представитель (родитель / опекун) — степень родства:"
  - "Врач, предоставляющий информацию и выполняющий процедуру"
  - "Переводчик (при необходимости) — язык:"
  - "Свидетель (при необходимости)"

interpreter_text: "Заявление переводчика: я полностью и точно перевёл(-а) эту форму и устные разъяснения врача пациенту / законному представителю на понятный ему язык."

minor_text:
  - "За пациентов младше 18 лет согласие дают **родитель или законный опекун**. Ребёнка информируют в соответствии с его возрастом и зрелостью и учитывают его мнение. За недееспособных пациентов согласие даёт законный представитель."

minor_checks:
  - "Если мы осуществляем родительские права совместно, я заявляю, что второй родитель осведомлён об этой процедуре и согласен с ней."
  - "Я заявляю, что не существует судебного решения или спора относительно опеки / попечительства (если они есть, соответствующий документ был предъявлен врачу)."

copies:
  - "Эта форма составлена в двух экземплярах: один хранится в медицинской карте пациента, другой выдаётся пациенту / законному представителю."

withdraw_text:
  - "Я отзываю согласие, которое дал(-а) выше. Мне разъяснили возможные последствия отзыва согласия."

final_note: "Эта форма составлена в соответствии с Положением о правах пациентов Турецкой Республики и принципами информированного согласия Турецкой медицинской ассоциации. Она дополняет, но не заменяет устные разъяснения вашего врача."
