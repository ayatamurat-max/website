intro:
  - "Уважаемый пациент, эта форма составлена для того, чтобы **простым и понятным языком** рассказать вам о том, что необходимо знать о рекомендованной вам процедуре. Её цель — не напугать вас, а помочь вам принять решение **свободно и на основе достоверной информации**."
  - "Пожалуйста, прочитайте эту форму не торопясь. Обо всём, что вам непонятно, спросите своего врача. Врач также устно объяснит вам риски, связанные именно с вашим состоянием. Давать или не давать согласие — исключительно ваше право."

