code: "03"
type: surgical
aesthetic: true
title: "Отопластика"
alt_name: "Операция по коррекции оттопыренных ушей"

specific_fields:
  - label: "Сторона:"
    options: ["Правая", "Левая", "Обе"]
    blank: false
  - label: "Вид анестезии:"
    options: ["Общая анестезия", "Местная анестезия", "Местная анестезия + седация"]
    blank: false
  - label: "Что будет корректироваться / ожидания пациента:"

about:
  - "Оттопыренные уши — это уши, которые отходят от головы под бо́льшим углом, чем обычно, или у которых не сформировалась естественная складка ушного хряща (противозавиток). Это состояние обычно врождённое, не вредит здоровью и не влияет на слух. Однако, особенно в детском и подростковом возрасте, оно может приводить к насмешкам, потере уверенности в себе и социальной тревожности."
  - "Цель отопластики — приблизить уши к голове так, чтобы они выглядели **естественно** и были как можно более **симметричными** с обеих сторон. Поскольку ушная раковина достигает бо́льшей части своего взрослого размера примерно к 5–6 годам, операцию можно проводить **с 5–6 лет**; проведение её до школьного возраста может уберечь ребёнка от социальных трудностей. Если операция предстоит вашему ребёнку, важно учитывать его собственное желание и готовность."

procedure_intro:
  - "Операция проводится в операционной. Детям обычно проводят общую анестезию; взрослым — местную анестезию (при необходимости с седацией) или общую анестезию."
procedure_steps:
  - "**Планирование и разметка:** Уши фотографируют, измеряют их расстояние от головы и размечают положение новой складки."
  - "**Разрез:** Разрез кожи делают на **задней поверхности уха**, рядом с естественной складкой между ухом и головой. Поскольку этот рубец находится за ухом, он обычно не виден."
  - "**Моделирование хряща:** На ушном хряще с помощью постоянных (нерассасывающихся) швов формируют новую складку (противозавиток). При необходимости хрящ истончают или слегка надсекают, чтобы сделать его мягче."
  - "**Приближение уха к голове:** Если глубокая чаша ушной раковины (раковина) большая, её уменьшают или фиксируют швами к тканям за ухом. Если мочка уха также оттопырена, её корректируют."
  - "**Ушивание и повязка:** Кожу закрывают швами. На голову накладывают мягкую, слегка давящую повязку, чтобы сохранить новую форму ушей и не допустить скопления крови."
anesthesia: "Детям — общая анестезия; взрослым — местная анестезия ± седация или общая анестезия"
duration: "Около 1–2 часов (обе стороны)"
stay: "Обычно выписка в тот же день"

benefits:
  - "Уши располагаются ближе к голове и выглядят естественно"
  - "Более симметричный вид обоих ушей"
  - "Меньше социальной тревожности и насмешек, связанных с внешностью; рост уверенности в себе"
success:
  - "Большинство пациентов и их семей довольны результатом. Поскольку ушной хрящ — эластичная ткань, по данным публикаций, примерно у **5–10 из 100** пациентов ухо может частично снова отойти вперёд и может потребоваться коррекция. Различия в несколько миллиметров между двумя ушами считаются нормой."

alternatives:
  - "**Отказ от операции:** Оттопыренные уши не вызывают проблем со здоровьем, поэтому операция не является обязательной."
  - "**Формирование с помощью шин (молдинг) в период новорождённости:** В первые несколько недель после рождения ушной хрящ очень мягкий, и ему можно придать форму с помощью специальных корректоров; после этого периода метод неэффективен."
  - "**Маскировка причёской:** Причёски, закрывающие уши, могут скрыть их вид."
  - "**Безразрезовые / нитевые методики:** У отдельных пациентов с мягким хрящом коррекцию можно провести через крошечные разрезы; частота рецидивов может быть выше, чем при стандартной операции."

no_treatment:
  - "Если операцию не проводить, форма ушей останется прежней; со временем сама по себе она не исправится. Оттопыренные уши не представляют опасности для здоровья; решение об операции полностью зависит от внешнего вида и от желания человека (в случае детей — ребёнка и семьи)."

before:
  - "Перед операцией проводятся необходимые анализы крови; если планируется общая анестезия, вас/вашего ребёнка осмотрит врач-анестезиолог."
  - "Если применяется общая анестезия или седация, в течение **6–8 часов** до операции нельзя ничего есть и пить (для маленьких детей — в течение времени, указанного анестезиологом)."
  - "Утром в день операции вымойте волосы шампунем. Длинные волосы можно собрать так, чтобы они не попадали в область операции."
  - "Операция может быть отложена, если вокруг уха есть активная кожная инфекция, экзема или незажившая рана от пирсинга."

recovery:
  - when: "Первые 48 часов"
    what: "В ушах могут ощущаться пульсация, стянутость и умеренная боль; их снимают обезболивающими. Рекомендуется спать с приподнятой головой. **Сильная боль с одной стороны, которая продолжает нарастать, — это ненормально**, о ней нужно немедленно сообщить."
  - when: "2–7-й день"
    what: "Повязку обычно снимают на контрольном осмотре **со 2-го по 5-й день** и осматривают уши. На этом этапе часто бывают отёк, синяки и болезненность ушей. После снятия повязки носят мягкую **повязку на голову (бандаж для ушей)**. Дети обычно могут вернуться в школу через неделю."
  - when: "1–2-я недели"
    what: "Бандаж носят **днём и ночью в течение первых 1–2 недель**, затем **только ночью в течение 4–6 недель**. Это не даёт уху загибаться вперёд во сне и защищает швы. Нерассасывающиеся кожные швы, если они использовались, снимают на 7–10-й день."
  - when: "3–6-я недели"
    what: "Бо́льшая часть отёка спадает. Контактных видов спорта, плавания и шлемов, давящих на уши, следует избегать как минимум **4–6 недель**."
  - when: "3–6-й месяцы"
    what: "Складки ушей устанавливаются, рубец бледнеет, и становится виден окончательный результат. Лёгкое онемение ушей в этот период обычно проходит."

risks:
  expected:
    - "Боль, пульсация и чувство стянутости в первые дни"
    - "Отёк и синяки ушей (1–2 недели)"
    - "Временное онемение кожи ушей и чувствительность к холоду (от нескольких недель до месяцев)"
    - "Тонкий рубец за ухом, который со временем бледнеет"
  common:
    - name: "Швы, которые прощупываются или выходят через кожу"
      text: "Примерно у **5–10 из 100** пациентов постоянные швы, формирующие хрящ, спустя месяцы или годы могут прощупываться за ухом, выходить через кожу или образовывать небольшое воспалённое уплотнение (гранулёму). Обычно это исправляют с помощью простой процедуры по удалению шва."
    - name: "Частичный рецидив (ухо снова отходит вперёд)"
      text: "Примерно у **5–10 из 100** пациентов ухо может частично вернуться к исходному положению; при необходимости может быть проведена коррекция."
    - name: "Лёгкая асимметрия"
      text: "Два уха никогда не бывают совершенно одинаковыми; различия в несколько миллиметров после операции — норма. Если разница заметна, её можно исправить."
  uncommon:
    - name: "Скопление крови в ухе (гематома)"
      text: "Встречается примерно у **1–3 из 100** пациентов, обычно в первые 48 часов. Важнейший её признак — **сильная боль с одной стороны, которая продолжает нарастать**. Гематому необходимо **срочно дренировать**, прежде чем нарушится кровоснабжение хряща; при задержке лечения может развиться повреждение хряща и стойкая деформация («ухо борца», «ухо в виде цветной капусты»)."
    - name: "Раневая инфекция"
      text: "Встречается примерно у **1–5 из 100** пациентов; обычно проходит при лечении антибиотиками."
    - name: "Грубый рубец или келоид"
      text: "Примерно у **1–3 из 100** пациентов, особенно с более тёмной кожей или склонностью к келоидам, за ухом может образоваться грубый выпуклый рубец. Может потребоваться лечение инъекциями кортикостероидов, силиконовым гелем или хирургическим путём, и рубец может образоваться снова. Пожалуйста, сообщите нам, если у вас раньше образовывались келоиды."
    - name: "Гиперкоррекция или неестественный вид"
      text: "Уши могут выглядеть слишком плотно прижатыми к голове, складка может быть слишком резкой, или средняя часть уха может располагаться дальше назад, чем верхняя и нижняя (вид «телефонной трубки»); при необходимости может быть проведена корригирующая операция."
  rare:
    - name: "Воспаление надхрящницы (перихондрит)"
      text: "Встречается **менее чем у 1 из 100** пациентов. Проявляется нарастающим покраснением, отёком, ощущением жара и сильной болью в ухе. Может потребоваться внутривенное введение антибиотиков и при необходимости хирургическая обработка; при задержке лечения возможны потеря хряща и **стойкая деформация**."
    - name: "Нарушение кровоснабжения кожи или хряща (некроз)"
      text: "Встречается очень редко; обычно связано со слишком тугой повязкой, нелеченой гематомой или инфекцией. Может потребоваться уход за раной, а иногда и восстановительная операция."
    - name: "Стойкое снижение чувствительности или хроническая боль"
      text: "Онемение кожи уха или боль в холодную погоду в редких случаях могут оставаться навсегда."
    - name: "Сужение наружного слухового прохода"
      text: "Очень редко после уменьшения или фиксации раковины вход в слуховой проход может сузиться; может потребоваться коррекция."

emergency:
  - "**Сильная боль в ухе с одной стороны, которая продолжает нарастать** (особенно в первые 48 часов) — это может быть признаком скопления крови"
  - "Усиливающееся просачивание крови через повязку или повязка, пропитанная кровью"
  - "**Температура выше 38,5 °C**, нарастающее покраснение, отёк, ощущение жара или выделения из уха с неприятным запахом"
  - "Ощущение, что повязка слишком тугая, или посинение / изменение цвета уха"
  - "Удар по уху или внезапное изменение его формы"

lifestyle:
  - "Не мочите повязку и не снимайте её самостоятельно до того, как её снимут в клинике. После снятия повязки можно аккуратно принимать душ начиная с того дня, который укажет врач."
  - "Регулярно носите бандаж в течение указанного вам срока; это важно для стойкого результата."
  - "В первые недели не лежите на ушах, не загибайте уши вперёд и не надевайте/не снимайте через голову одежду с узким воротом, задевая уши."
  - "Защищайте уши от солнца и сильного холода как минимум 3 месяца; из-за сниженной чувствительности можно не заметить ожог или обморожение."
  - "Присматривайте за ребёнком, чтобы он не тянул повязку или бандаж."

declarations_extra:
  - "Я понимаю, что ношение бандажа в течение рекомендованного срока после операции влияет на результат и что несоблюдение этих указаний может повысить риск рецидива."
