code: "02"
type: surgical
aesthetic: false
title: "Септопластика"
alt_name: "Операция за изправяне на носната преграда (септума)"

specific_fields:
  - label: "Процедури, които ще се извършат едновременно:"
    options: ["Редукция на носните конхи (радиочестотна / субмукозна)", "Ендоскопска синусова хирургия — FESS (с отделен формуляр за съгласие)", "Няма"]
  - label: "Шини / тампони в носа:"
    options: ["Силиконови шини", "Тампони", "Не са необходими", "Ще се реши по време на операцията"]
  - label: "Оплаквания на пациента (страна на запушването, хъркане, главоболие и др.):"

about:
  - "Стената от хрущял и тънка кост, която разделя носната кухина на лява и дясна половина, се нарича **носна преграда (септум)**. Изкривяването на септума към едната или към двете страни се нарича **девиация на носната преграда**. То може да е вродено, да се развие по време на растежа или след удар в носа."
  - "Изкривеният септум може да причини запушване на носа, дишане през устата, хъркане, нарушен сън, сухота в устата, кървене от носа, а при някои хора — пристъпи на синузит или главоболие. Тъй като е структурен проблем, той не се повлиява от лекарства. Целта на септопластиката е да изправи изкривените части, така че да можете да **дишате свободно през носа**. Тази операция няма за цел да промени външния вид на носа."

procedure_intro:
  - "Операцията обикновено се извършва под обща анестезия в операционна зала, изцяло през ноздрите. По лицето не остава видим разрез или белег."
procedure_steps:
  - "**Разрез:** Прави се малък разрез вътре в ноздрата, в лигавицата, която покрива септума."
  - "**Отделяне на лигавицата:** Лигавицата, покриваща двете страни на септума, внимателно се отделя от хрущяла и костта."
  - "**Корекция на изкривяването:** Изкривените части от хрущяла и костта се отстраняват, изправят или поставят отново на място. Опорните части, които поддържат външната форма на носа (хрущялната рамка на гърба и върха), се запазват."
  - "**Намаляване на носните конхи (при нужда):** Ако разположените по страничната стена на носа структури, наречени конхи, са увеличени, те се намаляват с радиочестотна енергия или чрез намаляване на тъканта под лигавицата."
  - "**Затваряне:** Лигавицата се поставя обратно на мястото си и се фиксира с резорбируеми конци."
  - "**Шини/тампони:** За да заздравее септумът прав и да се предотврати кървене, в носа обикновено се поставят меки силиконови шини с отвор за дишане или тампони."
procedure_notes:
  - "Ако е изкривена и предната, външна част на септума или външната форма на носа допринася за запушването, операцията може да се съчетае с ринопластика (септоринопластика), при условие че това се обсъди и за него се даде отделно съгласие."
anesthesia: "Обща анестезия (в отделни случаи местна анестезия + седация)"
duration: "Около 45–90 минути"
stay: "Същия ден или една нощ в болница"

benefits:
  - "По-лесно дишане през носа и по-малко дишане през устата"
  - "По-качествен сън и по-слабо хъркане (хъркането може да има и други причини)"
  - "По-редки повтарящи се кръвотечения от носа, свързани с изкривяването, а при някои пациенти — по-редки пристъпи на синузит"
  - "По-добър достъп при необходимост от синусова или друга операция на носа"
success:
  - "Според публикуваните данни около **70–85 от 100** пациенти съобщават за ясно намаляване на запушването след операцията. Ако запушването има и други причини — алергия, оток на лигавицата, хлътване на носните крила или заболяване на синусите — те може да изискват отделно лечение. Рядко септумът може постепенно да се изкриви леко отново."

alternatives:
  - "**Без операция / наблюдение:** Ако оплакванията са леки, може само да се наблюдават."
  - "**Медикаментозно лечение:** Кортикостероидните спрейове за нос, промивките и антиалергичните лекарства могат да облекчат оплакванията, като намалят отока на лигавицата, но не коригират структурното изкривяване на костта и хрущяла."
  - "**Лентички за нос / разширители за ноздрите:** Могат да дадат временно облекчение."
  - "**Деконгестантни (отпушващи) спрейове:** Подходящи са само за няколко дни; продължителната употреба води до привикване и по-силно запушване."

no_treatment:
  - "Ако операцията не бъде извършена, изкривяването няма да се изправи от само себе си; оплакванията като запушен нос, дишане през устата и хъркане ще продължат и може да се засилят с възрастта. Това обикновено не е опасно за живота; решението за операция зависи от това доколко оплакванията влошават качеството ви на живот."

before:
  - "Преди операцията се правят кръвни изследвания, при нужда компютърна томография на синусите и други изследвания; ще бъдете прегледани от анестезиолог."
  - "През последните **6–8 часа** преди операцията не трябва да ядете и пиете нищо (моля, спазвайте указанията на анестезиолога)."
  - "Ако в дните преди операцията се разболеете от настинка, грип или заболяване с температура, моля, уведомете ни; операцията може да бъде отложена."

recovery:
  - when: "Първите 48 часа"
    what: "Заради шините ще имате усещане за запушен нос, леко кървениста секреция, главоболие и сухота в гърлото. Болката обикновено е лека. Препоръчва се да спите с повдигната глава. Марлевият тампон под носа може да се наложи да се сменя няколко пъти."
  - when: "3–7-и ден"
    what: "Силиконовите шини или тампоните обикновено се отстраняват на контролен преглед между **3-ия и 7-ия ден**; това причинява краткотраен дискомфорт. Започват се промивки на носа. Повечето хора се връщат към офис работа за 5–7 дни."
  - when: "2–4-та седмица"
    what: "В носа може да има крусти и сухота, които намаляват с редовни промивки. Дишането постепенно се подобрява. Тежките физически натоварвания и контактните спортове трябва да се отложат за около **3–4 седмици**."
  - when: "1–3-ти месец"
    what: "Лигавицата на носа заздравява напълно. Крайният резултат по отношение на дишането обикновено се оценява през този период."

risks:
  expected:
    - "Запушен нос и дишане през устата до отстраняването на шините"
    - "Леко кървениста секреция през първите дни"
    - "Временно изтръпване на горните предни зъби и горната устна"
    - "Крусти и сухота в носа (първите седмици)"
    - "Временно намаляване на обонянието"
  common:
    - name: "Продължителни крусти и сухота"
      text: "Може да продължат няколко седмици, особено ако е извършена редукция на конхите; отзвучават с промивки и овлажняващ мехлем."
    - name: "Продължително изтръпване на горните зъби и устната"
      text: "Обикновено изчезва за няколко седмици; рядко може да продължи няколко месеца."
    - name: "Запушването не изчезва напълно"
      text: "При около **15–30 от 100** пациенти дишането може да не се подобри толкова, колкото се очаква. Причината често са допълнителни фактори като алергия, оток на лигавицата или слабост на носните крила; може да е необходимо медикаментозно лечение или допълнителна операция."
  uncommon:
    - name: "Кървене от носа"
      text: "При около **1–3 от 100** пациенти може да настъпи кървене, което налага тампониране. Много рядко кървенето трябва да се спре в операционна зала."
    - name: "Перфорация на носната преграда"
      text: "При около **1–3 от 100** пациенти в септума може да се образува отвор. Често не причинява оплаквания; ако предизвиква свистене, крусти или кървене, може да са необходими промивки, септален обтуратор (бутон) или възстановителна операция."
    - name: "Сраствания в носа (синехии)"
      text: "При около **1–5 от 100** пациенти може да се образуват сраствания между септума и страничната стена; ако причиняват запушване, се разделят с проста процедура при контролен преглед."
    - name: "Събиране на кръв или гной в септума (хематом / абсцес)"
      text: "Среща се при **по-малко от 1 от 100** пациенти. Проявява се със засилващо се запушване, болка и температура в дните след операцията. Трябва да се **дренира спешно**, за да не се увреди хрущялът на носа; без лечение може да настъпи загуба на хрущял и хлътване на гърба на носа."
    - name: "Инфекция"
      text: "Рядка; обикновено отзвучава с антибиотици."
    - name: "Повторно изкривяване"
      text: "Поради „паметта“ на хрущяла септумът може с времето леко да се изкриви отново; ако това причинява оплаквания, може да е необходима втора операция."
  rare:
    - name: "Хлътване на гърба на носа (седловиден нос)"
      text: "Среща се при **по-малко от 1 от 100** пациенти. Отслабването на опорния хрущял на септума или загубата на хрущял след хематом/абсцес може да доведе до хлътване на гърба на носа; това променя външния вид на носа и за корекцията му е необходима допълнителна операция с хрущялна присадка."
    - name: "Спадане или промяна във формата на върха на носа"
      text: "Много рядко; може да се получи при засягане на опорните структури."
    - name: "Трайно намаляване или загуба на обонянието"
      text: "Много рядко."
    - name: "Изтичане на гръбначно-мозъчна течност (ликворея) и менингит"
      text: "Тъй като горната част на септума граничи с основата на черепа, това е изключително рядко усложнение — **далеч под 1 на 10 000** случая. При възникването му може да са необходими хоспитализация, допълнително лечение и възстановителна операция."
    - name: "Синдром на празния нос"
      text: "При прекомерно намаляване на конхите може да се появи усещане за запушване и сухота, въпреки че носът е проходим. Много рядко е; затова конхите се намаляват щадящо. Ако се развие, може да бъде продължителен или траен и се лекува трудно."
    - name: "Синдром на токсичния шок"
      text: "Много рядка, но сериозна инфекция, свързана с носните тампони/шини, която налага спешно лечение (внезапна висока температура, обрив, ниско кръвно налягане). Изисква болнично лечение, понякога в интензивно отделение, и може да бъде животозастрашаваща."
    - name: "Нарушение на зрението, кървене около окото"
      text: "Изключително рядко при септопластика; рискът е малко по-висок при съчетаване със синусова операция (FESS) и се обяснява в отделен формуляр за съгласие."

emergency:
  - "**Кървене от носа, което не спира или е много обилно** въпреки няколкоминутен натиск и лед, или постоянно стичане на кръв в устата"
  - "**Засилващо се запушване, силна болка и оток на носа** в дните след операцията (може да е признак на хематом/абсцес на септума)"
  - "**Температура над 38,5 °C** или зловонна секреция"
  - "**Внезапна висока температура, кожен обрив, световъртеж или отпадналост**, докато тампоните/шините са в носа"
  - "**Бистра, водниста секреция** от носа, особено засилваща се при навеждане напред, силно главоболие или схванат врат"
  - "**Замъглено или двойно виждане** или оток около окото"
  - "Задух или болка в гърдите"

lifestyle:
  - "През първите 2 седмици не издухвайте носа си; кихайте с отворена уста."
  - "Промивайте носа така, както ви е показано, и толкова често, колкото е препоръчано."
  - "През първите 2 седмици избягвайте горещи вани, сауна, турска баня и вдигане на тежести."
  - "Пазете носа от удари поне 4 седмици."
  - "Ако сте пристигнали от чужбина, пътуването със самолет обикновено е безопасно след отстраняване на шините."

declarations_extra:
  - "Разбирам, че целта на тази операция е да подобри дишането, а не да промени външния вид на носа, и че може да е необходимо допълнително лечение, ако запушването има и други причини."
