code: "16"
type: office
aesthetic: true
title: "Мезотерапия"
alt_name: "Въвеждане на продукти за грижа и възстановяване на кожата или скалпа чрез микроинжекции"

specific_fields:
  - label: "Наименование / състав на продукта:"
  - label: "LOT № / срок на годност:"
  - label: "Област на приложение:"
    options: ["Лице", "Шия", "Скалп", "Под очите", "Друго"]
  - label: "Техника:"
    options: ["Ръчно (с игла)", "Мезотерапевтичен пистолет", "Дермаролер / микронидлинг"]
  - label: "Сеанс № / планиран брой сеанси:"

about:
  - "Мезотерапията представлява въвеждане на малки количества продукти, съдържащи **хиалуронова киселина, витамини, минерали и аминокиселини**, в повърхностните слоеве на кожата или скалпа с много тънки игли. Целта е да се подобрят хидратацията и жизнеността на кожата, да се намали видимостта на фините бръчки, на безжизнения тен и на уморения вид под очите или да се подпомогне грижата за скалпа при косопад."
  - "Качеството на кожата и косата се влияе от възрастта, слънцето, тютюнопушенето, стреса, хормоните и наследствеността. Мезотерапията не спира тези процеси; тя е **поддържаща** процедура. Кой продукт и колко сеанса са подходящи за вас, се решава заедно след прегледа."

procedure_intro:
  - "Процедурата се извършва в нашата клиника при стерилни условия. Използват се само продукти, които са **разрешени/регистрирани в Турция, стерилни и се отварят от оригиналната си опаковка**; наименованието на продукта и LOT номерът се записват в досието ви."
procedure_steps:
  - "**Подготовка:** Областта се фотографира, гримът се почиства и кожата се дезинфекцира с антисептичен разтвор. По желание може да се нанесе обезболяващ крем за 20–30 минути."
  - "**Приложение:** Продуктът се въвежда в повърхностния слой на кожата на множество малки точки — ръчно с много тънка игла, с мезотерапевтичен пистолет или с апарат за микронидлинг."
  - "**Приключване:** Областта се почиства и при нужда за кратко се поставя студен компрес. Получавате препоръки за грижа след процедурата."
procedure_notes:
  - "Ефектът обикновено се забелязва не след един сеанс, а след **курс от няколко сеанса**. Повечето протоколи препоръчват 3–6 сеанса през 2–4 седмици, последвани от поддържащи сеанси на всеки няколко месеца."
anesthesia: "Обезболяващ крем (по желание)"
duration: "Около 20–40 минути"
stay: "Същия ден; кратко наблюдение след процедурата"

benefits:
  - "По-хидратирана, сияйна и свежа кожа; по-слабо забележими фини бръчки"
  - "По-малко уморен вид под очите"
  - "Подкрепа за подхранването на скалпа и качеството на косата при косопад"
success:
  - "Резултатите се различават значително при отделните хора. Степента на научните доказателства за мезотерапията зависи от продукта и целта: процедурите с хиалуронова киселина за качество на кожата са проучени по-добре, докато данните за някои смеси от съставки („коктейли“) са ограничени. Ефектът не е постоянен; за поддържането му са необходими редовни повторения. Определен резултат не може да бъде гарантиран."

alternatives:
  - "**Без лечение** или продължаване само с редовна грижа за кожата, защита от слънцето и здравословен начин на живот"
  - "**Локални продукти:** кремове с ретиноиди, витамин C или хидратиращи съставки; при косопад — лекарства като миноксидил по лекарска препоръка"
  - "**Други процедури:** PRP, процедури с хиалуронова киселина за качество на кожата, химичен пилинг, лазерни процедури или микронидлинг"
  - "При косопад — изследване и лечение на основната причина (дефицит на желязо, заболяване на щитовидната жлеза, хормонални причини)"

no_treatment:
  - "Ако не се извърши мезотерапия, кожата или косата ви ще продължат естественото си развитие. Тъй като процедурата е изцяло естетична/поддържаща, отказът от нея не носи риск за здравето ви."

before:
  - "Ако е възможно, след консултация с лекаря спрете 1 седмица преди процедурата продуктите, които могат да засилят кръвонасяданията — аспирин, обезболяващи (ибупрофен и др.), омега-3, витамин Е."
  - "При активно акне, херпес, екзема или инфекция в областта на процедурата тя се отлага."
  - "Уведомете ни, ако през последните 2 седмици в същата област сте имали филър, ботулинов токсин, лазер или пилинг."
  - "Мезотерапия не се прилага по време на бременност и кърмене."

recovery:
  - when: "Първите часове"
    what: "По местата на убождане се появяват малки подутини (папули), зачервяване и лек оток; обикновено намаляват в рамките на няколко часа. По местата на убождане може да има малки следи от кръв."
  - when: "Първите 24 часа"
    what: "Не си слагайте грим и не търкайте областта. Избягвайте сауна, турска баня, солариум, интензивни физически натоварвания и пряко слънце. След процедура на скалпа можете да измиете косата си на следващия ден."
  - when: "2–7-и ден"
    what: "Ако се **появи** кръвонасядане, то изчезва за 3–7 дни. Леките подутини и чувствителността отшумяват напълно. Продължете да използвате слънцезащита."
  - when: "По време на курса"
    what: "Сеансите обикновено се повтарят през 2–4 седмици. Ефектът най-често се забелязва след 2-рия–3-тия сеанс."
  - when: "След курса"
    what: "Постигнатият ефект постепенно отслабва; за поддържането му могат да се планират поддържащи сеанси на всеки няколко месеца."

risks:
  expected:
    - "Лека болка или парене от убождането"
    - "Малки подутини, зачервяване и лек оток в точките на убождане (от няколко часа до 1 ден)"
    - "Малки следи от кръв и чувствителност по местата на убождане"
  common:
    - name: "Кръвонасядания"
      text: "Чести са, особено в области с тънка кожа като под очите; изчезват сами за 3–7 дни и могат да се прикрият с грим."
    - name: "Продължителен оток или зачервяване"
      text: "Отокът под очите може да продължи няколко дни. Студените компреси и спането с повдигната глава помагат."
    - name: "По-слаб ефект от очаквания"
      text: "При някои хора може да няма забележима промяна или ефектът да е краткотраен."
  uncommon:
    - name: "Временно засилен косопад"
      text: "След процедура на скалпа през първите седмици може да се наблюдава временно засилено окапване на косата; обикновено отшумява от само себе си."
    - name: "Алергична или възпалителна реакция"
      text: "Към съставка на продукта може да се развие сърбеж, зачервяване, уртикария или продължителен оток. Обикновено се лекува с медикаменти."
    - name: "Потъмняване на кожата (хиперпигментация)"
      text: "Възможно е потъмняване в точките на убождане, особено при по-тъмна кожа и излагане на слънце; обикновено избледнява в рамките на месеци."
    - name: "Малки уплътнения (нодули)"
      text: "Могат да се образуват малки, опипващи се уплътнения; повечето изчезват за няколко седмици."
  rare:
    - name: "Инфекция"
      text: "Бактериалната инфекция е рядка. **Инфекцията с атипични микобактерии**, описвана основно във връзка с нестерилни или нерегистрирани продукти, може да се прояви седмици след процедурата като болезнени, зачервени уплътнения със секреция; може да наложи продължително лечение с антибиотици, понякога хирургично дрениране, и да остави белези. За да се намали този риск, се използват само регистрирани стерилни продукти."
    - name: "Възпаление на мастната тъкан (паникулит) или гранулом"
      text: "Рядка реакция с болезнено уплътнение или зачервяване в по-дълбоката тъкан, която може да е продължителна и да изисква лечение."
    - name: "Траен белег или промяна в цвета"
      text: "Много рядко след инфекция или тежка реакция може да остане траен белег, хлътване или разлика в цвета на кожата."
    - name: "Запушване на кръвоносен съд"
      text: "Особено при продукти, съдържащи хиалуронова киселина, **изключително рядко** е описано нарушено кръвоснабдяване на кожата и траен белег поради навлизане на веществото в кръвоносен съд или притискане на съда. При внезапна силна болка, побеляване на кожата или мрежовидно моравосиньо оцветяване веднага ни уведомете; ранното лечение е много важно."
    - name: "Тежка алергична реакция (анафилаксия)"
      text: "Много рядка; протича със задух, обширен обрив и спадане на кръвното налягане и изисква спешно лечение."

emergency:
  - "**Засилваща се болка, зачервяване, затопляне, оток или гнойна секреция** в третираната област"
  - "**Температура над 38 °C**"
  - "Болезнени, зачервени или секретиращи уплътнения, появили се **дни или седмици след** процедурата"
  - "Оток на лицето, устните или езика, **задух**, обширен сърбящ обрив"
  - "Побеляване на кожата, мрежовидно моравосиньо оцветяване или силна болка"

lifestyle:
  - "Не си слагайте грим през първите 24 часа; избягвайте сауна, турска баня, солариум, интензивен спорт и басейн."
  - "По време на курса използвайте всеки ден слънцезащитен крем с висок фактор."
  - "През първите 2–3 дни не нанасяйте на областта пилинги, ретинол или продукти с киселини."
  - "Ако по-късно ви предстои друга процедура в същата област (филър, лазер и др.), уведомете лекаря, че сте имали мезотерапия."

declarations_extra:
  - "Бяха ми съобщени наименованието и съставът на продукта; обяснено ми беше, че ще се използват само регистрирани и стерилни продукти и че данните за продукта ще бъдат записани в досието ми."
  - "Разбирам, че ефектът е индивидуален, че може да са необходими няколко сеанса и че резултатът не е постоянен."
