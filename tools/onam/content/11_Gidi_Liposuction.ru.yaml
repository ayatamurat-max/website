code: "11"
type: surgical
aesthetic: true
title: "Субментальная липосакция"
alt_name: "Удаление жира под подбородком (липосакция второго подбородка)"

specific_fields:
  - label: "Планируемая методика:"
    options: ["Классическая (тумесцентная)", "С применением энергии (лазер/РЧ)", "Будет определена хирургом"]
    blank: false
  - label: "Анестезия:"
    options: ["Местная анестезия", "Местная анестезия + седация", "Общий наркоз"]
  - label: "Вмешательства, выполняемые одновременно:"
    options: ["Нет", "С отдельной формой согласия:"]
  - label: "Жалобы и ожидания пациента:"

about:
  - "Жир, скапливающийся под подбородком («второй подбородок»), может сглаживать угол между подбородком и шеей, из-за чего линия челюсти выглядит менее чёткой, усталой или более полной, чем на самом деле. Жировые отложения в этой области часто обусловлены **генетической предрасположенностью** и могут не исчезать полностью даже при снижении веса или физических упражнениях. Возрастная потеря эластичности кожи также делает их более заметными."
  - "Субментальная липосакция — это удаление **подкожного жира** путём отсасывания через тонкие канюли. Цель — сделать линию челюсти более чёткой и получить **естественный, гармоничный угол между подбородком и шеей**."
  - "Важнейший фактор, определяющий результат, — **качество и эластичность кожи**. Эластичная кожа после удаления жира подстраивается под новый контур; кожа с низкой эластичностью может выглядеть более дряблой. Глубокий жир под мышцей шеи (платизмой), крупные слюнные железы, выраженные тяжи шейной мышцы и сильная дряблость кожи не поддаются коррекции липосакцией; в этих случаях могут потребоваться другие методы, например глубокая подтяжка шеи."

procedure_intro:
  - "Перед операцией осматривают область подбородка и шеи, оценивают эластичность кожи, выполняют фотографирование и размечают обрабатываемую зону в положении сидя."
procedure_steps:
  - "**Обезболивание и введение раствора:** В зону вводят специальный раствор (тумесцентный раствор), содержащий местный анестетик и препарат, уменьшающий кровотечение. Этот раствор предотвращает боль, а также уменьшает кровоточивость и образование синяков."
  - "**Небольшие разрезы:** В естественной складке под подбородком и при необходимости за мочками ушей делают небольшие входные проколы размером около **3–5 мм**."
  - "**Удаление жира:** Жир аккуратно и равномерно отсасывают через тонкие канюли (металлические трубки). Под кожей оставляют тонкий слой жира, чтобы поверхность оставалась ровной."
  - "**Воздействие энергией (если запланировано):** С помощью лазерной или радиочастотной энергии жир размягчают и в определённой степени способствуют подтягиванию кожи. Это может способствовать подтягиванию кожи, но не устраняет выраженную дряблость."
  - "**Завершение операции и компрессионное бельё:** Входные проколы закрывают одним швом или оставляют заживать самостоятельно. В конце операции на область подбородка и шеи надевают **эластичное компрессионное изделие (бандаж для подбородка)**."
anesthesia: "Местная анестезия, местная анестезия + седация или общий наркоз"
duration: "Около 45–90 минут (если выполняется отдельно)"
stay: "Обычно выписка в тот же день"

benefits:
  - "Уменьшение избытка жира под подбородком"
  - "Более чёткая линия челюсти и угол между подбородком и шеей; более гармоничный профиль лица"
  - "**Долговременный** результат при условии стабильного веса, поскольку удалённые жировые клетки не восстанавливаются (естественные возрастные изменения кожи и тканей будут продолжаться)"
success:
  - "Большинство пациентов с хорошей эластичностью кожи довольны результатом. Результат проявляется в течение **3–6 месяцев** по мере спадания отёка. Примерно **3–5 из 100** пациентов может потребоваться небольшая корректирующая процедура из-за неровностей, остаточного жира или асимметрии. Значительная прибавка в весе и старение со временем могут повлиять на результат."

alternatives:
  - "**Отказ от процедуры:** Поскольку это эстетическое вмешательство, у вас всегда есть возможность от него отказаться."
  - "**Снижение веса и изменение образа жизни:** Уменьшают общее количество жира в организме, но не всегда устраняют стойкий жир под подбородком."
  - "**Инъекции, растворяющие жир (например, дезоксихолевая кислота):** Требуют нескольких сеансов, могут вызывать выраженный отёк и боль и дают более ограниченный эффект."
  - "**Криолиполиз (уменьшение жира охлаждением) и аппаратные методы:** Не являются хирургическими, но требуют нескольких сеансов и дают более ограниченный эффект."
  - "**Глубокая подтяжка шеи / операция по подтяжке шеи:** Более подходящий вариант при выраженной дряблости кожи, тяжах шейной мышцы или глубоком жире под мышцей."

no_treatment:
  - "Если процедуру не проводить, вид области под подбородком останется прежним и может усилиться с возрастом или при прибавке в весе. Это не представляет опасности для вашего здоровья."

before:
  - "Перед операцией выполняются анализы крови; если планируется седация или общий наркоз, вас осмотрит анестезиолог, и перед операцией нужно будет соблюдать голод."
  - "Желательно, чтобы перед процедурой ваш вес был стабильным; если в ближайшее время вы планируете значительно изменить вес, обсудите это с врачом."
  - "В день операции не наносите крем или макияж на лицо и шею; наденьте удобную одежду с застёжкой спереди, а не с высоким воротом."
  - "После седации или общего наркоза нельзя садиться за руль; пожалуйста, возвращайтесь домой с сопровождающим."

recovery:
  - when: "Первые 48 часов"
    what: "Под подбородком будут отёк, стянутость и лёгкая боль, а из входных проколов может подтекать немного розоватой жидкости; это нормально. Синяки, **если они появляются**, могут распространяться вниз по шее и проходят в течение 1–2 недель. Спите с приподнятой головой и носите компрессионное изделие постоянно."
  - when: "1-я неделя"
    what: "Компрессионное изделие обычно носят **днём и ночью в течение первой недели**, а затем **по ночам ещё 2–3 недели**. Швы, если они есть, снимают на 5–7-й день. Большинство пациентов возвращаются к сидячей работе и общественной жизни в течение 3–7 дней."
  - when: "2–6-я недели"
    what: "Отёк в основном спадает. В этой зоне могут ощущаться уплотнение, небольшие узелки и онемение; со временем они смягчаются. К интенсивным физическим нагрузкам обычно можно вернуться через **2–3 недели**. Если рекомендовано, мягко массируйте эту область."
  - when: "3–6-й месяцы"
    what: "Оставшиеся отёк и уплотнение проходят, кожа подстраивается под новый контур, и результат становится отчётливым."

risks:
  expected:
    - "Отёк, стянутость и лёгкая боль под подбородком и на шее; синяки, **если они появляются**, проходят в течение 1–2 недель"
    - "Подтекание розоватой жидкости из входных проколов в первые 24–48 часов"
    - "Временное онемение и снижение чувствительности в этой зоне"
    - "Лёгкое уплотнение и небольшие прощупываемые узелки, сохраняющиеся несколько недель"
  common:
    - name: "Длительное уплотнение и узелки (фиброз)"
      text: "Уплотнение и бугристость под кожей часто встречаются в процессе заживления; в большинстве случаев они смягчаются в течение нескольких месяцев благодаря массажу и со временем."
    - name: "Длительное онемение"
      text: "Снижение чувствительности кожи под подбородком может сохраняться от нескольких недель до нескольких месяцев; очень редко оно бывает стойким."
    - name: "Небольшая асимметрия"
      text: "Поскольку две половины лица никогда не бывают идеально симметричными, небольшие различия могут сохраниться."
  uncommon:
    - name: "Неровность контура и впадины"
      text: "Примерно у **2–5 из 100** пациентов могут появиться волнистость, вмятины или остаточные жировые отложения. Если удалено слишком много жира, под подбородком может появиться впалый или «скелетированный» вид, а тяжи шейной мышцы могут стать более заметными. Для коррекции может потребоваться введение жира, повторная липосакция или другая процедура."
    - name: "Дряблость кожи или недостаточное подтягивание"
      text: "Особенно у людей со сниженной эластичностью кожи после удаления жира кожа может подтянуться недостаточно, и дряблость может стать более заметной. В этом случае в будущем может потребоваться подтяжка шеи."
    - name: "Асимметрия улыбки (воздействие на ветвь нерва нижней губы)"
      text: "Тонкая ветвь нерва, проходящая вдоль края нижней челюсти и двигающая нижнюю губу, может пострадать от отёка или давления, что вызывает асимметрию нижней губы при улыбке. Это происходит примерно у **1 из 100** пациентов и почти всегда проходит самостоятельно **в течение от нескольких недель до нескольких месяцев**; стойкая слабость бывает очень редко."
    - name: "Скопление крови или жидкости (гематома, серома)"
      text: "Возникает **менее чем у 1 из 100** пациентов. Небольшие скопления рассасываются сами; более крупные может потребоваться удалить иглой или с помощью небольшой процедуры."
    - name: "Инфекция"
      text: "Возникает **менее чем у 1 из 100** пациентов; обычно проходит при лечении антибиотиками, в редких случаях может потребоваться вскрытие абсцесса."
    - name: "Рубцы или изменение цвета кожи в местах проколов"
      text: "Маленькие рубцы от проколов обычно становятся незаметными; в редких случаях может остаться потемнение, утолщение или небольшая вмятина."
  rare:
    - name: "Ожог кожи (при методах с применением энергии)"
      text: "При использовании лазера или радиочастотной энергии, несмотря на меры безопасности, в редких случаях возможны ожог кожи, пузыри и стойкие рубцы; может потребоваться уход за раной и лечение рубцов."
    - name: "Повреждение кожи или потеря ткани"
      text: "Очень редко, особенно у курящих, нарушение кровоснабжения кожи может привести к образованию раны и рубцов."
    - name: "Стойкое повреждение нерва"
      text: "Стойкая слабость движений нижней губы бывает крайне редко; если она возникает, может потребоваться дополнительное лечение."
    - name: "Реакция на местный анестетик"
      text: "Возможна аллергия на местный анестетик, а его высокая концентрация в крови может вызвать головокружение, звон в ушах, металлический привкус во рту и, очень редко, судороги или нарушение сердечного ритма. Дозы поддерживаются в безопасных пределах."
    - name: "Жировая эмболия и повреждение глубоких структур или дыхательных путей"
      text: "Попадание капель жира в кровоток или повреждение канюлей глубоких структур при субментальной липосакции небольшого объёма — это **крайне редкое** явление; если бы это произошло, могло бы потребоваться экстренное лечение в больнице и в отделении интенсивной терапии."
    - name: "Психологическая неудовлетворённость"
      text: "Несмотря на технически успешный результат, человеку может быть трудно привыкнуть к своему новому виду. Открытое обсуждение ожиданий до операции снижает этот риск."

emergency:
  - "**Быстро нарастающий, плотный, напряжённый отёк** шеи, особенно с одной стороны"
  - "**Затруднение дыхания или глотания** либо изменение голоса"
  - "**Температура выше 38,5 °C**, нарастающая боль, покраснение, ощущение жара или выделения с неприятным запахом"
  - "Побеление, тёмно-фиолетовый или чёрный цвет кожи; пузыри, наполненные жидкостью"
  - "Боль в груди, одышка или спутанность сознания"

lifestyle:
  - "Регулярно носите компрессионное изделие в течение рекомендованного срока; следите, чтобы оно не было ни слишком тугим, ни слишком свободным."
  - "В первые 1–2 недели спите на спине с приподнятой головой; избегайте резкого или чрезмерного вытягивания шеи."
  - "В первые 2–3 недели избегайте интенсивных физических нагрузок, сауны, турецкой бани (хаммама) и длительного горячего душа."
  - "В первые месяцы защищайте эту зону от солнца; это снижает риск образования рубцов и изменения цвета кожи."
  - "Чтобы сохранить результат, старайтесь поддерживать стабильный вес."
  - "Если вы приехали из-за рубежа, авиаперелёт обычно безопасен начиная со 2–3-го дня."

declarations_extra:
  - "Я понимаю, что результат зависит от эластичности моей кожи и что липосакция не устраняет дряблость кожи, тяжи шейной мышцы и глубокий жир под мышцей."
  - "Я понимаю, что ношение компрессионного изделия и соблюдение данных мне рекомендаций напрямую повлияют на результат."
