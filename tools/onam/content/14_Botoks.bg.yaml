code: "14"
type: office
aesthetic: true
title: "Лечение с ботулинов токсин (ботокс)"
alt_name: "Инжекционно лечение на мимически бръчки, увеличен дъвкателен мускул (масетер) или прекомерно изпотяване"

specific_fields:
  - label: "Име на продукта / марка:"
  - label: "Партиден номер (LOT) и срок на годност:"
  - label: "Общ брой единици и разреждане:"
  - label: "Третирани зони:"
    options: ["Чело", "Между веждите", "Около очите („пачи крачета“)", "Масетер (дъвкателен мускул)", "Шия", "Изпотяване (подмишници / длани)", "Друго"]
  - label: "Цел на лечението:"
    options: ["Естетична", "Медицинска (скърцане със зъби, изпотяване и др.)"]
  - label: "Зона извън одобрените показания (off-label):"
    options: ["Няма", "Има — зона:"]

about:
  - "Ботулиновият токсин е пречистен белтък, който временно намалява връзката между нерва и мускула, в който се инжектира, така че мускулът се съкращава по-слабо. С естетична цел се използва за омекотяване на **мимическите бръчки** по челото, между веждите и около очите. Прилага се и като медицинско лечение при скърцане със зъби (бруксизъм) и уголемяване на дъвкателния мускул (масетер), при вертикални ивици на шията и при **прекомерно изпотяване** (хиперхидроза)."
  - "Мимическите бръчки се образуват с годините от многократното съкращаване на едни и същи мускули и намаляването на еластичността на кожата. Ефектът е **временен**: мускулът постепенно възстановява функцията си и ако лечението не се повтори, видът бавно се връща към изходното състояние. Целта е **естествен, отпочинал** вид, без да се „замразява“ мимиката."

procedure_intro:
  - "Процедурата се извършва в клиниката след кратка консултация и преглед. Оценява се мимиката ви, отбелязват се точките за инжектиране и при необходимост се правят снимки преди процедурата."
procedure_steps:
  - "**Подготовка:** Гримът се отстранява, а кожата се почиства с антисептичен разтвор. Ако сте чувствителни към болка, може да се постави лед или крем с местен анестетик."
  - "**Инжектиране:** С много тънка игла в отбелязаните точки се инжектира малко количество от продукта. Всяко инжектиране трае няколко секунди; усеща се леко убождане или парене."
  - "**Завършване:** Върху местата на убождане се оказва лек натиск. Малките подутини изчезват за няколко минути."
  - "**Документиране:** Името на продукта, партидният номер (LOT), общият брой единици и третираните зони се вписват в досието ви."
procedure_notes:
  - "Някои зони и цели на лечение може да не са включени в одобрените указания за употреба на продукта в Турция (**употреба извън одобрените показания, „off-label“**); например лечението на масетера (дъвкателния мускул) и скърцането със зъби, на шията и на изпотяването на дланите не е сред одобрените показания на много продукти. Въпреки че такава употреба е широко разпространена и приета в медицинската литература, лекарят ще ви обясни отделно дали планираната при вас зона попада в тази категория и това ще бъде отбелязано в съответното поле на формуляра."
anesthesia: "Обикновено не е необходима; при желание — лед или анестетичен крем"
duration: "Около 10–20 минути"
stay: "Същия ден; наблюдение 15–30 минути след процедурата"

benefits:
  - "Омекотяване на мимическите бръчки по челото, между веждите и около очите и по-отпочинал вид"
  - "При лечение на масетера — по-малко оплаквания от скърцане със зъби и по-фина линия на долната челюст"
  - "При лечение на изпотяването — значително намаляване на потенето"
  - "Кратка процедура без хирургически разрези, след която можете веднага да се върнете към ежедневието си"
success:
  - "Ефектът обикновено започва в рамките на **3–14 дни**, достига максимума си около 2-рата седмица и продължава средно **3–4 месеца** в мимическите зони (при изпотяване и масетер може да е по-дълъг). Степента и продължителността на ефекта са индивидуални. Много дълбоките, трайни бръчки може да не изчезнат напълно. При нужда около 2-рата седмица се прави контролен преглед и когато лекарят прецени, може да се направи малка допълнителна корекция."

alternatives:
  - "**Без лечение:** Тъй като процедурата е естетична, винаги имате възможност да не я правите."
  - "**Филъри (пълнители):** Може да са по-подходящи за бръчки, причинени от загуба на обем, а не от движение."
  - "**Грижа за кожата и методи за подмладяване:** Кремове с ретиноиди, химичен пилинг, лазер или мезотерапия могат да подобрят качеството на кожата, но не намаляват движението на мимическите мускули."
  - "**Хирургични методи:** Операции като повдигане на веждите или лицето могат да дадат по-траен резултат при наличие на отпускане."
  - "**При медицински показания:** Нощна шина (предпазител за зъбите) при скърцане със зъби; антиперспиранти и лекарства при изпотяване."

no_treatment:
  - "Ако процедурата не се извърши, сегашният ви вид или оплаквания ще следват естествения си ход. С възрастта мимическите бръчки може постепенно да станат по-видими; това не представлява опасност за здравето ви."

before:
  - "Процедурата **не се извършва или се отлага** в следните случаи: бременност, кърмене, нервно-мускулни заболявания като **миастения гравис**, амиотрофична латерална склероза (АЛС) или синдром на Ламбърт–Итън, активна инфекция в третираната зона, известна алергия към продукта, а при някои продукти — алергия към белтъка на кравето мляко. Моля, кажете ни, ако някое от тези състояния се отнася за вас."
  - "**Антибиотиците от групата на аминогликозидите** (напр. гентамицин) и някои мускулни релаксанти могат да засилят ефекта на ботулиновия токсин; уведомете ни, ако ги приемате."
  - "Ако сте имали лечение с ботулинов токсин преди, кажете ни кога, с какъв продукт и какъв е бил резултатът."
  - "За да се намали рискът от кръвонасядания, ако е възможно и след консултация с лекаря, спрете аспирина и подобни лекарства няколко дни преди процедурата."

recovery:
  - when: "Първите 4 часа"
    what: "Не лягайте, не масажирайте и не натискайте третираната зона. Това помага продуктът да остане там, където е поставен. По местата на убождане може да има леко зачервяване и малки подутини."
  - when: "Първият ден"
    what: "Избягвайте усилени физически натоварвания, сауна, турска баня, солариум и много топла среда. Гримът може да се постави след няколко часа. Може да се появи леко главоболие; минава с обикновени обезболяващи."
  - when: "3–14-и ден"
    what: "Ефектът започва постепенно. **Ако** по местата на убождане се появят малки кръвонасядания, те изчезват в рамките на седмица. През този период не правете козметични процедури, кожни третирания или масаж на лицето."
  - when: "2-ра седмица"
    what: "Ефектът достига максимума си. При нужда се прави контролен преглед; при асиметрия или недостатъчен ефект, след преценка на лекаря, може да се планира малка допълнителна корекция."
  - when: "3–4-ти месец и след това"
    what: "Ефектът постепенно отслабва. Обикновено се препоръчва интервал от поне 3 месеца между процедурите."

risks:
  expected:
    - "Лека болка, зачервяване и малки подутини по местата на убождане (отшумяват за минути до часове)"
    - "Малки кръвонасядания; **ако** се появят, изчезват за няколко дни до седмица"
    - "Леко усещане за тежест или опъване в челото (първите 1–2 седмици)"
  common:
    - name: "Главоболие"
      text: "Особено след първа процедура при около **1–10 от 100** пациенти през първите дни се появява леко главоболие; обикновено отминава за няколко дни."
    - name: "Лека асиметрия или недостатъчен ефект"
      text: "Тъй като силата на мускулите е различна при отделните хора, може да останат малки разлики между двете страни или ефектът да е по-слаб от очаквания. Това се оценява на контролния преглед след 2 седмици."
    - name: "Прекомерно повдигнат външен край на веждата („вежда на Спок“)"
      text: "След лечение на челото външният край на веждата може да се повдигне прекалено; обикновено се коригира с малко допълнително инжектиране."
  uncommon:
    - name: "Спускане на горния клепач (птоза)"
      text: "След лечение между веждите или на челото при около **1–5 от 100** пациенти се появява леко спускане на горния клепач. То е **временно** и обикновено отзвучава за 2–6 седмици. През този период може да бъдат предписани капки за очи, които временно повдигат клепача и подобряват вида му."
    - name: "Спускане на веждата и тежест в челото"
      text: "Дължи се на прекомерно отпускане на челния мускул; подобрява се с отслабването на ефекта (седмици до няколко месеца)."
    - name: "Асиметрична усмивка, отслабено движение на устните, изтичане на течност от устата"
      text: "Може да се появи при лечение на долната част на лицето и масетера, ако продуктът засегне съседни мускули; временно е, но може да продължи няколко седмици до месеци."
    - name: "Сухота в очите, сълзене или двойно виждане"
      text: "Срещат се понякога при лечение около очите и са временни. Уведомете лекаря си, ако се появи двойно виждане."
    - name: "Затруднено преглъщане, слабост в шията"
      text: "Може да се появи при лечение на шията; обикновено е леко и временно."
    - name: "Намалена сила на дъвкане, хлътнали бузи"
      text: "При лечение на масетера дъвченето на твърда храна може временно да е уморително; много рядко бузата може да изглежда леко хлътнала или усмивката — неравна."
    - name: "Слабост в ръката след лечение на дланите"
      text: "След инжектиране в дланите за лечение на изпотяване силата на хвата на пръстите може временно да намалее, а самите инжекции могат да бъдат доста болезнени. Слабостта обикновено отзвучава в рамките на няколко седмици."
  rare:
    - name: "Разпространение на ефекта към отдалечени области"
      text: "Много рядко, особено при високи дози, ефектът на продукта може да се разпространи извън третираната зона и да причини обща мускулна слабост, замъглено зрение или **затруднено говорене, преглъщане или дишане**. Това налага **спешно лечение**; може да се наложи болнично лечение и дихателна поддръжка. При дозите, използвани с естетична цел, това е изключително рядко."
    - name: "Тежка алергична реакция"
      text: "Тежката алергична реакция (анафилаксия) с уртикария, оток на лицето и устните или задух е изключително рядка; изисква спешна помощ."
    - name: "Липса на ефект (образуване на антитела)"
      text: "Много рядко организмът образува антитела срещу продукта и следващите процедури може да не дадат резултат. Честото прилагане на високи дози увеличава този риск."

emergency:
  - "**Затруднено преглъщане, говорене или дишане** или изразена мускулна слабост"
  - "**Замъглено или двойно виждане** или невъзможност да отворите клепача"
  - "Бързо развиващ се оток на лицето, устните или езика, уртикария или задух (алергична реакция)"
  - "Засилваща се болка, зачервяване, затопляне или гнойна секреция в третираната зона"

lifestyle:
  - "През първите 4 часа не лягайте и не масажирайте зоната; през първия ден избягвайте усилени натоварвания, сауна и турска баня."
  - "Ако, докато ефектът продължава, ви предстои инжектиране на ботулинов токсин, масаж на лицето или кожни процедури при друг лекар, уведомете го за това лечение."
  - "Ако планирате бременност по време на курса на лечение, обсъдете това с лекаря си."

declarations_extra:
  - "Бях попитан/а за състояния, които правят лечението неподходящо (бременност, кърмене, нервно-мускулни заболявания, лекарства), и дадох вярна информация."
  - "Разбирам, че ефектът на ботулиновия токсин е временен и че за поддържането му лечението трябва да се повтаря на редовни интервали. Беше ми обяснено, че някои третирани зони може да са извън одобрените указания за употреба на продукта."
