code: "13"
type: surgical
aesthetic: true
title: "Темпоральный лифтинг"
alt_name: "Подтяжка наружной части брови и уголка глаза через височную область (латеральный лифтинг бровей)"

specific_fields:
  - label: "Сторона:"
    options: ["Справа", "Слева", "С обеих сторон"]
    blank: false
  - label: "Место разреза:"
    options: ["В волосистой части головы (висок)", "По линии роста волос", "Будет определено во время операции"]
  - label: "Способ фиксации:"
    options: ["Нерассасывающиеся швы", "Рассасывающееся устройство", "Другое"]
  - label: "Процедуры, выполняемые одновременно:"
    options: ["Верхняя блефаропластика (отдельное согласие)", "Введение жира (липофилинг)", "Нет"]
  - label: "Жалобы и ожидания пациента:"

about:
  - "С возрастом ткани лба и височной области становятся менее упругими; в особенности опускаются **наружный конец брови** и **наружный уголок глаза**. Из-за этого взгляд может выглядеть усталым, грустным или тяжёлым, может создаваться впечатление избытка кожи верхнего века, появляются морщины в уголке глаза. У некоторых людей такая форма бывает и врождённой."
  - "Темпоральный лифтинг — это операция, при которой через небольшие разрезы в волосистой части височной области **наружная часть брови и уголок глаза подтягиваются вверх и назад**. Её цель — получить **более свежий и открытый взгляд**, гармонирующий с вашим лицом. Сама по себе она не исправляет внутреннюю часть брови, весь лоб и избыток кожи век; при необходимости её сочетают с другими процедурами."

procedure_intro:
  - "Операция обычно проводится в операционной под общим наркозом или под седацией в сочетании с местной анестезией. Перед операцией положение ваших бровей и уголков глаз оценивается в положении стоя и сидя, выполняется фотографирование, а направление подтяжки размечается вместе с вами."
procedure_steps:
  - "**Разрез:** С каждой стороны в волосистой части виска или по линии роста волос делаются разрезы длиной около 3–5 см. Волосы не сбривают либо подравнивают лишь очень узкую полоску вдоль линии разреза."
  - "**Освобождение тканей:** Хирург работает в глубоком слое височной области так, чтобы сохранить лобную ветвь лицевого нерва. Соединительные ткани вокруг наружной части брови и уголка глаза бережно освобождаются, чтобы их можно было сместить."
  - "**Подтяжка и фиксация:** Освобождённые ткани подтягиваются вверх и назад в запланированном направлении и закрепляются к плотному тканевому слою виска **нерассасывающимися швами** или **рассасывающимися фиксирующими устройствами**. Проверяется симметрия обеих сторон."
  - "**Ушивание:** При необходимости удаляется небольшой избыток кожи волосистой части головы. Разрезы закрываются скобами или швами, иногда устанавливается тонкий дренаж, накладывается лёгкая повязка на голову."
procedure_notes:
  - "Если одновременно будет выполняться операция на верхних веках (блефаропластика) или другая процедура, на неё подписывается **отдельная форма информированного согласия**."
anesthesia: "Общий наркоз или седация + местная анестезия"
duration: "Около 1–2 часов"
stay: "Обычно выписка в тот же день или одна ночь в больнице"

benefits:
  - "Более свежий, открытый и молодой взгляд благодаря подъёму наружной части брови и уголка глаза"
  - "Уменьшение тяжести и видимого избытка кожи в наружной части верхнего века"
  - "Отсутствие видимых рубцов на лице, так как разрезы скрыты в волосах"
success:
  - "Большинство правильно отобранных пациентов довольны результатом. В первые недели брови могут выглядеть немного выше запланированного; по мере того как ткани занимают своё место, это смягчается. Окончательный результат виден через **3–6 месяцев**. Со временем под действием старения и силы тяжести подтянутые ткани могут несколько опуститься; продолжительность эффекта индивидуальна и обычно составляет **несколько лет**. Примерно у **5–10 из 100** пациентов может потребоваться коррекция из-за асимметрии или раннего ослабления подтяжки."

alternatives:
  - "**Отказ от операции:** Поскольку это эстетическая процедура, у вас всегда есть возможность от неё отказаться."
  - "**Подъём бровей ботулотоксином:** Может приподнять наружный конец брови на несколько миллиметров, временно (на 3–4 месяца)."
  - "**Нитевой лифтинг:** Выполняется через меньшее количество разрезов, но эффект обычно более ограниченный и менее продолжительный."
  - "**Поддержка виска/брови филлерами:** Может дать временное улучшение, если опущение связано с потерей объёма; у этого метода есть собственные риски, например закупорка кровеносного сосуда."
  - "**Другие операции по подъёму бровей:** Если опущены также весь лоб и внутренняя часть брови, более подходящими могут быть эндоскопический лифтинг лба или методы с разрезом над бровью или по линии роста волос."
  - "**Только верхняя блефаропластика:** Может быть достаточной, если основная проблема — избыток кожи век; низкое положение брови она не исправляет."

no_treatment:
  - "Если операция не проводится, нынешний вид ваших бровей и уголков глаз сохранится, а естественное старение будет продолжаться. Это не представляет опасности для вашего здоровья."

before:
  - "Перед операцией проводятся анализы крови и при необходимости другие обследования; если планируется общий наркоз, вас осмотрит анестезиолог."
  - "В течение **6–8 часов** до операции ничего не ешьте и не пейте (следуйте указаниям анестезиолога)."
  - "Вымойте голову накануне вечером или утром в день операции; в день операции не пользуйтесь лаком для волос, гелем, косметикой и контактными линзами. Стричь волосы обычно не требуется."
  - "Если в последние **3–4 месяца** вам вводили ботулотоксин в область лба или бровей, сообщите об этом врачу; это может повлиять на планирование."
  - "Рекомендуется, чтобы в первые сутки после операции рядом с вами был кто-то из близких."

recovery:
  - when: "Первые 48 часов"
    what: "Будут ощущаться стянутость, лёгкая головная боль и отёк в области висков и лба; боль обычно слабая и снимается обезболивающими. Отёк может спускаться к глазам; синяки, **если они появятся**, будут видны на веках. Сон с приподнятой головой и холодные компрессы помогают уменьшить отёк. Если был установлен дренаж, его обычно удаляют на следующий день."
  - when: "1-я неделя"
    what: "Мыть голову мягким шампунем обычно можно **со 2–3-го дня**. В этот период брови и уголки глаз могут выглядеть выше и напряжённее, чем запланировано. Большинство пациентов возвращаются к повседневной жизни и офисной работе в течение 5–7 дней."
  - when: "7–14-й день"
    what: "Снимаются скобы или швы. Онемение и зуд в области висков, а также чувствительность вдоль линии разреза могут сохраняться."
  - when: "2–6-я неделя"
    what: "Отёк в основном проходит, и взгляд становится более естественным. Интенсивных физических нагрузок и тугих повязок/шлемов, давящих на виски, следует избегать не менее **3–4 недель**, а окрашивания волос и подобных химических процедур — не менее **4–6 недель**; феном пользуйтесь в тёплом режиме."
  - when: "3–6-й месяц"
    what: "Ткани занимают своё место, и становится виден окончательный результат. Изменения чувствительности кожи головы в основном восстанавливаются; рубец бледнеет."

risks:
  expected:
    - "Стянутость, ощущение давления и лёгкая головная боль в области висков и лба"
    - "Отёк лба и области вокруг глаз; синяки, **если они появятся**, проходят в течение 1–2 недель"
    - "В первые недели брови выглядят выше запланированного, или взгляд кажется удивлённым"
    - "Онемение, зуд или покалывание в области висков и кожи головы"
    - "Чувствительность и уплотнение вдоль линии разреза"
  common:
    - name: "Лёгкая асимметрия"
      text: "Брови изначально не бывают идеально симметричными; после операции между сторонами может сохраниться или в процессе заживления появиться небольшая разница."
    - name: "Поредение волос вдоль линии разреза"
      text: "Временное выпадение волос вокруг разреза (шоковое выпадение) встречается часто, и волосы обычно отрастают в течение **2–4 месяцев**. Разрез остаётся в виде тонкой линии, скрытой волосами."
    - name: "Длительное онемение и зуд"
      text: "Изменение чувствительности кожи головы может сохраняться несколько месяцев; зуд в период заживления — это нормально."
    - name: "Частичное ослабление подтяжки"
      text: "В первые месяцы ожидается некоторое опускание подтянутых тканей; поэтому во время операции может выполняться небольшая гиперкоррекция."
  uncommon:
    - name: "Временная слабость при подъёме брови (лобная ветвь лицевого нерва)"
      text: "Примерно у **1–3 из 100** пациентов может возникнуть временная слабость при подъёме брови или наморщивании лба с одной стороны. Обычно это связано с натяжением нерва или отёком и проходит самостоятельно в течение **от нескольких недель до нескольких месяцев**."
    - name: "Стойкое выпадение волос или широкий рубец"
      text: "Вдоль линии разреза в редких случаях может образоваться участок без волос или расширенный рубец; особенно заметнее могут быть рубцы по линии роста волос. При необходимости их можно исправить коррекцией рубца или пересадкой волос."
    - name: "Гематома (скопление крови)"
      text: "Примерно у **1–2 из 100** пациентов в области виска может скопиться кровь; может потребоваться её удаление иглой или с помощью небольшого вмешательства."
    - name: "Инфекция"
      text: "Возникает **менее чем у 1 из 100** пациентов. Обычно проходит на фоне антибиотиков; в редких случаях требуется дренирование гноя или удаление фиксирующего шва."
    - name: "Гиперкоррекция: «удивлённый» или чрезмерно раскосый («лисий взгляд», fox eye) вид"
      text: "Наружный конец брови или уголок глаза могут выглядеть поднятыми сильнее, чем хотелось бы. Обычно это смягчается в первые недели по мере того, как ткани занимают своё место; если это сохраняется, может потребоваться коррекция."
    - name: "Раннее опускание или недостаточный эффект"
      text: "Из-за ослабления фиксации или особенностей тканей бровь может опуститься раньше, чем ожидалось; может потребоваться повторная подтяжка."
    - name: "Проблемы, связанные с фиксирующим материалом"
      text: "Нерассасывающийся шов или устройство может прощупываться под кожей, быть болезненным при прикосновении или в редких случаях выйти наружу через кожу; в этом случае может потребоваться его удаление."
  rare:
    - name: "Стойкое повреждение нерва"
      text: "Стойкое повреждение нервной ветви, иннервирующей мышцу, поднимающую бровь, **встречается очень редко** (значительно реже, чем у 1 из 100 пациентов). В этом случае бровь на этой стороне не поднимается и лоб не морщится; для уменьшения асимметрии может потребоваться введение ботулотоксина на противоположной стороне или дополнительная операция."
    - name: "Стойкое онемение или хроническая боль"
      text: "Очень редко могут возникать стойкая потеря чувствительности кожи головы, длительная боль из-за ущемления нерва или головные боли; может потребоваться дополнительное лечение."
    - name: "Нарушение кровоснабжения кожи"
      text: "Особенно у курящих возможны нарушения заживления по краям разреза, что приводит к более широкому рубцу и выпадению волос."
    - name: "Затруднённое закрывание глаз и сухость глаз"
      text: "Если в ту же сессию была выполнена и верхняя блефаропластика, в редких случаях могут возникнуть затруднения при полном закрывании глаза и симптомы сухости глаз; в большинстве случаев они временные."
    - name: "Психологическая неудовлетворённость"
      text: "Несмотря на технически успешный результат, человеку может быть трудно привыкнуть к своему новому взгляду. Открытое обсуждение ожиданий перед операцией снижает этот риск."

emergency:
  - "**Быстро нарастающий, напряжённый и болезненный отёк** виска или лба"
  - "**Не прекращающееся кровотечение** из разрезов"
  - "**Температура выше 38,5 °C**, нарастающие покраснение, боль, жар или гнойные выделения в области разрезов"
  - "**Сильная головная боль**, не снимаемая обезболивающими, рвота или ригидность (напряжение) мышц шеи"
  - "**Нечёткость зрения или двоение в глазах**, боль в глазу или невозможность закрыть глаз"
  - "Потемнение кожи, багрово-чёрная окраска или расхождение краёв раны"

lifestyle:
  - "Первые 1–2 недели спите на спине с приподнятой головой; не спите лицом вниз или на висках."
  - "Первые 3–4 недели не трите брови и лоб, не массируйте виски и избегайте движений, оттягивающих лицо вниз."
  - "Отложите химические и термические процедуры, такие как окрашивание волос, химическая завивка и выпрямитель для волос, как минимум на **4–6 недель**. Пользуйтесь феном в тёплом режиме."
  - "Первые 3–4 недели избегайте интенсивных физических нагрузок, наклонов, подъёма тяжестей, сауны и турецкой бани (хаммама)."
  - "Если вы приехали из-за рубежа, перелёт обычно безопасен после первого контрольного осмотра, как правило начиная с 3–5-го дня."

declarations_extra:
  - "Я понимаю, что темпоральный лифтинг поднимает наружную часть брови и уголок глаза и что сам по себе он не исправляет весь лоб, внутреннюю часть брови и избыток кожи век."
  - "Я понимаю, что в первые недели брови могут выглядеть выше и напряжённее, что подтянутые ткани со временем могут несколько опуститься и что эффект не является постоянным."
