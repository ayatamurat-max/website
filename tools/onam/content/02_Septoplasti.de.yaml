code: "02"
type: surgical
aesthetic: false
title: "Septumplastik"
alt_name: "Operation zur Begradigung der Nasenscheidewand (Nasenseptum)"

specific_fields:
  - label: "Gleichzeitig durchzuführende Eingriffe:"
    options: ["Verkleinerung der Nasenmuscheln (Radiofrequenz / submukös)", "Endoskopische Nasennebenhöhlenoperation — FESS (auf separatem Aufklärungsbogen)", "Keine"]
  - label: "Nasenschienen / Tamponaden:"
    options: ["Silikonschienen", "Tamponaden", "Nicht erforderlich", "Entscheidung während der Operation"]
  - label: "Beschwerden der Patientin / des Patienten (Seite der Behinderung, Schnarchen, Kopfschmerzen usw.):"

about:
  - "Die Wand aus Knorpel und dünnem Knochen, die die Nasenhöhle in eine rechte und eine linke Seite teilt, wird **Septum** (Nasenscheidewand) genannt. Ist das Septum zu einer oder zu beiden Seiten verbogen, spricht man von einer **Septumdeviation**. Sie kann angeboren sein, sich während des Wachstums entwickeln oder nach einem Schlag auf die Nase entstehen."
  - "Eine verkrümmte Nasenscheidewand kann zu behinderter Nasenatmung, Mundatmung, Schnarchen, schlechtem Schlaf, Mundtrockenheit, Nasenbluten und bei manchen Menschen zu wiederkehrenden Nasennebenhöhlenentzündungen oder Kopfschmerzen führen. Da es sich um ein strukturelles Problem handelt, bessert es sich nicht durch Medikamente. Ziel der Septumplastik ist es, die verkrümmten Anteile zu begradigen, damit Sie **frei durch die Nase atmen können**. Diese Operation zielt nicht darauf ab, das äußere Erscheinungsbild der Nase zu verändern."

procedure_intro:
  - "Die Operation wird in der Regel in Vollnarkose im Operationssaal durchgeführt, ausschließlich durch die Nasenlöcher. Im Gesicht entsteht kein sichtbarer Schnitt und keine Narbe."
procedure_steps:
  - "**Schnitt:** Im Naseneingang wird ein kleiner Schnitt in die Schleimhaut (Mukosa) gesetzt, die das Septum bedeckt."
  - "**Ablösen der Schleimhaut:** Die Schleimhaut, die das Septum auf beiden Seiten bedeckt, wird behutsam von Knorpel und Knochen gelöst."
  - "**Korrektur der Verkrümmung:** Die verbogenen Knorpel- und Knochenanteile werden entfernt, begradigt oder neu positioniert. Die tragenden Strukturen, die die äußere Form der Nase halten (das Knorpelgerüst, das Nasenrücken und Nasenspitze stützt), bleiben erhalten."
  - "**Verkleinerung der Nasenmuscheln (falls erforderlich):** Sind die an der Seitenwand der Nase liegenden Strukturen, die Nasenmuscheln, vergrößert, werden sie mit Radiofrequenz oder durch Gewebeentfernung unter der Schleimhaut verkleinert."
  - "**Wundverschluss:** Die Schleimhaut wird wieder angelegt und mit selbstauflösenden Fäden fixiert."
  - "**Schienen/Tamponaden:** Damit das Septum gerade verheilt und um Blutungen vorzubeugen, werden in der Regel weiche Silikonschienen mit zentralem Atemröhrchen oder Tamponaden in die Nase eingelegt."
procedure_notes:
  - "Ist auch der vordere und äußere Teil des Septums verkrümmt oder trägt die äußere Nasenform zur Atmungsbehinderung bei, kann die Operation mit einer Rhinoplastik kombiniert werden (Septorhinoplastik), sofern dies gesondert besprochen und darin eingewilligt wurde."
anesthesia: "Vollnarkose (in ausgewählten Fällen örtliche Betäubung + Sedierung)"
duration: "Etwa 45–90 Minuten"
stay: "Entlassung am selben Tag oder eine Nacht im Krankenhaus"

benefits:
  - "Freiere Nasenatmung und weniger Mundatmung"
  - "Bessere Schlafqualität und weniger Schnarchen (Schnarchen kann auch andere Ursachen haben)"
  - "Weniger wiederkehrendes Nasenbluten infolge der Verkrümmung und bei manchen Patientinnen und Patienten weniger Nasennebenhöhlenentzündungen"
  - "Besserer Zugang für eine gegebenenfalls notwendige Nasennebenhöhlen- oder andere Nasenoperation"
success:
  - "In Fachveröffentlichungen wird berichtet, dass etwa **70–85 von 100** Patientinnen und Patienten nach der Operation eine deutliche Besserung der Nasenatmungsbehinderung angeben. Hat die Behinderung auch andere Ursachen, etwa eine Allergie, eine Schleimhautschwellung, ein Einfallen der Nasenflügel oder eine Erkrankung der Nasennebenhöhlen, müssen diese gegebenenfalls gesondert behandelt werden. Selten kann sich das Septum im Laufe der Zeit allmählich wieder leicht verbiegen."

alternatives:
  - "**Keine Operation / abwartendes Beobachten:** Sind Ihre Beschwerden gering, können sie einfach beobachtet werden."
  - "**Medikamentöse Behandlung:** Kortisonhaltige Nasensprays, Nasenspülungen und Allergiemedikamente können die Beschwerden durch Abschwellen der Schleimhaut lindern, korrigieren aber keine strukturelle Verkrümmung von Knochen und Knorpel."
  - "**Nasenpflaster / Nasendilatatoren:** Können vorübergehend Erleichterung verschaffen."
  - "**Abschwellende Nasensprays:** Nur für wenige Tage geeignet; eine längere Anwendung führt zu Gewöhnung und sogar zu einer noch stärkeren Verstopfung."

no_treatment:
  - "Wird die Operation nicht durchgeführt, begradigt sich die Verkrümmung nicht von selbst; Beschwerden wie behinderte Nasenatmung, Mundatmung und Schnarchen bleiben bestehen und können mit zunehmendem Alter stärker werden. Dies ist in der Regel nicht lebensgefährlich; die Entscheidung für eine Operation hängt davon ab, wie stark Ihre Beschwerden Ihre Lebensqualität beeinträchtigen."

before:
  - "Vor der Operation werden Blutuntersuchungen und bei Bedarf eine Computertomographie (CT) der Nasennebenhöhlen sowie weitere Untersuchungen durchgeführt, und Sie werden vom Narkosearzt untersucht."
  - "Sie dürfen **6–8 Stunden** vor der Operation nichts essen und nichts trinken (bitte befolgen Sie die Anweisungen des Narkosearztes)."
  - "Wenn Sie in den Tagen vor der Operation eine Erkältung, eine Grippe oder eine fieberhafte Erkrankung bekommen, teilen Sie uns dies bitte mit; die Operation kann verschoben werden."

recovery:
  - when: "Erste 48 Stunden"
    what: "Wegen der Schienen fühlt sich Ihre Nase verstopft an, und Sie müssen mit leichtem blutigem Nachsickern, Kopfschmerzen und einem trockenen Hals rechnen. Die Schmerzen sind meist gering. Es wird empfohlen, mit erhöhtem Kopf zu schlafen. Der Mullverband unter der Nase muss eventuell einige Male gewechselt werden."
  - when: "3.–7. Tag"
    what: "Silikonschienen oder Tamponaden werden in der Regel bei einem Kontrolltermin zwischen dem **3. und 7. Tag** entfernt; dies verursacht kurzzeitig Unbehagen. Mit Nasenspülungen wird begonnen. Die meisten Menschen nehmen eine Bürotätigkeit innerhalb von 5–7 Tagen wieder auf."
  - when: "2.–4. Woche"
    what: "Krustenbildung und Trockenheit in der Nase können auftreten und bessern sich mit regelmäßigem Spülen. Die Atmung wird allmählich freier. Anstrengender Sport und Kontaktsportarten sollten für etwa **3–4 Wochen** zurückgestellt werden."
  - when: "1.–3. Monat"
    what: "Die Nasenschleimhaut heilt vollständig ab. Das endgültige Ergebnis für die Atmung wird in der Regel in diesem Zeitraum beurteilt."

risks:
  expected:
    - "Verstopfte Nase und Mundatmung, bis die Schienen entfernt sind"
    - "Leichtes blutiges Nachsickern in den ersten Tagen"
    - "Vorübergehendes Taubheitsgefühl der oberen Frontzähne und der Oberlippe"
    - "Krustenbildung und Trockenheit in der Nase (in den ersten Wochen)"
    - "Vorübergehend vermindertes Riechvermögen"
  common:
    - name: "Länger anhaltende Krustenbildung und Trockenheit"
      text: "Kann mehrere Wochen anhalten, besonders wenn die Nasenmuscheln verkleinert wurden; bessert sich mit Spülungen und befeuchtender Nasensalbe."
    - name: "Länger anhaltendes Taubheitsgefühl der oberen Zähne und der Lippe"
      text: "Klingt in der Regel innerhalb weniger Wochen ab; selten kann es einige Monate anhalten."
    - name: "Nasenatmungsbehinderung bessert sich nicht vollständig"
      text: "Bei etwa **15–30 von 100** Patientinnen und Patienten bessert sich die Atmung möglicherweise nicht so stark wie erwartet. Dies liegt oft an zusätzlichen Faktoren wie Allergie, Schleimhautschwellung oder schwachen Nasenflügeln; eine medikamentöse Behandlung oder eine weitere Operation kann notwendig sein."
  uncommon:
    - name: "Nasenbluten"
      text: "Bei etwa **1–3 von 100** Patientinnen und Patienten kann eine Blutung auftreten, die eine Tamponade erfordert. Sehr selten muss die Blutung im Operationssaal gestillt werden."
    - name: "Loch in der Nasenscheidewand (Perforation)"
      text: "Bei etwa **1–3 von 100** Patientinnen und Patienten kann ein Loch im Septum entstehen. Oft verursacht es keine Beschwerden; führt es zu Pfeifgeräuschen, Krustenbildung oder Blutungen, können Spülungen, ein Septumknopf (Obturator) oder eine Verschlussoperation notwendig sein."
    - name: "Verwachsungen in der Nase (Synechien)"
      text: "Bei etwa **1–5 von 100** Patientinnen und Patienten können sich Verwachsungen zwischen Septum und Seitenwand bilden; behindern sie die Atmung, werden sie bei einer Kontrolle mit einem einfachen Eingriff gelöst."
    - name: "Blut- oder Eiteransammlung in der Nasenscheidewand (Hämatom / Abszess)"
      text: "Tritt bei **weniger als 1 von 100** Patientinnen und Patienten auf. Es äußert sich in den Tagen nach der Operation durch zunehmende Nasenatmungsbehinderung, Schmerzen und Fieber. Es muss **dringend entlastet** werden, um eine Schädigung des Nasenknorpels zu vermeiden; unbehandelt kann es zu Knorpelverlust und einem Einsinken des Nasenrückens kommen."
    - name: "Infektion"
      text: "Selten; sie heilt in der Regel mit Antibiotika ab."
    - name: "Erneute Verkrümmung"
      text: "Da Knorpel ein „Gedächtnis“ hat, kann sich das Septum mit der Zeit wieder leicht verbiegen; verursacht dies Beschwerden, kann eine zweite Operation notwendig werden."
  rare:
    - name: "Einsinken des Nasenrückens (Sattelnase)"
      text: "Tritt bei **weniger als 1 von 100** Patientinnen und Patienten auf. Eine Schwächung des stützenden Septumknorpels oder ein Knorpelverlust nach einem Hämatom/Abszess kann dazu führen, dass der Nasenrücken einsinkt; dies verändert das äußere Erscheinungsbild der Nase und erfordert zur Korrektur eine weitere Operation mit Knorpeltransplantat."
    - name: "Absinken oder Formveränderung der Nasenspitze"
      text: "Sehr selten; kann auftreten, wenn stützende Strukturen betroffen sind."
    - name: "Dauerhaft vermindertes oder verlorenes Riechvermögen"
      text: "Sehr selten."
    - name: "Austritt von Hirnwasser (Liquorleck) und Hirnhautentzündung (Meningitis)"
      text: "Da der obere Teil des Septums an die Schädelbasis grenzt, handelt es sich hierbei um eine äußerst seltene Komplikation, die in **weit weniger als 1 von 10.000** Fällen auftritt. Tritt sie auf, können eine Krankenhausaufnahme, eine weitere Behandlung und eine Verschlussoperation notwendig werden."
    - name: "Empty-Nose-Syndrom (Syndrom der leeren Nase)"
      text: "Werden die Nasenmuscheln zu stark verkleinert, kann trotz offener Nase ein Gefühl von Verstopfung und Trockenheit entstehen. Dies ist sehr selten; deshalb werden die Nasenmuscheln schonend verkleinert. Tritt es auf, kann es lange anhalten oder dauerhaft sein und ist schwer zu behandeln."
    - name: "Toxisches Schocksyndrom"
      text: "Eine sehr seltene, aber schwere Erkrankung im Zusammenhang mit Nasentamponaden/-schienen (plötzliches hohes Fieber, Hautausschlag, niedriger Blutdruck), die eine sofortige Behandlung erfordert. Sie muss im Krankenhaus, manchmal auf der Intensivstation, behandelt werden und kann lebensbedrohlich sein."
    - name: "Sehstörung, Blutung um das Auge"
      text: "Bei einer Septumplastik äußerst selten; das Risiko ist etwas höher, wenn sie mit einer Nasennebenhöhlenoperation wie FESS kombiniert wird, und wird auf einem separaten Aufklärungsbogen erläutert."

emergency:
  - "**Nasenbluten, das nicht aufhört oder sehr stark ist**, obwohl Sie einige Minuten lang Druck ausgeübt und Eis aufgelegt haben, oder Blut, das ständig in den Mund läuft"
  - "**Zunehmende Nasenatmungsbehinderung, starke Schmerzen und Schwellung der Nase** in den Tagen nach der Operation (kann ein Zeichen für ein Septumhämatom/einen Septumabszess sein)"
  - "**Fieber über 38,5 °C** oder übel riechende Absonderung"
  - "**Plötzliches hohes Fieber, Hautausschlag, Schwindel oder Schwäche**, während Tamponaden/Schienen in der Nase liegen"
  - "**Klare, wässrige Absonderung** aus der Nase, besonders wenn sie beim Vorbeugen zunimmt; starke Kopfschmerzen oder Nackensteifigkeit"
  - "**Verschwommenes Sehen oder Doppelbilder** oder Schwellung um das Auge"
  - "Atemnot oder Schmerzen in der Brust"

lifestyle:
  - "Schnäuzen Sie sich in den ersten 2 Wochen nicht; halten Sie beim Niesen den Mund offen."
  - "Spülen Sie Ihre Nase so, wie es Ihnen gezeigt wurde, und so oft wie empfohlen."
  - "Vermeiden Sie in den ersten 2 Wochen heiße Bäder, Sauna, Hamam (türkisches Dampfbad) und schweres Heben."
  - "Schützen Sie Ihre Nase mindestens 4 Wochen lang vor Stößen."
  - "Wenn Sie aus dem Ausland angereist sind, ist ein Flug in der Regel unbedenklich, sobald die Schienen entfernt wurden."

declarations_extra:
  - "Mir ist bewusst, dass das Ziel dieser Operation die Verbesserung der Atmung ist und nicht die Veränderung des äußeren Erscheinungsbildes der Nase, und dass eine weitere Behandlung notwendig sein kann, wenn die Atmungsbehinderung andere Ursachen hat."
