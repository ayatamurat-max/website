code: "13"
type: surgical
aesthetic: true
title: "Temporal Lift"
alt_name: "Şakak bölgesinden kaş ve göz kenarı askılama (lateral kaş kaldırma)"

specific_fields:
  - label: "Taraf:"
    options: ["Sağ", "Sol", "İki taraflı"]
    blank: false
  - label: "Kesi yeri:"
    options: ["Saçlı deri içinde (şakak)", "Saç çizgisinde", "Ameliyatta belirlenecek"]
  - label: "Sabitleme yöntemi:"
    options: ["Kalıcı dikiş", "Eriyebilen cihaz", "Diğer"]
  - label: "Birlikte yapılacak işlemler:"
    options: ["Üst blefaroplasti (ayrı onam)", "Yağ enjeksiyonu", "Yok"]
  - label: "Hastanın şikâyeti ve beklentisi:"

about:
  - "Yaşla birlikte alın ve şakak bölgesindeki dokular gevşer; özellikle **kaşın dış ucu** ve **göz kenarı** aşağı doğru iner. Bu durum yorgun, üzgün veya ağır bir bakışa, üst göz kapağında fazlalık görüntüsüne ve göz kenarında kırışıklıklara yol açabilir. Bazı kişilerde bu yapı doğuştan da belirgindir."
  - "Temporal lift, şakak bölgesindeki saçlı deri içinden yapılan küçük kesilerle **kaşın dış kısmını ve göz kenarını yukarı ve geriye doğru askıya alan** bir ameliyattır. Amacı, yüzünüzle uyumlu, **daha dinç ve açık bir bakış** elde etmektir. Kaşın iç kısmını, alnın tamamını ve göz kapağındaki cilt fazlasını tek başına düzeltmez; gerekirse başka işlemlerle birleştirilir."

procedure_intro:
  - "Ameliyat genellikle genel anestezi veya sedasyon ile birlikte lokal anestezi altında, ameliyathane koşullarında yapılır. Ameliyattan önce kaşlarınızın ve göz kenarınızın konumu ayakta ve oturarak değerlendirilir, fotoğraflanır ve kaldırma yönü sizinle birlikte işaretlenir."
procedure_steps:
  - "**Kesi:** Her iki şakakta, saçlı derinin içinde veya saç çizgisinde yaklaşık 3–5 cm'lik kesiler yapılır. Saç kesilmez veya yalnızca kesi hattında çok dar bir alan düzeltilir."
  - "**Dokuların serbestleştirilmesi:** Şakak bölgesinin derin katmanında, yüz sinirinin alına giden dalını koruyacak şekilde ilerlenir. Kaşın dış kısmı ve göz kenarı çevresindeki bağ dokuları, hareket ettirilebilecek şekilde nazikçe serbestleştirilir."
  - "**Askılama ve sabitleme:** Serbestleştirilen dokular planlanan yöne doğru yukarı ve geriye çekilir ve **kalıcı dikişlerle** ya da **eriyebilen sabitleme cihazlarıyla** şakaktaki sağlam doku tabakasına sabitlenir. İki taraf arasında denge kontrol edilir."
  - "**Kapatma:** Gerekirse küçük bir saçlı deri fazlası alınır. Kesiler zımba veya dikişlerle kapatılır, bazen ince bir dren konur ve hafif bir baş bandajı uygulanır."
procedure_notes:
  - "Üst göz kapağı estetiği (blefaroplasti) veya başka bir işlem eşzamanlı yapılacaksa bunun için **ayrı bir onam formu** imzalanır."
anesthesia: "Genel anestezi veya sedasyon + lokal anestezi"
duration: "Yaklaşık 1–2 saat"
stay: "Genellikle aynı gün veya 1 gece hastanede kalış"

benefits:
  - "Kaşın dış ucunun ve göz kenarının yukarı kalkmasıyla daha dinç, açık ve genç bir bakış"
  - "Üst göz kapağının dış kısmındaki ağırlık ve fazlalık görüntüsünün azalması"
  - "Kesilerin saçlı deri içinde kalması sayesinde yüzde görünür iz bırakmaması"
success:
  - "Uygun seçilmiş hastaların büyük çoğunluğu sonuçtan memnun kalır. İlk haftalarda kaşlar planlanandan biraz daha yukarıda görünebilir; bu, dokular yerine oturdukça yumuşar. Nihai sonuç **3–6 ay** içinde ortaya çıkar. Kaldırılan dokular yaşla ve yer çekimiyle zamanla bir miktar aşağı inebilir; etkinin süresi kişiden kişiye değişir ve genellikle **birkaç yıl** sürer. Yaklaşık 100 hastadan **5–10'unda** asimetri veya erken gevşeme nedeniyle düzeltme gerekebilir."

alternatives:
  - "**Ameliyat olmamak:** Estetik bir işlem olduğu için yaptırmama seçeneğiniz her zaman vardır."
  - "**Botoks ile kaş kaldırma:** Kaşın dış ucunu birkaç milimetre ve geçici olarak (3–4 ay) kaldırabilir."
  - "**İp askı yöntemleri:** Daha az kesiyle uygulanır, ancak etkisi genellikle daha sınırlı ve kısa sürelidir."
  - "**Dolgu ile şakak/kaş desteği:** Hacim kaybına bağlı düşüklükte geçici bir iyileşme sağlayabilir; damar tıkanıklığı gibi kendine özgü riskleri vardır."
  - "**Diğer kaş kaldırma ameliyatları:** Alnın tamamı ve kaşın iç kısmı da düşükse endoskopik alın germe veya kaş üstü/saç çizgisi kesili yöntemler daha uygun olabilir."
  - "**Yalnızca üst blefaroplasti:** Sorun esas olarak göz kapağı cilt fazlasıysa tek başına yeterli olabilir; kaş düşüklüğünü düzeltmez."

no_treatment:
  - "Ameliyat yapılmazsa kaş ve göz kenarınızın mevcut görünümü korunur ve doğal yaşlanma süreci devam eder. Bu durum sağlığınız için bir tehlike oluşturmaz."

before:
  - "Ameliyattan önce kan tahlilleri ve gerekirse diğer tetkikler yapılır; genel anestezi uygulanacaksa anestezi uzmanı tarafından değerlendirilirsiniz."
  - "Ameliyattan önceki **6–8 saat** boyunca hiçbir şey yememeniz ve içmemeniz gerekir (anestezi uzmanının talimatlarına uyunuz)."
  - "Ameliyattan önceki gece veya sabah saçınızı yıkayınız; ameliyat günü saç spreyi, jöle, makyaj ve lens kullanmayınız. Saçınızın kesilmesine genellikle gerek yoktur."
  - "Son **3–4 ay** içinde alın veya kaş bölgesine botoks yaptırdıysanız hekiminize bildiriniz; planlamayı etkileyebilir."
  - "Ameliyattan sonraki ilk gün size eşlik edecek bir yakınınızın olması önerilir."

recovery:
  - when: "İlk 48 saat"
    what: "Şakaklarda ve alında gerginlik, hafif baş ağrısı ve şişlik olur; ağrı genellikle hafiftir ve ağrı kesicilerle kontrol edilir. Şişlik göz çevresine doğru inebilir; morarma **olursa** göz kapaklarında görülür. Başınızı yüksekte tutarak yatmanız ve soğuk uygulama şişliği azaltır. Dren konduysa genellikle ertesi gün çıkarılır."
  - when: "1. hafta"
    what: "Saçınızı genellikle **2–3. günden** itibaren hafif şampuanla yıkayabilirsiniz. Kaşlar ve göz kenarı bu dönemde planlanandan daha yukarıda ve gergin görünebilir. Çoğu hasta 5–7 gün içinde günlük hayatına ve masa başı işine döner."
  - when: "7–14. gün"
    what: "Zımba veya dikişler alınır. Şakaklarda uyuşukluk, kaşıntı ve kesi hattında hassasiyet devam edebilir."
  - when: "2–6. haftalar"
    what: "Şişlik büyük ölçüde geçer ve bakış daha doğal hâle gelir. Ağır egzersiz ve şakaklara baskı yapan sıkı bandana/kask en az **3–4 hafta**, saç boyası ve benzeri kimyasal işlemler en az **4–6 hafta** ertelenmelidir; fön makinesi ılık ayarda kullanılmalıdır."
  - when: "3–6. aylar"
    what: "Dokular yerine oturur ve nihai görünüm ortaya çıkar. Saçlı derideki his değişiklikleri büyük ölçüde düzelir; iz soluklaşır."

risks:
  expected:
    - "Şakaklarda ve alında gerginlik, baskı hissi ve hafif baş ağrısı"
    - "Alında ve göz çevresinde şişlik; morarma **olursa** 1–2 hafta içinde geçer"
    - "İlk haftalarda kaşların planlanandan daha yukarıda veya şaşkın görünmesi"
    - "Şakak ve saçlı deride uyuşukluk, kaşıntı, karıncalanma"
    - "Kesi hattında hassasiyet ve sertlik"
  common:
    - name: "Hafif asimetri"
      text: "Kaşlar doğuştan da tam simetrik değildir; ameliyattan sonra iki taraf arasında hafif farklar kalabilir veya iyileşme sırasında ortaya çıkabilir."
    - name: "Kesi hattında saç incelmesi"
      text: "Kesi çevresinde geçici saç dökülmesi (şok dökülme) sıktır ve genellikle **2–4 ay** içinde saçlar yeniden çıkar. Kesi hattı ince bir çizgi şeklinde kalır ve saç tarafından örtülür."
    - name: "Uzun süren uyuşukluk ve kaşıntı"
      text: "Saçlı deride his değişikliği birkaç ay sürebilir; iyileşirken kaşıntı olması normaldir."
    - name: "Kısmi gevşeme"
      text: "Kaldırılan dokuların ilk aylarda bir miktar geri inmesi beklenir; bu nedenle ameliyatta hafif fazla kaldırma yapılabilir."
  uncommon:
    - name: "Kaş kaldırmada geçici zayıflık (yüz sinirinin alın dalı)"
      text: "Yaklaşık 100 hastadan **1–3'ünde** bir tarafta kaşı kaldırmada veya alnı kırıştırmada geçici zayıflık olabilir. Genellikle sinirin gerilmesine veya şişliğe bağlıdır ve **birkaç hafta ile birkaç ay** içinde kendiliğinden düzelir."
    - name: "Kalıcı saç kaybı veya geniş iz"
      text: "Kesi hattında kalıcı saçsız alan veya genişlemiş iz nadiren oluşabilir; özellikle saç çizgisindeki kesilerde iz daha belirgin olabilir. Gerekirse iz düzeltme veya saç ekimiyle giderilebilir."
    - name: "Hematom (kan birikmesi)"
      text: "Yaklaşık 100 hastadan **1–2'sinde** şakakta kan birikebilir; iğneyle veya küçük bir girişimle boşaltılması gerekebilir."
    - name: "Enfeksiyon"
      text: "100 hastada **1'den az** görülür. Genellikle antibiyotikle düzelir; nadiren iltihabın boşaltılması veya sabitleme dikişinin çıkarılması gerekir."
    - name: "Aşırı kaldırma: “şaşkın” veya aşırı çekik (“fox eye”) görünüm"
      text: "Kaşın dış ucu veya göz kenarı istenenden fazla kalkmış görünebilir. Çoğu zaman ilk haftalarda dokular yerleştikçe yumuşar; kalıcı olursa düzeltme gerekebilir."
    - name: "Erken düşme veya etkinin yetersiz kalması"
      text: "Sabitlemenin gevşemesi veya dokuların özelliğine bağlı olarak kaş beklenenden erken aşağı inebilir; tekrar askılama gerekebilir."
    - name: "Sabitleme materyaline bağlı sorunlar"
      text: "Kalıcı dikiş veya cihaz cilt altından hissedilebilir, hassasiyet yapabilir ya da nadiren ciltten dışarı çıkabilir; bu durumda çıkarılması gerekebilir."
  rare:
    - name: "Kalıcı sinir hasarı"
      text: "Kaşı kaldıran kası çalıştıran sinir dalının kalıcı hasarı **çok nadirdir** (100 hastada 1'den çok daha az). Bu durumda o taraftaki kaş kalkmaz ve alın kırışmaz; asimetriyi azaltmak için karşı tarafa botoks veya ek cerrahi gerekebilir."
    - name: "Kalıcı uyuşukluk veya kronik ağrı"
      text: "Saçlı deride kalıcı his kaybı, sinir sıkışmasına bağlı uzun süren ağrı veya baş ağrısı çok nadiren görülebilir; ek tedavi gerektirebilir."
    - name: "Cilt beslenmesinin bozulması"
      text: "Özellikle sigara içenlerde kesi kenarlarında yara iyileşme sorunu ve buna bağlı daha geniş iz ve saç kaybı görülebilir."
    - name: "Göz kapağı kapanmasında güçlük ve kuru göz"
      text: "Aynı seansta üst blefaroplasti de yapıldıysa, nadiren gözü tam kapatmada güçlük ve kuru göz şikâyetleri olabilir; çoğu geçicidir."
    - name: "Psikolojik memnuniyetsizlik"
      text: "Teknik olarak başarılı bir sonuca rağmen kişi yeni bakışına uyum sağlamakta zorlanabilir. Beklentilerin ameliyat öncesi açıkça konuşulması bu riski azaltır."

emergency:
  - "Şakakta veya alında **hızla artan, gergin ve ağrılı şişlik**"
  - "Kesi yerlerinden **durmayan kanama**"
  - "**38,5 °C üzerinde ateş**, kesi yerlerinde artan kızarıklık, ağrı, ısı veya iltihaplı akıntı"
  - "Ağrı kesicilere yanıt vermeyen **şiddetli baş ağrısı**, kusma, ense sertliği"
  - "**Görmede bulanıklık, çift görme**, göz ağrısı veya gözü kapatamama"
  - "Ciltte koyulaşma, morumsu-siyah renk veya yara açılması"

lifestyle:
  - "İlk 1–2 hafta başınızı yüksekte tutarak sırtüstü yatınız; yüzüstü veya şakaklarınızın üzerine yatmaktan kaçınınız."
  - "İlk 3–4 hafta kaşlarınızı ve alnınızı ovuşturmayınız, şakaklara masaj yapmayınız ve yüzünüzü aşağı doğru çekecek hareketlerden kaçınınız."
  - "Saç boyası, perma ve saç düzleştirici gibi kimyasal ve ısı içeren işlemleri en az **4–6 hafta** erteleyiniz. Fön makinesini ılık ayarda kullanınız."
  - "İlk 3–4 hafta ağır egzersiz, eğilip kaldırma, sauna ve hamamdan kaçınınız."
  - "Yurt dışından geldiyseniz uçak yolculuğu genellikle ilk kontrolden sonra, çoğunlukla 3–5. günden itibaren güvenlidir."

declarations_extra:
  - "Temporal liftin kaşın dış kısmını ve göz kenarını kaldırdığını; alnın tamamını, kaşın iç kısmını ve göz kapağındaki cilt fazlasını tek başına düzeltmediğini anladım."
  - "İlk haftalarda kaşların daha yukarıda ve gergin görünebileceğini, kaldırılan dokuların zamanla bir miktar aşağı inebileceğini ve etkinin kalıcı olmadığını biliyorum."
