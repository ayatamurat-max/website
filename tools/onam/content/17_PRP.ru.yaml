code: "17"
type: office
aesthetic: true
title: "PRP-терапия (плазма, обогащённая тромбоцитами)"
alt_name: "Введение плазмы, приготовленной из вашей собственной крови, в кожу или кожу головы"

specific_fields:
  - label: "Используемый набор / номер серии (LOT):"
  - label: "Объём взятой крови (мл):"
  - label: "Активатор / добавка:"
    options: ["Нет", "Хлорид кальция", "Другое"]
  - label: "Зона введения:"
    options: ["Лицо", "Кожа головы", "Подглазничная область", "Шея / зона декольте", "Другое"]
  - label: "Номер сеанса / запланированное количество сеансов:"

about:
  - "PRP (Platelet-Rich Plasma — плазма, обогащённая тромбоцитами) — это плазма, приготовленная **из вашей собственной крови** и обогащённая тромбоцитами (кровяными пластинками). Тромбоциты содержат естественные факторы роста, которые участвуют в восстановлении тканей."
  - "PRP применяют, чтобы поддержать качество, сияние и упругость кожи, сделать менее заметными мелкие морщины и усталый вид области под глазами, способствовать улучшению вида постакне (рубцов после угрей) или поддержать волосяные фолликулы при **выпадении волос**. Поскольку плазма готовится из вашей собственной крови, аллергии на сам препарат или его отторжения организмом не ожидается."

procedure_intro:
  - "Процедура проводится в нашей клинике в стерильных условиях с использованием **одноразовых наборов закрытого типа**. Название и номер серии (LOT) набора записываются в вашу медицинскую карту."
procedure_steps:
  - "**Забор крови:** Из вены на руке, как при обычном анализе крови, берут, как правило, 10–30 мл крови."
  - "**Приготовление:** Кровь в специальной пробирке, содержащей вещество, препятствующее свёртыванию, разделяется в центрифуге, и фракция плазмы, обогащённой тромбоцитами, отделяется в стерильных условиях. На каждом этапе проверяется, что пробирки принадлежат именно вам."
  - "**Подготовка зоны:** Зону введения очищают и обрабатывают антисептиком; по желанию может быть нанесён обезболивающий крем."
  - "**Введение:** Плазму вводят в кожу или кожу головы во множество мелких точек тонкой иглой или канюлей; иногда её распределяют по коже в сочетании с микронидлингом."
  - "**Завершение:** Зону очищают, при необходимости прикладывают холодный компресс и дают рекомендации по уходу."
procedure_notes:
  - "Обычно рекомендуется курс из **3–4 сеансов с интервалом 4–6 недель**, а затем поддерживающие сеансы каждые 4–6 месяцев."
anesthesia: "Обезболивающий крем (по желанию)"
duration: "Около 45–60 минут (включая подготовку)"
stay: "В тот же день; кратковременное наблюдение после процедуры"

benefits:
  - "Кожа выглядит более свежей, сияющей и подтянутой, мелкие морщины менее заметны"
  - "Уменьшение тёмных кругов и усталого вида под глазами"
  - "При выпадении волос — помощь в уменьшении выпадения и увеличении толщины волос"
  - "Поскольку используется ваша собственная кровь, аллергии на саму плазму не ожидается"
success:
  - "Результаты различаются у разных людей. Научные данные зависят от цели применения: существует много исследований, сообщающих о положительных результатах при **андрогенетическом (наследственном) выпадении волос**, тогда как данные по омоложению кожи более ограничены. Методики и наборы также различаются. Эффект проявляется постепенно и не является постоянным; никакой конкретный результат не может быть гарантирован."

alternatives:
  - "**Отказ от каких-либо процедур** или продолжение регулярного ухода за кожей и защиты от солнца"
  - "**При выпадении волос:** обследование для выявления основной причины (железо, щитовидная железа, гормоны); препараты, например миноксидил, по рекомендации врача; мезотерапия кожи головы; при выраженном облысении — пересадка волос"
  - "**Для кожи:** наружные средства, мезотерапия, процедуры с гиалуроновой кислотой для улучшения качества кожи, химические пилинги, лазерные процедуры или микронидлинг"

no_treatment:
  - "Если PRP-терапия не проводится, ваша кожа или волосы будут меняться естественным образом. В зависимости от причины выпадение волос может прогрессировать; при этом всегда можно рассмотреть другие варианты лечения. Отказ от PRP-терапии не несёт вреда для вашего здоровья."

before:
  - "**Состояния, при которых PRP не проводится:** низкое количество тромбоцитов или нарушение их функции, заболевания, связанные с кровотечениями и нарушением свёртываемости крови, выраженная анемия, активная инфекция или повышенная температура, текущее лечение онкологического заболевания или рак крови в последние годы, беременность и кормление грудью. Пожалуйста, обязательно сообщите нам, если что-либо из этого относится к вам."
  - "Если вы принимаете препараты, разжижающие кровь (варфарин, ривароксабан, апиксабан, клопидогрел и т. п.), сообщите об этом врачу до процедуры; **не прекращайте приём этих препаратов самостоятельно**."
  - "По возможности, посоветовавшись с врачом, прекратите за 1 неделю до процедуры приём аспирина и противовоспалительных обезболивающих (ибупрофен, напроксен и т. п.); эти препараты могут снижать функцию тромбоцитов."
  - "Сообщите нам, если в последние 2–3 недели вы принимали стероиды (кортизон) в таблетках или в виде инъекций; они могут снижать эффект PRP, и процедуру, возможно, придётся отложить."
  - "В день процедуры пейте много воды и перед приходом слегка поешьте; если прийти натощак, повышается риск головокружения и обморока."
  - "При процедуре на коже головы вымойте голову накануне или утром в день процедуры и не используйте гель, лак и подобные средства."

recovery:
  - when: "Первые часы"
    what: "В зоне введения появляются покраснение, лёгкий отёк, ощущение стянутости и небольшие возвышения в местах уколов. Место забора крови может быть слегка болезненным."
  - when: "Первые 24 часа"
    what: "Не наносите макияж; избегайте сауны, турецкой бани (хаммама), солярия, интенсивных физических нагрузок и прямого солнца. После процедуры на коже головы мойте голову не ранее следующего дня."
  - when: "2–7-й день"
    what: "Покраснение и отёк проходят. Синяки, **если они появятся** (особенно под глазами), проходят за 3–7 дней."
  - when: "В течение курса"
    what: "Сеансы повторяются каждые 4–6 недель. Изменения кожи обычно заметны после 2–3-го сеанса, изменения волос — в течение 3–6 месяцев."
  - when: "После курса"
    what: "Эффект постепенно ослабевает; для его сохранения могут быть рекомендованы поддерживающие сеансы каждые 4–6 месяцев."

risks:
  expected:
    - "Лёгкая боль или жжение во время забора крови и инъекций"
    - "Покраснение, лёгкий отёк, чувствительность и стянутость в зоне введения (от нескольких часов до 2 дней)"
    - "Мельчайшие следы крови в местах уколов"
  common:
    - name: "Синяки"
      text: "Могут появиться в зоне введения или в месте забора крови; проходят самостоятельно за 3–7 дней."
    - name: "Головная боль или болезненность кожи головы"
      text: "Могут сохраняться 1–2 дня после процедуры на коже головы; проходят после приёма простых обезболивающих (вместо аспирина рекомендуется парацетамол)."
    - name: "Эффект меньше ожидаемого"
      text: "У некоторых людей заметных изменений может не быть, или эффект может оказаться кратковременным."
  uncommon:
    - name: "Предобморочное состояние"
      text: "Во время забора крови или инъекций могут возникнуть головокружение, потливость и кратковременный обморок; это быстро проходит, если лечь."
    - name: "Временное усиление выпадения волос"
      text: "В первые недели после процедуры на коже головы может наблюдаться временное усиление выпадения волос; обычно оно проходит самостоятельно."
    - name: "Длительный отёк"
      text: "Отёк, особенно под глазами, может сохраняться несколько дней."
    - name: "Изменение цвета кожи"
      text: "На смуглой коже и при пребывании на солнце в местах уколов может появиться временное потемнение."
  rare:
    - name: "Инфекция"
      text: "При соблюдении стерильной техники встречается очень редко; если она возникнет, может потребоваться лечение антибиотиками, в редких случаях — вскрытие и дренирование."
    - name: "Аллергия на вещества, входящие в набор"
      text: "Аллергии на саму плазму не ожидается; однако очень редко может развиться аллергическая реакция на вещество, препятствующее свёртыванию крови, или активатор из набора, на обезболивающий крем или антисептик."
    - name: "Закупорка кровеносного сосуда (сосудистая окклюзия)"
      text: "При глубоких инъекциях в области лица **крайне редко** вещество может попасть в кровеносный сосуд или сдавить его; сообщалось о вызванном этим нарушении кровоснабжения кожи и рубцах, а ещё реже — о нарушении зрения. Очень важно вовремя это распознать и оказать неотложную помощь."
    - name: "Раздражение нерва"
      text: "Если во время забора крови или инъекции затрагивается нерв, может возникнуть временное онемение или покалывание; очень редко оно сохраняется дольше."

emergency:
  - "**Внезапная сильная боль, побледнение кожи или багрово-синюшное сетчатое окрашивание** во время или после процедуры"
  - "**Нечёткость зрения, потеря зрения**, двоение в глазах или боль в глазу"
  - "**Нарастающие покраснение, жар, отёк или гнойные выделения** в зоне введения или температура выше 38 °C"
  - "Отёк лица, губ или языка, **одышка** или распространённая зудящая сыпь"
  - "Нарастающие отёк, боль или онемение руки, из которой брали кровь"

lifestyle:
  - "Не наносите макияж в первые 24 часа; избегайте сауны, турецкой бани (хаммама), солярия, интенсивных тренировок и бассейна."
  - "В течение 3 дней после процедуры не рекомендуется принимать противовоспалительные обезболивающие (ибупрофен, напроксен, аспирин); при боли можно принимать парацетамол."
  - "В течение курса ежедневно пользуйтесь солнцезащитным средством с высоким фактором защиты; после процедуры на коже головы подождите не менее 3 дней, прежде чем окрашивать волосы или делать химическую завивку."
  - "Курение снижает действие тромбоцитов и ухудшает заживление; по возможности рекомендуется отказаться от курения."

declarations_extra:
  - "Я понимаю, что PRP будет приготовлена из моей собственной крови, что данные об используемом наборе будут записаны в мою медицинскую карту и что на каждом этапе будет проверяться, что пробирки принадлежат мне."
  - "Я предоставил(а) достоверную информацию о состояниях, которые могут препятствовать проведению PRP-терапии: заболеваниях крови, онкологических заболеваниях в анамнезе, приёме препаратов, разжижающих кровь, и беременности."
  - "Я понимаю, что эффект различается у разных людей, что необходимо несколько сеансов и что результат не является постоянным."
