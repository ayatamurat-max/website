code: "15"
type: office
aesthetic: true
title: "Лечение с филъри (хиалуронова киселина)"
alt_name: "Инжектиране на хиалуронова киселина при загуба на обем, за контур и бръчки на лицето"

specific_fields:
  - label: "Име на продукта / марка:"
  - label: "Партиден номер (LOT) и срок на годност:"
  - label: "Общо количество (мл):"
  - label: "Третирани зони:"
    options: ["Устни", "Назолабиални гънки", "Скули / бузи", "Брадичка", "Линия на долната челюст", "Под очите", "Нос", "Друго"]
  - label: "Инструмент:"
    options: ["Игла", "Канюла", "И двете"]

about:
  - "Хиалуроновата киселина е вещество, което се съдържа естествено в кожата ни; тя задържа вода и придава плътност на тъканите. Филърите са произведена в лаборатория гелообразна форма на това вещество. Използват се за **възстановяване на обема**, загубен с възрастта, за **подчертаване на контура** на устните, скулите, брадичката и линията на долната челюст или за изглаждане на **бръчки и вдлъбнатини**."
  - "Загубата на обем и бръчките по лицето се дължат на стареенето, промените в костите и мастната тъкан, отслабването, слънцето и генетичните фактори. Ефектът на филъра с хиалуронова киселина е **временен**; той постепенно се резорбира от организма. **В нашата клиника не се използват постоянни (перманентни) филъри.**"

procedure_intro:
  - "Процедурата се извършва в клиниката. Първо се оценява лицето ви, обсъждат се очакванията ви, изготвя се план и се правят снимки преди процедурата."
procedure_steps:
  - "**Подготовка:** Гримът се отстранява, а кожата се почиства с антисептичен разтвор. За ваше удобство може да се постави анестетичен крем; повечето филъри също съдържат местен анестетик (лидокаин)."
  - "**Инжектиране:** Гелът се въвежда бавно и на малки порции на планираната дълбочина и в планираната зона с тънка игла или гъвкава канюла с тъп връх. Използват се безопасни техники, за да се намали рискът от инжектиране в кръвоносен съд."
  - "**Оформяне:** При нужда продуктът се моделира внимателно с пръсти; резултатът се оценява заедно с вас пред огледалото."
  - "**Документиране:** Името на продукта, партидният номер (LOT), количеството и третираните зони се вписват в досието ви. Може да получите карта/етикет с данните за продукта; препоръчваме ви да я запазите."
procedure_notes:
  - "Важно предимство за безопасността на филърите с хиалуронова киселина е, че при нужда могат да бъдат разтворени с ензим, наречен **хиалуронидаза**. В нашата клиника това лекарство и оборудване за спешна помощ винаги са на разположение."
anesthesia: "Анестетичен крем и/или местен анестетик, съдържащ се в продукта"
duration: "Около 20–45 минути"
stay: "Същия ден; наблюдение 15–30 минути след процедурата"

benefits:
  - "Възстановяване на загубения обем и по-свеж и балансиран вид на лицето"
  - "По-изразен и хармоничен контур на устните, скулите, брадичката и линията на челюстта"
  - "Изглаждане на бръчки и вдлъбнатини"
  - "Резултатът се вижда веднага и бързо се връщате към ежедневието си"
success:
  - "Резултатът се вижда веднага след процедурата и се оценява по-точно след отшумяване на отока — около **2-рата седмица**. В зависимост от продукта, зоната и метаболизма ви ефектът обикновено продължава **6–18 месеца** (по-кратко в устните, по-дълго в скулите и брадичката). За поддържане на резултата процедурата трябва да се повтаря периодично. При изразено отпускане на кожата подобрението, постижимо с филър, може да е ограничено."

alternatives:
  - "**Без лечение:** Тъй като процедурата е естетична, винаги имате възможност да не я правите."
  - "**Ботулинов токсин:** По-подходящ е за бръчки, причинени от мимиката, а не от загуба на обем."
  - "**Методи за подмладяване на кожата:** Мезотерапия, PRP, пилинг или лазер могат да подобрят качеството на кожата, но не добавят обем."
  - "**Трансплантация на собствена мазнина (липофилинг):** Може да е по-трайна; изисква малка хирургична намеса."
  - "**Хирургични методи:** Лифтинг на лицето, операция на клепачите, имплант на брадичката или ринопластика могат да дадат по-изразена или трайна промяна."

no_treatment:
  - "Ако процедурата не се извърши, лицето ви ще продължи да се променя с естественото стареене. Това не представлява опасност за здравето ви."

before:
  - "Процедурата **не се извършва или се отлага** в следните случаи: бременност, кърмене, активно акне, херпес или инфекция в третираната зона, известна алергия към продукта или към лидокаин, прекарана тежка алергична реакция (анафилаксия), неконтролирано автоимунно заболяване. Моля, кажете ни, ако някое от тези състояния се отнася за вас."
  - "Уведомете ни, ако в същата зона в миналото сте имали **какъвто и да е филър** (особено постоянни продукти или такива, за които не е известно дали са постоянни), конци или импланти."
  - "Ако е възможно, избягвайте стоматологично лечение, ваксинации или други планирани операции **2 седмици преди и 2 седмици след** процедурата, тъй като те могат да увеличат риска от забавена възпалителна реакция. Ако се налагат, уведомете ни."
  - "Ако ви предстои важно събитие, планирайте процедурата поне 2 седмици по-рано заради възможния оток и кръвонасядания."

recovery:
  - when: "Първите 24 часа"
    what: "В зоната има оток, чувствителност и зачервяване; студеният компрес облекчава. Не масажирайте и не натискайте зоната. Избягвайте грим, сауна, усилени натоварвания и алкохол. След филър на устните отокът е по-изразен."
  - when: "2–7-и ден"
    what: "Отокът до голяма степен отшумява. **Ако** се появят кръвонасядания, те изчезват за 5–10 дни. Може да се напипват малки уплътнения; повечето омекват сами. Избягвайте спане по корем и масаж на лицето."
  - when: "2-ра седмица"
    what: "Резултатът се установява. При нужда се прави контролен преглед; при асиметрия или недостатъчна корекция, след преценка на лекаря, може да се планира малка допълнителна процедура."
  - when: "6–18-и месец"
    what: "Продуктът постепенно се резорбира. Моментът за повторна процедура се планира заедно с вас."

risks:
  expected:
    - "Лека болка, зачервяване и чувствителност по местата на убождане"
    - "Оток (може да е изразен няколко дни, особено в устните и под очите)"
    - "Кръвонасядания; **ако** се появят, изчезват за 1–2 седмици"
    - "Малки напипващи се уплътнения (обикновено омекват за няколко седмици)"
  common:
    - name: "Лека асиметрия или по-голяма/по-малка плътност от очакваното"
      text: "Двете половини на лицето естествено се различават; може да останат малки разлики. Те могат да бъдат коригирани на контролния преглед с допълнителен филър или с хиалуронидаза."
    - name: "Продължителен оток"
      text: "Особено под очите отокът при някои хора може да продължи седмици."
  uncommon:
    - name: "Трайни уплътнения или възелчета"
      text: "Могат да се образуват, когато продуктът се натрупа на едно място. Лекуват се с масаж, хиалуронидаза или други методи."
    - name: "Синкаво оцветяване (ефект на Тиндал)"
      text: "Може да се появи, когато продуктът е поставен твърде повърхностно, особено в тънката кожа под очите; коригира се с хиалуронидаза."
    - name: "Преместване на продукта (миграция)"
      text: "С времето продуктът може да се измести в съседна зона (напр. над контура на устните); при нужда се разтваря."
    - name: "Инфекция и биофилм"
      text: "Рядко в зоната може да се появят зачервяване, затопляне, болка или абсцес. Може да са необходими антибиотици, а при нужда — разтваряне на филъра и дрениране. Ако около продукта се образува слой от бактерии (биофилм), възпалението може да се повтаря и лечението да е продължително."
    - name: "Забавена възпалителна реакция"
      text: "**Седмици или дори месеци** след процедурата, често след имунен стимул като грип, стоматологично лечение или ваксинация, в зоната на филъра може да се появи болезнен оток и зачервяване (при **по-малко от 1 на 100** пациенти). Подобрява се с лекарства и при нужда с разтваряне на филъра."
    - name: "Активиране на херпес"
      text: "Може да се появи, особено след третиране на устните; ако сте имали херпес преди, може да ви бъде дадено профилактично лекарство."
  rare:
    - name: "Запушване на кръвоносен съд (съдова оклузия)"
      text: "Това е най-важният риск при филърите. Ако продуктът попадне в кръвоносен съд или го притисне отвън, кръвоснабдяването на съответната зона може да бъде нарушено. В медицинската литература се съобщава за честота приблизително **1 на 1000 до 1 на 10 000 процедури**; рискът е по-висок в областта на **носа, между веждите и назолабиалните гънки**. Признаци: **силна болка** по време на или след процедурата, **побледняване** на кожата, последвано от **тъмно, моравосиньо, мрежовидно оцветяване** и студенина. Ако не бъде разпознато рано и лекувано незабавно, може да доведе до **разрушаване и загуба на тъкан (некроза)**, траен белег и деформация."
    - name: "Спешно лечение: хиалуронидаза"
      text: "При съмнение за съдова оклузия процедурата се прекратява незабавно и се инжектира висока доза **хиалуронидаза** за разтваряне на филъра, заедно с топли компреси, масаж и лекарства. Това лечение обикновено е ефективно, но **не винаги може напълно да обърне** увреждането. Самата хиалуронидаза много рядко може да предизвика алергична реакция. Може да се наложат насочване към болница, грижи за раната, продължително лечение или по-късни коригиращи процедури."
    - name: "Загуба на зрение и инсулт"
      text: "Макар и изключително рядко, ако продуктът достигне съдовете, кръвоснабдяващи окото или мозъка, може да причини **частична или пълна, трайна загуба на зрението** или **инсулт**. Най-често се свързва с третиране на носа и областта между веждите. В такъв случай **всяка минута е от значение**; ще бъдете насочени към болница за спешна очна и неврологична оценка."
    - name: "Тежка алергична реакция"
      text: "Тежката алергична реакция (анафилаксия) към хиалуронова киселина или лидокаин е изключително рядка; изисква спешна помощ."
    - name: "Гранулом"
      text: "Организмът образува твърди възпалителни възли като реакция към продукта; това е много рядко и може да изисква продължително лечение."

emergency:
  - "**Силна болка** след процедурата, която не отминава или се засилва"
  - "**Побледняване или тъмно моравосиньо, мрежовидно (мраморно) оцветяване** на кожата, студенина, мехури или рана"
  - "**Замъглено зрение или загуба на зрение**, болка в окото или двойно виждане — **всяка минута е важна**: обадете се веднага или отидете в най-близкото спешно отделение"
  - "Внезапно **силно главоболие, нарушен говор, слабост в лицето, ръката или крака** (признаци на инсулт) — обадете се незабавно на 112"
  - "Бързо развиващ се оток на лицето, устните или езика, уртикария или задух"
  - "Температура, зачервяване, затопляне и засилващо се уплътнение/оток (дори седмици по-късно)"

lifestyle:
  - "През първите 24 часа избягвайте грим, сауна, турска баня, усилени натоварвания и алкохол; през първите 2 седмици избягвайте масаж на зоната, козметични процедури за лице и спане по корем."
  - "През първите 2 седмици пазете зоната от слънце, солариум и много студено време."
  - "Ако в бъдеще друг лекар извършва процедура на лицето ви (филър, лазер, операция, стоматологично лечение), кажете му, че сте имали процедура с филър, и посочете името на продукта."

declarations_extra:
  - "Бяха ми обяснени рискът от съдова оклузия и произтичащото от нея увреждане на кожата, както и — макар и много рядко — рискът от загуба на зрение и инсулт; спешното лечение, което ще бъде приложено в такъв случай (хиалуронидаза), и това, че то не винаги може да бъде напълно успешно."
  - "Разбирам, че ефектът на филъра е временен и че в тази клиника не се използват постоянни филъри, и декларирам, че съм съобщил/а изцяло за предишни процедури с филъри или импланти."
