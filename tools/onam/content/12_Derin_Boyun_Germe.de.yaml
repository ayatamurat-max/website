code: "12"
type: surgical
aesthetic: true
title: "Tiefes Halslifting"
alt_name: "Halsstraffung, bei der auch die tieferen Strukturen des Halses behandelt werden (Deep-Plane-Halslifting)"

specific_fields:
  - label: "Geplante Bestandteile:"
    options: ["Platysmaplastik", "Entfernung von tiefem Fett", "Verkleinerung des Musculus digastricus", "Verkleinerung der Unterkieferspeicheldrüse", "Hautentfernung"]
    blank: false
  - label: "Gleichzeitiges Facelift:"
    options: ["Nein", "Ja (mit gesonderter Einwilligungserklärung)"]
  - label: "Weitere gleichzeitig durchzuführende Eingriffe:"
  - label: "Anliegen und Erwartungen der Patientin/des Patienten:"

about:
  - "Mit dem Alter, durch Gewichtsveränderungen oder aufgrund erblicher Merkmale können sich am Hals eine **Fülle unter dem Kinn**, ein Verlust des Winkels zwischen Kiefer und Hals, **senkrechte Stränge** (Stränge des Platysmamuskels) und **erschlaffte Haut** entwickeln. Dieses Erscheinungsbild wird häufig nicht nur durch Fett unter der Haut verursacht, sondern auch durch **tiefes Fett unter dem Halsmuskel, die Muskeln unter dem Kinn (Musculi digastrici) und ein Absinken der Speicheldrüsen (Unterkieferspeicheldrüsen)**."
  - "Beim tiefen Halslifting werden auch diese tieferen Strukturen behandelt, mit dem Ziel, die Kieferlinie zu konturieren und einen **jüngeren, klarer definierten und natürlich wirkenden** Hals zu erreichen. Das Ergebnis hängt von Ihrer Hautelastizität, Ihrem Knochenbau, Ihrem Gewicht und Ihrem Alter ab. Die Operation hält das Altern nicht auf; der Hals wird mit der Zeit allmählich weiter erschlaffen."

procedure_intro:
  - "Die Operation wird in der Regel in Vollnarkose im Operationssaal durchgeführt. Vorher wird Ihr Hals im Sitzen und im Stehen untersucht, fotografiert und angezeichnet, und die zu behandelnden Strukturen werden gemeinsam mit Ihnen festgelegt."
procedure_steps:
  - "**Schnitte:** In der natürlichen Falte unter dem Kinn wird ein Schnitt von etwa 3–5 cm angelegt. Soll überschüssige Haut entfernt werden, kommen Schnitte um das Ohrläppchen hinzu, die hinter dem Ohr in Richtung Haaransatz verlaufen. Die Schnitte werden so weit wie möglich in natürlichen Falten und im behaarten Bereich verborgen."
  - "**Ablösen der Haut:** Die Haut des Halses wird behutsam vom darunterliegenden Muskel gelöst; bei Bedarf wird das oberflächliche Fett gleichmäßig ausgedünnt."
  - "**Entfernung von tiefem Fett:** Das tiefe Fett unter dem Halsmuskel (Platysma), das durch eine Fettabsaugung von außen nicht erreicht werden kann, wird kontrolliert verringert."
  - "**Musculi digastrici und Unterkieferspeicheldrüsen:** Bei Bedarf wird der vordere Anteil des Musculus digastricus, der eine Fülle unter dem Kinn verursacht, ausgedünnt. Ist eine Speicheldrüse (Unterkieferspeicheldrüse) abgesunken und hervortretend, kann der vorstehende Anteil bei Bedarf teilweise verkleinert werden; die Drüse wird nicht vollständig entfernt."
  - "**Platysmaplastik:** Die Ränder des Platysmamuskels, die in der Halsmitte auseinandergewichen sind und Stränge bilden, werden miteinander vernäht, sodass ein „inneres Korsett“ entsteht; bei Bedarf wird der Muskel zusätzlich seitlich aufgehängt."
  - "**Entfernung überschüssiger Haut und Wundverschluss:** Die Haut wird spannungsfrei nach oben und hinten verlagert, und der Überschuss wird entfernt. Blutungen werden sorgfältig gestillt, meist wird eine **Drainage** (ein dünner Schlauch zum Ableiten von Flüssigkeit) eingelegt, die Schnitte werden mit feinen Nähten verschlossen und ein Halsverband wird angelegt."
procedure_notes:
  - "Die geplanten Bestandteile sind von Person zu Person unterschiedlich; nicht jeder Schritt wird bei jeder Patientin bzw. jedem Patienten durchgeführt. Soll gleichzeitig ein Facelift durchgeführt werden, wird dafür eine **gesonderte Einwilligungserklärung** unterschrieben."
anesthesia: "Vollnarkose (bei ausgewählten Patienten Sedierung + örtliche Betäubung)"
duration: "Etwa 2–4 Stunden (bei kombinierten Eingriffen länger)"
stay: "In der Regel eine Nacht im Krankenhaus"

benefits:
  - "Eine besser konturierte Kieferlinie und ein definierterer Winkel zwischen Kiefer und Hals"
  - "Weniger Fülle unter dem Kinn und weniger senkrechte Halsstränge"
  - "Straffung erschlaffter Halshaut und ein jüngeres, frischeres Aussehen"
success:
  - "Die meisten geeignet ausgewählten Patienten sind mit dem Ergebnis zufrieden. Der größte Teil der Schwellung klingt in den ersten 4–6 Wochen ab; das endgültige Ergebnis zeigt sich innerhalb von **6–12 Monaten**. Bei Patienten mit schlechter Hautqualität, höherem Alter, starkem Gewichtsverlust oder früheren Halsoperationen kann das Ergebnis begrenzter sein. Bei etwa **5–10 von 100** Patienten kann ein kleiner Korrektureingriff (Nachkorrektur) erforderlich sein."

alternatives:
  - "**Verzicht auf die Operation:** Da es sich um einen ästhetischen Eingriff handelt, haben Sie immer die Möglichkeit, ihn nicht durchführen zu lassen."
  - "**Alleinige Fettabsaugung am Kinn (submentale Liposuktion):** Kann bei Menschen mit guter Hautelastizität ausreichen, deren Fülle nur durch Fett unter der Haut bedingt ist; tiefes Fett, Muskeln oder Drüsen werden dadurch nicht korrigiert."
  - "**Fettlösende Injektionen (Deoxycholsäure) oder energiebasierte Geräte (Radiofrequenz, Ultraschall):** Bewirken bei leichter Fülle und Erschlaffung eine begrenzte Verbesserung; meist sind mehrere Sitzungen erforderlich."
  - "**Botulinumtoxin zur Abschwächung der Platysmastränge:** Verringert die Stränge vorübergehend (3–4 Monate); Erschlaffung und Fett werden dadurch nicht korrigiert."
  - "**Ein weniger umfangreiches Halslifting:** Kleinere Operationen, bei denen nur überschüssige Haut entfernt oder nur eine Platysmaplastik durchgeführt wird; ihre Wirkung ist begrenzter."

no_treatment:
  - "Ohne Operation bleibt das derzeitige Erscheinungsbild Ihres Halses bestehen, und das natürliche Altern setzt sich fort. Für Ihre Gesundheit besteht dadurch keine Gefahr."

before:
  - "Vor der Operation werden Blutuntersuchungen und bei Bedarf ein EKG sowie weitere Untersuchungen durchgeführt; Sie werden von der Narkoseärztin bzw. dem Narkosearzt untersucht."
  - "**Es ist sehr wichtig, dass Ihr Blutdruck gut eingestellt ist.** Bluthochdruck erhöht das Risiko einer Blutansammlung am Hals (Hämatom) nach der Operation deutlich. Fragen Sie die Narkoseärztin bzw. den Narkosearzt, ob Sie Ihr Blutdruckmedikament auch am Morgen der Operation (mit einem Schluck Wasser) einnehmen sollen."
  - "In den **6–8 Stunden** vor der Operation dürfen Sie nichts essen und nichts trinken (befolgen Sie die Anweisungen der Narkoseärztin bzw. des Narkosearztes)."
  - "Vermeiden Sie vor der Operation anstrengenden Sport, Sauna und übermäßigen Alkoholkonsum. Tragen Sie am Operationstag kein Make-up, keinen Schmuck und keine Halsketten; bringen Sie ein vorne zu knöpfendes Oberteil mit, das nicht über den Kopf gezogen werden muss."
  - "Es wird empfohlen, dass in den ersten 24–48 Stunden nach der Operation eine Begleitperson bei Ihnen bleibt."

recovery:
  - when: "Erste 24–48 Stunden"
    what: "Am Hals befinden sich ein Verband und eine Drainage. Sie werden eine Schwellung, ein Spannungsgefühl und Beschwerden beim Schlucken haben; die Schmerzen sind meist leicht bis mäßig. Es ist wichtig, mit erhöhtem Kopf (30–45°) zu schlafen, den Hals nicht übermäßig zu beugen und Blutdruckanstiege zu vermeiden (nicht pressen, einen eventuellen Husten unter Kontrolle halten). Die Drainage wird in der Regel am **1.–2. Tag** entfernt."
  - when: "1. Woche"
    what: "Schwellung und Blutergüsse, **falls sie auftreten**, sind in dieser Phase am ausgeprägtesten und beginnen dann abzuklingen. Ein Taubheitsgefühl am Hals und unter dem Kinn ist normal. Die **Halsbandage/der Halsverband** wird nach Anweisung Tag und Nacht getragen. Die Fäden werden am **5.–10. Tag** gezogen."
  - when: "2.–4. Woche"
    what: "Die meisten Patienten kehren innerhalb von 10–14 Tagen zur Bürotätigkeit und ins gesellschaftliche Leben zurück. Verhärtungen, ein Gefühl von Unebenheit und Spannung am Hals können fortbestehen. Anstrengender Sport, Bücken, Heben und Bewegungen, die den Hals belasten, sollten mindestens **3–4 Wochen** vermieden werden."
  - when: "1.–3. Monat"
    what: "Restschwellung und Verhärtung nehmen allmählich ab. Das Taubheitsgefühl bessert sich weitgehend. Die Narben können in diesem Zeitraum rosafarben und leicht erhaben sein."
  - when: "6.–12. Monat"
    what: "Das endgültige Erscheinungsbild zeigt sich; die Narben verblassen und werden feiner. Wird eine Nachkorrektur für notwendig gehalten, erfolgt sie in der Regel frühestens nach 6 Monaten."

risks:
  expected:
    - "Schwellung am Hals und unter dem Kinn; Blutergüsse klingen, **falls sie auftreten**, innerhalb von 1–3 Wochen ab"
    - "Vorübergehendes Taubheitsgefühl der Halshaut und um die Ohren"
    - "Spannungsgefühl und Verhärtung am Hals sowie leichte Beschwerden beim Schlucken"
    - "Leichte Schmerzen, Juckreiz und rosafarbene Narben an den Schnittstellen"
    - "In den ersten Wochen tastbare Unebenheiten und Verhärtungen unter der Haut"
  common:
    - name: "Länger anhaltende Schwellung und Verhärtung"
      text: "Verhärtungen am Hals und unter dem Kinn können mehrere Monate anhalten; sie bessern sich durch Massage und mit der Zeit."
    - name: "Geringe Asymmetrie und Konturunregelmäßigkeiten"
      text: "Leichte Unterschiede zwischen beiden Halsseiten oder kleine Dellen/Erhebungen unter der Haut können bestehen bleiben; die meisten gleichen sich mit der Zeit aus, manche können eine kleine Korrektur erfordern."
    - name: "Serom (Flüssigkeitsansammlung)"
      text: "Eine Ansammlung klarer Flüssigkeit unter der Haut; wird meist durch Punktion mit einer Nadel in der Praxis behandelt."
    - name: "Notwendigkeit einer Nachkorrektur"
      text: "Bei etwa **5–10 von 100** Patienten kann wegen verbliebener Fülle, Unregelmäßigkeiten oder Narben eine kleine Korrektur erforderlich sein."
  uncommon:
    - name: "Hämatom (Blutansammlung am Hals)"
      text: "Tritt bei etwa **2–5 von 100** Patienten auf; es ist **bei Männern und bei Menschen mit Bluthochdruck** häufiger und tritt meist innerhalb der ersten 24 Stunden auf. Kleine Hämatome können mit einer Nadel entleert werden; bei großen ist eine **Rückkehr in den Operationssaal** erforderlich, um das Blut zu entfernen und die Blutung zu stillen. Ein sich rasch vergrößerndes Hämatom kann **auf die Luftröhre drücken und das Atmen erschweren**; dies erfordert eine Notfallbehandlung. Ein spät erkanntes Hämatom kann die Durchblutung der Haut beeinträchtigen und zu Wund- und Narbenproblemen führen."
    - name: "Vorübergehende Schwäche der Unterlippenbewegung (Ramus marginalis mandibulae / Ramus colli des Gesichtsnervs)"
      text: "Bei etwa **1–10 von 100** Patienten kann eine Seite der Unterlippe beim Lächeln asymmetrisch wirken. Die meisten Fälle beruhen auf einer Dehnung des Nervs oder auf der Schwellung und bilden sich **innerhalb von einigen Wochen bis einigen Monaten** von selbst zurück."
    - name: "Speichelaustritt / Speichelansammlung (Sialozele)"
      text: "Bei Patienten, deren Unterkieferspeicheldrüse verkleinert wurde, kann Speichel aus der Drüse austreten und sich unter der Haut ansammeln. Dies klingt meist durch wiederholte Punktion mit einer Nadel, einen Druckverband und bei Bedarf Medikamente ab; selten ist ein weiterer Eingriff erforderlich."
    - name: "Fehlbildung durch übermäßige Gewebeentfernung"
      text: "Wird zu viel Fett- oder Drüsengewebe entfernt, können eine Mulde in der Halsmitte, hervortretende Muskeln und ein „skelettiertes“ Aussehen entstehen („Kobrahals“-Deformität). Die Korrektur kann eine Eigenfetttransplantation oder eine weitere Operation erfordern; deshalb wird das Gewebe ausgewogen und kontrolliert entfernt."
    - name: "Auffällige oder breite Narben"
      text: "Narben unter dem Kinn und hinter den Ohren können sich selten verdicken, verbreitern oder ihre Farbe verändern. Sie können mit Kortisoninjektionen, Silikongel oder einer Narbenkorrektur behandelt werden. Reicht der Schnitt hinter dem Ohr bis zum Haaransatz, kann das Haar entlang der Narbe dünner werden. Werden Schnitte um das Ohrläppchen gesetzt, kann das Ohrläppchen selten nach unten und vorne gezogen wirken; bei Bedarf kann eine kleine Korrektur vorgenommen werden."
    - name: "Länger anhaltendes Taubheitsgefühl"
      text: "Ein vermindertes Gefühl am Hals und um das Ohrläppchen kann mehrere Monate anhalten; selten kann es teilweise dauerhaft bleiben."
    - name: "Infektion"
      text: "Tritt bei **weniger als 1 bis 2 von 100** Patienten auf. Sie heilt meist mit Antibiotika ab; selten ist eine Eiterentleerung (Drainage) erforderlich."
  rare:
    - name: "Gestörte Hautdurchblutung und Gewebeverlust (Nekrose)"
      text: "Insbesondere bei **Raucherinnen und Rauchern**, Menschen mit Diabetes und Patienten, bei denen sich ein Hämatom entwickelt, können ein Aufgehen der Wunde und ein Verlust von Haut an den Wundrändern auftreten. Die Heilung verlängert sich, Verbandswechsel und manchmal eine weitere Operation sind erforderlich, und es kann eine bleibende Narbe zurückbleiben."
    - name: "Dauerhafte Nervenschädigung"
      text: "Eine dauerhafte Schwäche der Unterlippenbewegung tritt bei **weniger als 1 von 100** Patienten auf. Sehr selten können die Nerven, die die Zunge bewegen (Nervus hypoglossus) oder die Zunge sensibel versorgen (Nervus lingualis), oder der Nerv, der das Ohrläppchen sensibel versorgt (Nervus auricularis magnus), beeinträchtigt werden."
    - name: "Atemwegsprobleme und Schluckbeschwerden"
      text: "In sehr seltenen Fällen kann wegen eines großen Hämatoms oder einer ausgeprägten Schwellung eine notfallmäßige Sicherung der Atemwege mit anschließender Überwachung auf der Intensivstation erforderlich sein. Nach der Korrektur der tiefen Strukturen können vorübergehend Schluckbeschwerden auftreten."
    - name: "Verletzung eines Blutgefäßes oder eines Speichelgangs"
      text: "Blutungen durch eine Verletzung der Halsvenen oder Probleme mit dem Ausführungsgang der Speicheldrüse sind sehr selten; sie können eine weitere Behandlung oder einen Eingriff erforderlich machen."
    - name: "Erneute Erschlaffung"
      text: "Im Laufe der Jahre kann der Hals durch das Altern und Gewichtsveränderungen wieder erschlaffen; dies ist ein natürlicher Vorgang und keine Komplikation. Auch die Halsstränge können mit der Zeit wieder sichtbar werden. Eine deutliche frühe Erschlaffung ist selten."
    - name: "Psychische Unzufriedenheit"
      text: "Trotz eines technisch erfolgreichen Ergebnisses kann es einem Menschen schwerfallen, sich an sein neues Aussehen zu gewöhnen. Ein offenes Gespräch über die Erwartungen vor der Operation verringert dieses Risiko."

emergency:
  - "**Rasch zunehmende Schwellung, Spannung oder deutliche einseitige Vergrößerung** des Halses, besonders in den ersten 24–48 Stunden"
  - "**Atembeschwerden, eine Veränderung Ihrer Stimme, Unfähigkeit zu schlucken** oder Erstickungsgefühl (rufen Sie unverzüglich die 112 an)"
  - "**Nicht aufhörende Blutung** unter dem Verband oder rasch zunehmendes Blut in der Drainageflasche"
  - "**Fieber über 38,5 °C**, zunehmende Rötung, Schmerzen, Überwärmung oder Eiter an den Schnittstellen"
  - "**Dunkelfärbung, violett-schwarze Verfärbung** der Haut oder Aufgehen der Wunde"
  - "Plötzliche starke Schmerzen oder Schmerzen, die auf Schmerzmittel nicht ansprechen"
  - "Atemnot, Brustschmerzen oder einseitige Schwellung und Schmerzen in einem Bein"

lifestyle:
  - "Schlafen Sie in den ersten 2 Wochen auf dem Rücken mit erhöhtem Kopf; vermeiden Sie übermäßiges Beugen des Halses, plötzliche Kopf- und Halsbewegungen sowie Vorbeugen."
  - "Tragen Sie die Halsbandage/den Halsverband für den empfohlenen Zeitraum (in der Regel 1–3 Wochen)."
  - "Messen Sie regelmäßig Ihren Blutdruck und lassen Sie keine Medikamenteneinnahme aus; vermeiden Sie Pressen, schweres Heben und unkontrolliertes Husten."
  - "Vermeiden Sie in den ersten 3–4 Wochen anstrengenden Sport, Sauna, Hamam (Dampfbad) und heiße Duschen."
  - "Schützen Sie Ihre Narben mindestens 3–6 Monate lang vor der Sonne."
  - "Wenn Sie aus dem Ausland angereist sind, ist eine Flugreise in der Regel unbedenklich, sobald die Drainage entfernt und die ersten Kontrollen abgeschlossen sind, meist ab dem 5.–7. Tag."

declarations_extra:
  - "Ich habe verstanden, dass die Operation das Altern nicht aufhält, dass der Hals mit der Zeit wieder erschlaffen kann und dass das Ergebnis durch meine Hautqualität, mein Gewicht und meinen Knochenbau begrenzt ist."
  - "Ich habe verstanden, dass es wichtig ist, meinen Blutdruck unter Kontrolle zu halten und die Anweisungen nach der Operation zu befolgen, um das Risiko einer Blutung (Hämatom) zu verringern."
