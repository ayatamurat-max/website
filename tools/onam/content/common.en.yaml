intro:
  - "Dear patient, this form has been prepared to explain, in **plain and clear language**, what you need to know about the procedure recommended to you. Its purpose is not to frighten you, but to help you make your decision **freely and on the basis of good information**."
  - "Please read this form without rushing. Ask your doctor about anything you do not understand. Your doctor will also explain verbally any risks that are particular to your situation. Whether or not you give consent is entirely your right."

