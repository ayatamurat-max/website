code: "13"
type: surgical
aesthetic: true
title: "Lifting temporal"
alt_name: "Remontée de la queue du sourcil et du coin externe de l'œil par voie temporale (lifting latéral du sourcil)"

specific_fields:
  - label: "Côté :"
    options: ["Droit", "Gauche", "Des deux côtés"]
    blank: false
  - label: "Site d'incision :"
    options: ["Dans le cuir chevelu (tempe)", "À la lisière des cheveux", "À déterminer pendant l'intervention"]
  - label: "Méthode de fixation :"
    options: ["Points de suture permanents", "Dispositif résorbable", "Autre"]
  - label: "Interventions réalisées dans le même temps :"
    options: ["Blépharoplastie supérieure (consentement séparé)", "Injection de graisse", "Aucune"]
  - label: "Plaintes et attentes du patient :"

about:
  - "Avec l'âge, les tissus du front et des tempes se relâchent ; en particulier, l'**extrémité externe du sourcil** et le **coin externe de l'œil** descendent. Cela peut donner un regard fatigué, triste ou lourd, une impression d'excès de peau sur la paupière supérieure et des rides au coin de l'œil. Chez certaines personnes, cette forme est également présente dès la naissance."
  - "Le lifting temporal est une intervention qui **remonte la partie externe du sourcil et le coin de l'œil vers le haut et vers l'arrière** grâce à de petites incisions situées dans les cheveux des tempes. Son objectif est d'obtenir un **regard plus frais et plus ouvert**, en harmonie avec votre visage. À lui seul, il ne corrige ni la partie interne du sourcil, ni l'ensemble du front, ni l'excès de peau des paupières ; si nécessaire, il est associé à d'autres interventions."

procedure_intro:
  - "L'intervention est habituellement réalisée sous anesthésie générale, ou sous sédation associée à une anesthésie locale, au bloc opératoire. Au préalable, la position de vos sourcils et des coins de vos yeux est évaluée en position debout et assise, des photographies sont prises et la direction de la remontée est marquée avec vous."
procedure_steps:
  - "**Incision :** de chaque côté, des incisions d'environ 3–5 cm sont réalisées dans les cheveux de la tempe ou à la lisière des cheveux. Les cheveux ne sont pas coupés, ou seule une bande très étroite le long de l'incision est égalisée."
  - "**Libération des tissus :** le chirurgien travaille dans le plan profond de la tempe, de manière à protéger la branche frontale du nerf facial. Les tissus conjonctifs situés autour de la partie externe du sourcil et du coin de l'œil sont délicatement libérés afin de pouvoir être mobilisés."
  - "**Remontée et fixation :** les tissus libérés sont remontés vers le haut et vers l'arrière dans la direction prévue, puis fixés à la couche de tissu solide de la tempe à l'aide de **points de suture permanents** ou de **dispositifs de fixation résorbables**. L'équilibre entre les deux côtés est vérifié."
  - "**Fermeture :** si nécessaire, un petit excédent de cuir chevelu est retiré. Les incisions sont refermées par des agrafes ou des points de suture, un drain fin est parfois mis en place et un pansement léger est appliqué autour de la tête."
procedure_notes:
  - "Si une chirurgie de la paupière supérieure (blépharoplastie) ou une autre intervention doit être réalisée dans le même temps, un **formulaire de consentement séparé** sera signé pour celle-ci."
anesthesia: "Anesthésie générale ou sédation + anesthésie locale"
duration: "Environ 1–2 heures"
stay: "Généralement sortie le jour même ou une nuit à l'hôpital"

benefits:
  - "Un regard plus frais, plus ouvert et plus jeune grâce à la remontée de la partie externe du sourcil et du coin de l'œil"
  - "Diminution de la lourdeur et de l'impression d'excès de peau sur la partie externe de la paupière supérieure"
  - "Aucune cicatrice visible sur le visage, les incisions étant cachées dans les cheveux"
success:
  - "La plupart des patients correctement sélectionnés sont satisfaits du résultat. Au cours des premières semaines, les sourcils peuvent paraître légèrement plus hauts que prévu ; cela s'atténue à mesure que les tissus se mettent en place. Le résultat définitif est visible en **3–6 mois**. Les tissus remontés peuvent redescendre quelque peu avec le temps, sous l'effet du vieillissement et de la pesanteur ; la durée de l'effet varie d'une personne à l'autre et est généralement de **plusieurs années**. Environ **5–10 patients sur 100** peuvent avoir besoin d'une retouche en raison d'une asymétrie ou d'un relâchement précoce."

alternatives:
  - "**Ne pas se faire opérer :** s'agissant d'une intervention esthétique, vous avez toujours la possibilité de ne pas la réaliser."
  - "**Remontée du sourcil par toxine botulique :** peut relever la partie externe du sourcil de quelques millimètres, de façon temporaire (3–4 mois)."
  - "**Techniques de lifting par fils :** réalisées avec moins d'incisions, mais leur effet est généralement plus limité et de plus courte durée."
  - "**Produits de comblement pour soutenir la tempe/le sourcil :** peuvent apporter une amélioration temporaire lorsque l'affaissement est dû à une perte de volume ; ils comportent leurs propres risques, comme l'obstruction d'un vaisseau sanguin."
  - "**Autres interventions de remontée du sourcil :** si l'ensemble du front et la partie interne du sourcil sont également affaissés, un lifting frontal endoscopique ou des techniques avec incision au-dessus du sourcil ou à la lisière des cheveux peuvent être plus adaptés."
  - "**Blépharoplastie supérieure seule :** peut suffire si le problème principal est l'excès de peau de la paupière ; elle ne corrige pas un sourcil bas."

no_treatment:
  - "Si l'intervention n'est pas réalisée, l'aspect actuel de vos sourcils et des coins de vos yeux restera inchangé et le vieillissement naturel se poursuivra. Cela ne représente pas de danger pour votre santé."

before:
  - "Des analyses de sang et, si nécessaire, d'autres examens sont réalisés avant l'intervention ; si une anesthésie générale est prévue, vous serez évalué(e) par le médecin anesthésiste."
  - "Ne mangez et ne buvez rien pendant les **6–8 heures** précédant l'intervention (suivez les consignes du médecin anesthésiste)."
  - "Lavez-vous les cheveux la veille au soir ou le matin de l'intervention ; le jour même, n'utilisez ni laque, ni gel, ni maquillage, ni lentilles de contact. Il n'est généralement pas nécessaire de couper vos cheveux."
  - "Informez votre médecin si vous avez reçu des injections de toxine botulique dans la région du front ou des sourcils au cours des **3–4 derniers mois** ; cela peut influencer la planification."
  - "Il est recommandé qu'un proche reste avec vous le premier jour suivant l'intervention."

recovery:
  - when: "Premières 48 heures"
    what: "Vous ressentirez une sensation de tension, de légers maux de tête et un gonflement au niveau des tempes et du front ; la douleur est généralement légère et soulagée par les antalgiques. Le gonflement peut descendre vers les yeux ; des ecchymoses, **si elles apparaissent**, se situent sur les paupières. Dormir la tête surélevée et appliquer des compresses froides aident à réduire le gonflement. Si un drain a été mis en place, il est généralement retiré le lendemain."
  - when: "1re semaine"
    what: "Vous pouvez généralement vous laver doucement les cheveux avec un shampooing doux à partir du **2e–3e jour**. À ce stade, les sourcils et les coins des yeux peuvent paraître plus hauts et plus tirés que prévu. La plupart des patients reprennent leurs activités quotidiennes et un travail de bureau en 5–7 jours."
  - when: "Jours 7–14"
    what: "Les agrafes ou les points de suture sont retirés. Un engourdissement, des démangeaisons et une sensibilité le long de l'incision au niveau des tempes peuvent persister."
  - when: "Semaines 2–6"
    what: "Le gonflement disparaît en grande partie et le regard devient plus naturel. Le sport intense et les bandeaux/casques serrés qui appuient sur les tempes doivent être évités pendant au moins **3–4 semaines**, et les colorations capillaires et traitements chimiques similaires pendant au moins **4–6 semaines** ; utilisez votre sèche-cheveux en position tiède."
  - when: "Mois 3–6"
    what: "Les tissus se mettent en place et l'aspect définitif apparaît. Les modifications de sensibilité du cuir chevelu récupèrent en grande partie ; la cicatrice s'estompe."

risks:
  expected:
    - "Sensation de tension, de pression et légers maux de tête au niveau des tempes et du front"
    - "Gonflement du front et du pourtour des yeux ; les ecchymoses, **si elles apparaissent**, disparaissent en 1–2 semaines"
    - "Sourcils paraissant plus hauts que prévu, ou air étonné, au cours des premières semaines"
    - "Engourdissement, démangeaisons ou fourmillements des tempes et du cuir chevelu"
    - "Sensibilité et induration le long de l'incision"
  common:
    - name: "Légère asymétrie"
      text: "Les sourcils ne sont naturellement pas parfaitement symétriques ; de légères différences entre les deux côtés peuvent persister après l'intervention ou apparaître pendant la cicatrisation."
    - name: "Raréfaction des cheveux le long de l'incision"
      text: "Une chute temporaire des cheveux autour de l'incision (effluvium post-opératoire, « shock loss ») est fréquente, et les cheveux repoussent généralement en **2–4 mois**. L'incision reste sous la forme d'une fine ligne recouverte par les cheveux."
    - name: "Engourdissement et démangeaisons prolongés"
      text: "Les modifications de sensibilité du cuir chevelu peuvent durer plusieurs mois ; des démangeaisons pendant la cicatrisation sont normales."
    - name: "Relâchement partiel"
      text: "Une certaine redescente des tissus remontés est attendue au cours des premiers mois ; c'est pourquoi une légère surcorrection peut être réalisée pendant l'intervention."
  uncommon:
    - name: "Faiblesse temporaire pour lever le sourcil (branche frontale du nerf facial)"
      text: "Chez environ **1–3 patients sur 100**, une faiblesse temporaire pour lever le sourcil ou plisser le front d'un côté peut survenir. Elle est généralement due à un étirement du nerf ou au gonflement et récupère spontanément en **quelques semaines à quelques mois**."
    - name: "Perte de cheveux définitive ou cicatrice élargie"
      text: "Une zone définitivement dépourvue de cheveux ou une cicatrice élargie le long de l'incision peut rarement apparaître ; les cicatrices situées à la lisière des cheveux, en particulier, peuvent être plus visibles. Si nécessaire, elle peut être améliorée par une reprise de cicatrice ou une greffe de cheveux."
    - name: "Hématome (accumulation de sang)"
      text: "Chez environ **1–2 patients sur 100**, du sang peut s'accumuler dans la tempe ; il peut être nécessaire de l'évacuer à l'aiguille ou par un petit geste."
    - name: "Infection"
      text: "Survient chez **moins de 1 patient sur 100**. Elle guérit généralement sous antibiotiques ; rarement, un drainage du pus ou le retrait d'un point de fixation est nécessaire."
    - name: "Surcorrection : air « étonné » ou regard trop étiré (« fox eye »)"
      text: "La partie externe du sourcil ou le coin de l'œil peut paraître plus remonté que souhaité. Cela s'atténue généralement à mesure que les tissus se mettent en place au cours des premières semaines ; si cela persiste, une retouche peut être nécessaire."
    - name: "Redescente précoce ou effet insuffisant"
      text: "En raison d'un relâchement de la fixation ou de la nature des tissus, le sourcil peut redescendre plus tôt que prévu ; une nouvelle remontée peut être nécessaire."
    - name: "Problèmes liés au matériel de fixation"
      text: "Un point de suture ou un dispositif permanent peut être perçu sous la peau, être sensible ou, rarement, se frayer un chemin à travers la peau ; dans ce cas, il peut être nécessaire de le retirer."
  rare:
    - name: "Lésion nerveuse définitive"
      text: "Une lésion définitive de la branche nerveuse qui commande le muscle releveur du sourcil est **très rare** (bien moins de 1 patient sur 100). Dans ce cas, le sourcil de ce côté ne se lève plus et le front ne se plisse plus ; une injection de toxine botulique du côté opposé ou une chirurgie complémentaire peut être nécessaire pour réduire l'asymétrie."
    - name: "Engourdissement définitif ou douleur chronique"
      text: "Une perte définitive de sensibilité du cuir chevelu, une douleur prolongée due à un piégeage nerveux ou des maux de tête peuvent très rarement survenir ; un traitement complémentaire peut être nécessaire."
    - name: "Altération de la vascularisation de la peau"
      text: "En particulier chez les fumeurs, des troubles de cicatrisation peuvent survenir sur les bords de l'incision, entraînant une cicatrice plus large et une perte de cheveux."
    - name: "Difficulté à fermer les yeux et sécheresse oculaire"
      text: "Si une blépharoplastie supérieure a été réalisée lors de la même séance, une difficulté à fermer complètement l'œil et des symptômes de sécheresse oculaire peuvent rarement survenir ; ils sont le plus souvent temporaires."
    - name: "Insatisfaction psychologique"
      text: "Malgré un résultat techniquement réussi, une personne peut avoir du mal à s'habituer à son nouveau regard. Discuter ouvertement des attentes avant l'intervention réduit ce risque."

emergency:
  - "**Gonflement de la tempe ou du front qui augmente rapidement, tendu et douloureux**"
  - "**Saignement qui ne s'arrête pas** au niveau des incisions"
  - "**Fièvre supérieure à 38,5 °C**, rougeur croissante, douleur, chaleur ou écoulement de pus au niveau des incisions"
  - "**Maux de tête violents** non soulagés par les antalgiques, vomissements ou raideur de la nuque"
  - "**Vision floue ou double**, douleur oculaire ou impossibilité de fermer l'œil"
  - "Assombrissement, coloration violacée à noirâtre de la peau, ou ouverture de la plaie"

lifestyle:
  - "Pendant les 1–2 premières semaines, dormez sur le dos, la tête surélevée ; évitez de dormir sur le ventre ou sur les tempes."
  - "Pendant les 3–4 premières semaines, ne frottez pas vos sourcils ni votre front, ne massez pas vos tempes et évitez les gestes qui tirent votre visage vers le bas."
  - "Reportez d'au moins **4–6 semaines** les traitements chimiques et thermiques tels que les colorations, les permanentes et les lisseurs. Utilisez votre sèche-cheveux en position tiède."
  - "Évitez le sport intense, le fait de vous pencher, de porter des charges, le sauna et le hammam pendant les 3–4 premières semaines."
  - "Si vous venez de l'étranger, le voyage en avion est généralement sans danger après le premier contrôle, le plus souvent à partir du 3e–5e jour."

declarations_extra:
  - "Je comprends que le lifting temporal remonte la partie externe du sourcil et le coin de l'œil, et qu'à lui seul il ne corrige ni l'ensemble du front, ni la partie interne du sourcil, ni l'excès de peau des paupières."
  - "Je comprends qu'au cours des premières semaines les sourcils peuvent paraître plus hauts et plus tirés, que les tissus remontés peuvent redescendre quelque peu avec le temps et que l'effet n'est pas permanent."
