code: "12"
type: surgical
aesthetic: true
title: "Lifting cervical profond"
alt_name: "Lifting du cou traitant également les structures profondes du cou (lifting cervical en plan profond)"

specific_fields:
  - label: "Composantes prévues :"
    options: ["Platysmaplastie", "Retrait de la graisse profonde", "Réduction des muscles digastriques", "Réduction de la glande sous-mandibulaire", "Excision de peau"]
    blank: false
  - label: "Lifting du visage simultané :"
    options: ["Non", "Oui (avec un formulaire de consentement distinct)"]
  - label: "Autres interventions à réaliser en même temps :"
  - label: "Préoccupations et attentes du patient :"

about:
  - "Avec l'âge, les variations de poids ou des caractéristiques héréditaires, le cou peut présenter une **plénitude sous le menton**, une perte de l'angle entre la mâchoire et le cou, des **bandes verticales** (bandes du muscle platysma) et une **peau relâchée**. Cet aspect est souvent dû non seulement à la graisse située sous la peau, mais aussi à **la graisse profonde située sous le muscle du cou, aux muscles sous le menton (muscles digastriques) et à l'affaissement des glandes salivaires (glandes sous-mandibulaires)**."
  - "Le lifting cervical profond traite également ces structures profondes, dans le but de dessiner l'ovale du visage et d'obtenir un cou **plus jeune, plus net et d'aspect naturel**. Le résultat dépend de l'élasticité de votre peau, de votre structure osseuse, de votre poids et de votre âge. L'intervention n'arrête pas le vieillissement ; le cou continuera à se relâcher progressivement avec le temps."

procedure_intro:
  - "L'intervention est généralement réalisée sous anesthésie générale, au bloc opératoire. Au préalable, votre cou est examiné en position assise et debout, photographié et marqué, et les structures à traiter sont convenues avec vous."
procedure_steps:
  - "**Incisions :** Une incision d'environ 3 à 5 cm est réalisée dans le pli naturel sous le menton. Si un excès de peau doit être retiré, des incisions sont ajoutées autour du lobe de l'oreille et se prolongent derrière l'oreille vers la lisière des cheveux. Les incisions sont dissimulées autant que possible dans les plis naturels et dans le cuir chevelu."
  - "**Décollement de la peau :** La peau du cou est délicatement séparée du muscle sous-jacent ; si nécessaire, la graisse superficielle est amincie de manière homogène."
  - "**Retrait de la graisse profonde :** La graisse profonde située sous le muscle du cou (platysma), qui ne peut pas être atteinte par une liposuccion depuis l'extérieur, est réduite de manière contrôlée."
  - "**Muscles digastriques et glandes sous-mandibulaires :** Si nécessaire, la partie antérieure du muscle digastrique responsable de la plénitude sous le menton est amincie. Si une glande salivaire (glande sous-mandibulaire) est affaissée et proéminente, la partie saillante peut être partiellement réduite ; la glande n'est pas retirée en totalité."
  - "**Platysmaplastie :** Les bords du muscle platysma, qui se sont écartés au milieu du cou et forment des bandes, sont suturés ensemble pour créer un « corset interne » ; si nécessaire, le muscle est également suspendu par les côtés."
  - "**Retrait de l'excès de peau et fermeture :** La peau est redrapée vers le haut et vers l'arrière, sans tension, et l'excédent est retiré. Le saignement est soigneusement contrôlé, un **drain** (un fin tuyau servant à évacuer le liquide) est généralement mis en place, les incisions sont refermées par des points fins et un pansement du cou est appliqué."
procedure_notes:
  - "Les composantes prévues varient d'une personne à l'autre ; toutes les étapes ne sont pas réalisées chez chaque patient. Si un lifting du visage doit être réalisé en même temps, un **formulaire de consentement distinct** sera signé pour celui-ci."
anesthesia: "Anesthésie générale (chez certains patients, sédation + anesthésie locale)"
duration: "Environ 2 à 4 heures (plus longtemps en cas d'interventions associées)"
stay: "Généralement une nuit à l'hôpital"

benefits:
  - "Un ovale du visage et un angle entre la mâchoire et le cou mieux dessinés"
  - "Moins de plénitude sous le menton et moins de bandes verticales sur le cou"
  - "Raffermissement de la peau relâchée du cou et un aspect plus jeune et plus frais"
success:
  - "La plupart des patients correctement sélectionnés sont satisfaits du résultat. La majeure partie du gonflement disparaît au cours des 4 à 6 premières semaines ; le résultat définitif est visible en **6 à 12 mois**. Les résultats peuvent être plus limités chez les patients ayant une peau de mauvaise qualité, un âge avancé, une perte de poids importante ou des antécédents de chirurgie du cou. Environ **5 à 10 patients sur 100** peuvent avoir besoin d'une petite intervention de correction (retouche)."

alternatives:
  - "**Ne pas se faire opérer :** Comme il s'agit d'une intervention esthétique, vous avez toujours la possibilité de ne pas la faire."
  - "**Liposuccion sous-mentonnière (du menton) seule :** Peut suffire chez les personnes ayant une bonne élasticité cutanée et dont la plénitude est due uniquement à la graisse située sous la peau ; elle ne corrige pas la graisse profonde, les muscles ni les glandes."
  - "**Injections lipolytiques (acide désoxycholique) ou appareils à base d'énergie (radiofréquence, ultrasons) :** Apportent une amélioration limitée en cas de plénitude et de relâchement légers ; plusieurs séances sont généralement nécessaires."
  - "**Toxine botulique pour atténuer les bandes du platysma :** Réduit les bandes de façon temporaire (3 à 4 mois) ; elle ne corrige ni l'affaissement ni la graisse."
  - "**Un lifting du cou plus limité :** Interventions plus légères qui retirent uniquement l'excès de peau ou comprennent uniquement une platysmaplastie ; leur effet est plus limité."

no_treatment:
  - "Si l'intervention n'est pas réalisée, l'aspect actuel de votre cou persistera et le vieillissement naturel se poursuivra. Cela ne représente aucun risque pour votre santé."

before:
  - "Des analyses de sang et, si nécessaire, un ECG et d'autres examens sont réalisés avant l'intervention ; vous serez examiné(e) par le médecin anesthésiste."
  - "**Il est très important que votre tension artérielle soit bien contrôlée.** Une tension artérielle élevée augmente nettement le risque d'accumulation de sang dans le cou (hématome) après l'intervention. Demandez au médecin anesthésiste si vous devez également prendre votre médicament contre la tension le matin de l'intervention (avec une gorgée d'eau)."
  - "Ne mangez et ne buvez rien pendant les **6 à 8 heures** précédant l'intervention (suivez les consignes du médecin anesthésiste)."
  - "Évitez le sport intense, le sauna et une consommation importante d'alcool avant l'intervention. Ne portez ni maquillage, ni bijoux, ni collier le jour de l'intervention ; apportez un haut qui se boutonne sur le devant et qu'il n'est pas nécessaire d'enfiler par la tête."
  - "Il est recommandé qu'une personne reste avec vous pendant les 24 à 48 premières heures après l'intervention."

recovery:
  - when: "Premières 24 à 48 heures"
    what: "Vous aurez un pansement et un drain sur le cou. Vous ressentirez un gonflement, une sensation de tiraillement et une gêne en avalant ; la douleur est généralement légère à modérée. Il est important de dormir la tête surélevée (30–45°), de ne pas trop fléchir le cou et d'éviter les poussées de tension artérielle (ne pas forcer en poussant, maîtriser une éventuelle toux). Le drain est généralement retiré **le 1er ou le 2e jour**."
  - when: "1re semaine"
    what: "Le gonflement et les ecchymoses, **si elles apparaissent**, sont à leur maximum à ce stade, puis commencent à diminuer. Un engourdissement du cou et de la zone sous le menton est normal. Le **vêtement de contention/pansement du cou** est porté jour et nuit selon les consignes. Les points sont retirés **entre le 5e et le 10e jour**."
  - when: "2e à 4e semaine"
    what: "La plupart des patients reprennent un travail de bureau et leur vie sociale en 10 à 14 jours. Une induration, une sensation d'irrégularité et un tiraillement du cou peuvent persister. Le sport intense, le fait de se pencher, de soulever des charges et les mouvements qui sollicitent le cou doivent être évités pendant au moins **3 à 4 semaines**."
  - when: "1er au 3e mois"
    what: "Le gonflement et l'induration résiduels diminuent progressivement. L'engourdissement s'améliore en grande partie. Les cicatrices peuvent être rosées et légèrement en relief pendant cette période."
  - when: "6e au 12e mois"
    what: "L'aspect définitif est visible ; les cicatrices s'estompent et s'affinent. Si une retouche est jugée nécessaire, elle est généralement réalisée après au moins 6 mois."

risks:
  expected:
    - "Gonflement du cou et de la zone sous le menton ; les ecchymoses, **si elles apparaissent**, disparaissent en 1 à 3 semaines"
    - "Engourdissement temporaire de la peau du cou et autour des oreilles"
    - "Tiraillement et induration du cou, et légère gêne en avalant"
    - "Légère douleur, démangeaisons et cicatrices rosées au niveau des incisions"
    - "Irrégularités et zones indurées palpables sous la peau au cours des premières semaines"
  common:
    - name: "Gonflement et induration prolongés"
      text: "L'induration du cou et de la zone sous le menton peut durer plusieurs mois ; elle s'améliore avec les massages et le temps."
    - name: "Légère asymétrie et irrégularités du contour"
      text: "De légères différences entre les deux côtés du cou ou de petits creux/reliefs sous la peau peuvent persister ; la plupart s'atténuent avec le temps, certains peuvent nécessiter une petite correction."
    - name: "Sérome (accumulation de liquide)"
      text: "Accumulation de liquide clair sous la peau ; généralement traitée par ponction à l'aiguille au cabinet."
    - name: "Nécessité d'une retouche"
      text: "Environ **5 à 10 patients sur 100** peuvent avoir besoin d'une petite correction en raison d'une plénitude résiduelle, d'irrégularités ou d'une cicatrice."
  uncommon:
    - name: "Hématome (accumulation de sang dans le cou)"
      text: "Survient chez environ **2 à 5 patients sur 100** ; il est plus fréquent **chez les hommes et chez les personnes ayant une tension artérielle élevée** et apparaît généralement au cours des 24 premières heures. Les petits hématomes peuvent être évacués à l'aiguille ; les hématomes importants nécessitent un **retour au bloc opératoire** pour évacuer le sang et arrêter le saignement. Un hématome qui augmente rapidement peut **comprimer la trachée et rendre la respiration difficile** ; cela nécessite un traitement en urgence. Un hématome reconnu tardivement peut altérer l'irrigation sanguine de la peau et entraîner des problèmes de plaie et de cicatrice."
    - name: "Faiblesse temporaire des mouvements de la lèvre inférieure (rameau marginal de la mandibule / rameau cervical du nerf facial)"
      text: "Chez environ **1 à 10 patients sur 100**, un côté de la lèvre inférieure peut paraître asymétrique lors du sourire. La plupart des cas sont dus à un étirement du nerf ou au gonflement et récupèrent spontanément **en quelques semaines à quelques mois**."
    - name: "Fuite de salive / accumulation de salive (sialocèle)"
      text: "Chez les patients dont la glande sous-mandibulaire a été réduite, de la salive peut s'échapper de la glande et s'accumuler sous la peau. Cela se résorbe généralement grâce à des ponctions répétées à l'aiguille, un pansement compressif et, si nécessaire, des médicaments ; rarement, un geste complémentaire est nécessaire."
    - name: "Déformation due à un retrait excessif de tissu"
      text: "Le retrait d'une trop grande quantité de graisse ou de tissu glandulaire peut créer un creux au milieu du cou, des muscles saillants et un aspect « squelettisé » (déformation en « cou de cobra »). La correction peut nécessiter une greffe de graisse ou une nouvelle intervention ; c'est pourquoi le retrait de tissu est réalisé de manière équilibrée et contrôlée."
    - name: "Cicatrices visibles ou élargies"
      text: "Les cicatrices sous le menton et derrière les oreilles peuvent rarement s'épaissir, s'élargir ou changer de couleur. Elles peuvent être traitées par des injections de corticoïdes, un gel de silicone ou une reprise de cicatrice. Si l'incision derrière l'oreille se prolonge jusqu'à la lisière des cheveux, les cheveux peuvent s'éclaircir le long de celle-ci. Si des incisions sont réalisées autour du lobe de l'oreille, le lobe peut rarement paraître tiré vers le bas et vers l'avant ; une petite correction peut être réalisée si nécessaire."
    - name: "Engourdissement prolongé"
      text: "La diminution de la sensibilité du cou et autour du lobe de l'oreille peut durer plusieurs mois ; rarement, elle peut être en partie permanente."
    - name: "Infection"
      text: "Survient chez **moins de 1 à 2 patients sur 100**. Elle guérit généralement avec des antibiotiques ; rarement, un drainage est nécessaire."
  rare:
    - name: "Altération de la vascularisation de la peau et perte de tissu (nécrose)"
      text: "En particulier chez les **fumeurs**, les personnes diabétiques et les patients qui développent un hématome, une désunion de la plaie et une perte de peau sur les bords peuvent survenir. La cicatrisation est prolongée, des pansements et parfois une nouvelle intervention sont nécessaires, et une cicatrice permanente peut persister."
    - name: "Lésion nerveuse permanente"
      text: "Une faiblesse permanente des mouvements de la lèvre inférieure survient chez **moins de 1 patient sur 100**. Très rarement, les nerfs qui font bouger la langue (nerf hypoglosse) ou qui assurent la sensibilité de la langue (nerf lingual), ou le nerf qui assure la sensibilité du lobe de l'oreille (nerf grand auriculaire), peuvent être atteints."
    - name: "Problèmes des voies respiratoires et difficultés à avaler"
      text: "Dans de très rares cas, en raison d'un hématome important ou d'un gonflement marqué, il peut être nécessaire de sécuriser les voies respiratoires en urgence, puis d'assurer une surveillance en réanimation. Des difficultés temporaires à avaler peuvent survenir après la correction des structures profondes."
    - name: "Lésion d'un vaisseau sanguin ou d'un canal salivaire"
      text: "Un saignement dû à une lésion des veines du cou ou des problèmes du canal de la glande salivaire sont très rares ; ils peuvent nécessiter un traitement ou un geste complémentaire."
    - name: "Récidive du relâchement"
      text: "Au fil des années, le cou peut à nouveau se relâcher avec le vieillissement et les variations de poids ; il s'agit d'un processus naturel, et non d'une complication. Les bandes musculaires du cou peuvent également redevenir visibles avec le temps. Un relâchement marqué précoce est rare."
    - name: "Insatisfaction psychologique"
      text: "Malgré un résultat techniquement réussi, une personne peut avoir du mal à s'adapter à sa nouvelle apparence. Discuter ouvertement des attentes avant l'intervention réduit ce risque."

emergency:
  - "**Gonflement, tension ou augmentation de volume marquée d'un seul côté du cou, s'aggravant rapidement**, surtout au cours des 24 à 48 premières heures"
  - "**Difficultés à respirer, modification de la voix, impossibilité d'avaler** ou sensation d'étouffement (appelez le 112 sans attendre)"
  - "**Saignement qui ne s'arrête pas** sous le pansement, ou sang augmentant rapidement dans le réservoir du drain"
  - "**Fièvre supérieure à 38,5 °C**, rougeur, douleur ou chaleur croissantes, ou écoulement de pus au niveau des incisions"
  - "**Assombrissement ou coloration violacée à noire** de la peau, ou ouverture de la plaie"
  - "Douleur soudaine et intense, ou douleur qui ne cède pas aux antalgiques"
  - "Essoufflement, douleur thoracique, ou gonflement et douleur d'une seule jambe"

lifestyle:
  - "Pendant les 2 premières semaines, dormez sur le dos, la tête surélevée ; évitez de trop fléchir le cou, les mouvements brusques de la tête et du cou et le fait de vous pencher en avant."
  - "Portez le vêtement de contention/pansement du cou pendant la durée indiquée (généralement 1 à 3 semaines)."
  - "Contrôlez régulièrement votre tension artérielle et n'oubliez pas vos médicaments ; évitez de forcer en poussant, de soulever des charges lourdes et de laisser une toux non maîtrisée."
  - "Évitez le sport intense, le sauna, le hammam et les douches chaudes pendant les 3 à 4 premières semaines."
  - "Protégez vos cicatrices du soleil pendant au moins 3 à 6 mois."
  - "Si vous venez de l'étranger, prendre l'avion est généralement sans danger une fois le drain retiré et les premiers contrôles effectués, en général à partir du 5e au 7e jour."

declarations_extra:
  - "Je comprends que l'intervention n'arrête pas le vieillissement, que le cou peut à nouveau se relâcher avec le temps et que le résultat est limité par la qualité de ma peau, mon poids et ma structure osseuse."
  - "Je comprends qu'il est important de maintenir ma tension artérielle sous contrôle et de suivre les consignes postopératoires afin de réduire le risque de saignement (hématome)."
