code: "01"
type: surgical
aesthetic: true
title: "Rhinoplastik"
alt_name: "Ästhetische Nasenkorrektur (bei Bedarf kombiniert mit einer Korrektur der Nasenatmung)"

specific_fields:
  - label: "Geplante Technik:"
    options: ["Offene Technik", "Geschlossene Technik", "Entscheidung durch den Operateur während der Operation"]
    blank: false
  - label: "Gleichzeitig durchzuführende Eingriffe:"
    options: ["Septumplastik", "Verkleinerung der Nasenmuscheln", "Keine"]
  - label: "Entnahmestelle für Knorpeltransplantat:"
    options: ["Nasenscheidewand (Septum)", "Ohr", "Rippe", "Voraussichtlich nicht erforderlich"]
  - label: "Anliegen und Erwartungen der Patientin / des Patienten:"

about:
  - "Die Rhinoplastik ist eine Operation, bei der die äußere Form der Nase neu gestaltet wird (Nasenrücken, Höcker, Nasenspitze, Nasenbreite, Nasenlöcher sowie ihre Harmonie mit dem Gesicht). Liegen eine die Atmung behindernde Verkrümmung der Nasenscheidewand (Septumdeviation), ein Einfallen der Nasenflügel oder vergrößerte Nasenmuscheln vor, können diese in derselben Operation korrigiert werden."
  - "Die Form der Nase beruht auf angeborenen Merkmalen, auf Veränderungen während des Wachstums oder auf früheren Verletzungen (Schlag, Bruch). Diese Strukturen verändern sich nicht von selbst. Ziel der Operation ist es, die gemeinsam vereinbarten **realistischen Ziele** zu erreichen und eine Nase zu erhalten, die **natürlich wirkt, zu Ihrem Gesicht passt und eine freie Atmung ermöglicht**."

procedure_intro:
  - "Die Operation wird in Vollnarkose im Operationssaal durchgeführt. Vor der Operation wird Ihre Nase untersucht und fotografiert, und die Planung wird gemeinsam mit Ihnen erstellt."
procedure_steps:
  - "**Schnittführung:** Bei der geschlossenen Technik liegen alle Schnitte im Naseninneren, von außen ist keine Narbe sichtbar. Bei der offenen Technik wird zusätzlich ein kleiner Schnitt von etwa 4–5 mm über den schmalen Hautsteg zwischen den Nasenlöchern (Kolumella) gesetzt; diese Narbe wird mit der Zeit meist kaum noch wahrnehmbar."
  - "**Formung des Nasengerüsts:** Haut und Weichteile werden behutsam abgelöst. Ist ein Höcker vorhanden, wird er an Knochen und Knorpel abgetragen oder mit höckererhaltenden Techniken korrigiert. Die Knorpel der Nasenspitze werden mit Nähten neu geformt."
  - "**Verschmälern/Begradigen der Knochen (Osteotomie):** Müssen breite oder schiefe Nasenbeine verschmälert oder begradigt werden, werden kontrollierte Knochenschnitte durchgeführt. Dieser Schritt kann die Wahrscheinlichkeit von Blutergüssen und Schwellungen erhöhen."
  - "**Stützen und Transplantate:** Damit die Nase ihre Form langfristig behält und die Atemwege offen bleiben, werden bei Bedarf Knorpelstützen (Transplantate) eingesetzt. Der Knorpel wird zunächst aus dem Naseninneren (Septum) entnommen; reicht dieser nicht aus, kann Ohr- oder Rippenknorpel verwendet werden. Dies wird vor der Operation mit Ihnen besprochen."
  - "**Funktionelle Korrektur:** Falls notwendig, wird die Nasenscheidewand (Septum) begradigt und die Nasenmuscheln werden verkleinert."
  - "**Wundverschluss und Schiene:** Die Schnitte werden mit feinen Nähten verschlossen. Auf den Nasenrücken wird eine Schutzschiene gelegt; bei Bedarf werden weiche Silikonschienen oder Tamponaden, die das Atmen ermöglichen, in die Nase eingelegt."
anesthesia: "Vollnarkose"
duration: "Etwa 2–4 Stunden"
stay: "In der Regel eine Nacht im Krankenhaus"

benefits:
  - "Eine natürlichere, ausgewogenere und besser zu Ihrem Gesicht passende Nasenform"
  - "Beseitigung einer gegebenenfalls bestehenden Nasenatmungsbehinderung und leichteres Atmen"
  - "Ein Beitrag dazu, dass Sie sich wohler fühlen"
success:
  - "Die meisten Patientinnen und Patienten sind mit dem Ergebnis zufrieden. Die Nase liegt jedoch in der Mitte des Gesichts und braucht lange, um auszuheilen; das endgültige Ergebnis zeigt sich innerhalb von **12–18 Monaten**. In Fachveröffentlichungen wird berichtet, dass bei etwa **5–15 %** der Patientinnen und Patienten eine kleinere oder umfangreichere Korrekturoperation (Revision) notwendig werden kann. Bei Nasen mit dicker Haut, nach Voroperationen oder nach schweren Verletzungen ist das Ergebnis schwerer vorherzusagen."

alternatives:
  - "**Keine Operation:** Da es sich um einen ästhetischen Eingriff handelt, haben Sie stets die Möglichkeit, ihn nicht durchführen zu lassen."
  - "**Formung der Nase mit Fillern („Nasenkorrektur ohne Operation“):** Kann einen kleinen Höcker oder eine Delle vorübergehend kaschieren; die Nase wird dadurch nicht kleiner, die Atmung verbessert sich nicht, und es bestehen eigene Risiken wie der Verschluss eines Blutgefäßes."
  - "**Nur funktionelle Operation (Septumplastik/Verkleinerung der Nasenmuscheln):** Ist ausschließlich die Atmung das Problem, kann dies ohne Veränderung der äußeren Nasenform erfolgen."
  - "**Medikamentöse Behandlung:** Nasensprays können bei einer Verstopfung durch Allergie oder Schleimhautschwellung helfen; strukturelle Fehlstellungen korrigieren sie nicht."

no_treatment:
  - "Wird die Operation nicht durchgeführt, bleibt die jetzige Form Ihrer Nase unverändert. Haben Sie Atembeschwerden mit struktureller Ursache (Verkrümmung, Einfallen der Nasenflügel), bessern sich diese nicht von selbst, stellen aber in der Regel keine akute Gefahr für Ihre Gesundheit dar."

before:
  - "Wenn Sie in den letzten 6–12 Monaten **Isotretinoin** (Aknemedikament, z. B. Roaccutan) eingenommen haben, teilen Sie uns dies bitte mit; es kann die Wundheilung der Haut beeinflussen, und der Operationszeitpunkt kann entsprechend geplant werden."
  - "Vor der Operation werden Blutuntersuchungen und bei Bedarf weitere Untersuchungen durchgeführt, und Sie werden vom Narkosearzt untersucht."
  - "Sie dürfen **6–8 Stunden** vor der Operation nichts essen und nichts trinken (bitte befolgen Sie die Anweisungen des Narkosearztes)."
  - "Tragen Sie am Operationstag kein Make-up, keinen Nagellack, keinen Schmuck und keine Kontaktlinsen. Es empfiehlt sich, dass Sie am ersten Tag nach der Operation eine Angehörige oder einen Angehörigen bzw. eine Freundin oder einen Freund bei sich haben."
  - "Bei aktiver Akne oder einer Hautinfektion im Gesicht, bei Grippe oder einem Infekt der oberen Atemwege kann die Operation verschoben werden."

recovery:
  - when: "Erste 48 Stunden"
    what: "Eine verstopfte Nase, leichtes Nachsickern, Kopfschmerzen und eine Schwellung des Gesichts sind normal. Die Schmerzen sind meist leicht bis mäßig und lassen sich mit Schmerzmitteln gut behandeln. Schlafen mit erhöhtem Kopf und kühlende Kompressen helfen, die Schwellung zu verringern. **Falls** Blutergüsse auftreten, zeigen sie sich um die Augen und klingen in 7–10 Tagen ab."
  - when: "1. Woche"
    what: "Eventuell eingelegte Silikonschienen/Tamponaden in der Nase werden in der Regel am 2.–5. Tag entfernt, die äußere Schiene und die Fäden etwa am **7. Tag**. Sie werden gebeten, das Naseninnere mit Kochsalzlösung zu spülen. Die meisten Patientinnen und Patienten nehmen Bürotätigkeiten und ihr soziales Leben innerhalb von 7–10 Tagen wieder auf."
  - when: "2.–6. Woche"
    what: "Der größte Teil der Schwellung bildet sich zurück, die Nasenspitze kann sich jedoch noch fest und leicht taub anfühlen. Anstrengender Sport, Kontaktsportarten und Schwimmen sollten für etwa **4–6 Wochen** zurückgestellt werden. Eine Brille sollte mindestens **6 Wochen** lang nicht getragen werden, es sei denn, sie wird mit Pflaster so fixiert, dass sie nicht auf den Nasenrücken drückt."
  - when: "3.–12. Monat"
    what: "Die verbleibende Schwellung, besonders an der Nasenspitze, nimmt allmählich ab. Die Form der Nase verändert sich in dieser Zeit weiter; kleine Unregelmäßigkeiten, die anfangs sichtbar sind, verschwinden meist."
  - when: "12.–18. Monat"
    what: "Das endgültige Ergebnis wird sichtbar. Wird ein Korrektureingriff (Revision) für notwendig gehalten, erfolgt er in der Regel nach einer Wartezeit von mindestens 12 Monaten."

risks:
  expected:
    - "Verstopfte Nase, leichtes Nachsickern und blutig tingierte Absonderung (in den ersten Tagen)"
    - "Schwellung des Gesichts und um die Augen; **falls** Blutergüsse auftreten, klingen sie innerhalb von 1–2 Wochen ab"
    - "Vorübergehendes Taubheitsgefühl an der Nasenspitze und den Frontzähnen; Verhärtung der Nasenspitze"
    - "Vorübergehend vermindertes Riechvermögen (bessert sich mit dem Abklingen der Schwellung)"
    - "Die Form der Nase verändert sich über Monate weiter"
  common:
    - name: "Länger anhaltende Schwellung"
      text: "Besonders bei dicker Haut kann die Schwellung der Nasenspitze ein Jahr oder länger anhalten. Bei Bedarf kann sie mit Kortisoninjektionen unterstützend behandelt werden."
    - name: "Leichte Asymmetrie und kleine Unregelmäßigkeiten"
      text: "Da das Gesicht selbst nicht vollkommen symmetrisch ist, können geringe Unterschiede an der Nase bestehen bleiben; kleine Knochen-/Knorpelvorsprünge können tastbar, aber meist nicht sichtbar sein."
    - name: "Notwendigkeit einer Revision (Korrektur)"
      text: "Bei etwa **5–15 von 100** Patientinnen und Patienten kann ein Korrektureingriff notwendig werden, der von einer kleinen Nachkorrektur bis zu einer umfangreicheren Operation reichen kann."
    - name: "Krustenbildung und Trockenheit in der Nase"
      text: "In den ersten Wochen häufig; bessert sich mit regelmäßigem Spülen und Befeuchten."
  uncommon:
    - name: "Nasenbluten"
      text: "Bei etwa **1–3 von 100** Patientinnen und Patienten kann eine Blutung auftreten, die eine Tamponade oder einen Eingriff erfordert. Sehr selten muss die Blutung im Operationssaal gestillt werden."
    - name: "Infektion"
      text: "Tritt bei **weniger als 1 bis 3 von 100** Patientinnen und Patienten auf. Sie heilt in der Regel mit Antibiotika ab; selten muss die Infektion entlastet (der Eiter abgeleitet) oder ein Transplantat entfernt werden."
    - name: "Atmung bessert sich nicht wie erwartet"
      text: "Die Nasenatmungsbehinderung kann unvollständig zurückgehen oder selten sogar zunehmen; eine weitere Behandlung oder Operation kann notwendig werden."
    - name: "Loch in der Nasenscheidewand (Perforation)"
      text: "Ein Loch in der Nasenscheidewand entsteht bei etwa **1 von 100** Patientinnen und Patienten. Oft verursacht es keine Beschwerden; führt es zu Pfeifgeräuschen, Krustenbildung oder Blutungen, kann eine Behandlung notwendig sein."
    - name: "Blut- oder Eiteransammlung in der Nasenscheidewand (Hämatom / Abszess)"
      text: "Wird am Septum operiert, tritt dies bei **weniger als 1 von 100** Patientinnen und Patienten auf. Es äußert sich in den Tagen nach der Operation durch zunehmende Nasenatmungsbehinderung, Schmerzen und Fieber. Es muss **dringend entlastet** werden, um eine Schädigung des Nasenknorpels zu vermeiden; unbehandelt kann es zu Knorpelverlust und einem Einsinken des Nasenrückens (Sattelnase) kommen, deren Korrektur eine weitere Operation erfordern kann."
    - name: "Verwachsungen in der Nase (Synechien)"
      text: "Gewebe im Naseninneren verkleben miteinander; behindern sie die Atmung, können sie mit einem einfachen Eingriff gelöst werden."
    - name: "Auffällige Narbe"
      text: "Bei der offenen Technik kann die Narbe an der Kolumella selten sichtbar bleiben; werden die Nasenlöcher verkleinert, entsteht eine feine Narbe in der Nasenflügelfalte."
    - name: "Länger anhaltendes Taubheitsgefühl"
      text: "Ein vermindertes Gefühl an der Nasenspitze oder den Frontzähnen kann mehrere Monate anhalten; selten kann es dauerhaft sein."
    - name: "Probleme mit Transplantaten"
      text: "Knorpeltransplantate können sich mit der Zeit verschieben, verbiegen, sich teilweise zurückbilden oder sich unter der Haut abzeichnen. Wird Knorpel aus dem Ohr oder der Rippe entnommen, besteht an dieser Stelle ein Risiko für Schmerzen, Narbenbildung und Blutung und bei der Rippe sehr selten für eine Verletzung des Lungenfells (Pneumothorax)."
  rare:
    - name: "Hautprobleme"
      text: "Dünner werdende Haut, Rötung, kleine sichtbare Äderchen oder vermehrtes Narbengewebe bei dicker Haut. Sehr selten kann, vor allem bei Rauchern und voroperierten Nasen, eine Durchblutungsstörung der Haut zu einer Wunde und zu Gewebeverlust führen. In diesem Fall können eine langwierige Wundbehandlung und eine wiederherstellende Operation notwendig werden, und eine bleibende Narbe oder Formveränderung kann zurückbleiben."
    - name: "Dauerhaft vermindertes oder verlorenes Riechvermögen"
      text: "Sehr selten."
    - name: "Probleme mit dem Tränenkanal und Blutung um das Auge"
      text: "Sehr selten können die Knochenschnitte zu einem tränenden Auge oder einer Blutung um das Auge führen."
    - name: "Austritt von Hirnwasser (Liquorleck), Hirnhautentzündung (Meningitis), Sehverlust"
      text: "Äußerst seltene Komplikationen, die in **weit weniger als 1 von 10.000** Fällen auftreten und durch eine Verletzung der dünnen Knochen entstehen, welche die Nase von der Schädelbasis und vom Auge trennen. Treten sie auf, können eine weitere Behandlung im Krankenhaus (manchmal auf der Intensivstation) und eine Operation notwendig werden; ein Sehverlust kann, falls er eintritt, dauerhaft sein."
    - name: "Toxisches Schocksyndrom"
      text: "Eine sehr seltene, aber schwere Erkrankung im Zusammenhang mit Nasentamponaden (plötzliches hohes Fieber, Hautausschlag, niedriger Blutdruck), die eine sofortige Behandlung erfordert. Sie muss im Krankenhaus, manchmal auf der Intensivstation, behandelt werden und kann lebensbedrohlich sein."
    - name: "Psychische Unzufriedenheit"
      text: "Trotz eines technisch gelungenen Ergebnisses kann es einem Menschen schwerfallen, sich an sein neues Aussehen zu gewöhnen. Ein offenes Gespräch über die Erwartungen vor der Operation verringert dieses Risiko."

emergency:
  - "**Nasenbluten, das nicht aufhört oder sehr stark ist**, obwohl Sie einige Minuten lang Druck ausgeübt und Eis aufgelegt haben"
  - "**Zunehmende Nasenatmungsbehinderung, starke Schmerzen und Schwellung der Nase** in den Tagen nach der Operation (kann ein Zeichen für ein Septumhämatom/einen Septumabszess sein)"
  - "**Fieber über 38,5 °C**, zunehmende Schmerzen, Rötung oder übel riechende Absonderung aus der Nase"
  - "**Plötzliches hohes Fieber, Hautausschlag, Schwindel oder Schwäche**, während Tamponaden in der Nase liegen"
  - "**Klare, wässrige Absonderung** aus der Nase, besonders wenn sie beim Vorbeugen zunimmt; oder starke Kopfschmerzen und Nackensteifigkeit"
  - "**Verschwommenes Sehen oder Doppelbilder** oder rasch zunehmende Schwellung und Schmerzen um das Auge"
  - "Ein Schlag auf die Nase oder eine plötzliche Veränderung ihrer Form"
  - "Atemnot oder Schmerzen in der Brust"

lifestyle:
  - "Schnäuzen Sie sich in den ersten 2 Wochen nicht; wenn Sie niesen müssen, niesen Sie mit offenem Mund."
  - "Reinigen Sie das Naseninnere so, wie es Ihnen gezeigt wurde, und so oft wie empfohlen."
  - "Vermeiden Sie mindestens 6 Wochen lang Stöße gegen die Nase, eine auf dem Nasenrücken aufliegende Brille und das Schlafen in Bauchlage."
  - "Schützen Sie die Haut Ihrer Nase mindestens 3 Monate lang vor der Sonne (Sonnenschutzmittel mit hohem Lichtschutzfaktor, Hut)."
  - "Wenn Sie aus dem Ausland angereist sind, ist ein Flug in der Regel nach Entfernung der Schiene (etwa am 7. Tag) unbedenklich."

declarations_extra:
  - "Mir ist bewusst, dass der Vergleich meiner Fotos vor und nach der Operation Teil der Beurteilung des Ergebnisses ist und dass Computersimulationen oder Beispielfotos nur eine Vorstellung vermitteln sollen und kein Ergebnis garantieren."
