code: "08"
type: surgical
aesthetic: false
title: "Отстраняване на подчелюстната слюнчена жлеза"
alt_name: "Екстирпация на субмандибуларната жлеза"

specific_fields:
  - label: "Страна:"
    options: ["Дясна", "Лява"]
    blank: false
  - label: "Причина за операцията:"
    options: ["Слюнчен камък / повтарящо се възпаление", "Образувание в жлезата", "Друго"]
  - label: "Невромониторинг:"
    options: ["Ще се използва", "Няма да се използва"]
    blank: false
  - label: "Резултат от образно изследване / биопсия:"

about:
  - "Подчелюстната (субмандибуларна) жлеза е слюнчена жлеза, разположена непосредствено под долната челюст от двете страни, която отделя слюнка в устата. Тя произвежда значителна част от слюнката; тъй като обаче жлезата от другата страна и слюнчените жлези пред ушите и под езика продължават да работят, **отстраняването на една жлеза при повечето пациенти не води до сухота в устата**."
  - "Тази операция най-често се извършва поради **камъни в слюнчената жлеза** и причинените от тях **повтарящи се отоци и възпаления**. Камъкът пречи на изтичането на слюнката в устата, което води до болезнен оток под челюстта по време на хранене и до повтарящи се инфекции. По-рядко операция се налага поради **образувание (тумор)** в жлезата. Делът на злокачествените тумори при образуванията на подчелюстната жлеза е по-висок, отколкото при околоушната жлеза; затова отстраняването на жлезата и хистологичното ѝ изследване са важни за поставяне на окончателна диагноза."
  - "В близост до жлезата преминават нервното клонче, което движи долната устна, нервът, който осигурява чувствителността на езика, и нервът, който движи езика. Целта на операцията е жлезата да бъде отстранена напълно, като тези нерви се запазят."

procedure_intro:
  - "Операцията се извършва под обща анестезия в операционна зала."
procedure_steps:
  - "**Разрез:** На около 2–3 см под долночелюстната кост, успоредно на естествена кожна гънка на шията, се прави разрез, обикновено с дължина 4–6 см. Разполагането на разреза достатъчно ниско под челюстта помага да се запази нервното клонче, което движи долната устна."
  - "**Запазване на нервите:** Преминава се тънкият мускулен слой под кожата (платизма). Нервното клонче, което движи долната устна (маргиналният мандибуларен клон на лицевия нерв), се запазва, като се открие и проследи или като се работи в безопасен тъканен слой."
  - "**Отстраняване на жлезата:** Жлезата се отделя от околните тъкани, а кръвоносните съдове, които я кръвоснабдяват, се подвързват. Слюнченият канал внимателно се отделя от нерва, осигуряващ чувствителността на езика (езичния нерв), след което се подвързва и прерязва. Нервът, който движи езика (подезичният нерв), се запазва. Ако в канала има камък, се отстранява и колкото е възможно по-голяма част от далечния участък на канала."
  - "**Хистологично изследване:** Отстранената жлеза се изпраща за хистологично изследване; резултатът обикновено е готов до 1–2 седмици."
  - "**Затваряне:** Извършва се контрол на кървенето, обикновено се поставя тънък **дрен** и кожата се зашива с козметичен шев."
procedure_notes:
  - "Ако в устата има камък близо до мястото, където каналът се отваря, понякога той може да бъде отстранен и отделно през устата. Това ще бъде обсъдено с вас преди операцията."
anesthesia: "Обща анестезия"
duration: "Около 1–2 часа"
stay: "Обикновено една нощ в болница; изписване след премахване на дрена"

benefits:
  - "Прекратяване на повтарящите се болезнени отоци и възпаления, причинени от камъни"
  - "Отпадане на нуждата от многократни курсове с антибиотици"
  - "Отстраняване на образуванието в жлезата и поставяне на окончателна диагноза"
success:
  - "След операция поради камъни и хронично възпаление оплакванията изчезват напълно при **над 90%** от пациентите. Ако в останалата в устата част от канала остане или се образува нов камък, рядко отокът на пода на устата може да продължи. При доброкачествени образувания операцията обикновено води до трайно излекуване; при злокачествени тумори може да е необходимо допълнително лечение."

alternatives:
  - "**Медикаментозно и поддържащо лечение:** Обилен прием на течности, кисели бонбони за стимулиране на слюноотделянето, масаж, топли компреси и антибиотици при възпаление. Може да облекчи оплакванията, но не премахва камъка."
  - "**Отстраняване на камъка през устата:** Камъни, които могат да се напипат в частта от канала близо до устата, могат да бъдат отстранени чрез малък разрез в устата, като жлезата се запазва."
  - "**Ендоскопия на слюнчения канал (сиалендоскопия):** Камъни с подходящ размер и разположение могат да бъдат отстранени отвътре през канала с тънък ендоскоп; методът не е достъпен навсякъде и не е подходящ за всеки камък."
  - "**Наблюдение:** При малки образувания, смятани за доброкачествени, рядко може да се обсъди наблюдение; за окончателна диагноза при тази жлеза обаче обикновено се препоръчва операция."

no_treatment:
  - "Без операция отоците и възпаленията, причинени от камъни, могат да продължат да се повтарят; рядко около жлезата може да се развие абсцес (гнойна колекция), който налага спешно лечение. Ако в жлезата има образувание, окончателна диагноза не може да бъде поставена; нелекуваният злокачествен тумор може да прогресира."

before:
  - "Преди операцията се извършват кръвни изследвания и образни изследвания (ехография и при нужда КТ/ЯМР); ще бъдете прегледани от анестезиолог."
  - "Не трябва да ядете и пиете нищо **6–8 часа** преди операцията (следвайте указанията на анестезиолога)."
  - "Ако жлезата е активно възпалена, операцията обикновено се планира след излекуване на възпалението."
  - "При мъжете брадата в зоната на разреза може да бъде скъсена в деня на операцията."

recovery:
  - when: "Първите 24–48 часа"
    what: "Под челюстта ще има лека до умерена болка, опъване и оток, които се овладяват с обезболяващи. Преглъщането може да е леко неприятно. Дренът обикновено се премахва на 1-вия ден. Препоръчва се да спите с повдигната глава. Можете веднага да започнете да се храните с мека храна."
  - when: "1-ва седмица"
    what: "Можете да се върнете към ежедневните си занимания. Конците обикновено се свалят на **5–7-ия ден**. Изтръпването над разреза, по ръба на челюстта и около разреза е нормално. Хистологичният резултат ще бъде обсъден с вас в този период или малко след това."
  - when: "2–4-та седмица"
    what: "Повечето хора се връщат на офис работа до 1 седмица. Тежките физически натоварвания и вдигането на тежести трябва да се отложат за около **2 седмици**. Втвърдяването и лекият оток в областта на разреза постепенно намаляват."
  - when: "2–6-и месец"
    what: "Белегът постепенно избледнява и често става незабележим в гънката на шията. Ако е имало временна слабост на нерв или намалена чувствителност, обикновено те се възстановяват в този период."

risks:
  expected:
    - "Болка, опъване и оток под челюстта; лек дискомфорт при преглъщане"
    - "Изтръпване на кожата около и под разреза"
    - "Белег на шията (избледнява с времето)"
  common:
    - name: "Временна слабост на долната устна"
      text: "Поради разтягането по време на операцията на нервното клонче, което дърпа долната устна надолу (маргиналния мандибуларен клон), при около **10–20 от 100** пациенти се наблюдава лека асиметрия на долната устна от тази страна при усмивка или говор. Това е предимно козметичен проблем, обикновено не пречи на храненето и пиенето и в повечето случаи **отзвучава за седмици до няколко месеца**."
    - name: "Втвърдяване и изтръпване в областта на разреза"
      text: "Втвърдяването и намалената чувствителност под разреза са чести през първите седмици и намаляват в рамките на месеци."
  uncommon:
    - name: "Кървене и хематом"
      text: "При около **1–3 от 100** пациенти под кожата може да се събере кръв. Ако хематомът е голям, може да се наложи да бъде отстранен и кървенето да бъде спряно в операционна зала."
    - name: "Инфекция на раната"
      text: "Може да се появи при **1–3 от 100** пациенти, особено ако жлезата е била възпалена; обикновено отзвучава с антибиотици, рядко е необходимо дрениране."
    - name: "Намалена чувствителност на едната половина на езика"
      text: "Поради засягане на нерва, който осигурява чувствителността на езика (езичния нерв), изтръпване или мравучкане на езика от тази страна се появява при около **1–3 от 100** пациенти. Най-често е временно; рядко може да бъде трайно и да засегне и вкуса."
    - name: "Събиране на течност (серома)"
      text: "Събиране на течност под разреза; обикновено отзвучава с пункция и компресивна превръзка."
    - name: "Остатъчен камък в канала"
      text: "В останалата в устата част от слюнчения канал може да остане или да се образува нов камък, който да причини оток или възпаление на пода на устата. При нужда се отстранява с малка процедура през устата."
    - name: "Забележим или задебелен белег"
      text: "В зависимост от индивидуалната склонност белегът може да задебелее или да остане забележим; могат да се приложат методи за лечение на белези."
    - name: "Хлътване под челюстта"
      text: "На мястото на жлезата може да се получи леко хлътване и разлика между двете страни; обикновено не е забележимо."
  rare:
    - name: "Трайна слабост на долната устна"
      text: "При **около 1–3 от 100** пациенти или по-малко може да остане трайно ограничено движение на долната устна от тази страна и асиметрична усмивка. Ако е забележимо, може да се приложи лечение, например ботулинов токсин за балансиране на другата страна."
    - name: "Слабост в движенията на езика"
      text: "Увреждането на нерва, който движи езика (подезичния нерв), е **много рядко**. Ако настъпи, може да има слабост на езика от тази страна и затруднения в говора и преглъщането; при трайно увреждане може да е необходима логопедична терапия и рехабилитация на гълтането."
    - name: "Голям хематом на шията, засягащ дихателните пътища"
      text: "Много рядко бързо нарастващ кръвоизлив може да притисне шията и да предизвика затруднено преглъщане или **дишане**. Това е спешно състояние; хематомът трябва незабавно да бъде отстранен в операционна зала, а рядко се налага осигуряване на дихателните пътища (интубация или трахеостомия)."
    - name: "Окончателен хистологичен резултат, различен от предварителната диагноза"
      text: "Дори при жлеза, за която се смята, че има камъни или възпаление, окончателното хистологично изследване може да установи неочакван тумор. Ако се установи злокачествен тумор, може да е необходимо допълнително лечение, например отстраняване на шийните лимфни възли или лъчетерапия."
    - name: "Сухота в устата"
      text: "Отстраняването на една жлеза при повечето пациенти остава незабелязано; сухотата в устата обаче може да стане забележима при пациенти, преминали лъчетерапия, с някои ревматологични заболявания или приемащи лекарства, които причиняват сухота в устата."

emergency:
  - "**Бързо нарастващ оток на шията**, особено придружен от **затруднено дишане или преглъщане** (спешен случай — обадете се незабавно на 112)"
  - "**Кървене, което не спира**, от дрена или раната"
  - "**Температура над 38,5 °C**, нарастващо зачервяване, болка, затопляне или гнойна секреция от раната"
  - "Изразен оток на езика или пода на устата"
  - "**Новопоявило се изразено затруднение** при говор или преглъщане"

lifestyle:
  - "Не мокрете раната през първите 48 часа; след това можете да вземете кратък душ според указанията."
  - "През първите дни предпочитайте мека, хладка храна; поддържайте добра хигиена на устата и пийте много течности."
  - "Пазете белега от слънце поне 6 месеца (слънцезащитен крем с висок фактор)."
  - "Задължително обсъдете хистологичния резултат и плана за проследяване с лекаря си."

declarations_extra:
  - "Разбирам, че окончателната диагноза ще бъде поставена от хистологичното изследване след операцията и че в зависимост от резултата може да е необходимо допълнително лечение."
