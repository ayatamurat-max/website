code: "15"
type: office
aesthetic: true
title: "Traitement par produit de comblement (acide hyaluronique)"
alt_name: "Injection d'acide hyaluronique pour la perte de volume, les contours et les rides du visage"

specific_fields:
  - label: "Nom du produit / marque :"
  - label: "Numéro de LOT et date de péremption :"
  - label: "Quantité totale (mL) :"
  - label: "Zones traitées :"
    options: ["Lèvres", "Sillons nasogéniens", "Joues / pommettes", "Menton", "Ligne de la mâchoire", "Cernes (vallée des larmes)", "Nez", "Autre"]
  - label: "Instrument d'injection :"
    options: ["Aiguille", "Canule", "Les deux"]

about:
  - "L'acide hyaluronique est une substance naturellement présente dans notre peau ; il retient l'eau et donne aux tissus leur volume. Les produits de comblement sont une forme gel de cette substance, fabriquée en laboratoire. Ils sont utilisés pour **restaurer le volume** perdu avec l'âge, pour **redessiner les contours** des lèvres, des joues, du menton et de la ligne de la mâchoire, ou pour adoucir les **rides et les creux**."
  - "La perte de volume et les rides du visage apparaissent sous l'effet du vieillissement, des modifications des os et du tissu graisseux, de la perte de poids, de l'exposition au soleil et de facteurs génétiques. L'effet du produit de comblement à l'acide hyaluronique est **temporaire** ; il est progressivement résorbé par l'organisme. **Aucun produit de comblement permanent n'est utilisé dans notre cabinet.**"

procedure_intro:
  - "Le traitement est réalisé au cabinet. Votre visage est d'abord évalué, vos attentes sont discutées, un plan de traitement est établi et des photographies sont prises avant le traitement."
procedure_steps:
  - "**Préparation :** le maquillage est retiré et la peau est nettoyée avec une solution antiseptique. Une crème anesthésiante peut être appliquée pour votre confort ; la plupart des produits de comblement contiennent également un anesthésique local (lidocaïne)."
  - "**Injection :** le gel est injecté lentement et en petites quantités, à la profondeur et dans la zone prévues, à l'aide d'une aiguille fine ou d'une canule souple à bout mousse. Des techniques sûres sont utilisées pour réduire le risque d'injection dans un vaisseau sanguin."
  - "**Modelage :** si nécessaire, le produit est délicatement modelé avec les doigts ; le résultat est évalué avec vous devant le miroir."
  - "**Traçabilité :** le nom du produit, le numéro de LOT, la quantité et les zones traitées sont consignés dans votre dossier. Une carte/étiquette mentionnant les informations sur le produit peut vous être remise ; nous vous recommandons de la conserver."
procedure_notes:
  - "Un avantage important du produit de comblement à l'acide hyaluronique en matière de sécurité est qu'il peut, si nécessaire, être dissous à l'aide d'une enzyme appelée **hyaluronidase**. Ce médicament et le matériel d'urgence sont toujours tenus prêts dans notre cabinet."
anesthesia: "Crème anesthésiante et/ou anesthésique local contenu dans le produit"
duration: "Environ 20–45 minutes"
stay: "Le jour même ; 15–30 minutes de surveillance après le traitement"

benefits:
  - "Restauration du volume perdu, pour un aspect plus frais et plus équilibré"
  - "Contours des lèvres, des joues, du menton et de la ligne de la mâchoire plus nets et plus harmonieux"
  - "Adoucissement des rides et des creux"
  - "Un résultat visible immédiatement et un retour rapide à la vie quotidienne"
success:
  - "Le résultat est visible immédiatement après le traitement et peut être apprécié plus nettement une fois le gonflement résorbé, vers **2 semaines**. Selon le produit, la zone et votre métabolisme, l'effet dure généralement **6–18 mois** (moins longtemps dans les lèvres, plus longtemps dans les joues et le menton). Pour maintenir le résultat, le traitement doit être renouvelé à intervalles réguliers. En cas de relâchement cutané marqué, l'amélioration possible avec un produit de comblement peut être limitée."

alternatives:
  - "**Absence de traitement :** s'agissant d'une intervention esthétique, vous avez toujours la possibilité de ne pas la réaliser."
  - "**Toxine botulique :** plus adaptée aux rides dues aux mouvements du visage qu'à celles dues à une perte de volume."
  - "**Rajeunissement cutané :** la mésothérapie, le PRP, les peelings ou le laser peuvent améliorer la qualité de la peau, mais n'apportent pas de volume."
  - "**Transfert de graisse (à partir de votre propre graisse) :** peut durer plus longtemps ; nécessite un petit geste chirurgical."
  - "**Chirurgie :** un lifting du visage, une chirurgie des paupières, un implant de menton ou une rhinoplastie peuvent apporter un changement plus marqué ou permanent."

no_treatment:
  - "Si le traitement n'est pas réalisé, votre visage continuera d'évoluer avec le vieillissement naturel. Cela ne représente pas de danger pour votre santé."

before:
  - "Le traitement **n'est pas réalisé, ou est reporté,** dans les situations suivantes : grossesse, allaitement, acné active, bouton de fièvre (herpès labial) ou infection dans la zone à traiter, allergie connue au produit ou à la lidocaïne, antécédent de réaction allergique grave (anaphylaxie), ou maladie auto-immune non contrôlée. Veuillez nous signaler si l'une de ces situations vous concerne."
  - "Signalez-nous si vous avez déjà reçu **un produit de comblement, quel qu'il soit,** dans la même zone (en particulier un produit permanent ou de nature inconnue), des fils ou des implants."
  - "Dans la mesure du possible, évitez les soins dentaires, les vaccinations ou toute autre intervention chirurgicale programmée pendant les **2 semaines qui précèdent et les 2 semaines qui suivent** le traitement, car ils peuvent augmenter le risque de réaction inflammatoire retardée. Si vous devez en avoir, veuillez nous en informer."
  - "Si vous avez un événement social important, prévoyez le traitement au moins 2 semaines avant, en raison d'un éventuel gonflement et d'ecchymoses."

recovery:
  - when: "Premières 24 heures"
    what: "Un gonflement, une sensibilité et une rougeur apparaissent dans la zone ; une compresse froide soulage. Ne massez pas et n'appuyez pas sur la zone. Évitez le maquillage, le sauna, le sport intense et l'alcool. Le gonflement est plus marqué après un comblement des lèvres."
  - when: "Jours 2–7"
    what: "Le gonflement diminue en grande partie. **Si** des ecchymoses apparaissent, elles s'estompent en 5–10 jours. De petites zones fermes peuvent être perçues au toucher ; la plupart s'assouplissent d'elles-mêmes. Évitez de dormir sur le ventre et les massages du visage."
  - when: "2e semaine"
    what: "Le résultat se stabilise. Un contrôle est organisé si nécessaire ; en cas d'asymétrie ou de correction insuffisante, une petite injection complémentaire peut être prévue après évaluation par le médecin."
  - when: "Mois 6–18"
    what: "Le produit est progressivement résorbé. Le moment du renouvellement du traitement est planifié avec vous."

risks:
  expected:
    - "Légère douleur, rougeur et sensibilité aux points d'injection"
    - "Gonflement (peut être marqué pendant quelques jours, en particulier au niveau des lèvres et sous les yeux)"
    - "Ecchymoses ; **si** elles apparaissent, elles s'estompent en 1–2 semaines"
    - "Petites zones fermes perceptibles au toucher (s'assouplissent généralement en quelques semaines)"
  common:
    - name: "Légère asymétrie ou volume plus ou moins important que prévu"
      text: "Les deux moitiés du visage sont naturellement différentes ; de petites différences peuvent persister. Elles peuvent être corrigées lors du contrôle par une injection complémentaire ou par de la hyaluronidase."
    - name: "Gonflement prolongé"
      text: "En particulier sous les yeux, le gonflement peut durer plusieurs semaines chez certaines personnes."
  uncommon:
    - name: "Induration persistante ou nodules (grosseurs)"
      text: "Peuvent se former lorsque le produit s'accumule en un endroit. Peuvent être traités par massage, hyaluronidase ou d'autres traitements."
    - name: "Coloration bleutée (effet Tyndall)"
      text: "Peut être observée lorsque le produit est injecté trop près de la surface, en particulier dans la peau fine sous les yeux ; elle peut être corrigée par de la hyaluronidase."
    - name: "Déplacement du produit (migration)"
      text: "Avec le temps, le produit peut se déplacer vers une zone voisine (par ex. au-dessus du contour de la lèvre) ; il peut être dissous si nécessaire."
    - name: "Infection et biofilm"
      text: "Rarement, une rougeur, une chaleur, une douleur ou un abcès peuvent apparaître au niveau de la zone traitée. Des antibiotiques et, si nécessaire, la dissolution du produit et un drainage peuvent être nécessaires. Si une couche de bactéries (biofilm) se forme autour du produit, l'inflammation peut récidiver et le traitement peut être long."
    - name: "Réaction inflammatoire retardée"
      text: "**Des semaines, voire des mois** après le traitement, souvent à la suite d'une stimulation du système immunitaire comme une grippe, des soins dentaires ou une vaccination, un gonflement douloureux et une rougeur peuvent apparaître dans la zone comblée (chez **moins de 1 patient sur 100**). Elle s'améliore avec un traitement médicamenteux et, si nécessaire, la dissolution du produit."
    - name: "Réactivation de l'herpès labial (bouton de fièvre)"
      text: "Peut survenir, en particulier après un traitement des lèvres ; si vous avez déjà eu des boutons de fièvre, un traitement préventif peut vous être prescrit."
  rare:
    - name: "Obstruction d'un vaisseau sanguin (occlusion vasculaire)"
      text: "Il s'agit du risque le plus important des produits de comblement. Si le produit pénètre dans un vaisseau sanguin ou le comprime de l'extérieur, la vascularisation de la zone concernée peut être compromise. Elle est rapportée dans les publications dans environ **1 traitement sur 1 000 à 1 sur 10 000** ; le risque est plus élevé au niveau du **nez, de l'espace entre les sourcils et des sillons nasogéniens**. Signes : **douleur intense** pendant ou après le traitement, **blanchiment** de la peau, suivi d'une **coloration violacée et sombre, en réseau** et d'une sensation de froid. Si elle n'est pas reconnue tôt et traitée immédiatement, elle peut entraîner une **ulcération de la peau et une perte de tissu (nécrose)**, une cicatrice permanente et une déformation."
    - name: "Traitement d'urgence : la hyaluronidase"
      text: "En cas de suspicion d'occlusion vasculaire, le traitement est immédiatement interrompu et une dose élevée de **hyaluronidase** est injectée pour dissoudre le produit, en association avec des compresses chaudes, des massages et un traitement médicamenteux. Ce traitement est généralement efficace, mais **il ne permet pas toujours de réparer complètement** les dommages. La hyaluronidase elle-même peut très rarement provoquer une réaction allergique. Un transfert à l'hôpital, des soins de plaie, un traitement prolongé ou des interventions correctrices ultérieures peuvent être nécessaires."
    - name: "Perte de la vue et accident vasculaire cérébral"
      text: "Bien que cela soit extrêmement rare, si le produit atteint les vaisseaux sanguins qui irriguent l'œil ou le cerveau, il peut provoquer une **perte de la vue partielle ou totale et définitive** ou un **accident vasculaire cérébral (AVC)**. Ce risque est le plus souvent associé au traitement du nez et de l'espace entre les sourcils. Dans cette situation, **chaque minute compte** ; vous serez transféré(e) à l'hôpital pour une évaluation ophtalmologique et neurologique en urgence."
    - name: "Réaction allergique grave"
      text: "Une réaction allergique sévère (anaphylaxie) à l'acide hyaluronique ou à la lidocaïne est extrêmement rare ; elle nécessite un traitement en urgence."
    - name: "Granulome"
      text: "L'organisme forme des nodules fermes et inflammatoires en réaction au produit ; cela est très rare et peut nécessiter un traitement de longue durée."

emergency:
  - "**Douleur intense** après le traitement, qui ne s'atténue pas ou qui ne cesse d'augmenter"
  - "**Blanchiment, ou coloration violacée et sombre, en réseau (marbrée)** de la peau, sensation de froid, cloques ou plaie"
  - "**Vision floue ou perte de la vue**, douleur oculaire ou vision double — **chaque minute compte** : appelez immédiatement ou rendez-vous aux urgences les plus proches"
  - "**Maux de tête violents, troubles de la parole, faiblesse du visage, d'un bras ou d'une jambe** d'apparition soudaine (signes d'AVC) — appelez immédiatement le 112"
  - "Gonflement d'apparition rapide du visage, des lèvres ou de la langue, urticaire ou essoufflement"
  - "Fièvre, rougeur, chaleur et induration/gonflement croissants (même plusieurs semaines après)"

lifestyle:
  - "Évitez le maquillage, le sauna, le hammam, le sport intense et l'alcool pendant les 24 premières heures ; évitez de masser la zone, les soins du visage et de dormir sur le ventre pendant les 2 premières semaines."
  - "Protégez la zone du soleil, des cabines de bronzage (UV) et du grand froid pendant les 2 premières semaines."
  - "Si un autre médecin intervient à l'avenir sur votre visage (produit de comblement, laser, chirurgie, soins dentaires), informez-le que vous avez reçu un produit de comblement et indiquez-lui le nom du produit."

declarations_extra:
  - "Il m'a été expliqué qu'il existe un risque d'occlusion vasculaire et de lésions cutanées qui en résultent et, bien que très rarement, de perte de la vue et d'accident vasculaire cérébral ; quel traitement d'urgence (hyaluronidase) serait administré dans ce cas ; et que ce traitement peut ne pas toujours être pleinement efficace."
  - "Je comprends que l'effet du produit de comblement est temporaire et qu'aucun produit de comblement permanent n'est utilisé dans ce cabinet, et je déclare avoir signalé de manière complète tous mes traitements antérieurs par produit de comblement ou implant."
