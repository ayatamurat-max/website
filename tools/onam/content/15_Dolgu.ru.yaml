code: "15"
type: office
aesthetic: true
title: "Контурная пластика филлерами (гиалуроновая кислота)"
alt_name: "Инъекции гиалуроновой кислоты при потере объёма лица, для коррекции контуров и морщин"

specific_fields:
  - label: "Название препарата / марка:"
  - label: "Номер серии (LOT) и срок годности:"
  - label: "Общий объём (мл):"
  - label: "Зоны введения:"
    options: ["Губы", "Носогубные складки", "Щёки / скулы", "Подбородок", "Линия нижней челюсти", "Подглазничная область (носослёзная борозда)", "Нос", "Другое"]
  - label: "Инструмент для введения:"
    options: ["Игла", "Канюля", "Оба"]

about:
  - "Гиалуроновая кислота — вещество, которое в естественном виде содержится в нашей коже; оно удерживает воду и придаёт тканям упругость и объём. Препараты-филлеры представляют собой полученную в лаборатории гелевую форму этого вещества. Их применяют, чтобы **восполнить объём**, утраченный с возрастом, **подчеркнуть контур** губ, щёк, подбородка и линии нижней челюсти или смягчить **морщины и впадины**."
  - "Потеря объёма и морщины на лице развиваются вследствие старения, изменений костной и жировой ткани, потери веса, воздействия солнца и генетических особенностей. Эффект филлера на основе гиалуроновой кислоты **временный**; он постепенно рассасывается организмом. **Перманентные (нерассасывающиеся) филлеры в нашей клинике не используются.**"

procedure_intro:
  - "Процедура проводится в клинике. Сначала оценивается ваше лицо, обсуждаются ваши ожидания, составляется план процедуры, и перед её началом делаются фотографии."
procedure_steps:
  - "**Подготовка:** Снимается макияж, кожа обрабатывается антисептическим раствором. Для вашего комфорта может быть нанесён обезболивающий крем; кроме того, большинство филлеров содержат местный анестетик (лидокаин)."
  - "**Введение:** Гель вводится медленно и небольшими порциями на запланированную глубину и в запланированную зону с помощью тонкой иглы или гибкой канюли с тупым концом. Для снижения риска попадания препарата в кровеносный сосуд используются безопасные техники."
  - "**Моделирование:** При необходимости препарат бережно распределяют пальцами; результат оценивается вместе с вами перед зеркалом."
  - "**Запись:** Название препарата, номер серии (LOT), объём и зоны введения записываются в вашу медицинскую карту. Вам могут выдать карточку/этикетку с данными о препарате; рекомендуем её сохранить."
procedure_notes:
  - "Важное преимущество филлеров на основе гиалуроновой кислоты с точки зрения безопасности состоит в том, что при необходимости их можно растворить ферментом под названием **гиалуронидаза**. Этот препарат и средства для оказания неотложной помощи всегда есть в нашей клинике."
anesthesia: "Обезболивающий крем и/или местный анестетик, содержащийся в препарате"
duration: "Около 20–45 минут"
stay: "В тот же день; после процедуры — наблюдение в течение 15–30 минут"

benefits:
  - "Восполнение утраченного объёма, более свежий и гармоничный вид лица"
  - "Более чёткие и гармоничные контуры губ, щёк, подбородка и линии нижней челюсти"
  - "Смягчение морщин и впадин"
  - "Результат виден сразу, к повседневной жизни можно быстро вернуться"
success:
  - "Результат виден сразу после процедуры; точнее его можно оценить после того, как спадёт отёк, примерно через **2 недели**. В зависимости от препарата, зоны и особенностей обмена веществ эффект обычно сохраняется **6–18 месяцев** (в губах — меньше, в щеках и подбородке — дольше). Чтобы сохранять результат, процедуру необходимо повторять с определёнными интервалами. При выраженном провисании кожи улучшение, которого можно достичь филлером, может быть ограниченным."

alternatives:
  - "**Отказ от процедуры:** Поскольку это эстетическая процедура, у вас всегда есть возможность от неё отказаться."
  - "**Ботулинотоксин:** Больше подходит для морщин, вызванных не потерей объёма, а мимическими движениями."
  - "**Методы омоложения кожи:** Мезотерапия, PRP, пилинги или лазер могут улучшить качество кожи, но объёма не добавляют."
  - "**Пересадка жира (липофилинг собственным жиром):** Эффект может сохраняться дольше; требуется небольшое хирургическое вмешательство."
  - "**Хирургические методы:** Подтяжка лица, операция на веках, имплантат подбородка или ринопластика могут дать более выраженное или постоянное изменение."

no_treatment:
  - "Если процедура не проводится, ваше лицо будет продолжать меняться в ходе естественного старения. Это не представляет опасности для вашего здоровья."

before:
  - "Процедура **не проводится или откладывается** в следующих случаях: беременность, кормление грудью, активные угри (акне), герпес на губах или инфекция в зоне введения, известная аллергия на препарат или лидокаин, тяжёлые аллергические реакции (анафилаксия) в анамнезе, неконтролируемое аутоиммунное заболевание. Пожалуйста, обязательно сообщите нам, если что-либо из этого относится к вам."
  - "Сообщите нам, если ранее в ту же зону вводили **какой-либо филлер** (особенно перманентный или неизвестного типа), устанавливали нити или имплантаты."
  - "По возможности избегайте лечения зубов, вакцинации или других плановых хирургических вмешательств в течение **2 недель до и 2 недель после** процедуры, так как это может повысить риск отсроченной воспалительной реакции. Если они вам необходимы, пожалуйста, сообщите нам."
  - "Если у вас запланировано важное мероприятие, из-за возможного отёка и синяков планируйте процедуру не позднее чем за 2 недели до него."

recovery:
  - when: "Первые 24 часа"
    what: "В зоне введения возникают отёк, чувствительность и покраснение; холодный компресс облегчает состояние. Не массируйте и не надавливайте на эту зону. Избегайте макияжа, сауны, интенсивных физических нагрузок и алкоголя. После увеличения губ отёк более выражен."
  - when: "2–7-й день"
    what: "Отёк в основном спадает. Синяки, **если они появятся**, проходят в течение 5–10 дней. Могут прощупываться небольшие уплотнения; большинство из них размягчаются самостоятельно. Не спите лицом вниз и избегайте массажа лица."
  - when: "2-я неделя"
    what: "Результат стабилизируется. При необходимости проводится контрольный осмотр; при асимметрии или недостаточной коррекции после оценки врача может быть запланирована небольшая дополнительная процедура."
  - when: "6–18-й месяц"
    what: "Препарат постепенно рассасывается. Время повторной процедуры планируется вместе с вами."

risks:
  expected:
    - "Лёгкая боль, покраснение и чувствительность в местах уколов"
    - "Отёк (может быть выраженным в течение нескольких дней, особенно в области губ и под глазами)"
    - "Синяки; **если они появятся**, проходят в течение 1–2 недель"
    - "Небольшие прощупываемые уплотнения (обычно размягчаются в течение нескольких недель)"
  common:
    - name: "Лёгкая асимметрия или больший/меньший объём, чем ожидалось"
      text: "Две половины лица от природы различаются; небольшая разница может сохраниться. Её можно исправить на контрольном осмотре дополнительным введением филлера или гиалуронидазой."
    - name: "Длительный отёк"
      text: "Особенно под глазами у некоторых людей отёк может сохраняться неделями."
  uncommon:
    - name: "Стойкое уплотнение или узелки (бугорки)"
      text: "Могут образоваться при скоплении препарата в одном месте. Устраняются массажем, гиалуронидазой или другими методами лечения."
    - name: "Голубоватое окрашивание (эффект Тиндаля)"
      text: "Может появиться, если препарат введён слишком близко к поверхности кожи, особенно в тонкой коже под глазами; исправляется гиалуронидазой."
    - name: "Смещение препарата (миграция)"
      text: "Со временем препарат может сместиться в соседнюю область (например, выше контура губ); при необходимости его растворяют."
    - name: "Инфекция и биоплёнка"
      text: "В редких случаях в зоне введения могут развиться покраснение, жар, боль или абсцесс. Может потребоваться лечение антибиотиками, а при необходимости — растворение филлера и дренирование. Если вокруг препарата образуется слой бактерий (биоплёнка), воспаление может повторяться, а лечение — занять много времени."
    - name: "Отсроченная воспалительная реакция"
      text: "Через **несколько недель или даже месяцев** после процедуры, чаще всего после иммунного «толчка», например гриппа, лечения зубов или вакцинации, в зоне филлера может развиться болезненный отёк и покраснение (**менее чем у 1 из 100** пациентов). Состояние улучшается при медикаментозном лечении и, при необходимости, после растворения филлера."
    - name: "Обострение герпеса на губах"
      text: "Может возникнуть, особенно после введения в губы; если у вас ранее был герпес на губах, могут быть назначены профилактические препараты."
  rare:
    - name: "Закупорка кровеносного сосуда (сосудистая окклюзия)"
      text: "Это самый важный риск при введении филлеров. Если препарат попадает в кровеносный сосуд или сдавливает его снаружи, кровоснабжение этой области может нарушиться. По опубликованным данным, это происходит примерно в **1 случае на 1 000 – 10 000 процедур**; риск выше в области **носа, межбровья и носогубных складок**. Признаки: **сильная боль** во время или после процедуры, **побледнение** кожи, а затем **синюшно-багровое сетчатое окрашивание** и похолодание. Если это не распознать рано и не начать лечение немедленно, могут развиться **повреждение кожи и гибель тканей (некроз)**, стойкие рубцы и деформация."
    - name: "Неотложное лечение: гиалуронидаза"
      text: "При подозрении на сосудистую окклюзию процедуру немедленно прекращают и для растворения филлера вводят высокую дозу **гиалуронидазы**; кроме того, применяют тёплые компрессы, массаж и медикаментозное лечение. Такое лечение обычно эффективно, но **не всегда может полностью устранить** повреждение. Сама гиалуронидаза очень редко может вызвать аллергическую реакцию. Может потребоваться направление в больницу, уход за раной, длительное лечение или последующие корректирующие процедуры."
    - name: "Потеря зрения и инсульт"
      text: "Хотя это случается крайне редко, попадание препарата в сосуды, питающие глаз или головной мозг, может привести к **частичной или полной стойкой потере зрения** или к **инсульту**. Чаще всего это связано с введением в область носа и межбровья. В такой ситуации **важна каждая минута**; вас направят в больницу для экстренного обследования у офтальмолога и невролога."
    - name: "Тяжёлая аллергическая реакция"
      text: "Тяжёлая аллергическая реакция (анафилаксия) на гиалуроновую кислоту или лидокаин встречается крайне редко; она требует неотложной помощи."
    - name: "Гранулёма"
      text: "Организм в ответ на препарат образует плотные воспалительные узлы; это бывает очень редко и может потребовать длительного лечения."

emergency:
  - "**Сильная боль** после процедуры, которая не проходит или продолжает усиливаться"
  - "**Побледнение кожи или синюшно-багровое сетчатое (мраморное) окрашивание**, похолодание, пузыри или рана"
  - "**Нечёткость зрения или потеря зрения**, боль в глазу или двоение — **важна каждая минута**: немедленно позвоните или обратитесь в ближайшее отделение неотложной помощи"
  - "Внезапная **сильная головная боль, нарушение речи, слабость лица, руки или ноги** (признаки инсульта) — немедленно позвоните по номеру 112"
  - "Быстро нарастающий отёк лица, губ или языка, крапивница или одышка"
  - "Повышение температуры, покраснение, жар и нарастающее уплотнение/отёк (даже спустя несколько недель)"

lifestyle:
  - "В первые 24 часа избегайте макияжа, сауны, турецкой бани (хаммама), интенсивных физических нагрузок и алкоголя; в первые 2 недели не массируйте зону введения, не делайте косметических процедур для лица и не спите лицом вниз."
  - "В первые 2 недели защищайте зону введения от солнца, солярия и сильного холода."
  - "Если в будущем другой врач будет проводить вам процедуры в области лица (филлеры, лазер, операция, лечение зубов), сообщите ему, что вам вводили филлер, и назовите препарат."

declarations_extra:
  - "Мне объяснили, что существует риск сосудистой окклюзии и связанного с ней повреждения кожи, а также, хотя и очень редко, потери зрения и инсульта; какое неотложное лечение (гиалуронидаза) будет проведено в этом случае и что такое лечение не всегда может быть полностью успешным."
  - "Я понимаю, что эффект филлера временный и что в этой клинике перманентные филлеры не используются, и заявляю, что полностью сообщил(а) обо всех ранее проведённых процедурах с филлерами или имплантатами."
