code: "12"
type: surgical
aesthetic: true
title: "Derin Boyun Germe"
alt_name: "Deep neck lift / derin plan boyun germe"

specific_fields:
  - label: "Planlanan işlem bileşenleri:"
    options: ["Platizmaplasti", "Derin yağ alımı", "Digastrik kas küçültme", "Submandibuler bez küçültme", "Cilt fazlası alımı"]
    blank: false
  - label: "Eşzamanlı yüz germe:"
    options: ["Yok", "Var (ayrı onam formu ile)"]
  - label: "Birlikte yapılacak diğer işlemler:"
  - label: "Hastanın şikâyeti ve beklentisi:"

about:
  - "Boyun bölgesinde yaşla, kilo değişimleriyle veya kalıtsal yapıya bağlı olarak **gıdı altında dolgunluk**, çene-boyun açısının kaybolması, boyunda **dikey bantlar** (platizma kası bantları) ve **cilt sarkması** görülebilir. Bu görünüm yalnızca cilt altındaki yağdan değil, çoğu zaman **boyun kasının altındaki derin yağdan, çene altı kaslarından (digastrik kas) ve tükürük bezlerinin (submandibuler bez) sarkmasından** kaynaklanır."
  - "Derin boyun germe, bu derin yapıları da ele alarak çene hattını belirginleştirmeyi ve daha **genç, net ve doğal görünümlü** bir boyun elde etmeyi amaçlar. Sonuç; cildinizin esnekliğine, kemik yapınıza, kilonuza ve yaşınıza bağlıdır. Ameliyat yaşlanmayı durdurmaz; boyun zamanla yeniden gevşemeye devam eder."

procedure_intro:
  - "Ameliyat genellikle genel anestezi altında, ameliyathane koşullarında yapılır. Ameliyattan önce boynunuz oturarak ve ayakta muayene edilir, fotoğraflanır, işaretleme yapılır ve hangi yapıların ele alınacağı sizinle birlikte belirlenir."
procedure_steps:
  - "**Kesiler:** Çene altındaki doğal kıvrıma yaklaşık 3–5 cm'lik bir kesi yapılır. Cilt fazlası alınacaksa kulak memesinin çevresinden kulak arkasına ve saç çizgisine uzanan kesiler eklenir. Kesiler mümkün olduğunca doğal kıvrımlara ve saçlı deriye gizlenir."
  - "**Cildin kaldırılması:** Boyun cildi alttaki kastan nazikçe ayrılır; gerekiyorsa yüzeyel yağ dengeli şekilde inceltilir."
  - "**Derin yağın alınması:** Boyun kasının (platizma) altında kalan ve dışarıdan yağ aldırma (liposuction) ile ulaşılamayan derin yağ dokusu kontrollü şekilde azaltılır."
  - "**Digastrik kas ve submandibuler bez:** Çene altında dolgunluk yapan digastrik kasın ön kısmı gerekirse inceltilir. Sarkık ve belirgin tükürük bezinin (submandibuler bez) çıkıntı yapan kısmı gerekiyorsa kısmen küçültülür; bez tamamen çıkarılmaz."
  - "**Platizmaplasti:** Boyun ortasında ayrılmış ve bant oluşturan platizma kasının kenarları birbirine dikilerek bir “iç korse” oluşturulur; gerekirse yanlardan askıya alınır."
  - "**Cilt fazlasının alınması ve kapatma:** Cilt, gerginlik oluşturmadan yukarı ve geriye yönlendirilir, fazlası alınır. Kanama kontrolü yapılır, genellikle **dren** (ince bir sıvı boşaltma borusu) yerleştirilir, kesiler ince dikişlerle kapatılır ve boyun bandajı uygulanır."
procedure_notes:
  - "Planlanan bileşenler kişiye göre değişir; her hastada her adım uygulanmaz. Yüz germe ameliyatı eşzamanlı yapılacaksa bunun için **ayrı bir onam formu** imzalanır."
anesthesia: "Genel anestezi (seçilmiş hastalarda sedasyon + lokal anestezi)"
duration: "Yaklaşık 2–4 saat (eşzamanlı işlemlerle daha uzun)"
stay: "Genellikle 1 gece hastanede kalış"

benefits:
  - "Çene hattının ve çene-boyun açısının daha belirgin hâle gelmesi"
  - "Gıdı altındaki dolgunluğun ve boyundaki dikey bantların azalması"
  - "Sarkık boyun cildinin toparlanması ve daha genç, dinç bir görünüm"
success:
  - "Uygun seçilmiş hastaların büyük çoğunluğu sonuçtan memnun kalır. Şişliğin büyük kısmı ilk 4–6 haftada geçer; nihai sonuç **6–12 ay** içinde oturur. Cilt kalitesi zayıf, ileri yaşta, çok kilo vermiş veya daha önce boyun ameliyatı geçirmiş hastalarda sonuç daha sınırlı olabilir. Yaklaşık 100 hastadan **5–10'unda** küçük bir düzeltme (rötuş) işlemi gerekebilir."

alternatives:
  - "**Ameliyat olmamak:** Estetik bir işlem olduğu için yaptırmama seçeneğiniz her zaman vardır."
  - "**Yalnızca gıdı liposuction:** Cilt esnekliği iyi olan ve dolgunluğu yalnızca cilt altı yağdan kaynaklanan kişilerde yeterli olabilir; derin yağı, kası ve bezleri düzeltmez."
  - "**Enjeksiyonla yağ eritme (deoksikolik asit) veya enerji temelli cihazlar (radyofrekans, ultrason):** Hafif dolgunluk ve gevşeklikte sınırlı iyileşme sağlar, genellikle birden fazla seans gerekir."
  - "**Botoks ile platizma bantlarının yumuşatılması:** Bantları geçici olarak (3–4 ay) azaltır; sarkmayı ve yağı düzeltmez."
  - "**Daha sınırlı boyun germe:** Yalnızca cilt fazlasını alan veya yalnızca platizmaplasti içeren daha küçük ameliyatlar; etkileri daha sınırlıdır."

no_treatment:
  - "Ameliyat yapılmazsa boynunuzun mevcut görünümü korunur ve yaşla birlikte doğal yaşlanma süreci devam eder. Bu durum sağlığınız için bir tehlike oluşturmaz."

before:
  - "Ameliyattan önce kan tahlilleri, gerekirse EKG ve diğer tetkikler yapılır; anestezi uzmanı tarafından değerlendirilirsiniz."
  - "**Tansiyonunuzun iyi kontrol altında olması çok önemlidir.** Yüksek tansiyon, ameliyat sonrası boyunda kan birikmesi (hematom) riskini belirgin şekilde artırır. Tansiyon ilacınızı ameliyat sabahı da (az suyla) almanız gerekip gerekmediğini anestezi uzmanına danışınız."
  - "Ameliyattan önceki **6–8 saat** boyunca hiçbir şey yememeniz ve içmemeniz gerekir (anestezi uzmanının talimatlarına uyunuz)."
  - "Ameliyattan önce yoğun egzersiz, sauna ve aşırı alkol tüketiminden kaçınınız. Ameliyat günü makyaj, takı ve kolye kullanmayınız; önden düğmeli, boyundan geçirilmesi gerekmeyen bir giysi getiriniz."
  - "Ameliyattan sonraki ilk 24–48 saat size eşlik edecek bir yakınınızın olması önerilir."

recovery:
  - when: "İlk 24–48 saat"
    what: "Boyunda bandaj ve dren bulunur. Boyunda şişlik, gerginlik ve yutkunurken rahatsızlık hissi olur; ağrı genellikle hafif–orta düzeydedir. Başınızı yüksekte (30–45°) tutarak yatmanız, boynu aşırı bükmemeniz ve tansiyonunuzun yükselmemesi (ıkınmama, öksürüğü kontrol etme) önemlidir. Dren genellikle **1–2. günde** çıkarılır."
  - when: "1. hafta"
    what: "Şişlik ve morarma olursa en belirgin dönemdir, sonra azalmaya başlar. Boyun ve çene altında uyuşukluk normaldir. Gündüz ve gece **boyun korsesi/bandajı** önerildiği şekilde kullanılır. Dikişler **5–10. günlerde** alınır."
  - when: "2–4. haftalar"
    what: "Çoğu hasta 10–14 gün içinde masa başı işine ve sosyal hayata döner. Boyunda sertlik, düzensizlik hissi ve gerginlik devam edebilir. Ağır egzersiz, eğilip kaldırma ve boynu zorlayan hareketler en az **3–4 hafta** ertelenmelidir."
  - when: "1–3. aylar"
    what: "Kalan şişlik ve sertlik yavaş yavaş azalır. Uyuşukluk büyük oranda düzelir. İzler bu dönemde pembe ve hafif kabarık olabilir."
  - when: "6–12. aylar"
    what: "Nihai görünüm ortaya çıkar; izler soluklaşır ve incelir. Gerekli görülürse rötuş işlemi için genellikle en az 6 ay beklenir."

risks:
  expected:
    - "Boyunda ve çene altında şişlik; morarma **olursa** 1–3 hafta içinde geçer"
    - "Boyun cildinde ve kulak çevresinde geçici uyuşukluk"
    - "Boyunda gerginlik, sertlik ve yutkunurken hafif rahatsızlık"
    - "Kesi yerlerinde hafif ağrı, kaşıntı ve pembe izler"
    - "İlk haftalarda deri altında elle hissedilen düzensizlik ve sertlikler"
  common:
    - name: "Uzun süren şişlik ve sertlik"
      text: "Boyunda ve çene altında sertlik birkaç ay sürebilir; masaj ve zamanla düzelir."
    - name: "Küçük asimetri ve kontur düzensizlikleri"
      text: "Boynun iki tarafı arasında hafif farklar veya cilt altında küçük çukurluk/kabarıklıklar kalabilir; çoğu zamanla yumuşar, bazıları küçük bir düzeltme gerektirebilir."
    - name: "Seroma (sıvı birikimi)"
      text: "Cilt altında berrak sıvı toplanmasıdır; genellikle muayenehanede iğneyle boşaltılarak tedavi edilir."
    - name: "Rötuş (düzeltme) ihtiyacı"
      text: "Yaklaşık 100 hastadan **5–10'unda** kalan fazlalık, düzensizlik veya iz için küçük bir düzeltme işlemi gerekebilir."
  uncommon:
    - name: "Hematom (boyunda kan birikmesi)"
      text: "Yaklaşık 100 hastadan **2–5'inde** görülür; **erkeklerde ve tansiyonu yüksek olanlarda** daha sıktır ve çoğunlukla ilk 24 saatte ortaya çıkar. Küçük hematomlar iğneyle boşaltılabilir; büyük hematomlarda **ameliyathaneye geri dönülerek** kanın boşaltılması ve kanamanın durdurulması gerekir. Hızla büyüyen bir hematom **soluk borusuna baskı yaparak nefes almayı zorlaştırabilir**; bu durum acil müdahale gerektirir. Geç fark edilen hematom cilt beslenmesini bozarak yara ve iz sorunlarına yol açabilir."
    - name: "Alt dudak hareketinde geçici zayıflık (yüz sinirinin çene kenarı / boyun dalı)"
      text: "Yaklaşık 100 hastadan **1–10'unda** gülümserken alt dudağın bir tarafında asimetri görülebilir. Büyük çoğunluğu sinirin gerilmesine veya şişliğe bağlıdır ve **birkaç hafta ile birkaç ay** içinde kendiliğinden düzelir."
    - name: "Tükürük sızıntısı / tükürük kesesi (sialosel)"
      text: "Submandibuler bez küçültülen hastalarda bezden sızan tükürük cilt altında birikebilir. Genellikle tekrarlayan iğne ile boşaltma, baskılı bandaj ve gerekirse ilaçla düzelir; nadiren ek girişim gerekir."
    - name: "Fazla doku alımına bağlı görünüm bozukluğu"
      text: "Çok fazla yağ veya bez dokusu alınması boyun ortasında çukurluk, kasların belirginleşmesi ve “iskeletleşmiş” görünüm (“kobra boyun” deformitesi) oluşturabilir. Düzeltilmesi yağ enjeksiyonu veya ek ameliyat gerektirebilir; bu nedenle doku alımı dengeli ve kontrollü yapılır."
    - name: "Belirgin veya geniş iz"
      text: "Çene altı ve kulak arkası izler nadiren kalınlaşabilir, genişleyebilir veya renk değişikliği gösterebilir. Kortizonlu iğne, silikon jel veya iz düzeltme işlemiyle tedavi edilebilir. Kulak arkası kesi saç çizgisine uzanıyorsa bu bölgede saç seyrelmesi olabilir. Kulak memesi çevresinden kesi yapıldıysa kulak memesi nadiren aşağı ve öne çekilmiş görünebilir; gerekirse küçük bir düzeltme yapılır."
    - name: "Uzun süren uyuşukluk"
      text: "Boyun ve kulak memesi çevresinde his azalması birkaç ay sürebilir; nadiren kısmen kalıcı olabilir."
    - name: "Enfeksiyon"
      text: "100 hastada **1'den az–2** oranında görülür. Genellikle antibiyotikle düzelir; nadiren iltihabın boşaltılması gerekir."
  rare:
    - name: "Cilt beslenmesinin bozulması ve doku kaybı (nekroz)"
      text: "Özellikle **sigara içenlerde**, şeker hastalarında ve hematom gelişen hastalarda, cilt kenarlarında yara açılması ve doku kaybı görülebilir. İyileşme uzar, pansuman ve bazen ek cerrahi gerekir; kalıcı iz bırakabilir."
    - name: "Kalıcı sinir hasarı"
      text: "Alt dudak hareketinde kalıcı zayıflık **100 hastada 1'den azdır**. Çok nadiren dil hareketini (hipoglossal sinir) veya dilde hissi (lingual sinir) sağlayan sinirler ya da kulak memesinin hissini sağlayan sinir (büyük kulak siniri) etkilenebilir."
    - name: "Hava yolu sorunları ve yutma güçlüğü"
      text: "Büyük hematom veya belirgin şişliğe bağlı çok nadir durumlarda acil olarak hava yolunun güvence altına alınması ve yoğun bakım takibi gerekebilir. Derin yapıların düzeltilmesinden sonra geçici yutma güçlüğü olabilir."
    - name: "Damar veya tükürük kanalı yaralanması"
      text: "Boyundaki toplardamarların yaralanmasına bağlı kanama veya tükürük bezi kanalına ait sorunlar çok nadirdir; ek tedavi veya girişim gerektirebilir."
    - name: "Yeniden sarkma"
      text: "Boyun, yaşlanma ve kilo değişiklikleriyle yıllar içinde yeniden gevşeyebilir; bu bir komplikasyon değil, doğal süreçtir. Boyun kas bantları da zamanla yeniden belirginleşebilir. Erken dönemde belirgin gevşeme nadirdir."
    - name: "Psikolojik memnuniyetsizlik"
      text: "Teknik olarak başarılı bir sonuca rağmen kişi yeni görünümüne uyum sağlamakta zorlanabilir. Beklentilerin ameliyat öncesi açıkça konuşulması bu riski azaltır."

emergency:
  - "Boyunda **hızla artan şişlik, gerginlik veya tek taraflı belirgin büyüme**, özellikle ilk 24–48 saatte"
  - "**Nefes almada güçlük, ses değişikliği, yutkunamama** veya boğulma hissi (bekletmeden 112'yi arayınız)"
  - "Bandajın altından **durmayan kanama** veya dren torbasında hızla artan kan"
  - "**38,5 °C üzerinde ateş**, kesi yerlerinde artan kızarıklık, ağrı, ısı veya iltihaplı akıntı"
  - "Cilt renginde **koyulaşma, morumsu-siyah renk** veya yara açılması"
  - "Ani ve şiddetli ağrı, ilaçlara yanıt vermeyen ağrı"
  - "Nefes darlığı, göğüs ağrısı veya bacakta tek taraflı şişlik ve ağrı"

lifestyle:
  - "İlk 2 hafta başınızı yüksekte tutarak sırtüstü yatınız; boynunuzu aşırı bükmekten, ani baş-boyun hareketlerinden ve öne eğilmekten kaçınınız."
  - "Boyun korsesini/bandajını size önerilen süre boyunca (genellikle 1–3 hafta) kullanınız."
  - "Tansiyonunuzu düzenli ölçünüz ve ilaçlarınızı aksatmayınız; ıkınmaktan, ağır kaldırmaktan ve öksürüğü kontrolsüz bırakmaktan kaçınınız."
  - "İlk 3–4 hafta ağır egzersiz, sauna, hamam ve sıcak duştan kaçınınız."
  - "İzleri en az 3–6 ay güneşten koruyunuz."
  - "Yurt dışından geldiyseniz uçak yolculuğu genellikle dren ve ilk kontroller tamamlandıktan sonra, çoğunlukla 5–7. günden itibaren güvenlidir."

declarations_extra:
  - "Ameliyatın yaşlanmayı durdurmadığını, boynun zamanla yeniden gevşeyebileceğini ve sonucun cilt kalitem, kilom ve kemik yapımla sınırlı olduğunu anladım."
  - "Tansiyonumun kontrol altında tutulmasının ve ameliyat sonrası talimatlara uymanın kanama (hematom) riskini azaltmak için önemli olduğunu biliyorum."
