code: "07"
type: surgical
aesthetic: false
title: "Паротидэктомия"
alt_name: "Частичное или полное удаление околоушной слюнной железы (расположенной перед ухом)"

specific_fields:
  - label: "Сторона:"
    options: ["Правая", "Левая"]
    blank: false
  - label: "Планируемый объём:"
    options: ["Поверхностная", "Частичная / экстракапсулярная", "Тотальная", "Будет определён во время операции"]
  - label: "Мониторинг лицевого нерва:"
    options: ["Будет использоваться", "Не будет использоваться"]
    blank: false
  - label: "Предварительный диагноз (результат тонкоигольной биопсии / визуализации):"
  - label: "Заранее согласованное решение на случай, если опухоль затрагивает лицевой нерв:"
    options: ["При необходимости ветвь нерва может быть пожертвована", "Сохранить нерв", "Другое"]

about:
  - "Околоушная (паротидная) железа — самая крупная слюнная железа. Она расположена с каждой стороны перед ухом и чуть ниже него. Через железу проходит и внутри неё делится на ветви **лицевой нерв**, который приводит в движение мимические мышцы лица. Поэтому операция на околоушной железе — это тонкое вмешательство, при котором особое внимание уделяется сохранению этого нерва."
  - "Паротидэктомию чаще всего выполняют по поводу **образования (опухоли)** в железе. Подавляющее большинство таких образований (около 80%) — **доброкачественные (не рак)**; наиболее частые из них — плеоморфная аденома и опухоль Уортина. Доброкачественные образования тоже могут со временем расти, а некоторые из них (особенно плеоморфная аденома) спустя многие годы могут перерождаться в злокачественные. Реже операция требуется при повторяющихся воспалениях, камнях или злокачественной опухоли."
  - "Цель операции — полностью удалить образование или поражённую ткань железы, **сохранив лицевой нерв**, и установить окончательный диагноз с помощью патогистологического исследования."

procedure_intro:
  - "Операция проводится под общим наркозом в условиях операционной. До операции образование оценивают с помощью УЗИ, МРТ и/или тонкоигольной биопсии; эти исследования дают полезную предварительную информацию, но окончательный диагноз ставится после операции по результатам патогистологического исследования."
procedure_steps:
  - "**Разрез:** Разрез обычно начинается в естественной складке перед ухом, огибает мочку уха снизу и продолжается в кожную складку на шее. В подходящих случаях разрез можно сделать короче или скрыть его по линии роста волос."
  - "**Поиск лицевого нерва:** Кожу и ткани над железой приподнимают и находят основной ствол лицевого нерва. Если используется аппарат **мониторинга нерва**, он помогает отслеживать расположение и функцию нерва на протяжении всей операции."
  - "**Удаление образования/железы:** Тщательно прослеживая нерв и его ветви, образование удаляют вместе с участком здоровой ткани железы вокруг него. В зависимости от расположения и размера образования может быть удалена только наружная часть железы (поверхностная паротидэктомия), её часть или вся железа (тотальная паротидэктомия)."
  - "**Патогистологическое исследование:** Удалённую ткань отправляют на патогистологическое исследование. Окончательный результат обычно готов в течение 1–2 недель."
  - "**Завершение операции:** Проводится остановка кровотечения, и обычно устанавливается тонкий **дренаж** (трубка) для отвода скапливающейся крови или жидкости. Кожу зашивают тонкими швами; может быть наложена лёгкая давящая повязка."
procedure_notes:
  - "Если опухоль окружает лицевой нерв или прорастает в него (это происходит в основном при злокачественных опухолях), для полного удаления опухоли может потребоваться пожертвовать ветвью нерва или всем нервом. Эта возможность **отдельно обсуждается с вами** до операции. Нерв не будет пересечён неожиданно, без предварительного обсуждения с вами; что будет сделано, если опухоль не удастся отделить от нерва, согласовывается с вами заранее."
anesthesia: "Общий наркоз"
duration: "Около 2–4 часов"
stay: "Обычно 1–2 ночи; выписка после удаления дренажа"

benefits:
  - "Удаление образования и установление окончательного диагноза"
  - "Предотвращение роста доброкачественного образования, давления на лицевой нерв и, в долгосрочной перспективе, его перерождения в злокачественное"
  - "При злокачественных опухолях — первый и самый важный этап лечения"
  - "Прекращение боли и отёков, вызванных повторяющимся воспалением или камнями"
success:
  - "При большинстве доброкачественных опухолей операция обеспечивает стойкое излечение. При плеоморфных аденомах, удалённых по правильной методике, частота рецидива составляет **менее 1–2 случаев на 100 пациентов**; однако разрыв капсулы опухоли или ранее перенесённая операция повышают этот показатель. Опухоль Уортина может появиться в виде нового очага в той же или в противоположной железе. При злокачественных опухолях результат зависит от вида и стадии опухоли, и может потребоваться дополнительное лечение."

alternatives:
  - "**Наблюдение:** При некоторых небольших образованиях, которые считаются доброкачественными (например, при опухоли Уортина у пожилых пациентов или у пациентов с высоким операционным риском), может обсуждаться регулярное наблюдение с помощью УЗИ/МРТ. В этом случае образование остаётся на месте и может расти, а окончательный диагноз поставить нельзя."
  - "**Медикаментозное лечение:** При воспалении или камнях — антибиотики, обильное питьё, массаж; в подходящих случаях — удаление камней с помощью эндоскопии слюнного протока (сиалоэндоскопии). При опухолях медикаментозное лечение не является вариантом."
  - "**Лучевая терапия:** Применяется при злокачественных опухолях, которые невозможно прооперировать, или в дополнение к операции; при доброкачественных опухолях она не является предпочтительным методом лечения."

no_treatment:
  - "Без операции образование остаётся на месте, и окончательный диагноз поставить нельзя. Доброкачественные опухоли обычно растут медленно, но со временем они могут увеличиться, что затрудняет операцию и повышает риск для лицевого нерва; плеоморфные аденомы спустя многие годы могут перерождаться в злокачественные (примерно в 5–10% случаев за годы). Злокачественная опухоль без лечения будет прогрессировать и может распространиться на окружающие ткани и лимфатические узлы."

before:
  - "Перед операцией выполняются анализы крови, визуализирующие исследования (УЗИ/МРТ) и при необходимости тонкоигольная биопсия; вас осмотрит анестезиолог."
  - "В течение **6–8 часов** до операции нельзя ничего есть и пить (пожалуйста, следуйте указаниям анестезиолога)."
  - "У мужчин в день операции могут подстричь бороду в зоне разреза и волосы вокруг уха. В зависимости от разреза могут немного подровнять волосы за ухом."
  - "Перед операцией осматривают и фотографируют ваши мимические движения, чтобы зафиксировать, как они работают до операции."

recovery:
  - when: "Первые 24–48 часов"
    what: "В области операции будут ощущаться стянутость, лёгкая или умеренная боль и отёк, которые контролируются обезболивающими. Дренаж обычно удаляют на 1–2-й день, когда количество отделяемой жидкости уменьшается. Рекомендуется спать с приподнятой головой. Будут проверяться движения мышц вашего лица."
  - when: "1-я неделя"
    what: "После выписки вы можете вернуться к повседневным делам. Швы обычно снимают на **5–7-й день**. Заметно онемение мочки уха и области перед ухом. Результат патогистологического исследования обычно бывает готов в этот период или вскоре после него, и его сообщат вам."
  - when: "2–6-я недели"
    what: "Большинство людей возвращаются к сидячей работе в течение 1–2 недель. Интенсивные физические нагрузки и работу, связанную с наклонами и подъёмом тяжестей, следует отложить примерно на **2–3 недели**. Если возникла временная слабость мышц лица, она обычно начинает проходить в течение нескольких недель; рекомендуются защита глаза и упражнения для мышц лица."
  - when: "3–12-й месяцы"
    what: "Рубец постепенно светлеет. Онемение мочки уха частично проходит. Большинство пациентов с временной слабостью нерва полностью восстанавливаются в течение 6–12 месяцев. Потливость щеки во время еды (синдром Фрея), если она возникает, может появиться в этот период."

risks:
  expected:
    - "Боль, стянутость и отёк в области операции"
    - "Онемение мочки уха и кожи перед ухом"
    - "Рубец в месте разреза (со временем светлеет)"
    - "Лёгкая боль на стороне операции при открывании рта или жевании (в первые дни)"
  common:
    - name: "Временная слабость лицевого нерва"
      text: "Примерно у **10–40 из 100** пациентов (в зависимости от объёма удалённой ткани и расположения образования) возникает временная слабость в углу рта, при закрывании глаза или при поднимании брови. Обычно она затрагивает только одну ветвь и **проходит в течение нескольких недель или месяцев**. Если в этот период глаз закрывается не полностью, для предотвращения сухости глаза вам потребуется использовать капли, гель и ночную повязку на глаз."
    - name: "Стойкое снижение чувствительности мочки уха"
      text: "Нерв, обеспечивающий чувствительность мочки уха (большой ушной нерв), затрагивается при большинстве операций. У большинства пациентов онемение со временем уменьшается, однако некоторое снижение чувствительности мочки уха и окружающей области может остаться **навсегда**. Обычно это не влияет на повседневную жизнь."
    - name: "Синдром Фрея (потливость во время еды)"
      text: "Потливость и покраснение щеки на стороне операции во время еды. Хотя при специальных тестах это выявляется чаще, заметным оно бывает примерно у **10–20 из 100** пациентов и обычно начинается спустя несколько месяцев. Если это беспокоит, можно применять кремы-антиперспиранты или инъекции **ботулотоксина**."
    - name: "Западение в области щеки"
      text: "В зависимости от объёма удалённой ткани может сформироваться небольшое углубление перед ухом и разница между двумя сторонами. Если оно заметно, его можно исправить с помощью собственного жира или филлера."
  uncommon:
    - name: "Скопление жидкости (серома) или слюны (сиалоцеле) / слюнной свищ"
      text: "Примерно у **5–10 из 100** пациентов в области операции может скапливаться жидкость или слюна; в редких случаях она подтекает наружу через кожу (свищ). Обычно это проходит в течение нескольких недель после откачивания иглой, наложения давящей повязки и при необходимости введения ботулотоксина."
    - name: "Кровотечение и гематома"
      text: "Примерно у **1–3 из 100** пациентов под кожей может скопиться кровь. Если гематома большая, может потребоваться её удаление и остановка кровотечения в операционной."
    - name: "Раневая инфекция"
      text: "Возникает у **1–3 из 100** пациентов; обычно проходит при лечении антибиотиками, в редких случаях требуется дренирование."
    - name: "Синдром первого укуса"
      text: "Особенно после операций на глубокой доле — резкая боль в области угла нижней челюсти, длящаяся несколько секунд, при первых укусах во время еды. Обычно со временем она ослабевает."
    - name: "Рецидив образования"
      text: "Хотя при доброкачественных опухолях это бывает нечасто, образование может появиться снова в той же области, а при опухоли Уортина может развиться новый очаг; это может потребовать повторной операции. При повторных операциях риск для лицевого нерва выше."
    - name: "Грубый рубец или келоид"
      text: "В зависимости от индивидуальной предрасположенности рубец может утолщаться; можно применять инъекции стероидов или другие методы лечения рубцов."
  rare:
    - name: "Стойкий паралич лицевого нерва"
      text: "При доброкачественных опухолях при первой операции примерно у **1–3 из 100** пациентов может остаться стойкая слабость одной ветви лицевого нерва или, в редких случаях, всего нерва. Это может привести к опущению угла рта, неполному закрыванию глаза, асимметричной улыбке и сухости глаза; если глаз не защищать, возможно повреждение прозрачной передней оболочки глаза (роговицы) и потеря зрения. Риск выше при злокачественных опухолях, повторных операциях и образованиях, сращённых с нервом. Если развивается стойкий паралич, может потребоваться дополнительное лечение, например препараты для защиты глаза, установка грузика в веко, восстановление нерва или операции по реанимации лица."
    - name: "Окончательный патогистологический диагноз отличается от предварительного"
      text: "Даже если дооперационные исследования указывают на доброкачественное образование, окончательное патогистологическое заключение может выявить **злокачественную** опухоль. В этом случае может потребоваться дополнительная операция (удаление оставшейся части железы или лимфатических узлов шеи), лучевая терапия или другие виды лечения."
    - name: "Большая гематома шеи с нарушением проходимости дыхательных путей"
      text: "Очень редко быстро увеличивающееся скопление крови может сдавливать шею и вызывать затруднение глотания или дыхания. Это неотложное состояние: гематому необходимо немедленно удалить в операционной, а в редких случаях может потребоваться обеспечение проходимости дыхательных путей (интубация или трахеостомия)."
    - name: "Нарушение кровоснабжения кожи"
      text: "Расхождение краёв раны, особенно под мочкой уха, из-за ухудшения кровоснабжения кожи; чаще встречается у курящих."
    - name: "Изменение формы мочки уха или нарушение чувствительности ушной раковины"
      text: "Встречается редко; связано с разрезом или с воздействием на нерв."

emergency:
  - "**Быстро нарастающий отёк шеи или щеки**, особенно с затруднением глотания или дыхания (неотложное состояние — звоните 112)"
  - "**Непрекращающееся кровотечение** из дренажа или раны"
  - "**Температура выше 38,5 °C**, нарастающее покраснение, боль, ощущение жара или гнойное отделяемое из раны"
  - "**Новая или нарастающая слабость** мимических движений"
  - "Если вы не можете полностью закрыть глаз: **покраснение, ощущение песка, боль или затуманивание зрения** в глазу"
  - "**Подтекание прозрачной жидкости** из раны или мягкая припухлость перед ухом, которая продолжает увеличиваться"

lifestyle:
  - "В первые 48 часов держите рану сухой; после этого можно принять короткий тёплый душ, как вам объяснят."
  - "В первые недели отказ от очень кислой пищи и продуктов, сильно усиливающих слюноотделение, может снизить риск скопления жидкости."
  - "Если есть слабость лицевого нерва, днём используйте капли «искусственная слеза», а на ночь — гель для глаз и повязку на глаз; защищайте глаз от ветра и пыли."
  - "Защищайте рубец от солнца не менее 6 месяцев (солнцезащитный крем с высоким фактором защиты)."
  - "Обязательно обсудите с врачом результат патогистологического исследования и план дальнейшего наблюдения; регулярные контрольные осмотры рекомендуются даже при доброкачественных опухолях."

declarations_extra:
  - "Я понимаю, что взаимоотношение лицевого нерва и образования можно достоверно увидеть только во время операции, что окончательный диагноз будет поставлен после операции по результатам патогистологического исследования и что в зависимости от результата может потребоваться дополнительное лечение."
  - "До операции со мной обсудили, что будет сделано с нервом, если опухоль прорастает в лицевой нерв, и моё решение записано в разделе сведений о пациенте."
