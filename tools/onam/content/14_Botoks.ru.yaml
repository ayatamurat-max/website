code: "14"
type: office
aesthetic: true
title: "Лечение ботулинотоксином (ботокс)"
alt_name: "Инъекционное лечение мимических морщин, увеличенной жевательной мышцы (массетера) или повышенной потливости"

specific_fields:
  - label: "Название препарата / марка:"
  - label: "Номер серии (LOT) и срок годности:"
  - label: "Общее количество единиц и разведение:"
  - label: "Зоны введения:"
    options: ["Лоб", "Межбровье", "«Гусиные лапки» (уголки глаз)", "Массетер (жевательная мышца)", "Шея", "Потливость (подмышки / ладони)", "Другое"]
  - label: "Цель процедуры:"
    options: ["Эстетическая", "Медицинская (бруксизм, потливость и т. п.)"]
  - label: "Зона(-ы) применения вне инструкции (офф-лейбл):"
    options: ["Нет", "Да — зона:"]

about:
  - "Ботулинотоксин — это очищенный белок, который временно ослабляет связь между мышцей, в которую он введён, и её нервом, вследствие чего мышца сокращается слабее. В эстетических целях его применяют, чтобы смягчить **мимические морщины** на лбу, в межбровье и вокруг глаз. Кроме того, его используют как лечебное средство при скрежетании зубами (бруксизме) и увеличении жевательной мышцы (массетера), выраженных тяжах на шее и **повышенной потливости** (гипергидрозе)."
  - "Мимические морщины формируются с годами из-за многократного сокращения одних и тех же мышц и снижения эластичности кожи. Эффект **временный**: мышца постепенно восстанавливает свою функцию, и если процедуру не повторять, внешний вид медленно возвращается к исходному. Цель — **естественный, отдохнувший** вид без «застывшей» мимики."

procedure_intro:
  - "Процедура проводится в клинике после короткой консультации и осмотра. Оценивается ваша мимика, размечаются точки введения и при необходимости перед процедурой делаются фотографии."
procedure_steps:
  - "**Подготовка:** Снимается макияж, кожа обрабатывается антисептическим раствором. Если вы чувствительны к боли, можно приложить лёд или нанести обезболивающий крем."
  - "**Введение:** Очень тонкой иглой в размеченные точки вводится небольшое количество препарата. Каждый укол длится несколько секунд; ощущается лёгкое покалывание или жжение."
  - "**Завершение:** На места уколов слегка надавливают. Небольшие припухлости (папулы) исчезают в течение нескольких минут."
  - "**Запись:** Название препарата, номер серии (LOT), общее количество единиц и зоны введения записываются в вашу медицинскую карту."
procedure_notes:
  - "Некоторые зоны и цели введения могут не входить в утверждённую в Турции инструкцию по применению препарата (**применение вне инструкции, офф-лейбл**); например, введение в массетер (жевательную мышцу) и при бруксизме, в шею и при потливости ладоней не относится к утверждённым показаниям многих препаратов. Хотя такое применение широко распространено и признано в медицинской литературе, ваш врач отдельно объяснит, относится ли запланированная для вас зона к этой категории, и это будет отмечено в соответствующем поле настоящей формы."
anesthesia: "Обычно не требуется; по желанию — лёд или обезболивающий крем"
duration: "Около 10–20 минут"
stay: "В тот же день; после процедуры — наблюдение в течение 15–30 минут"

benefits:
  - "Смягчение мимических морщин на лбу, в межбровье и вокруг глаз, более отдохнувший вид"
  - "При введении в массетер — уменьшение симптомов бруксизма и более изящная линия нижней челюсти"
  - "При лечении потливости — выраженное уменьшение потоотделения"
  - "Короткая процедура без хирургических разрезов, после которой можно сразу вернуться к повседневной жизни"
success:
  - "Эффект обычно начинает проявляться через **3–14 дней**, достигает максимума примерно через 2 недели и в мимических зонах сохраняется в среднем **3–4 месяца** (при лечении потливости и введении в массетер может длиться дольше). Выраженность и продолжительность эффекта индивидуальны. Очень глубокие, устоявшиеся морщины могут не исчезнуть полностью. При необходимости примерно через 2 недели назначается контрольный осмотр, и если врач сочтёт это целесообразным, может быть проведена небольшая дополнительная коррекция."

alternatives:
  - "**Отказ от процедуры:** Поскольку это эстетическая процедура, у вас всегда есть возможность от неё отказаться."
  - "**Филлеры:** Могут быть более подходящими для морщин, вызванных не движением, а потерей объёма."
  - "**Уход за кожей и методы омоложения кожи:** Кремы с ретиноидами, химические пилинги, лазер или мезотерапия могут улучшить качество кожи, но не уменьшают подвижность мимических мышц."
  - "**Хирургические методы:** При наличии птоза тканей более долговременное решение могут дать такие операции, как подъём бровей или подтяжка лица."
  - "**При медицинских показаниях:** Ночная капа при бруксизме; антиперспиранты и лекарственные препараты при потливости."

no_treatment:
  - "Если процедура не проводится, ваш нынешний внешний вид или жалобы будут развиваться естественным путём. С возрастом мимические морщины могут постепенно становиться заметнее; это не представляет опасности для вашего здоровья."

before:
  - "Процедура **не проводится или откладывается** в следующих случаях: беременность, кормление грудью, нервно-мышечные заболевания, такие как **миастения гравис**, БАС или синдром Ламберта–Итона, активная инфекция в зоне введения, известная аллергия на препарат, а для некоторых препаратов — аллергия на белок коровьего молока. Пожалуйста, обязательно сообщите нам, если что-либо из этого относится к вам."
  - "**Антибиотики группы аминогликозидов** (например, гентамицин) и некоторые миорелаксанты могут усиливать действие ботулинотоксина; если вы их принимаете, сообщите нам."
  - "Если вам ранее вводили ботулинотоксин, сообщите, когда, какой препарат и каким был результат."
  - "Чтобы снизить риск синяков, по возможности, посоветовавшись с врачом, сделайте перерыв в приёме аспирина и подобных препаратов за несколько дней до процедуры."

recovery:
  - when: "Первые 4 часа"
    what: "Не ложитесь, не массируйте и не надавливайте на обработанную зону. Это помогает препарату оставаться там, куда он был введён. В местах уколов могут быть лёгкое покраснение и небольшие припухлости."
  - when: "Первый день"
    what: "Избегайте интенсивных физических нагрузок, сауны, турецкой бани (хаммама), солярия и очень жарких помещений. Макияж можно наносить через несколько часов. Возможна лёгкая головная боль; она проходит после приёма простых обезболивающих."
  - when: "3–14-й день"
    what: "Эффект проявляется постепенно. Небольшие синяки в местах уколов, **если они появятся**, проходят в течение недели. В этот период не делайте косметических процедур для лица, процедур на коже и массажа лица."
  - when: "2-я неделя"
    what: "Эффект достигает максимума. При необходимости проводится контрольный осмотр; при асимметрии или недостаточном эффекте после оценки врача может быть запланирована небольшая дополнительная коррекция."
  - when: "3–4-й месяц и далее"
    what: "Эффект постепенно ослабевает. Между повторными процедурами обычно рекомендуется интервал не менее 3 месяцев."

risks:
  expected:
    - "Лёгкая боль, покраснение и небольшие припухлости в местах уколов (проходят в течение от нескольких минут до нескольких часов)"
    - "Небольшие синяки; **если они появятся**, проходят в течение от нескольких дней до недели"
    - "Лёгкое ощущение тяжести или стянутости в области лба (первые 1–2 недели)"
  common:
    - name: "Головная боль"
      text: "Особенно после первой процедуры примерно у **1–10 из 100** пациентов в первые дни бывает лёгкая головная боль; обычно она проходит в течение нескольких дней."
    - name: "Лёгкая асимметрия или недостаточный эффект"
      text: "Поскольку сила мышц у всех разная, между сторонами может сохраняться небольшая разница или эффект может оказаться слабее ожидаемого. Это оценивается на контрольном осмотре через 2 недели."
    - name: "Чрезмерно приподнятый наружный край брови («бровь Спока»)"
      text: "После введения в лоб наружный конец брови может подняться слишком сильно; обычно это исправляется небольшой дополнительной инъекцией."
  uncommon:
    - name: "Опущение верхнего века (птоз)"
      text: "После введения в межбровье или лоб примерно у **1–5 из 100** пациентов может возникнуть лёгкое опущение верхнего века. Оно **временное** и обычно проходит в течение 2–6 недель. В этот период могут быть назначены глазные капли, которые временно приподнимают веко и улучшают внешний вид."
    - name: "Опущение брови и тяжесть в области лба"
      text: "Связаны с чрезмерным расслаблением лобной мышцы; проходят по мере ослабления эффекта (от нескольких недель до нескольких месяцев)."
    - name: "Асимметричная улыбка, слабость движений губ, подтекание слюны"
      text: "Могут возникать при введении в нижнюю часть лица и массетер, если препарат воздействует на соседние мышцы; явление временное, но может длиться от нескольких недель до нескольких месяцев."
    - name: "Сухость глаз, слезотечение или двоение в глазах"
      text: "Встречаются нечасто при введении вокруг глаз; временные. Если появится двоение в глазах, сообщите врачу."
    - name: "Затруднённое глотание, слабость мышц шеи"
      text: "Могут возникать при введении в шею; обычно лёгкие и временные."
    - name: "Снижение силы жевания, впалый вид щёк"
      text: "После введения в массетер жевание твёрдой пищи какое-то время может вызывать усталость; очень редко щека может выглядеть слегка впалой или улыбка — неровной."
    - name: "Слабость кисти после введения в ладони"
      text: "После инъекций в ладони при потливости сила захвата пальцами может временно снизиться, а сами инъекции могут быть довольно болезненными. Слабость обычно проходит в течение нескольких недель."
  rare:
    - name: "Распространение действия на отдалённые области"
      text: "Очень редко, особенно при высоких дозах, действие препарата может распространиться за пределы зоны введения, вызывая общую мышечную слабость, нарушения зрения или **затруднение речи, глотания или дыхания**. Это требует **неотложного лечения**; может понадобиться госпитализация и поддержка дыхания. При дозах, применяемых в эстетических целях, это встречается крайне редко."
    - name: "Тяжёлая аллергическая реакция"
      text: "Тяжёлая аллергическая реакция (анафилаксия) с крапивницей, отёком лица и губ или одышкой встречается крайне редко; она требует неотложной помощи."
    - name: "Потеря эффекта (образование антител)"
      text: "Очень редко организм вырабатывает антитела к препарату, и последующие процедуры могут оказаться неэффективными. Частые процедуры с высокими дозами повышают этот риск."

emergency:
  - "**Затруднение глотания, речи или дыхания**, выраженная мышечная слабость"
  - "**Нечёткость зрения или двоение в глазах**, полная невозможность открыть веко"
  - "Быстро нарастающий отёк лица, губ или языка, крапивница или одышка (аллергическая реакция)"
  - "Нарастающие боль, покраснение, жар или гнойные выделения в зоне введения"

lifestyle:
  - "В первые 4 часа не ложитесь и не массируйте зону введения; в первый день избегайте интенсивных физических нагрузок, сауны и турецкой бани (хаммама)."
  - "Пока сохраняется эффект, если вы собираетесь делать инъекции ботулинотоксина, массаж лица или процедуры на коже у другого врача, сообщите ему об этой процедуре."
  - "Если вы планируете беременность в период лечения, посоветуйтесь с врачом."

declarations_extra:
  - "Меня расспросили о состояниях, препятствующих проведению процедуры (беременность, кормление грудью, нервно-мышечные заболевания, лекарственные препараты), и я предоставил(а) достоверную информацию."
  - "Я понимаю, что эффект ботулинотоксина временный и что для его поддержания процедуру необходимо регулярно повторять. Мне объяснили, что некоторые зоны введения могут выходить за рамки утверждённой инструкции по применению препарата."
