code: "12"
type: surgical
aesthetic: true
title: "Дълбок лифтинг на шията"
alt_name: "Deep neck lift / лифтинг на шията в дълбока равнина (deep plane)"

specific_fields:
  - label: "Планирани компоненти на операцията:"
    options: ["Платизмопластика", "Отстраняване на дълбока мазнина", "Изтъняване на двукореместия мускул", "Частично намаляване на подчелюстната жлеза", "Отстраняване на излишна кожа"]
    blank: false
  - label: "Едновременен лифтинг на лицето:"
    options: ["Не", "Да (с отделен формуляр за съгласие)"]
  - label: "Други процедури, които ще се извършат едновременно:"
  - label: "Оплакване и очаквания на пациента:"

about:
  - "С възрастта, при промени в теглото или поради наследствени особености по шията може да се появят **пълнота под брадичката („двойна брадичка“)**, заличаване на ъгъла между челюстта и шията, **вертикални ивици** (ивици на мускула платизма) и **отпусната кожа**. Този вид често се дължи не само на мазнината под кожата, но и на **дълбоката мазнина под мускула на шията, мускулите под брадичката (двукоремести мускули) и увисването на слюнчените жлези (подчелюстни жлези)**."
  - "Дълбокият лифтинг на шията третира и тези дълбоки структури, като целта е да се очертае линията на челюстта и да се постигне **по-млада, ясно очертана и естествено изглеждаща** шия. Резултатът зависи от еластичността на кожата, костната структура, теглото и възрастта ви. Операцията не спира стареенето; с времето шията продължава постепенно да се отпуска."

procedure_intro:
  - "Операцията обикновено се извършва под обща анестезия в операционна зала. Преди това шията ви се преглежда в седнало и изправено положение, снима се и се маркира, а структурите, които ще бъдат третирани, се определят заедно с вас."
procedure_steps:
  - "**Разрези:** Прави се разрез с дължина около 3–5 см в естествената гънка под брадичката. Ако ще се отстранява излишна кожа, се добавят разрези около долната (меката) част на ухото, които продължават зад него към линията на косата. Разрезите се скриват, доколкото е възможно, в естествените гънки и в окосмената част."
  - "**Повдигане на кожата:** Кожата на шията внимателно се отделя от подлежащия мускул; при нужда повърхностната мазнина се изтънява равномерно."
  - "**Отстраняване на дълбоката мазнина:** Дълбоката мазнина под мускула на шията (платизма), която не може да бъде достигната с липосукция отвън, се намалява контролирано."
  - "**Двукоремест мускул и подчелюстни жлези:** При нужда предната част на двукореместия (дигастралния) мускул, която създава пълнота под брадичката, се изтънява. Ако подчелюстната слюнчена жлеза е увиснала и изпъква, изпъкващата ѝ част може да бъде частично намалена; жлезата не се отстранява изцяло."
  - "**Платизмопластика:** Разделените по средата на шията краища на мускула платизма, които образуват ивици, се зашиват един към друг и се създава „вътрешен корсет“; при нужда мускулът се изтегля и закрепва и встрани."
  - "**Отстраняване на излишната кожа и затваряне:** Кожата се изтегля нагоре и назад без напрежение и излишъкът се отстранява. Извършва се внимателна хемостаза (спиране на кървенето), обикновено се поставя **дрен** (тънка тръбичка за изтичане на течност), разрезите се затварят с фини шевове и се поставя превръзка на шията."
procedure_notes:
  - "Планираните етапи са индивидуални; не всяка стъпка се прилага при всеки пациент. Ако едновременно ще се извърши лифтинг на лицето, за него се подписва **отделен формуляр за съгласие**."
anesthesia: "Обща анестезия (при подбрани пациенти – седация и местна анестезия)"
duration: "Около 2–4 часа (по-дълго при съчетани процедури)"
stay: "Обикновено една нощ в болница"

benefits:
  - "По-ясно очертана линия на челюстта и ъгъл между челюстта и шията"
  - "Намаляване на пълнотата под брадичката и на вертикалните ивици по шията"
  - "Стягане на отпуснатата кожа на шията и по-млад, свеж вид"
success:
  - "Повечето правилно подбрани пациенти са доволни от резултата. По-голямата част от отока отзвучава през първите 4–6 седмици; крайният резултат се вижда в рамките на **6–12 месеца**. При пациенти с лошо качество на кожата, по-напреднала възраст, голяма загуба на тегло или предишна операция на шията резултатът може да е по-ограничен. При около **5–10 от всеки 100** пациенти може да е необходима малка корекция."

alternatives:
  - "**Да не се оперирате:** Тъй като процедурата е естетична, винаги имате възможност да не я извършите."
  - "**Само липосукция под брадичката:** Може да е достатъчна при хора с добра еластичност на кожата, при които пълнотата се дължи само на подкожна мазнина; не коригира дълбоката мазнина, мускулите и жлезите."
  - "**Инжекции за разграждане на мазнини (деоксихолева киселина) или апаратни методи (радиочестота, ултразвук):** Дават ограничено подобрение при лека пълнота и отпуснатост; обикновено са необходими няколко сеанса."
  - "**Ботулинов токсин за омекотяване на ивиците на платизмата:** Намалява ивиците временно (3–4 месеца); не коригира отпускането и мазнината."
  - "**По-ограничен лифтинг на шията:** По-малки операции, при които се отстранява само излишна кожа или се прави само платизмопластика; ефектът им е по-ограничен."

no_treatment:
  - "Ако операцията не бъде извършена, сегашният вид на шията ви ще се запази и естественото стареене ще продължи. Това не представлява опасност за здравето ви."

before:
  - "Преди операцията се правят кръвни изследвания и при нужда ЕКГ и други изследвания; ще бъдете прегледани от анестезиолог."
  - "**Много е важно кръвното ви налягане да бъде добре контролирано.** Високото кръвно налягане значително увеличава риска от натрупване на кръв в шията (хематом) след операцията. Попитайте анестезиолога дали трябва да приемете лекарството си за кръвно налягане и сутринта преди операцията (с малко вода)."
  - "Не яжте и не пийте нищо **6–8 часа** преди операцията (спазвайте указанията на анестезиолога)."
  - "Преди операцията избягвайте тежки физически натоварвания, сауна и прекомерна консумация на алкохол. В деня на операцията не използвайте грим, бижута и колиета; носете дреха, която се закопчава отпред и не се облича през главата."
  - "Препоръчва се през първите 24–48 часа след операцията до вас да има придружител."

recovery:
  - when: "Първите 24–48 часа"
    what: "На шията ще имате превръзка и дрен. Ще усещате оток, стягане и дискомфорт при преглъщане; болката обикновено е лека до умерена. Важно е да спите с повдигната глава (30–45°), да не сгъвате прекомерно шията и да избягвате покачване на кръвното налягане (не се напъвайте и овладявайте кашлицата). Дренът обикновено се отстранява на **1–2-ия ден**."
  - when: "1-ва седмица"
    what: "Отокът и кръвонасяданията, **ако се появят**, са най-изразени в този период, след което започват да намаляват. Изтръпването на шията и под брадичката е нормално. **Компресивната превръзка за шията** се носи денем и нощем според указанията. Конците се свалят на **5–10-ия ден**."
  - when: "2–4-та седмица"
    what: "Повечето пациенти се връщат към офис работа и социален живот в рамките на 10–14 дни. Уплътнението, усещането за неравности и стягането в шията може да продължат. Тежки физически натоварвания, навеждане, вдигане на тежести и движения, натоварващи шията, трябва да се избягват поне **3–4 седмици**."
  - when: "1–3-ти месец"
    what: "Остатъчният оток и уплътнението постепенно намаляват. Изтръпването в голяма степен отминава. В този период белезите може да са розови и леко надигнати."
  - when: "6–12-и месец"
    what: "Вижда се крайният резултат; белезите избледняват и изтъняват. Ако се прецени, че е необходима корекция, тя обикновено се прави след поне 6 месеца."

risks:
  expected:
    - "Оток на шията и под брадичката; кръвонасядания, **ако се появят**, отзвучават за 1–3 седмици"
    - "Временно изтръпване на кожата на шията и около ушите"
    - "Стягане, уплътнение и лек дискомфорт при преглъщане"
    - "Лека болка, сърбеж и розови белези в областта на разрезите"
    - "Неравности и уплътнения, които се напипват под кожата през първите седмици"
  common:
    - name: "Продължителен оток и уплътнение"
      text: "Уплътнението на шията и под брадичката може да продължи няколко месеца; отминава с масаж и с времето."
    - name: "Лека асиметрия и неравности на контура"
      text: "Може да останат леки разлики между двете страни на шията или малки вдлъбнатини/подутини под кожата; повечето се изглаждат с времето, някои може да изискват малка корекция."
    - name: "Серома (натрупване на течност)"
      text: "Събиране на бистра течност под кожата; обикновено се лекува с изтегляне на течността с игла в кабинета."
    - name: "Необходимост от корекция"
      text: "При около **5–10 от всеки 100** пациенти може да е необходима малка корекция заради остатъчна пълнота, неравност или белег."
  uncommon:
    - name: "Хематом (натрупване на кръв в шията)"
      text: "Среща се при около **2–5 от всеки 100** пациенти; по-чест е **при мъже и при хора с високо кръвно налягане** и обикновено се появява през първите 24 часа. Малките хематоми могат да бъдат изтеглени с игла; при големите се налага **връщане в операционната** за отстраняване на кръвта и спиране на кървенето. Бързо нарастващ хематом може да **притисне дихателната тръба (трахеята) и да затрудни дишането**; това изисква спешна намеса. Късно установеният хематом може да наруши кръвоснабдяването на кожата и да доведе до проблеми със заздравяването и белезите."
    - name: "Временна слабост в движението на долната устна (клон на лицевия нерв по ръба на долната челюст / шиен клон)"
      text: "При около **1–10 от всеки 100** пациенти едната страна на долната устна може да изглежда асиметрична при усмивка. В повечето случаи това се дължи на разтягане на нерва или на оток и отминава от само себе си в рамките на **няколко седмици до няколко месеца**."
    - name: "Изтичане на слюнка / слюнчена киста (сиалоцеле)"
      text: "При пациенти с частично намалена подчелюстна жлеза слюнка може да изтича от жлезата и да се събира под кожата. Обикновено отзвучава след многократно изтегляне с игла, компресивна превръзка и при нужда лекарства; рядко е необходима допълнителна намеса."
    - name: "Деформация поради прекомерно отстраняване на тъкан"
      text: "Отстраняването на твърде много мазнина или жлезна тъкан може да създаде вдлъбнатина в средата на шията, изпъкнали мускули и „скелетизиран“ вид (деформация тип „кобра“). Корекцията може да изисква инжектиране на собствена мастна тъкан (липофилинг) или нова операция; затова тъканите се отстраняват балансирано и контролирано."
    - name: "Забележими или широки белези"
      text: "Белезите под брадичката и зад ушите рядко могат да се задебелят, разширят или променят цвета си. Лекуват се с инжекции с кортикостероид, силиконов гел или корекция на белега. Ако разрезът зад ухото достига до линията на косата, косата по него може да оредее. Ако разрезите минават около меката част на ухото, рядко тя може да изглежда изтеглена надолу и напред; при нужда се прави малка корекция."
    - name: "Продължително изтръпване"
      text: "Намалената чувствителност на шията и около ухото може да продължи няколко месеца; рядко може да остане частично трайно."
    - name: "Инфекция"
      text: "Среща се при **по-малко от 1 до 2 от всеки 100** пациенти. Обикновено отзвучава с антибиотици; рядко е необходимо дрениране."
  rare:
    - name: "Нарушено кръвоснабдяване на кожата и загуба на тъкан (некроза)"
      text: "Особено при **пушачи**, хора с диабет и пациенти, развили хематом, може да се стигне до разтваряне на раната и загуба на кожа по ръбовете ѝ. Заздравяването се удължава, необходими са превръзки, понякога и допълнителна операция, и може да остане траен белег."
    - name: "Трайно увреждане на нерв"
      text: "Трайна слабост в движението на долната устна се наблюдава при **по-малко от 1 на 100** пациенти. Много рядко могат да бъдат засегнати нервите, които движат езика (подезичен нерв) или осигуряват чувствителността му (езичен нерв), както и нервът, отговорен за чувствителността на ухото и долната му част (голям ушен нерв)."
    - name: "Проблеми с дишането и затруднено преглъщане"
      text: "В много редки случаи при голям хематом или изразен оток може да се наложи спешно осигуряване на дихателните пътища и наблюдение в интензивно отделение. След корекция на дълбоките структури може да има временно затруднение при преглъщане."
    - name: "Нараняване на кръвоносен съд или слюнчен канал"
      text: "Кървене поради нараняване на вените на шията или проблеми с канала на слюнчената жлеза са много редки; могат да изискват допълнително лечение или намеса."
    - name: "Повторно отпускане"
      text: "С годините, със стареенето и промените в теглото шията може отново да се отпусне; това е естествен процес, а не усложнение. С времето вертикалните ивици на шийния мускул също могат отново да станат видими. Изразено ранно отпускане е рядкост."
    - name: "Психологическа неудовлетвореност"
      text: "Въпреки технически успешния резултат човек може трудно да свикне с новия си външен вид. Откритото обсъждане на очакванията преди операцията намалява този риск."

emergency:
  - "**Бързо нарастващ оток, стягане или изразено едностранно подуване** на шията, особено през първите 24–48 часа"
  - "**Затруднено дишане, промяна в гласа, невъзможност за преглъщане** или чувство на задушаване (обадете се незабавно на 112)"
  - "**Кървене, което не спира** под превръзката, или бързо увеличаващо се количество кръв в резервоара на дрена"
  - "**Температура над 38,5 °C**, засилващо се зачервяване, болка, затопляне или гноен секрет от разрезите"
  - "**Потъмняване на кожата, оцветяване в морав до черен цвят** или разтваряне на раната"
  - "Внезапна силна болка или болка, която не се повлиява от обезболяващи"
  - "Задух, болка в гърдите или едностранен оток и болка в крака"

lifestyle:
  - "През първите 2 седмици спете по гръб с повдигната глава; избягвайте прекомерно сгъване на шията, резки движения на главата и навеждане напред."
  - "Носете компресивната превръзка за шията толкова време, колкото ви е препоръчано (обикновено 1–3 седмици)."
  - "Измервайте редовно кръвното си налягане и не пропускайте лекарствата си; избягвайте напъване, вдигане на тежести и неконтролирана кашлица."
  - "През първите 3–4 седмици избягвайте тежки натоварвания, сауна, турска баня и горещ душ."
  - "Пазете белезите от слънце поне 3–6 месеца."
  - "Ако сте пристигнали от чужбина, пътуването със самолет обикновено е безопасно след отстраняване на дрена и първите контролни прегледи, най-често от 5–7-ия ден."

declarations_extra:
  - "Разбирам, че операцията не спира стареенето, че с времето шията може отново да се отпусне и че резултатът е ограничен от качеството на кожата, теглото и костната ми структура."
  - "Разбирам, че контролът на кръвното ми налягане и спазването на следоперативните указания са важни за намаляване на риска от кървене (хематом)."
