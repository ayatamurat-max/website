code: "06"
type: surgical
aesthetic: false
title: "Поставяне на вентилационна тръбичка / Миринготомия"
alt_name: "Поставяне на тръбичка в тъпанчето / разрез на тъпанчето за изтегляне на течност (парацентеза)"

specific_fields:
  - label: "Страна:"
    options: ["Дясно", "Ляво", "Двустранно"]
    blank: false
  - label: "Планирана процедура:"
    options: ["Миринготомия + вентилационна тръбичка", "Само миринготомия (без тръбичка)"]
    blank: false
  - label: "Вид тръбичка:"
    options: ["Краткосрочна тръбичка", "Дългосрочна тръбичка (Т-тръбичка и др.)"]
  - label: "Допълнителни процедури по време на същата операция:"
    options: ["Аденоидектомия", "Тонзилектомия", "Няма"]

about:
  - "Средното ухо е малко пространство зад тъпанчето (тъпанчевата мембрана), което нормално е изпълнено с въздух. То се вентилира чрез **Евстахиевата тръба**, която се отваря в задната част на носа. Когато Евстахиевата тръба не функционира добре (особено при деца — поради уголемени аденоиди, алергия или чести настинки), в средното ухо се **натрупва течност** (секреторен отит)."
  - "Тази течност може да причини **намален слух**, а при децата — **забавяне в развитието на говора и езика**, проблеми с вниманието, нарушено равновесие и **повтарящи се възпаления на ушите**. Ако течността се задържи дълго, тъпанчето може да изтънее, да хлътне и да претърпи трайни промени. Подобни проблеми могат да възникнат и при възрастни, например поради промени в налягането при полет или гмуркане или поради заболявания в задната част на носа."
  - "Целта на процедурата е чрез малък отвор в тъпанчето да се изтегли течността и с поставената в него малка тръбичка да се осигури вентилация на средното ухо — така **слухът се подобрява, а възпаленията стават по-редки.**"

procedure_intro:
  - "При децата процедурата обикновено се извършва под кратка обща анестезия, а при възрастните най-често под местна анестезия. Тя се прави през ушния канал под микроскоп; **отвън няма разрези или белези.**"
procedure_steps:
  - "**Почистване на ушния канал:** Под микроскоп ушният канал се почиства от ушна кал и тъпанчето се оглежда."
  - "**Миринготомия:** На тъпанчето се прави малък разрез с размер около 1–2 мм в участък, където няма да повлияе на слуха."
  - "**Изтегляне на течността:** Течността в средното ухо (която може да бъде бистра, гъста или гнойна) се изтегля с тънка аспирационна канюла. При нужда може да се вземе проба за микробиологично изследване."
  - "**Поставяне на тръбичката:** В разреза се поставя малка тръбичка с форма на макара и размер няколко милиметра. Тя временно поема функцията на Евстахиевата тръба и осигурява вентилация на средното ухо."
  - "**Приключване:** При нужда се поставят ушни капки. Обикновено в ухото не се слага тампон или се поставя само малко памуче."
procedure_notes:
  - "**Краткосрочните тръбички** обикновено се изтласкват от само себе си в рамките на **6–18 месеца**, докато тъпанчето заздравява, и падат в ушния канал; често това остава незабелязано. **Дългосрочните тръбички** остават по-дълго на мястото си и понякога е необходимо да бъдат извадени с отделна процедура."
  - "Когато се извършва само миринготомия (без тръбичка), отворът в тъпанчето се затваря за няколко дни и течността може отново да се натрупа."
anesthesia: "При деца обща анестезия; при възрастни обикновено местна анестезия"
duration: "Около 10–20 минути за двете уши"
stay: "Обикновено изписване в същия ден"

benefits:
  - "Слухът обикновено се подобрява веднага или за кратко време"
  - "При децата — положителен ефект върху говора, езиковото развитие, вниманието и успеха в училище"
  - "По-редки и по-леки възпаления на ушите; когато възникне възпаление, то обикновено може да се лекува с ушни капки вместо с антибиотици през устата"
  - "По-нисък риск от трайно увреждане на тъпанчето; изчезване на усещането за натиск и запушване в ухото"
success:
  - "Докато тръбичката е на мястото си и е проходима, при повечето пациенти слухът се подобрява и възпаленията на ушите стават по-редки. Ако до изпадането на тръбичката Евстахиевата тръба се е развила достатъчно, течността обикновено не се натрупва отново. При някои деца (около **20–30 на 100**) обаче течността се появява отново и може да е необходимо **повторно поставяне на тръбички**."

alternatives:
  - "**Наблюдение:** При много деца течността в средното ухо изчезва сама в рамките на 3 месеца. Ако намаляването на слуха е леко и няма рискови фактори, е възможно наблюдение с редовни слухови изследвания."
  - "**Автоинсуфлация (отоинфлация):** Особено при по-големите деца надуването на специален балон през носа може да помогне за отварянето на Евстахиевата тръба."
  - "**Слухов апарат:** При пациенти, които не желаят или не са подходящи за операция, може да бъде временно решение, докато течността се задържа."
  - "**Медикаментозно лечение:** При наличие на алергия или заболяване на носа и синусите те се лекуват; данните обаче, че антибиотици, кортикостероиди или назални спрейове трайно премахват течността в средното ухо, са ограничени."
  - "**Аденоидектомия:** При подходящи деца може да се препоръча заедно с тръбичките или когато е необходимо повторно поставяне."

no_treatment:
  - "Без процедурата течността може да изчезне сама при някои пациенти; ако обаче се задържи, намаленият слух, забавянето в развитието на говора и езика при децата, проблемите с вниманието и в училище, нарушеното равновесие и повтарящите се възпаления на ушите може да продължат. Продължително задържащата се течност може да доведе до хлътване (ретракция) на тъпанчето, трайни промени в него, увреждане на слуховите костици и рядко до по-сериозни ушни заболявания, налагащи операция, като **холестеатом**."

before:
  - "Преди процедурата се правят изследване на слуха (аудиометрия) и изследване на налягането в средното ухо (тимпанометрия)."
  - "Ако е планирана обща анестезия, ще бъдете прегледани от анестезиолог; през последните **6 часа** преди операцията не трябва да се дава твърда храна и мляко, а за бистрите течности спазвайте срока, определен от анестезиолога."
  - "Уведомете ни, ако през последните 2 седмици преди процедурата е имало температура, кашлица или грип; процедурата може да бъде отложена."
  - "Ако има изтичане от ухото или активно възпаление, може да е необходимо то да бъде лекувано преди процедурата."

recovery:
  - when: "Денят на процедурата"
    what: "Повечето пациенти се прибират у дома след няколко часа. Може да има лека болка или усещане за запушване в ухото, които отминават с обикновени обезболяващи. Няколко дни от ухото може да изтича слабо кървениста или водниста секреция. Повечето пациенти **веднага чуват звуците по-силно**; в първите дни това може да е неприятно."
  - when: "Първата седмица"
    what: "Ако лекарят е препоръчал, се използват ушни капки. Децата могат да се върнат на училище/детска градина, а възрастните — на работа след 1–2 дни. Трябва да се внимава в ухото да не попада вода."
  - when: "4–8-а седмица"
    what: "Извършва се първият контролен преглед; проверява се дали тръбичката е на мястото си и е проходима и се повтаря изследването на слуха."
  - when: "Докато тръбичката е на място (6–18 месеца)"
    what: "Препоръчват се контролни прегледи на около **всеки 3–6 месеца**. Възпалението на ухото се проявява с изтичане и обикновено се лекува с ушни капки. Полетите със самолет обикновено се понасят по-леко, докато тръбичката е на място."
  - when: "След изпадане на тръбичката"
    what: "Проверява се дали отворът в тъпанчето се е затворил и дали в средното ухо няма течност; прави се изследване на слуха."

risks:
  expected:
    - "Лека болка и усещане за запушване в ухото (1–2 дни)"
    - "Слабо кървениста или водниста секреция от ухото няколко дни"
    - "Временно усещане, че звуците са много силни или ехтят"
    - "Временно гадене или неспокойствие след обща анестезия"
  common:
    - name: "Изтичане от ухото (оторея)"
      text: "Около **10–25 на 100** пациенти с тръбички имат поне един епизод на изтичане от ухото, обикновено след настинка или попадане на вода в ухото. В повечето случаи отминава за няколко дни с ушни капки с антибиотик. Рядко изтичането може да е упорито и да наложи лекарства през устата, почистване на ухото или изваждане на тръбичката."
    - name: "Бели петна по тъпанчето (тимпаносклероза)"
      text: "Варовикови бели петна по тъпанчето се срещат често (при около **10–30+ на 100** уши). В повечето случаи не влияят на слуха."
    - name: "Ранно изпадане или запушване на тръбичката"
      text: "Тръбичката може да изпадне по-рано от очакваното или да се запуши от засъхнала кръв или секрет. В такъв случай се опитва отпушване с капки; при нужда тръбичката се сменя."
    - name: "Необходимост от повторно поставяне"
      text: "Ако след изпадането на тръбичката течността се натрупа отново, при около **20–30 на 100** деца може да е необходимо второ поставяне на тръбички (понякога заедно с аденоидектомия)."
  uncommon:
    - name: "Трайна перфорация (дупка) на тъпанчето"
      text: "След изпадането на тръбичката отворът в тъпанчето може да не се затвори: при около **1–3 на 100** пациенти с краткосрочни тръбички и по-често при дългосрочните (около **10–20 на 100**). Малките перфорации често не причиняват оплаквания; ако водят до повтарящо се изтичане или намален слух, може да е необходимо **затварянето им с отделна операция (тимпанопластика/мирингопластика)**."
    - name: "Изтъняване или хлътване на тъпанчето"
      text: "На мястото на тръбичката тъпанчето може да изтънее или да хлътне навътре; може да е необходимо проследяване."
    - name: "Тръбичката не изпада"
      text: "Ако тръбичката не изпадне в очаквания срок (обикновено ако остане повече от 2–3 години), може да се наложи да бъде извадена с кратка процедура; при децата тя обикновено се извършва под обща анестезия."
    - name: "Разрастване на тъкан в ушния канал (гранулации)"
      text: "Около тръбичката може да се образува червена възпалителна тъкан; тя може да причини кървениста секреция и се лекува с капки или с малка процедура."
  rare:
    - name: "Попадане на тръбичката в средното ухо"
      text: "Много рядко, вместо да изпадне навън, тръбичката може да се плъзне зад тъпанчето в средното ухо; за изваждането ѝ може да е необходима отделна процедура."
    - name: "Холестеатом"
      text: "Заболяване, подобно на киста, което се образува, когато кожният слой на тъпанчето врасне в средното ухо. Във връзка с поставянето на тръбички се среща **много рядко**. Ако се развие, е необходимо хирургично лечение."
    - name: "Загуба на слуха, шум в ухото или световъртеж"
      text: "Трайна загуба на слуха, шум в ухото или световъртеж поради засягане на вътрешното ухо или слуховите костици са **изключително редки**."
    - name: "Нараняване на ушния канал и кървене"
      text: "При тесен ушен канал може да се получат малки наранявания; много рядко са описани сериозни увреждания, свързани с анатомични варианти на лицевия нерв, вътрешното ухо или големите кръвоносни съдове."

emergency:
  - "Обилно изтичане или изтичане с неприятна миризма от ухото, което продължава **повече от 3–5 дни** въпреки капките"
  - "**Температура над 38,5 °C**, силна болка в ухото"
  - "Зачервяване или оток зад ухото, изместване на ушната мида напред"
  - "**Внезапна загуба на слуха**, силен световъртеж, нестабилност или повръщане"
  - "Асиметрия на лицето, увисване на ъгъла на устата или невъзможност за затваряне на окото"
  - "Обилно кървене от ухото"

lifestyle:
  - "Докато тръбичката е на място, **избягвайте попадане на мръсна вода (езеро, море, басейн, вода от вана) в ухото.** Под душа и във ваната може да се използва памук, намазан с вазелин, или тапи за уши. Относно плуването следвайте съвета на лекаря; обикновено е разрешено плуване на повърхността с тапи за уши и/или шапка за плуване, но гмуркането не се препоръчва."
  - "Не почиствайте вътрешността на ушния канал с клечки за уши."
  - "При изтичане от ухото внимателно забършете секрета отвън, използвайте препоръчаните ви капки и уведомете лекаря. Не използвайте сами други ушни капки; някои капки не са подходящи за средното ухо."
  - "Продължавайте да идвате на контролни прегледи и след изпадането на тръбичката; важно е да се проследяват слухът и състоянието на тъпанчето."

declarations_extra:
  - "Разбирам, че тръбичката ще изпадне сама след определено време, че при повторно натрупване на течност може да е необходимо ново поставяне и че ако в тъпанчето остане трайна перфорация, за затварянето ѝ може да е необходима отделна операция."
