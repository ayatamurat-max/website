code: "08"
type: surgical
aesthetic: false
title: "Удаление поднижнечелюстной слюнной железы"
alt_name: "Удаление слюнной железы, расположенной под нижней челюстью"

specific_fields:
  - label: "Сторона:"
    options: ["Правая", "Левая"]
    blank: false
  - label: "Причина операции:"
    options: ["Камень слюнной железы / повторяющееся воспаление", "Образование в железе", "Другое"]
  - label: "Мониторинг нерва:"
    options: ["Будет использоваться", "Не будет использоваться"]
    blank: false
  - label: "Результат визуализации / биопсии:"

about:
  - "Поднижнечелюстная железа — это слюнная железа, которая расположена с каждой стороны сразу под нижней челюстью и выделяет слюну в полость рта. Она вырабатывает значительную часть слюны; однако, поскольку такая же железа с другой стороны, а также слюнные железы перед ушами и под языком продолжают работать, **удаление одной железы у большинства пациентов не вызывает сухости во рту**."
  - "Эту операцию чаще всего выполняют из-за **камней слюнной железы** и вызванных ими **повторяющихся отёков и воспалений**. Камень препятствует оттоку слюны в рот, из-за чего во время еды под челюстью возникает болезненный отёк и случаются повторные инфекции. Реже операция требуется при **образовании (опухоли)** в железе. Среди образований поднижнечелюстной железы доля злокачественных опухолей выше, чем среди образований околоушной железы; поэтому для окончательного диагноза важно удалить железу и исследовать её под микроскопом."
  - "Рядом с железой проходят три нерва: ветвь нерва, которая двигает нижнюю губу, нерв, обеспечивающий чувствительность языка, и нерв, который двигает язык. Цель операции — полностью удалить железу, сохранив эти нервы."

procedure_intro:
  - "Операция проводится под общим наркозом в условиях операционной."
procedure_steps:
  - "**Разрез:** Примерно на 2–3 см ниже края нижней челюсти, параллельно естественной кожной складке шеи, делается разрез длиной обычно 4–6 см. Расположение разреза достаточно низко под челюстью помогает защитить ветвь нерва, которая двигает нижнюю губу."
  - "**Защита нервов:** Рассекают тонкий мышечный слой под кожей (платизму). Ветвь нерва, которая двигает нижнюю губу (краевая ветвь нижней челюсти), защищают — либо визуально контролируя её, либо работая в безопасном слое тканей."
  - "**Удаление железы:** Железу отделяют от окружающих тканей и перевязывают питающие её сосуды. Слюнной проток аккуратно отделяют от нерва, обеспечивающего чувствительность языка (язычного нерва), затем перевязывают и пересекают. Нерв, который двигает язык (подъязычный нерв), сохраняют. Если в протоке есть камень, по возможности удаляют и дальнюю часть протока."
  - "**Патогистологическое исследование:** Удалённую железу отправляют на патогистологическое исследование; результат обычно готов в течение 1–2 недель."
  - "**Завершение операции:** Проводится остановка кровотечения, обычно устанавливается тонкий **дренаж**, и кожу зашивают косметическими швами."
procedure_notes:
  - "Если в полости рта рядом с местом, где проток открывается в рот, находится камень, иногда его могут дополнительно удалить отдельно через рот. Это будет обсуждено с вами до операции."
anesthesia: "Общий наркоз"
duration: "Около 1–2 часов"
stay: "Обычно 1 ночь; выписка после удаления дренажа"

benefits:
  - "Прекращение повторяющихся болезненных отёков и воспалений, вызванных камнями"
  - "Отсутствие необходимости в повторных курсах антибиотиков"
  - "Удаление образования в железе и установление окончательного диагноза"
success:
  - "После операции по поводу камней и хронического воспаления жалобы полностью проходят у **более чем 90%** пациентов. Если в части протока, оставшейся во рту, сохраняется камень или образуется новый, в редких случаях отёк дна полости рта может сохраняться. При доброкачественных образованиях операция обычно обеспечивает стойкое излечение; при злокачественных опухолях может потребоваться дополнительное лечение."

alternatives:
  - "**Медикаментозное и поддерживающее лечение:** Обильное питьё, кислые продукты для усиления слюноотделения, массаж, тёплые компрессы и антибиотики в периоды воспаления. Это может облегчить жалобы, но не устраняет камень."
  - "**Удаление камня через рот:** Камни, расположенные в части протока ближе ко рту и прощупываемые пальцем, можно удалить через небольшой разрез в полости рта с сохранением железы."
  - "**Эндоскопия слюнного протока (сиалоэндоскопия):** Камни подходящего размера и расположения можно удалить изнутри протока с помощью тонкого эндоскопа; этот метод доступен не в каждом центре и подходит не для каждого камня."
  - "**Наблюдение:** При небольших образованиях, которые считаются доброкачественными, в редких случаях может обсуждаться наблюдение; однако для окончательного диагноза при образованиях этой железы обычно рекомендуется операция."

no_treatment:
  - "Без операции отёки и воспаления, вызванные камнями, могут продолжать повторяться; в редких случаях вокруг железы может развиться абсцесс (скопление гноя), требующий неотложного лечения. Если в железе есть образование, окончательный диагноз поставить нельзя; злокачественная опухоль без лечения может прогрессировать."

before:
  - "Перед операцией выполняются анализы крови и визуализирующие исследования (УЗИ и при необходимости КТ/МРТ); вас осмотрит анестезиолог."
  - "В течение **6–8 часов** до операции нельзя ничего есть и пить (пожалуйста, следуйте указаниям анестезиолога)."
  - "Если в железе есть активное воспаление, операцию обычно планируют после того, как воспаление будет вылечено."
  - "У мужчин в день операции могут подстричь бороду в зоне разреза."

recovery:
  - when: "Первые 24–48 часов"
    what: "Под челюстью будут ощущаться лёгкая или умеренная боль, стянутость и отёк, которые контролируются обезболивающими. При глотании может быть небольшой дискомфорт. Дренаж обычно удаляют на 1-й день. Рекомендуется спать с приподнятой головой. Мягкую пищу можно начинать есть сразу."
  - when: "1-я неделя"
    what: "Вы можете вернуться к повседневным делам. Швы обычно снимают на **5–7-й день**. Онемение выше разреза, вдоль края нижней челюсти и вокруг разреза — это нормально. Результат патогистологического исследования вам сообщат в этот период или вскоре после него."
  - when: "2–4-я недели"
    what: "Большинство людей возвращаются к сидячей работе в течение 1 недели. Интенсивные физические нагрузки и подъём тяжестей следует отложить примерно на **2 недели**. Уплотнение и небольшой отёк в области разреза постепенно уменьшаются."
  - when: "2–6-й месяцы"
    what: "Рубец постепенно светлеет и часто становится незаметным в кожной складке шеи. Если была временная слабость нерва или снижение чувствительности, они обычно проходят в этот период."

risks:
  expected:
    - "Боль, стянутость и отёк под челюстью; лёгкий дискомфорт при глотании"
    - "Онемение кожи вокруг и ниже разреза"
    - "Рубец на шее (со временем светлеет)"
  common:
    - name: "Временная слабость нижней губы"
      text: "Из-за натяжения во время операции ветви нерва, которая опускает нижнюю губу (краевой ветви нижней челюсти), примерно у **10–20 из 100** пациентов при улыбке или разговоре возникает лёгкая асимметрия нижней губы на этой стороне. Это косметическая проблема, обычно она не мешает есть и пить и в большинстве случаев **проходит в течение нескольких недель или нескольких месяцев**."
    - name: "Уплотнение и онемение в области разреза"
      text: "В первые недели уплотнение и снижение чувствительности ниже разреза встречаются часто и уменьшаются в течение нескольких месяцев."
  uncommon:
    - name: "Кровотечение и гематома"
      text: "Примерно у **1–3 из 100** пациентов под кожей может скопиться кровь. Если гематома большая, может потребоваться её удаление и остановка кровотечения в операционной."
    - name: "Раневая инфекция"
      text: "Может возникнуть у **1–3 из 100** пациентов, особенно если железа была воспалена; обычно проходит при лечении антибиотиками, в редких случаях требуется дренирование."
    - name: "Снижение чувствительности одной половины языка"
      text: "Из-за воздействия на нерв, обеспечивающий чувствительность языка (язычный нерв), онемение или покалывание на этой стороне языка возникает примерно у **1–3 из 100** пациентов. Чаще всего это временно; в редких случаях может быть стойким и также влиять на восприятие вкуса."
    - name: "Скопление жидкости (серома)"
      text: "Скопление жидкости под разрезом; обычно проходит после откачивания иглой и наложения давящей повязки."
    - name: "Камень, оставшийся в протоке"
      text: "В части слюнного протока, оставшейся во рту, может сохраниться камень или образоваться новый, что может вызвать отёк или воспаление дна полости рта. При необходимости его удаляют через рот с помощью небольшой процедуры."
    - name: "Заметный или грубый рубец"
      text: "В зависимости от индивидуальной предрасположенности рубец может утолщаться или оставаться заметным; можно применять методы лечения рубцов."
    - name: "Западение под челюстью"
      text: "На месте железы может образоваться небольшое углубление и разница между двумя сторонами; обычно это незаметно."
  rare:
    - name: "Стойкая слабость нижней губы"
      text: "**Примерно у 1–3 из 100** пациентов или реже может остаться стойкое ограничение подвижности нижней губы на этой стороне и асимметрия улыбки. Если это заметно, можно применить лечение, например уравновешивание другой стороны с помощью ботулотоксина."
    - name: "Слабость движений языка"
      text: "Повреждение нерва, который двигает язык (подъязычного нерва), встречается **очень редко**. Если оно происходит, может возникнуть слабость этой половины языка и затруднения речи и глотания; при стойком повреждении может потребоваться логопедическая терапия речи и глотания."
    - name: "Большая гематома шеи с нарушением проходимости дыхательных путей"
      text: "Очень редко быстро увеличивающееся скопление крови может сдавливать шею и вызывать затруднение глотания или **дыхания**. Это неотложное состояние: гематому необходимо немедленно удалить в операционной, а в редких случаях может потребоваться обеспечение проходимости дыхательных путей (интубация или трахеостомия)."
    - name: "Окончательный патогистологический диагноз отличается от предварительного"
      text: "Даже в железе, в которой предполагались камни или воспаление, окончательное патогистологическое заключение может выявить неожиданную опухоль. Если обнаружена злокачественная опухоль, может потребоваться дополнительное лечение, например удаление лимфатических узлов шеи или лучевая терапия."
    - name: "Сухость во рту"
      text: "У большинства пациентов удаление одной железы проходит незамеченным; однако сухость во рту может стать заметной у пациентов, ранее получавших лучевую терапию, страдающих некоторыми ревматическими заболеваниями или принимающих лекарства, вызывающие сухость во рту."

emergency:
  - "**Быстро нарастающий отёк шеи**, особенно с **затруднением дыхания или глотания** (неотложное состояние — немедленно звоните 112)"
  - "**Непрекращающееся кровотечение** из дренажа или раны"
  - "**Температура выше 38,5 °C**, нарастающее покраснение, боль, ощущение жара или гнойное отделяемое из раны"
  - "Выраженный отёк языка или дна полости рта"
  - "**Новое выраженное затруднение** речи или глотания"

lifestyle:
  - "В первые 48 часов держите рану сухой; после этого можно принять короткий душ, как вам объяснят."
  - "В первые дни выбирайте мягкую, тёплую (не горячую) пищу; следите за гигиеной полости рта и пейте много жидкости."
  - "Защищайте рубец от солнца не менее 6 месяцев (солнцезащитный крем с высоким фактором защиты)."
  - "Обязательно обсудите с врачом результат патогистологического исследования и план дальнейшего наблюдения."

declarations_extra:
  - "Я понимаю, что окончательный диагноз будет поставлен после операции по результатам патогистологического исследования и что в зависимости от результата может потребоваться дополнительное лечение."
