code: "12"
type: surgical
aesthetic: true
title: "Deep Neck Lift"
alt_name: "Neck lift that also treats the deeper structures of the neck (deep-plane neck lift)"

specific_fields:
  - label: "Planned components:"
    options: ["Platysmaplasty", "Deep fat removal", "Digastric reduction", "Submandibular gland reduction", "Skin excision"]
    blank: false
  - label: "Simultaneous facelift:"
    options: ["No", "Yes (with a separate consent form)"]
  - label: "Other procedures to be performed at the same time:"
  - label: "Patient's concerns and expectations:"

about:
  - "With age, weight changes or inherited features, the neck may develop **fullness under the chin**, loss of the angle between the jaw and the neck, **vertical bands** (bands of the platysma muscle) and **loose skin**. This appearance is often caused not only by fat under the skin, but also by **deep fat beneath the neck muscle, the muscles under the chin (digastric muscles) and sagging of the salivary glands (submandibular glands)**."
  - "A deep neck lift addresses these deeper structures as well, with the aim of defining the jawline and achieving a **younger, sharper and natural-looking** neck. The result depends on your skin elasticity, bone structure, weight and age. The operation does not stop ageing; the neck will continue to relax gradually over time."

procedure_intro:
  - "The operation is usually performed under general anaesthesia in an operating theatre. Beforehand, your neck is examined while you sit and stand, photographed and marked, and the structures to be treated are agreed with you."
procedure_steps:
  - "**Incisions:** An incision of about 3–5 cm is made in the natural crease under the chin. If excess skin is to be removed, incisions are added around the earlobe, extending behind the ear towards the hairline. Incisions are hidden in natural creases and within the hair as far as possible."
  - "**Lifting the skin:** The skin of the neck is gently separated from the muscle beneath; if needed, the superficial fat is thinned evenly."
  - "**Removing deep fat:** The deep fat lying beneath the neck muscle (platysma), which cannot be reached by liposuction from the outside, is reduced in a controlled way."
  - "**Digastric muscles and submandibular glands:** If needed, the front part of the digastric muscle that causes fullness under the chin is thinned. If a salivary gland (submandibular gland) is sagging and prominent, the protruding part may be partially reduced; the gland is not removed completely."
  - "**Platysmaplasty:** The edges of the platysma muscle, which have separated in the middle of the neck and form bands, are stitched together to create an “internal corset”; if needed, the muscle is also suspended from the sides."
  - "**Removing excess skin and closure:** The skin is redraped upwards and backwards without tension and the excess is removed. Bleeding is carefully controlled, a **drain** (a thin tube to remove fluid) is usually placed, the incisions are closed with fine stitches and a neck dressing is applied."
procedure_notes:
  - "The planned components vary from person to person; not every step is performed in every patient. If a facelift is to be performed at the same time, a **separate consent form** will be signed for it."
anesthesia: "General anaesthesia (in selected patients, sedation + local anaesthesia)"
duration: "About 2–4 hours (longer with combined procedures)"
stay: "Usually one night in hospital"

benefits:
  - "A more defined jawline and angle between the jaw and the neck"
  - "Less fullness under the chin and fewer vertical neck bands"
  - "Tightening of loose neck skin and a younger, fresher appearance"
success:
  - "Most suitably selected patients are satisfied with the result. Most of the swelling settles in the first 4–6 weeks; the final result is seen within **6–12 months**. Results may be more limited in patients with poor skin quality, older age, major weight loss or previous neck surgery. About **5–10 in every 100** patients may need a small correction (touch-up) procedure."

alternatives:
  - "**Not having surgery:** As this is a cosmetic procedure, you always have the option not to have it."
  - "**Submental (chin) liposuction alone:** May be enough for people with good skin elasticity whose fullness is due only to fat under the skin; it does not correct deep fat, muscles or glands."
  - "**Fat-dissolving injections (deoxycholic acid) or energy-based devices (radiofrequency, ultrasound):** Provide limited improvement in mild fullness and laxity; several sessions are usually needed."
  - "**Botulinum toxin to soften platysmal bands:** Reduces the bands temporarily (3–4 months); it does not correct sagging or fat."
  - "**A more limited neck lift:** Smaller operations that only remove excess skin or only include platysmaplasty; their effect is more limited."

no_treatment:
  - "If the operation is not performed, the current appearance of your neck will remain and natural ageing will continue. This does not pose a risk to your health."

before:
  - "Blood tests and, if needed, an ECG and other investigations are performed before surgery; you will be assessed by the anaesthetist."
  - "**It is very important that your blood pressure is well controlled.** High blood pressure significantly increases the risk of a collection of blood in the neck (haematoma) after surgery. Ask the anaesthetist whether you should also take your blood pressure medicine on the morning of surgery (with a sip of water)."
  - "Do not eat or drink anything for **6–8 hours** before surgery (follow the anaesthetist's instructions)."
  - "Avoid strenuous exercise, saunas and heavy alcohol intake before surgery. Do not wear make-up, jewellery or necklaces on the day of surgery; bring a front-buttoning top that does not need to be pulled over your head."
  - "It is recommended that someone stays with you for the first 24–48 hours after surgery."

recovery:
  - when: "First 24–48 hours"
    what: "There will be a dressing and a drain on your neck. You will have swelling, tightness and discomfort when swallowing; pain is usually mild to moderate. It is important to sleep with your head raised (30–45°), not to bend your neck excessively and to avoid rises in blood pressure (no straining, keep any cough under control). The drain is usually removed on **day 1–2**."
  - when: "Week 1"
    what: "Swelling, and bruising **if it occurs**, are most noticeable at this stage and then start to settle. Numbness of the neck and under the chin is normal. The **neck garment/dressing** is worn day and night as advised. Stitches are removed on **days 5–10**."
  - when: "Weeks 2–4"
    what: "Most patients return to desk work and social life within 10–14 days. Firmness, a feeling of unevenness and tightness in the neck may continue. Strenuous exercise, bending, lifting and movements that strain the neck should be avoided for at least **3–4 weeks**."
  - when: "Months 1–3"
    what: "Remaining swelling and firmness gradually decrease. Numbness largely improves. Scars may be pink and slightly raised during this period."
  - when: "Months 6–12"
    what: "The final appearance is seen; scars fade and become finer. If a touch-up is considered necessary, it is usually done after at least 6 months."

risks:
  expected:
    - "Swelling of the neck and under the chin; bruising, **if it occurs**, settles within 1–3 weeks"
    - "Temporary numbness of the neck skin and around the ears"
    - "Tightness and firmness in the neck, and mild discomfort when swallowing"
    - "Mild pain, itching and pink scars at the incision sites"
    - "Unevenness and firm areas that can be felt under the skin in the first few weeks"
  common:
    - name: "Prolonged swelling and firmness"
      text: "Firmness of the neck and under the chin may last several months; it improves with massage and time."
    - name: "Minor asymmetry and contour irregularities"
      text: "Slight differences between the two sides of the neck or small dips/bumps under the skin may remain; most soften with time, some may need a small correction."
    - name: "Seroma (fluid collection)"
      text: "A collection of clear fluid under the skin; usually treated by draining it with a needle in the clinic."
    - name: "Need for a touch-up"
      text: "About **5–10 in every 100** patients may need a small correction for residual fullness, irregularity or scarring."
  uncommon:
    - name: "Haematoma (collection of blood in the neck)"
      text: "Occurs in about **2–5 in every 100** patients; it is more common **in men and in people with high blood pressure** and usually appears within the first 24 hours. Small haematomas can be drained with a needle; large ones require a **return to the operating theatre** to remove the blood and stop the bleeding. A rapidly enlarging haematoma can **press on the windpipe and make breathing difficult**; this requires emergency treatment. A haematoma that is recognised late can impair the blood supply to the skin and lead to wound and scarring problems."
    - name: "Temporary weakness of lower-lip movement (marginal mandibular / cervical branch of the facial nerve)"
      text: "In about **1–10 in every 100** patients, one side of the lower lip may look asymmetric when smiling. Most cases are due to stretching of the nerve or swelling and recover on their own within **a few weeks to a few months**."
    - name: "Saliva leak / saliva collection (sialocele)"
      text: "In patients whose submandibular gland has been reduced, saliva may leak from the gland and collect under the skin. It usually resolves with repeated needle drainage, a pressure dressing and, if needed, medication; rarely a further procedure is needed."
    - name: "Deformity from excessive tissue removal"
      text: "Removing too much fat or gland tissue can create a hollow in the middle of the neck, prominent muscles and a “skeletonised” look (“cobra neck” deformity). Correction may require fat grafting or further surgery; for this reason tissue removal is performed in a balanced and controlled way."
    - name: "Noticeable or wide scars"
      text: "Scars under the chin and behind the ears may rarely thicken, widen or change colour. They can be treated with steroid injections, silicone gel or scar revision. If the incision behind the ear extends to the hairline, hair may thin along it. If incisions are made around the earlobe, the earlobe may rarely look pulled down and forwards; a minor correction can be made if needed."
    - name: "Prolonged numbness"
      text: "Reduced sensation of the neck and around the earlobe may last several months; rarely it may be partly permanent."
    - name: "Infection"
      text: "Occurs in **anywhere from fewer than 1 to 2 in every 100** patients. It usually settles with antibiotics; rarely drainage is needed."
  rare:
    - name: "Impaired skin blood supply and tissue loss (necrosis)"
      text: "Especially in **smokers**, people with diabetes and patients who develop a haematoma, wound breakdown and loss of skin at the edges may occur. Healing is prolonged, dressings and sometimes further surgery are needed, and a permanent scar may remain."
    - name: "Permanent nerve damage"
      text: "Permanent weakness of lower-lip movement occurs in **fewer than 1 in 100** patients. Very rarely the nerves that move the tongue (hypoglossal nerve) or give sensation to the tongue (lingual nerve), or the nerve supplying sensation to the earlobe (great auricular nerve), may be affected."
    - name: "Airway problems and swallowing difficulty"
      text: "In very rare cases due to a large haematoma or marked swelling, the airway may need to be secured as an emergency, followed by monitoring in intensive care. Temporary difficulty swallowing may occur after the deep structures are corrected."
    - name: "Injury to a blood vessel or salivary duct"
      text: "Bleeding from injury to the neck veins or problems with the salivary gland duct are very rare; they may require further treatment or a procedure."
    - name: "Recurrent sagging"
      text: "Over the years the neck may relax again with ageing and weight changes; this is a natural process, not a complication. The neck muscle bands may also become visible again over time. Marked early laxity is rare."
    - name: "Psychological dissatisfaction"
      text: "Despite a technically successful result, a person may find it difficult to adjust to their new appearance. Discussing expectations openly before surgery reduces this risk."

emergency:
  - "**Rapidly increasing swelling, tightness or marked one-sided enlargement** of the neck, especially in the first 24–48 hours"
  - "**Difficulty breathing, a change in your voice, inability to swallow** or a choking sensation (call 112 without delay)"
  - "**Bleeding that does not stop** under the dressing, or blood increasing rapidly in the drain bottle"
  - "**Fever above 38.5 °C**, increasing redness, pain, warmth or pus at the incision sites"
  - "**Darkening, purple-black discolouration** of the skin, or the wound opening up"
  - "Sudden severe pain, or pain that does not respond to painkillers"
  - "Shortness of breath, chest pain, or one-sided swelling and pain in a leg"

lifestyle:
  - "For the first 2 weeks sleep on your back with your head raised; avoid bending your neck excessively, sudden head and neck movements and leaning forward."
  - "Wear the neck garment/dressing for the period advised (usually 1–3 weeks)."
  - "Check your blood pressure regularly and do not miss your medicines; avoid straining, heavy lifting and uncontrolled coughing."
  - "Avoid strenuous exercise, saunas, Turkish baths and hot showers for the first 3–4 weeks."
  - "Protect your scars from the sun for at least 3–6 months."
  - "If you have travelled from abroad, flying is usually safe once the drain has been removed and the first check-ups are complete, generally from day 5–7."

declarations_extra:
  - "I understand that the operation does not stop ageing, that the neck may relax again over time, and that the result is limited by my skin quality, weight and bone structure."
  - "I understand that keeping my blood pressure under control and following the post-operative instructions are important to reduce the risk of bleeding (haematoma)."
