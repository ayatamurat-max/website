code: "18"
type: surgical
aesthetic: false
title: "Тимпанопластика"
alt_name: "Възстановяване на тъпанчето (при нужда с възстановяване на слуховите костици и мастоидектомия)"

specific_fields:
  - label: "Страна:"
    options: ["Дясна", "Лява"]
    blank: false
  - label: "Визуализация:"
    options: ["С микроскоп", "Ендоскопски", "Ще се определи по време на операцията"]
  - label: "Достъп:"
    options: ["Трансканален (през слуховия проход)", "Ретроаурикуларен (зад ухото)", "Ендаурален (пред ухото)"]
  - label: "Източник на присадката:"
    options: ["Обвивка на слепоочния мускул (темпорална фасция)", "Хрущял / перихондриум", "Друго"]
  - label: "Възстановяване на слуховите костици (осикулопластика):"
    options: ["Не се планира", "Планира се", "При нужда"]
  - label: "Мастоидектомия:"
    options: ["Не се планира", "Планира се", "При нужда"]
  - label: "Дата и резюме на предоперативното изследване на слуха (аудиометрия):"

about:
  - "Тъпанчето (тъпанчевата мембрана) е тънка преграда, която отделя външния слухов проход от средното ухо и предава звуковите трептения към малките костици (слухови костици) в средното ухо. Когато в тъпанчето има **отвор (перфорация)**, слухът намалява, а навлизането на вода или микроби в ухото води до **повтарящо се течение (секреция) от ухото**."
  - "Перфорациите на тъпанчето най-често се дължат на **хронично възпаление на средното ухо (хроничен среден отит)**, а понякога и на травма (шамар, клечка за уши, внезапна промяна на налягането). Малките, скорошни перфорации могат да се затворят спонтанно; дълго съществуващите отвори обаче обикновено не се затварят. При някои пациенти възпалението може да е увредило и слуховите костици или да се е разпространило в костните кухини зад ухото (мастоида). Ако в средното ухо има **холестеатом** (торбичка от кожни клетки, която расте и разрушава костта), неговото лечение е особено важно."
  - "Целта на тимпанопластиката е да се затвори отворът в тъпанчето, средното ухо да се очисти от възпалението, за да се постигне **сухо и безопасно ухо**, и по възможност **слухът да се запази или подобри**."

procedure_intro:
  - "Операцията се извършва под обща анестезия в операционна зала, с помощта на микроскоп и/или ендоскоп."
procedure_steps:
  - "**Достъп:** Ако перфорацията е малка и на подходящо място, операцията може да се извърши изцяло през слуховия проход, без видим белег. При по-големи перфорации или когато е нужен по-добра видимост, се прави малък разрез зад ухото (в гънката зад ушната мида) или пред ухото."
  - "**Вземане на присадка:** За възстановяване на тъпанчето се използва собствена тъкан на пациента: обикновено обвивката на мускула над ухото (темпорална фасция) или хрущял от ушната мида заедно с обвивката му (перихондриум). Тези тъкани се вземат през същия или през малък допълнителен разрез."
  - "**Почистване на средното ухо:** Ръбовете на перфорацията се освежават, тъпанчето се повдига и средното ухо се оглежда; възпалената тъкан и срастванията, ако има такива, се отстраняват. Проверяват се слуховите костици."
  - "**Възстановяване на костиците (при нужда):** Ако веригата от слухови костици е разрушена или прекъсната, тя може да бъде възстановена със собствена костица/хрущял на пациента или с биосъвместима протеза, например от титан."
  - "**Мастоидектомия (при нужда):** Ако възпалението или холестеатомът са се разпространили в костните кухини зад ухото, те се отварят и почистват със специална бормашина."
  - "**Поставяне на присадката и затваряне:** Присадката се поставя под или над перфорацията. Средното ухо и слуховият проход се поддържат с разтварящи се гъбести тампони. Разрезът, ако има такъв, се зашива и върху ухото се поставя компресивна превръзка."
procedure_notes:
  - "Ако се установи холестеатом, при някои пациенти може да се планира **втора, контролна операция след 6–12 месеца**, за да се потвърди, че заболяването е напълно отстранено. Това ще ви бъде обяснено отделно."
anesthesia: "Обща анестезия"
duration: "Около 1,5–3 часа (по-дълго при мастоидектомия)"
stay: "Обикновено изписване в същия ден или след 1 нощ в болница"

benefits:
  - "Затваряне на отвора в тъпанчето"
  - "Намаляване или прекратяване на течението от ухото и на възпаленията; сухо и безопасно ухо"
  - "По-малко ограничения за предпазване на ухото при къпане, душ и плуване"
  - "Запазване или подобряване на слуха при подходящи пациенти"
  - "При наличие на холестеатом — отстраняване на заболяването и предотвратяване на възможните му сериозни усложнения"
success:
  - "Трайно затваряне на перфорацията се постига при около **85–95%** от пациентите. Подобряването на слуха зависи от състоянието на слуховите костици, разпространението на възпалението и здравето на вътрешното ухо; слухът може значително да се подобри, да остане същият или рядко да се влоши. Ако присадката не се прихване или се образува нова перфорация, операцията може да бъде повторена."

alternatives:
  - "**Наблюдение и предпазване на ухото от вода:** При малки, сухи перфорации състоянието може да се проследява с редовни прегледи и предпазване на ухото от вода. Отворът остава и рискът от възпаление продължава."
  - "**Медикаментозно лечение:** При обостряне с течение от ухото антибиотичните капки за уши временно овладяват възпалението; те не затварят отвора."
  - "**Слухов апарат:** Може да компенсира загубата на слуха; при течащо ухо обаче използването му може да е затруднено и той не затваря отвора."
  - "**Обикновено „закърпване“ при малки перфорации:** При много малки отвори може да се обсъди затваряне с хартиена лепенка или мастна тъкан (мирингопластика)."

no_treatment:
  - "Без операция отворът в тъпанчето обикновено остава. При попадане на вода в ухото или при настинки течението от ухото може да се повтаря, а с времето загубата на слуха може да се задълбочи. Нелекуваният холестеатом продължава да расте и може да доведе до сериозни усложнения като **трайна загуба на слуха, световъртеж, парализа на лицевия нерв, менингит или мозъчен абсцес**."

before:
  - "Преди операцията се прави изследване на слуха (аудиометрия) и при нужда компютърна томография. Ще бъдете прегледани от анестезиолог."
  - "Не трябва да ядете и пиете нищо **6–8 часа** преди операцията (следвайте указанията на анестезиолога)."
  - "Ако ухото тече активно, преди операцията може да се наложи то да бъде „изсушено“ с капки."
  - "В деня на операцията косата зад ухото може да бъде леко скъсена. При грип или инфекция на горните дихателни пътища операцията може да бъде отложена."

recovery:
  - when: "Първите 24–48 часа"
    what: "Усещането за пълнота, лека болка и запушване на ухото е нормално и се овладява с обезболяващи. Може да има кратко леко замайване и гадене. Компресивната превръзка обикновено се сваля на 1-вия ден. Избягвайте да лежите върху оперираното ухо."
  - when: "1–2-ра седмица"
    what: "Поради тампоните в слуховия проход слухът в този период ще ви се струва **намален**; това е нормално. Може да има слаба кървениста секреция от ухото. Конците обикновено се свалят на **7–10-ия ден**. Повечето хора се връщат на офис работа в рамките на 1 седмица."
  - when: "3–6-а седмица"
    what: "Тампоните в слуховия проход се почистват при контролните прегледи или се разтварят сами. В ухото в никакъв случай не трябва да попада вода. Тежките физически натоварвания, вдигането на тежести и напъването трябва да се отложат за около **4–6 седмици**. Пътуване със самолет обикновено е възможно **след 2–4 седмици** с одобрението на лекаря."
  - when: "2–3-ти месец"
    what: "При контролните прегледи се оценява дали присадката се е прихванала. Изследването на слуха в този период показва ефекта на операцията върху слуха. Плуването и контактът на ухото с вода обикновено се разрешават след одобрение от лекаря."
  - when: "6–12-и месец"
    what: "Тъпанчето и средното ухо завършват заздравяването си. След операция за холестеатом се планират редовни прегледи и при нужда образни изследвания или втора, контролна операция."

risks:
  expected:
    - "Усещане за пълнота и запушване на ухото и намален слух през първите седмици (поради тампоните в слуховия проход)"
    - "Лека болка в ухото, пукане, усещане за плискане на вода или бучене"
    - "Слаба кървениста секреция от ухото (първите дни)"
    - "Временно изтръпване на ушната мида и около разреза; ушната мида може да изглежда леко избутана напред (при достъп зад ухото, отзвучава за седмици)"
  common:
    - name: "Промяна във вкуса"
      text: "Вкусовият нерв (тъпанчева струна, chorda tympani), който минава непосредствено зад тъпанчето, може да бъде разтегнат по време на операцията или рядко да се наложи да бъде прерязан. При около **5–20 от 100** пациенти се появява метален вкус, намален вкус или усещане за сухота от тази страна на езика; обикновено **отзвучава или престава да се усеща в рамките на седмици до месеци**. Рядко може да е трайно."
    - name: "Шум в ушите (тинитус)"
      text: "След операцията може да се появи шум в ухото или съществуващият шум да се засили за известно време; обикновено е временен."
    - name: "Временен световъртеж"
      text: "През първите дни може да има лека нестабилност или световъртеж; обикновено отзвучава за няколко дни."
  uncommon:
    - name: "Неприхващане на присадката или нова перфорация"
      text: "При около **5–15 от 100** пациенти тъпанчето може да не се затвори напълно или по-късно отново да се образува отвор. В такъв случай течението от ухото може да продължи и **може да се наложи повторна операция**."
    - name: "Слухът не се подобрява"
      text: "Дори тъпанчето да се затвори, слухът може да не се подобри според очакванията поради състоянието на слуховите костици, вентилацията на средното ухо или вътрешното ухо. След възстановяване на костиците протезата може да се размести или да бъде изтласкана през тъпанчето; може да е необходима допълнителна операция."
    - name: "Инфекция и течение от ухото"
      text: "След операцията може да има течение от ухото или инфекция на раната; обикновено отзвучава с капки или антибиотици. Възпалението на хрущяла на ушната мида (перихондрит) е рядко, но може да остави деформация на хрущяла."
    - name: "Стесняване на слуховия проход или латерализация на тъпанчето"
      text: "Белезна тъкан може да стесни слуховия проход или новото тъпанче да се отмести от правилното си положение; това може да засегне слуха и да наложи коригираща процедура."
    - name: "Рецидив или остатъчен холестеатом"
      text: "След операция за холестеатом при част от пациентите заболяването може да се появи отново или малък остатък да нарасне; затова са необходими дългосрочно проследяване и при нужда **повторна операция**."
    - name: "Проблеми с раната и белега"
      text: "На разреза зад ухото може да се образува задебелен белег или келоид, а рядко — събиране на течност зад ухото."
  rare:
    - name: "Трайна загуба на слуха поради увреждане на вътрешното ухо"
      text: "При **по-малко от 1 на 100** пациенти поради засягане на вътрешното ухо може да се развие **трайна сензоневрална (перцептивна) загуба на слуха**; много рядко слухът в оперираното ухо може да бъде загубен напълно („мъртво ухо“). Това може да наложи слухов апарат или друга слухова рехабилитация. Рискът е по-висок при холестеатом и заболяване в близост до вътрешното ухо."
    - name: "Продължителен световъртеж и нарушение на равновесието"
      text: "Рядко засягането на вътрешното ухо може да причини световъртеж, продължаващ седмици; може да са необходими упражнения за равновесие и лекарства."
    - name: "Парализа на лицевия нерв"
      text: "Тъй като лицевият нерв преминава през средното ухо, много рядко (при **значително по-малко от 1 на 100** пациенти) може да се развие временна или трайна слабост на лицето от тази страна. Рискът е по-висок при холестеатом, повторни операции и вроден необичаен ход на нерва. Ако настъпи, може да са необходими лекарства, защита на окото и при нужда операция (декомпресия или възстановяване на нерва). Ако е трайна, може да останат асиметрия на лицето и непълно затваряне на окото, което налага продължителна защита на окото и евентуално операции за възстановяване на мимиката (реанимация на лицето)."
    - name: "Усложнения, засягащи мозъчните обвивки"
      text: "Особено при мастоидектомия и операции за холестеатом, когато костта на черепната основа е изтъняла, много рядко може да настъпи изтичане на гръбначно-мозъчна течност (ликворея), менингит или нараняване на мозъчната обвивка; това може да наложи допълнително болнично лечение (понякога в интензивно отделение) и операция, а менингитът рядко може да остави трайни увреждания."
    - name: "Трайна промяна във формата на ушната мида"
      text: "Във връзка с достъпа зад ухото или вземането на хрущялна присадка рядко може да остане лека трайна промяна в положението или формата на ушната мида."

emergency:
  - "**Внезапна, изразена загуба на слуха** (рязко влошаване, различно от запушването, причинено от тампоните)"
  - "**Силен световъртеж**, повръщане и невъзможност да стоите прави"
  - "**Слабост на лицето**: увисване на ъгъла на устата, невъзможност да затворите окото"
  - "**Температура над 38,5 °C**, засилваща се болка в ухото, зачервяване и оток на ушната мида или гнойна секреция с неприятна миризма"
  - "**Бистра, водниста секреция** от ухото, силно главоболие или скованост на врата"
  - "**Кървене, което не спира**, от превръзката или ухото"

lifestyle:
  - "Докато лекарят не ви разреши, **в никакъв случай не допускайте вода в ухото**: под душа запушвайте ухото с памук, намазан с вазелин; не влизайте в басейн или море."
  - "През първите **4–6 седмици** **не се секнете**; ако трябва да кихнете, кихайте с отворена уста. Не стискайте носа си, докато напъвате (не правете маньовър на Валсалва)."
  - "През първите седмици избягвайте вдигане на тежести, напъване, навеждане и тежки физически натоварвания. Уведомете лекаря, ако имате запек."
  - "Задължително получете одобрение от лекаря си за пътуване със самолет, гмуркане и дейности, свързани с промяна на налягането; за **гмуркане** обикновено е необходимо по-дълго изчакване."
  - "Не поставяйте клечки за уши или други предмети в слуховия проход; използвайте предписаните капки за уши според указанията."
  - "Ако сте пристигнали от чужбина, планирайте пътуването си обратно заедно с лекаря; контролните прегледи и изследванията на слуха след завръщането могат да продължат при местен УНГ лекар."

declarations_extra:
  - "Разбирам, че основната цел на операцията е да се затвори отворът в тъпанчето и да се постигне сухо и безопасно ухо; че подобряването на слуха не може да бъде гарантирано и че рядко слухът може да се влоши."
  - "Обяснено ми е, че в зависимост от находката по време на операцията може да е необходимо възстановяване на слуховите костици или мастоидектомия, и давам съгласие тези процедури да бъдат извършени, както е отбелязано по-горе."
