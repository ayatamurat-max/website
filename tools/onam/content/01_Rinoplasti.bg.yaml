code: "01"
type: surgical
aesthetic: true
title: "Ринопластика"
alt_name: "Естетична операция на носа (при необходимост съчетана с корекция на носното дишане)"

specific_fields:
  - label: "Планирана техника:"
    options: ["Отворена техника", "Затворена техника", "Ще бъде определена от хирурга по време на операцията"]
    blank: false
  - label: "Процедури, които ще се извършат едновременно:"
    options: ["Септопластика", "Редукция на носните конхи", "Няма"]
  - label: "Източник на хрущялна присадка (графт):"
    options: ["От носа (септума)", "От ухото", "От ребро", "Не се очаква да е необходима"]
  - label: "Оплаквания и очаквания на пациента:"

about:
  - "Ринопластиката е операция за промяна на външния вид на носа (гърба на носа, гърбица, върха, ширината на носа, ноздрите и хармонията му с лицето). Ако имате изкривяване на носната преграда, което затруднява дишането (девиация на септума), хлътване на носните крила или увеличени носни конхи, те могат да бъдат коригирани по време на същата операция."
  - "Формата на носа се определя от наследствени особености, промени по време на растежа или прекарани травми (удар, счупване). Тези структури не се променят от само себе си. Целта на операцията е да постигнем **реалистичните цели**, които определяме заедно, и нос, който е **естествен, в хармония с лицето ви и през който се диша свободно**."

procedure_intro:
  - "Операцията се извършва под обща анестезия в операционна зала. Преди операцията носът ви се преглежда и снима, а планът се изготвя заедно с вас."
procedure_steps:
  - "**Разрез:** При затворената техника всички разрези са вътре в носа и отвън не остава белег. При отворената техника се прави и малък разрез от около 4–5 мм през тънкото кожно мостче между ноздрите (колумелата); с времето този белег обикновено става едва забележим."
  - "**Оформяне на носния скелет:** Кожата и меките тъкани се повдигат внимателно. Ако има гърбица, тя се отстранява от костта и хрущяла или се коригира с техники за запазване на гърба на носа. Хрущялите на върха се оформят наново с шевове."
  - "**Стесняване/изправяне на костите (остеотомия):** Ако широките или изкривени носни кости трябва да се стеснят или изправят, се правят контролирани срязвания на костта. Тази стъпка може да увеличи вероятността от кръвонасядания (синини) и оток."
  - "**Опора и присадки:** За да запази носът формата си в дългосрочен план и дихателният път да остане проходим, при необходимост се използват хрущялни опори (графтове). Хрущялът се взема първо от вътрешността на носа (септума); ако не е достатъчен, може да се използва хрущял от ухото или реброто. Това се обсъжда с вас преди операцията."
  - "**Функционална корекция:** При необходимост носната преграда (септумът) се изправя и носните конхи се намаляват."
  - "**Затваряне и шина:** Разрезите се затварят с фини шевове. Върху гърба на носа се поставя защитна шина; при нужда в носа се поставят меки силиконови шини или тампони, които позволяват дишане."
anesthesia: "Обща анестезия"
duration: "Около 2–4 часа"
stay: "Обикновено една нощ в болница"

benefits:
  - "По-естествена, балансирана и хармонираща с лицето ви форма на носа"
  - "Отстраняване на запушването на носа, ако има такова, и по-лесно дишане"
  - "Принос към по-доброто ви самочувствие"
success:
  - "Повечето пациенти са доволни от резултата. Носът обаче е разположен в центъра на лицето и заздравява дълго; крайният резултат се вижда в рамките на **12–18 месеца**. Според публикуваните данни при около **5–15%** от пациентите може да се наложи малка или по-обширна коригираща операция (ревизия). Резултатът е по-труден за предвиждане при дебела кожа, предишни операции или тежка травма на носа."

alternatives:
  - "**Без операция:** Тъй като процедурата е естетична, винаги имате възможност да се откажете от нея."
  - "**Оформяне на носа с филъри („нехирургична ринопластика“):** Може временно да замаскира малка гърбица или вдлъбнатина; не намалява носа, не подобрява дишането и носи собствени рискове, като запушване на кръвоносен съд."
  - "**Само функционална операция (септопластика/редукция на конхите):** Ако единственият проблем е дишането, тя може да се извърши, без да се променя външната форма на носа."
  - "**Медикаментозно лечение:** Спреят за нос може да помогне при запушване, дължащо се на алергия или оток на лигавицата; не коригира структурните деформации."

no_treatment:
  - "Ако операцията не бъде извършена, сегашната форма на носа ви ще остане непроменена. Ако имате проблеми с дишането със структурна причина (изкривяване, хлътване на носните крила), те няма да се подобрят от само себе си, но обикновено не представляват непосредствена опасност за здравето ви."

before:
  - "Ако през последните 6–12 месеца сте приемали **изотретиноин** (лекарство против акне, напр. Roaccutane), задължително ни уведомете; той може да повлияе на заздравяването на кожата и времето на операцията може да бъде планирано съобразно това."
  - "Преди операцията се правят кръвни изследвания и при нужда други изследвания; ще бъдете прегледани от анестезиолог."
  - "През последните **6–8 часа** преди операцията не трябва да ядете и пиете нищо (моля, спазвайте указанията на анестезиолога)."
  - "В деня на операцията не използвайте грим, лак за нокти, бижута и контактни лещи. Препоръчително е през първия ден след операцията да имате придружител."
  - "Операцията може да бъде отложена при активно акне или кожна инфекция на лицето, грип или инфекция на горните дихателни пътища."

recovery:
  - when: "Първите 48 часа"
    what: "Запушен нос, лека секреция, главоболие и оток на лицето са нормални. Болката обикновено е лека до умерена и се овладява с обезболяващи. Спането с повдигната глава и студените компреси намаляват отока. **Ако** се появят кръвонасядания, те са около очите и изчезват за 7–10 дни."
  - when: "1-ва седмица"
    what: "Силиконовите шини/тампони в носа, ако има такива, обикновено се отстраняват на 2–5-ия ден, а външната шина и конците — около **7-ия ден**. Ще трябва да промивате носа с физиологичен разтвор. Повечето пациенти се връщат към офис работа и социален живот за 7–10 дни."
  - when: "2–6-а седмица"
    what: "По-голямата част от отока отшумява, но втвърдяването на върха и лекото изтръпване може да продължат. Тежките физически натоварвания, контактните спортове и плуването трябва да се отложат за около **4–6 седмици**. Очила не трябва да се носят поне **6 седмици**, освен ако не са прикрепени с лепенка така, че да не притискат гърба на носа."
  - when: "3–12-и месец"
    what: "Остатъчният оток, особено на върха, постепенно намалява. През този период формата на носа продължава да се променя; малките неравности, видими в началото, обикновено изчезват."
  - when: "12–18-и месец"
    what: "Крайният резултат става видим. Ако се прецени, че е необходима корекция (ревизия), тя обикновено се прави след изчакване от поне 12 месеца."

risks:
  expected:
    - "Запушен нос, лека секреция и кървенисто течение от носа (първите дни)"
    - "Оток на лицето и около очите; **ако** се появят кръвонасядания, те изчезват за 1–2 седмици"
    - "Временно изтръпване на върха на носа и предните зъби; втвърдяване на върха"
    - "Временно намаляване на обонянието (подобрява се с отшумяването на отока)"
    - "Формата на носа продължава да се променя в продължение на месеци"
  common:
    - name: "Продължителен оток"
      text: "Особено при дебела кожа отокът на върха може да продължи година или повече. При нужда може да се подпомогне с кортикостероидни инжекции."
    - name: "Лека асиметрия и малки неравности"
      text: "Тъй като самото лице не е напълно симетрично, в носа могат да останат леки разлики; възможно е да се опипват малки костни/хрущялни издатини, които обикновено не се виждат."
    - name: "Необходимост от ревизия (корекция)"
      text: "При около **5–15 от 100** пациенти може да е необходима коригираща процедура — от малка корекция до по-обширна операция."
    - name: "Крусти и сухота в носа"
      text: "Чести през първите седмици; отзвучават с редовно промиване и овлажняване."
  uncommon:
    - name: "Кървене от носа"
      text: "При около **1–3 от 100** пациенти може да настъпи кървене, което налага тампониране или друга намеса. Много рядко кървенето трябва да се спре в операционна зала."
    - name: "Инфекция"
      text: "Среща се при **по-малко от 1 до 3 от 100** пациенти. Обикновено отзвучава с антибиотици; рядко може да се наложи дрениране или отстраняване на присадката."
    - name: "Липса на очакваното подобрение на дишането"
      text: "Запушването на носа може да не изчезне напълно или рядко да се засили; може да е необходимо допълнително лечение или операция."
    - name: "Перфорация на носната преграда"
      text: "Отвор в носната преграда се образува при около **1 от 100** пациенти. Често не причинява оплаквания; ако предизвиква свистене, крусти или кървене, може да се наложи лечение."
    - name: "Събиране на кръв или гной в септума (хематом / абсцес)"
      text: "При операция върху септума се среща при **по-малко от 1 от 100** пациенти. Проявява се със засилващо се запушване, болка и температура в дните след операцията. Трябва да се **дренира спешно**, за да не се увреди хрущялът на носа; без лечение може да настъпи загуба на хрущял и хлътване на гърба на носа (седловиден нос), което може да наложи допълнителна операция за корекция."
    - name: "Сраствания в носа (синехии)"
      text: "Слепване на тъканите в носа; ако причиняват запушване, се разделят с проста процедура."
    - name: "Забележим белег"
      text: "При отворената техника белегът на колумелата рядко може да остане забележим; ако се стесняват ноздрите, в гънката на носното крило остава тънък белег."
    - name: "Продължително изтръпване"
      text: "Намалената чувствителност на върха на носа или предните зъби може да продължи няколко месеца; рядко може да е трайна."
    - name: "Проблеми, свързани с присадката"
      text: "С времето хрущялните присадки могат да се изместят, изкривят, частично да се резорбират или да станат видими под кожата. Ако хрущял се взема от ухото или реброто, на това място има риск от болка, белег и кървене, а при реброто много рядко — от увреждане на обвивката на белия дроб (пневмоторакс)."
  rare:
    - name: "Кожни проблеми"
      text: "Изтъняване на кожата, зачервяване, малки видими капиляри или засилено образуване на белезна тъкан при дебела кожа. Много рядко, особено при пушачи и при повторни операции, нарушеното кръвоснабдяване на кожата може да доведе до рана и загуба на тъкан. В такъв случай може да са необходими продължителни грижи за раната и възстановителна операция, като може да остане траен белег или деформация."
    - name: "Трайно намаляване или загуба на обонянието"
      text: "Много рядко."
    - name: "Проблеми със слъзния канал и кървене около окото"
      text: "Много рядко, във връзка с остеотомиите, може да се появи сълзене или кървене около окото."
    - name: "Изтичане на гръбначно-мозъчна течност (ликворея), менингит, загуба на зрение"
      text: "Изключително редки усложнения — **далеч под 1 на 10 000** случая — свързани с увреждане на тънките кости между носа, основата на черепа и окото. При възникването им може да е необходимо допълнително болнично лечение (понякога в интензивно отделение) и операция; загубата на зрение, ако настъпи, може да е трайна."
    - name: "Синдром на токсичния шок"
      text: "Много рядка, но сериозна инфекция, свързана с носните тампони, която налага спешно лечение (внезапна висока температура, обрив, ниско кръвно налягане). Изисква болнично лечение, понякога в интензивно отделение, и може да бъде животозастрашаваща."
    - name: "Психологическа неудовлетвореност"
      text: "Въпреки технически успешния резултат човек може трудно да свикне с новия си външен вид. Откритото обсъждане на очакванията преди операцията намалява този риск."

emergency:
  - "**Кървене от носа, което не спира или е много обилно** въпреки няколкоминутен натиск и лед"
  - "**Засилващо се запушване, силна болка и оток на носа** в дните след операцията (може да е признак на хематом/абсцес на септума)"
  - "**Температура над 38,5 °C**, засилваща се болка, зачервяване или зловонна секреция от носа"
  - "**Внезапна висока температура, кожен обрив, световъртеж или отпадналост**, докато тампоните са в носа"
  - "**Бистра, водниста секреция** от носа, особено засилваща се при навеждане напред, или силно главоболие и схванат врат"
  - "**Замъглено или двойно виждане**, или бързо нарастващ оток и болка около окото"
  - "Удар по носа или внезапна промяна на формата му"
  - "Задух или болка в гърдите"

lifestyle:
  - "През първите 2 седмици не издухвайте носа си; ако трябва да кихнете, кихайте с отворена уста."
  - "Почиствайте носа така, както ви е показано, и толкова често, колкото е препоръчано."
  - "Поне 6 седмици избягвайте удари по носа, очила, опиращи се на гърба на носа, и спане по корем."
  - "Пазете кожата на носа от слънце поне 3 месеца (слънцезащитен крем с висок фактор, шапка)."
  - "Ако сте пристигнали от чужбина, пътуването със самолет обикновено е безопасно след отстраняване на шината (около 7-ия ден)."

declarations_extra:
  - "Разбирам, че сравняването на снимките ми преди и след операцията е част от оценката на резултата и че компютърните симулации или примерните снимки служат само за ориентир и не гарантират резултата."
