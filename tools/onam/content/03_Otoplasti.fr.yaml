code: "03"
type: surgical
aesthetic: true
title: "Otoplastie"
alt_name: "Chirurgie de correction des oreilles décollées"

specific_fields:
  - label: "Côté :"
    options: ["Droit", "Gauche", "Les deux"]
    blank: false
  - label: "Type d'anesthésie :"
    options: ["Anesthésie générale", "Anesthésie locale", "Anesthésie locale + sédation"]
    blank: false
  - label: "Parties à corriger / attentes du patient :"

about:
  - "Les oreilles décollées sont des oreilles qui s'écartent de la tête selon un angle plus ouvert que la normale, ou dont le pli naturel du cartilage de l'oreille (l'anthélix) ne s'est pas formé. Cette particularité est généralement présente dès la naissance, n'est pas nocive pour la santé et n'affecte pas l'audition. Cependant, en particulier pendant l'enfance et l'adolescence, elle peut entraîner des moqueries, une perte de confiance en soi et une anxiété sociale."
  - "Le but de l'otoplastie est de rapprocher les oreilles de la tête afin qu'elles aient un aspect **naturel** et soient aussi **équilibrées** que possible des deux côtés. Comme l'oreille atteint l'essentiel de sa taille adulte vers l'âge de 5–6 ans, l'opération peut être réalisée **à partir de 5–6 ans** ; la réaliser avant l'âge scolaire peut éviter que l'enfant en souffre sur le plan social. Si votre enfant doit être opéré, il est important de tenir compte de son propre souhait et de sa disposition à le faire."

procedure_intro:
  - "L'opération est réalisée au bloc opératoire. Chez l'enfant, on utilise généralement une anesthésie générale ; chez l'adulte, une anesthésie locale (avec sédation si nécessaire) ou une anesthésie générale."
procedure_steps:
  - "**Planification et marquage :** Les oreilles sont photographiées, leur distance par rapport à la tête est mesurée et l'emplacement du nouveau pli est marqué."
  - "**Incision :** Une incision est pratiquée dans la peau, **à l'arrière de l'oreille**, près du pli naturel situé entre l'oreille et la tête. Cette cicatrice se trouvant derrière l'oreille, elle n'est généralement pas visible."
  - "**Remodelage du cartilage :** Un nouveau pli (anthélix) est créé dans le cartilage de l'oreille à l'aide de points de suture permanents. Si nécessaire, le cartilage est aminci ou légèrement strié pour l'assouplir."
  - "**Rapprochement de l'oreille :** Si la partie creuse profonde de l'oreille (la conque) est grande, elle est réduite ou fixée par des points aux tissus situés derrière l'oreille. Si le lobe de l'oreille est également décollé, il est corrigé."
  - "**Fermeture et pansement :** La peau est refermée par des points de suture. Un pansement de tête souple et légèrement compressif est mis en place pour maintenir la nouvelle forme des oreilles et éviter une accumulation de sang."
anesthesia: "Anesthésie générale chez l'enfant ; anesthésie locale ± sédation ou anesthésie générale chez l'adulte"
duration: "Environ 1–2 heures (les deux côtés)"
stay: "Sortie généralement le jour même"

benefits:
  - "Des oreilles plus proches de la tête, d'aspect naturel"
  - "Un aspect plus équilibré entre les deux oreilles"
  - "Moins d'anxiété sociale et de moqueries liées à l'apparence ; un regain de confiance en soi"
success:
  - "La plupart des patients et des familles sont satisfaits du résultat. Le cartilage de l'oreille étant un tissu souple, les publications indiquent que chez environ **5–10 patients sur 100**, l'oreille peut se décoller à nouveau en partie et une correction peut être nécessaire. Des différences de quelques millimètres entre les deux oreilles sont considérées comme normales."

alternatives:
  - "**Ne pas se faire opérer :** Les oreilles décollées ne posent pas de problème de santé ; l'opération n'est donc pas indispensable."
  - "**Modelage (conformateur) pendant la période néonatale :** Au cours des premières semaines après la naissance, le cartilage de l'oreille est très souple et peut être modelé à l'aide de conformateurs spéciaux ; cette méthode n'est plus efficace après cette période."
  - "**Camouflage par la coiffure :** Des coiffures qui couvrent les oreilles peuvent masquer leur aspect."
  - "**Techniques sans incision / par fils :** Chez certains patients dont le cartilage est souple, la correction peut être réalisée par de très petites incisions ; le taux de récidive peut être plus élevé qu'avec la chirurgie classique."

no_treatment:
  - "Si l'opération n'est pas réalisée, la forme des oreilles restera la même ; elle ne s'améliore pas d'elle-même avec le temps. Les oreilles décollées ne présentent aucun danger pour la santé ; la décision d'opérer dépend entièrement de l'apparence et du souhait de la personne (pour les enfants, de l'enfant et de sa famille)."

before:
  - "Les analyses de sang nécessaires sont réalisées avant l'opération ; si une anesthésie générale est prévue, vous/votre enfant serez examiné(s) par le médecin anesthésiste."
  - "En cas d'anesthésie générale ou de sédation, il ne faut rien manger ni boire pendant les **6–8 heures** précédant l'opération (pour les jeunes enfants, selon le délai indiqué par le médecin anesthésiste)."
  - "Lavez les cheveux avec un shampooing le matin de l'opération. Les cheveux longs peuvent être attachés de façon à être tenus à l'écart de la zone opérée."
  - "L'opération peut être reportée en cas d'infection cutanée active, d'eczéma ou de plaie de piercing non cicatrisée autour de l'oreille."

recovery:
  - when: "48 premières heures"
    what: "Des élancements, une sensation de tension et une douleur modérée au niveau des oreilles peuvent survenir ; ils sont soulagés par des antalgiques. Il est recommandé de dormir la tête surélevée. **Une douleur intense d'un seul côté, qui ne cesse d'augmenter, n'est pas normale** et doit être signalée immédiatement."
  - when: "2e–7e jour"
    what: "Le pansement est généralement retiré lors d'une consultation de contrôle **entre le 2e et le 5e jour** et les oreilles sont examinées. À ce stade, un gonflement, des ecchymoses et une sensibilité des oreilles sont fréquents. Après le retrait du pansement, un **bandeau** souple est porté. Les enfants peuvent généralement retourner à l'école au bout d'une semaine."
  - when: "1re–2e semaine"
    what: "Le bandeau est porté **jour et nuit pendant les 1–2 premières semaines**, puis **uniquement la nuit pendant 4–6 semaines**. Cela évite que l'oreille ne se replie vers l'avant pendant le sommeil et protège les points de suture. Les points cutanés non résorbables, s'ils ont été utilisés, sont retirés entre le 7e et le 10e jour."
  - when: "3e–6e semaine"
    what: "La plus grande partie du gonflement disparaît. Les sports de contact, la natation et les casques qui appuient sur les oreilles doivent être évités pendant au moins **4–6 semaines**."
  - when: "3e–6e mois"
    what: "Les plis de l'oreille se stabilisent, la cicatrice s'estompe et l'aspect définitif apparaît. Le léger engourdissement des oreilles s'améliore généralement pendant cette période."

risks:
  expected:
    - "Douleur, élancements et sensation de tension les premiers jours"
    - "Gonflement et ecchymoses des oreilles (1–2 semaines)"
    - "Engourdissement temporaire de la peau de l'oreille et sensibilité au froid (quelques semaines à quelques mois)"
    - "Une fine cicatrice derrière l'oreille, qui s'estompe avec le temps"
  common:
    - name: "Points de suture palpables ou ressortant à travers la peau"
      text: "Chez environ **5–10 patients sur 100**, les points permanents qui modèlent le cartilage peuvent, des mois ou des années plus tard, être sentis derrière l'oreille, ressortir à travers la peau ou former une petite boule inflammatoire (granulome). Cela se corrige généralement par un geste simple de retrait du fil."
    - name: "Récidive partielle (l'oreille se décolle à nouveau)"
      text: "Chez environ **5–10 patients sur 100**, l'oreille peut revenir en partie vers sa position initiale ; une correction peut être réalisée si nécessaire."
    - name: "Légère asymétrie"
      text: "Les deux oreilles ne sont jamais exactement identiques ; des différences de quelques millimètres après l'opération sont normales. S'il existe une différence visible, elle peut être corrigée."
  uncommon:
    - name: "Collection de sang dans l'oreille (hématome)"
      text: "Survient chez environ **1–3 patients sur 100**, généralement au cours des 48 premières heures. **Une douleur intense d'un seul côté, qui ne cesse d'augmenter** en est le signe le plus important. L'hématome doit être **drainé en urgence**, avant qu'il ne compromette la vascularisation du cartilage ; si le traitement est retardé, des lésions du cartilage et une déformation définitive (« oreille en chou-fleur ») peuvent apparaître."
    - name: "Infection de la plaie"
      text: "Survient chez environ **1–5 patients sur 100** ; elle guérit généralement sous antibiotiques."
    - name: "Cicatrice épaisse ou chéloïde"
      text: "Chez environ **1–3 patients sur 100**, en particulier chez les personnes à peau foncée ou ayant une tendance aux chéloïdes, une cicatrice épaisse et en relief peut se former derrière l'oreille. Elle peut nécessiter un traitement par injections de corticoïdes, gel de silicone ou chirurgie, et peut récidiver. Merci de nous signaler si vous avez déjà eu une chéloïde."
    - name: "Hypercorrection ou aspect non naturel"
      text: "Les oreilles peuvent paraître trop plaquées contre la tête, le pli peut être trop marqué, ou la partie moyenne de l'oreille peut se trouver plus en arrière que les parties supérieure et inférieure (aspect en « combiné de téléphone ») ; une chirurgie de correction peut être réalisée si nécessaire."
  rare:
    - name: "Inflammation de l'enveloppe du cartilage (périchondrite)"
      text: "Survient chez **moins de 1 patient sur 100**. Elle se manifeste par une rougeur, un gonflement, une chaleur et une douleur intense croissants au niveau de l'oreille. Elle peut nécessiter des antibiotiques par voie intraveineuse et, si nécessaire, un nettoyage chirurgical ; si le traitement est retardé, une perte de cartilage et une **déformation définitive** peuvent en résulter."
    - name: "Défaut de vascularisation de la peau ou du cartilage (nécrose)"
      text: "Très rare ; généralement lié à un pansement trop serré, à un hématome non traité ou à une infection. Des soins de plaie et parfois une chirurgie réparatrice peuvent être nécessaires."
    - name: "Diminution définitive de la sensibilité ou douleur chronique"
      text: "L'engourdissement de la peau de l'oreille ou une douleur par temps froid peuvent rarement être définitifs."
    - name: "Rétrécissement du conduit auditif"
      text: "Très rarement, après une réduction ou une fixation de la conque, l'entrée du conduit auditif peut se rétrécir ; une correction peut être nécessaire."

emergency:
  - "**Douleur intense de l'oreille d'un seul côté qui ne cesse d'augmenter** (en particulier pendant les 48 premières heures) — cela peut être le signe d'une collection de sang"
  - "Saignement de plus en plus important à travers le pansement, ou pansement imbibé de sang"
  - "**Fièvre supérieure à 38,5 °C**, rougeur, gonflement ou chaleur croissants, ou écoulement malodorant de l'oreille"
  - "Pansement qui semble trop serré, ou oreille qui bleuit ou change de couleur"
  - "Un coup sur l'oreille ou une modification soudaine de sa forme"

lifestyle:
  - "Ne mouillez pas le pansement et ne le retirez pas vous-même avant qu'il ne soit retiré au cabinet. Une fois le pansement retiré, vous pourrez prendre une douche avec précaution à partir du jour indiqué par votre médecin."
  - "Portez le bandeau régulièrement pendant la durée indiquée ; c'est important pour un résultat durable."
  - "Pendant les premières semaines, évitez de vous coucher sur les oreilles, de replier les oreilles vers l'avant et d'enfiler ou d'enlever des vêtements à col serré en forçant sur les oreilles."
  - "Protégez les oreilles du soleil et du froid intense pendant au moins 3 mois ; en raison de la diminution de la sensibilité, une brûlure ou une gelure peut passer inaperçue."
  - "Surveillez votre enfant pour qu'il ne tire pas sur le pansement ou le bandeau."

declarations_extra:
  - "Je comprends que le port du bandeau pendant la durée recommandée après l'opération contribue au résultat, et que le non-respect de ces consignes peut augmenter le risque de récidive."
